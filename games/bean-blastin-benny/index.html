<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bean Blastin' Benny</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;cursor:none;user-select:none;-webkit-user-select:none;}
  canvas{display:block;image-rendering:pixelated;touch-action:none;}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
"use strict";
/* =========================================================
   BEAN BLASTIN' BENNY — light gun homage to Pea Shootin' Pete / Pang
   Folder layout: index.html + audio/*.mp3 (music). SFX + art are embedded.
   Built for OpenFIRE (gun = absolute mouse).
   Trigger = left click.  Right click (gun A / offscreen) = pause.
   Keys: Enter/Space/1 start, P/Esc pause, M music, C CRT look, F fullscreen.
   ========================================================= */
const W = 1280, H = 720, FLOOR = 650, CEIL = 60, LEFT = 20, RIGHT = W - 20;
const cv = document.getElementById('c');

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- storage (safe) ---------- */
function load(k, d){ try{ const v = localStorage.getItem('peapop_' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem('peapop_' + k, JSON.stringify(v)); }catch(e){} }

/* ---------- input ---------- */
const aim = { x: W / 2, y: H / 2 };
let triggerQueued = false;
function toGame(e){
  const r = cv.getBoundingClientRect();
  aim.x = (e.clientX - r.left) / r.width * W;
  aim.y = (e.clientY - r.top) / r.height * H;
}
addEventListener('pointermove', toGame);
addEventListener('pointerdown', e => {
  toGame(e); audioInit();
  if (e.button === 0) triggerQueued = true;
  else if (e.button === 2 || e.button === 1) togglePause();
  e.preventDefault();
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  audioInit();
  const k = e.key.toLowerCase();
  if (k === 'enter' || k === ' ' || k === '1') { if (state === 'title' || state === 'over') startGame(); else if (state === 'paused') togglePause(); }
  else if (k === 'p' || k === 'escape') togglePause();
  else if (k === 'm') { musicOn = !musicOn; save('music', musicOn); updateMusic(); }
  else if (k === 'c') { crt = !crt; save('crt', crt); }
  else if (k === 'f') { try{ if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.().catch(()=>{}); }catch(err){} }
});

/* ---------- audio (all synthesized, original) ---------- */
let AC = null, master = null, musicOn = load('music', true);
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    for (const k in SAMPLE_B64){
      const bin = atob(SAMPLE_B64[k]), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      AC.decodeAudioData(buf.buffer).then(d => { samples[k] = d; }).catch(() => {});
    }
  }catch(e){ AC = null; }
  updateMusic();
}

let bonus = null, bonusAt = 1e9, playT = 0, gameT = 0;
let timer = 0, timerMax = 1, stateT = 0, shotsFired = 0, shotsHit = 0;
let combo = 0, maxCombo = 0, comboPulse = 0;
let freezeT = 0, multiT = 0, shield = false;
let hitStop = 0, shakeT = 0, shakeDur = 1, shakeAmp = 0, flashT = 0, goT = 0, hurried = false;
let bgCanvas = null;
const pete = { x: W / 2, vx: 0, face: 1, lock: 0, inv: 0, walk: 0, flash: 0, dust: 0 };

const comboMult = () => combo < 3 ? 1 : combo < 6 ? 2 : combo < 10 ? 3 : combo < 15 ? 4 : 5;
function shake(amp, dur){ if (amp >= shakeAmp || shakeT <= 0){ shakeAmp = amp; shakeT = shakeDur = dur; } }

function togglePause(){
  if (state === 'play' || state === 'intro' || state === 'clear' || state === 'dead'){ prevState = state; state = 'paused'; SFX.ui(); }
  else if (state === 'paused'){ state = prevState; SFX.ui(); }
}

function startGame(){
  score = dispScore = 0; lives = 3; level = 1; nextLife = LIFE_EVERY; shield = false; startHi = hiScore; lastRank = -1;
  SFX.ui(); beginLevel();
}
function beginLevel(){
  const idx = (level - 1) % LEVELS.length, loop = Math.floor((level - 1) / LEVELS.length);
  balloons = LEVELS[idx].map(([s, x, d], i) => { const b = makeBalloon(Math.min(3, s), x, d, 140 + (i % 2) * 40, 0, loop); b.color = PALETTE[(level + i) % PALETTE.length]; return b; });
  for (let i = 0; i < loop; i++) balloons.push(makeBalloon(3, 120 + Math.random() * 1040, Math.random() < .5 ? 1 : -1, 140, 0, loop));
  peas = []; parts = []; pickups = []; floaters = []; rings = []; bonus = null;
  freezeT = 0; multiT = 0; combo = 0; maxCombo = 0; hurried = false; playT = 0; hitStop = 0;
  bonusAt = level >= 2 ? 8 + Math.random() * 14 : 1e9;
  pete.x = W / 2; pete.vx = 0; pete.lock = 0; pete.inv = 0; pete.flash = 0;
  timer = timerMax = 60 + Math.min(60, level * 6);
  shotsFired = 0; shotsHit = 0;
  bgCanvas = makeBackground(level);
  state = 'intro'; stateT = 2.0;
}
function makeBalloon(size, x, dir, y, vy, loop = Math.floor((level - 1) / LEVELS.length)){
  return { size, x, y, vx: BVX * dir * (1 + loop * 0.12), vy, color: PALETTE[(level - 1 + size) % PALETTE.length], rot: Math.random() * 6, hold: 0 };
}
const bounceV = s => Math.sqrt(2 * G * SIZES[s].bounceH);
function recordScore(){
  if (score <= 0) return;
  const e = { s: score, l: level };
  topScores.push(e); topScores.sort((a, b) => b.s - a.s); topScores = topScores.slice(0, 5);
  lastRank = topScores.indexOf(e); save('top', topScores);
}

/* ---------- title screen balls ---------- */
let titleBalloons = null;
function updateTitle(dt){
  if (!titleBalloons) titleBalloons = [0, 1, 2, 3, 2, 1].map((s, i) => ({ size: s, x: 150 + i * 190, y: 300, vx: (i % 2 ? 1 : -1) * 90, vy: -200 * (i % 3), color: PALETTE[i], rot: i, hold: 0 }));
  for (const b of titleBalloons){
    const r = SIZES[b.size].r; b.x += b.vx * dt; b.rot += b.vx * dt / r;
    if (b.hold > 0){ b.hold -= dt; if (b.hold <= 0) b.vy = -bounceV(b.size); }
    else { b.vy += G * dt; b.y += b.vy * dt; if (b.y + r > FLOOR){ b.y = FLOOR - r; b.vy = 0; b.hold = HOLD; dust(b.x, 2 + b.size, 60 + b.size * 30); } }
    if (b.x - r < LEFT){ b.x = LEFT + r; b.vx = Math.abs(b.vx); }
    if (b.x + r > RIGHT){ b.x = RIGHT - r; b.vx = -Math.abs(b.vx); }
  }
}

/* ---------- update ---------- */
function update(dt){
  musicTick();
  if (state === 'paused') return;
  gameT += dt;
  dispScore += (score - dispScore) * Math.min(1, dt * 12); if (score - dispScore < 1) dispScore = score;
  if (shakeT > 0) shakeT -= dt; if (flashT > 0) flashT -= dt; if (comboPulse > 0) comboPulse -= dt;
  if (goT > 0) goT -= dt; if (pete.flash > 0) pete.flash -= dt;
  if (hitStop > 0){ hitStop -= dt; return; }                 // tiny freeze-frame on a pop
  stateT -= dt;
  updateParts(dt);

  if (state === 'title' || state === 'over'){
    if (state === 'title') updateTitle(dt);
    if (triggerQueued){ triggerQueued = false; handleMenuShot(); }
    return;
  }
  if (state === 'intro'){
    triggerQueued = false; movePete(dt);
    if (stateT <= 0){ state = 'play'; pete.inv = 1.5; goT = 0.6; SFX.go(); }
    return;
  }
  if (state === 'dead'){
    triggerQueued = false;
    pete.hitT += dt;
    if (pete.hitT < 0.55) pete.x = Math.max(LEFT + 60, Math.min(RIGHT - 60, pete.x + pete.hitDir * 260 * dt * (1 - pete.hitT / 0.55)));
    if (pete.hitT >= 0.55 && !pete.landed){ pete.landed = true; dust(pete.x, 10, 160); shake(4, 0.15); }
    if (stateT <= 0){
      if (lives <= 0){ state = 'over'; stateT = 1; recordScore(); SFX.over(); }
      else beginLevel();
    }
    return;
  }
  if (state === 'clear'){
    const e = CLEAR_T - stateT;
    if (Math.random() < dt * 30) spawn(LEFT + Math.random() * (RIGHT - LEFT), CEIL, (Math.random() - .5) * 120, 60 + Math.random() * 120, 3, PALETTE[Math.floor(Math.random() * 6)], Math.random() < .4 ? 6 : 3, 50, true);
    const rows = clearInfo.rows.length + 1;
    while (clearInfo.shown < rows && e > 0.7 + clearInfo.shown * 0.55){ SFX.tally(clearInfo.shown, clearInfo.shown === rows - 1); clearInfo.shown++; }
    if (triggerQueued){ triggerQueued = false; if (e > 1.2) stateT = 0; }
    if (stateT <= 0){ level++; beginLevel(); }
    return;
  }

  /* ---- play ---- */
  playT += dt; timer -= dt;
  if (timer <= 0){ timer = 0; killPete('TIME UP!'); return; }
  if (timer < 10 && Math.floor(timer + dt) !== Math.floor(timer)) SFX.tick();
  if (!hurried && timer < 15){ hurried = true; addFloater(W / 2, 230, 'HURRY UP!', '#ff4a4a', 64, 1.4); SFX.hurry(); }
  if (freezeT > 0) freezeT -= dt;
  if (multiT > 0) multiT -= dt;
  if (pete.inv > 0) pete.inv -= dt;

  movePete(dt);
  if (triggerQueued){ triggerQueued = false; firePea(); }

  // beans
  for (const p of peas){
    p.px = p.x; p.py = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    spawn(p.x + (Math.random() - .5) * 6, p.y + 10, 0, 40, 0.16, Math.random() < .5 ? '#9be04a' : '#4aa82a', 3, 0);
    if (p.y < CEIL || p.x < LEFT || p.x > RIGHT || p.y > FLOOR) p.dead = true;
  }
  // balls
  if (freezeT <= 0){
    for (const b of balloons){
      const r = SIZES[b.size].r;
      b.x += b.vx * dt; b.rot += b.vx * dt / r;
      if (b.hold > 0){ b.hold -= dt; if (b.hold <= 0) b.vy = -bounceV(b.size); }
      else {
        b.vy += G * dt; b.y += b.vy * dt;
        if (b.y + r > FLOOR){ b.y = FLOOR - r; b.vy = 0; b.hold = HOLD; bounceSfx(b.size); dust(b.x, 2 + b.size * 2, 70 + b.size * 35); }
      }
      if (b.y - r < CEIL){ b.y = CEIL + r; b.vy = Math.abs(b.vy) * 0.6; }
      if (b.x - r < LEFT){ b.x = LEFT + r; b.vx = Math.abs(b.vx); }
      if (b.x + r > RIGHT){ b.x = RIGHT - r; b.vx = -Math.abs(b.vx); }
    }
  }
  // gold bonus ball: harmless, crosses the screen once
  if (!bonus && playT >= bonusAt){
    const d = Math.random() < .5 ? 1 : -1; bonusAt = 1e9;
    bonus = { x: d > 0 ? LEFT - 30 : RIGHT + 30, y: 200, vx: d * 215, vy: 0, rot: 0, hold: 0, size: 1, color: GOLD };
    addFloater(W / 2, 150, 'GOLD BALL!', GOLD, 26, 1.2); SFX.bling();
  }
  if (bonus){
    const b = bonus, r = SIZES[1].r;
    b.x += b.vx * dt; b.rot += b.vx * dt / r;
    if (b.hold > 0){ b.hold -= dt; if (b.hold <= 0) b.vy = -bounceV(1); }
    else { b.vy += G * dt; b.y += b.vy * dt; if (b.y + r > FLOOR){ b.y = FLOOR - r; b.vy = 0; b.hold = HOLD; } }
    if (Math.random() < dt * 25) spawn(b.x + (Math.random() - .5) * 50, b.y + (Math.random() - .5) * 50, 0, -20, 0.4, Math.random() < .5 ? '#fff' : '#ffe680', 3, 0);
    if (b.x < LEFT - 60 || b.x > RIGHT + 60) bonus = null;
  }
  // bean vs ball
  for (const p of peas){
    if (p.dead) continue;
    for (const b of balloons){
      if (b.dead) continue;
      if (segCircle(p.px, p.py, p.x, p.y, b.x, b.y, SIZES[b.size].r + 4)){ p.dead = p.hit = true; popBalloon(b); shotsHit++; break; }
    }
    if (!p.dead && bonus && segCircle(p.px, p.py, p.x, p.y, bonus.x, bonus.y, SIZES[1].r + 6)){
      p.dead = p.hit = true; shotsHit++; combo++; maxCombo = Math.max(maxCombo, combo);
      const pts = 1000 * comboMult(); addScore(pts); addFloater(bonus.x, bonus.y - 20, 'BONUS ' + pts, GOLD, 26, 1.3);
      popFx(bonus.x, bonus.y, 2, GOLD); SFX.pop(1); SFX.bling(); dropPickup(bonus.x, bonus.y); bonus = null;
    }
  }
  // bean vs pickup (shoot to collect)
  for (const p of peas){
    if (p.dead) continue;
    for (const k of pickups){ if (!k.dead && segCircle(p.px, p.py, p.x, p.y, k.x, k.y, 24)){ p.dead = p.hit = true; collect(k); break; } }
  }
  if (balloons.some(b => b.dead)){
    const born = [];
    for (const b of balloons) if (b.dead && b.size > 0){
      const v = Math.max(380, bounceV(b.size - 1) * 0.75);
      born.push(makeBalloon(b.size - 1, b.x - 4, -1, b.y, -v), makeBalloon(b.size - 1, b.x + 4, 1, b.y, -v));
      born[born.length - 1].color = born[born.length - 2].color = b.color;
    }
    balloons = balloons.filter(b => !b.dead).concat(born);
  }
  for (const p of peas) if (p.dead && !p.hit){                // a miss
    burst(p.x, Math.max(p.y, CEIL + 4), '#7fd040', 5, 0.4);
    if (multiT <= 0 && combo > 0){ if (combo >= 3) addFloater(p.x, CEIL + 50, 'COMBO LOST', '#ff7a7a', 16, 0.8); combo = 0; }
  }
  peas = peas.filter(p => !p.dead);

  // pickups
  for (const k of pickups){
    k.t -= dt;
    if (k.y < FLOOR - 24){ k.vy += 600 * dt; k.y = Math.min(FLOOR - 24, k.y + k.vy * dt); }
    if (Math.abs(k.x - pete.x) < 48 && k.y > FLOOR - 120) collect(k);
    if (k.t <= 0) k.dead = true;
  }
  pickups = pickups.filter(k => !k.dead);

  // ball vs Benny
  if (pete.inv <= 0){
    const hx = pete.x - 22, hy = FLOOR - 108, hw = 44, hh = 108;
    for (const b of balloons){
      const r = SIZES[b.size].r * 0.88;
      const cx = Math.max(hx, Math.min(b.x, hx + hw)), cy = Math.max(hy, Math.min(b.y, hy + hh));
      if ((b.x - cx) ** 2 + (b.y - cy) ** 2 < r * r){
        if (shield){ shield = false; pete.inv = 1.5; SFX.ouch(); burst(pete.x, FLOOR - 60, '#7ff', 30); rings.push({ x: pete.x, y: FLOOR - 75, max: 150, life: 0.4, t: 0, color: '#7ff' }); shake(6, 0.2); addFloater(pete.x, FLOOR - 170, 'SHIELD!', '#7ff'); }
        else { killPete('OUCH!', b.x); }
        return;
      }
    }
  }

  if (balloons.length === 0){
    const acc = shotsFired ? shotsHit / shotsFired : 0;
    const rows = [['TIME BONUS', Math.floor(timer) * 50], [`ACCURACY ${Math.round(acc * 100)}%`, Math.round(acc * 50) * 100], [`BEST COMBO ${maxCombo}`, maxCombo * 100]];
    if (acc >= 1 && shotsFired > 0) rows.push(['PERFECT AIM!', 2000]);
    const total = rows.reduce((a, r) => a + r[1], 0);
    clearInfo = { rows, total, shown: 0 };
    addScore(total);
    state = 'clear'; stateT = CLEAR_T; SFX.clear(); peas = []; bonus = null; flashT = 0.08;
  }
}
let clearInfo = null, deathMsg = '';

function movePete(dt){
  const tx = Math.max(LEFT + 24, Math.min(RIGHT - 24, aim.x));
  const dx = tx - pete.x, maxV = 430;
  if (pete.lock > 0){ pete.lock -= dt; pete.vx = 0; }
  else if (Math.abs(dx) > 6){
    pete.vx = Math.sign(dx) * Math.min(maxV, Math.abs(dx) * 9);
    pete.x += pete.vx * dt; pete.face = Math.sign(dx); pete.walk += dt * Math.abs(pete.vx) / 40;
    pete.dust -= dt;
    if (Math.abs(pete.vx) > 300 && pete.dust <= 0){ pete.dust = 0.09; spawn(pete.x - pete.face * 14, FLOOR - 3, -pete.face * (30 + Math.random() * 50), -20 - Math.random() * 40, 0.3, DUST[Math.floor(Math.random() * 3)], 3, 120); }
  } else pete.vx = 0;
}
function firePea(){
  const maxPeas = multiT > 0 ? 3 : 1;
  if (peas.length >= maxPeas){ SFX.dry(); return; }
  const sx = pete.x, sy = FLOOR - SPR_H * PIX + 9;
  let vx = 0, vy = -PEA_SPEED;
  if (aimMode === 'aimed'){
    const dx = aim.x - sx, dy = Math.min(-40, aim.y - sy), d = Math.hypot(dx, dy);
    vx = dx / d * PEA_SPEED; vy = dy / d * PEA_SPEED;
  }
  peas.push({ x: sx, y: sy, px: sx, py: sy, vx, vy });
  pete.lock = 0.12; pete.flash = 0.07; shotsFired++; SFX.pea();
  for (let i = 0; i < 5; i++) spawn(sx, sy, (Math.random() - .5) * 180, -40 - Math.random() * 120, 0.2, i % 2 ? '#fff6a0' : '#c8ff5a', 3, 200);
}
function popFx(x, y, size, color){
  rings.push({ x, y, max: SIZES[size].r * 2.1, life: 0.28, t: 0, color: '#fff', flash: SIZES[size].r });
  burst(x, y, color, 8 + size * 5); burst(x, y, shade(color, -0.35), 4 + size * 3); burst(x, y, '#fff', 4 + size * 2, 1.4, 0.3);
  hitStop = 0.02 + size * 0.012; shake(2 + size * 2, 0.1 + size * 0.03);
}
function popBalloon(b){
  b.dead = true;
  const before = comboMult(); combo++; maxCombo = Math.max(maxCombo, combo);
  const m = comboMult(), pts = SIZES[b.size].pts * m;
  addScore(pts);
  addFloater(b.x, b.y - 10, pts, m > 1 ? '#ffd23b' : '#fff', m > 2 ? 26 : 20);
  if (m > before){ addFloater(W / 2, FLOOR - 190, `COMBO X${m}!`, '#ffd23b', 40, 1.1); comboPulse = 0.5; }
  popFx(b.x, b.y, b.size, b.color);
  SFX.pop(b.size); SFX.combo(combo);
  if (Math.random() < 0.13) dropPickup(b.x, b.y);
}
function dropPickup(x, y){
  const r = Math.random();
  const type = r < 0.08 && lives < 6 ? '1UP' : r < 0.4 ? 'TRIPLE' : r < 0.7 ? 'FREEZE' : 'SHIELD';
  pickups.push({ x: Math.max(LEFT + 40, Math.min(RIGHT - 40, x)), y, vy: -150, type, t: 7 });
}
const PICK_COL = { TRIPLE: '#5ee06b', FREEZE: '#7fd8ff', SHIELD: '#c46bff', '1UP': '#ffe9a0' };
function collect(k){
  k.dead = true; SFX.pickup();
  if (k.type === 'TRIPLE') multiT = 10;
  if (k.type === 'FREEZE') freezeT = 4;
  if (k.type === 'SHIELD') shield = true;
  if (k.type === '1UP') lives++;
  rings.push({ x: k.x, y: k.y, max: 90, life: 0.3, t: 0, color: PICK_COL[k.type] });
  burst(k.x, k.y, PICK_COL[k.type], 12, 0.7);
  addFloater(k.x, k.y - 40, k.type === 'TRIPLE' ? 'TRIPLE BEANS!' : k.type + '!', '#ff0');
}
function addScore(n){
  score += n;
  if (score >= nextLife){ lives++; nextLife += LIFE_EVERY; addFloater(pete.x, FLOOR - 200, 'EXTRA LIFE!', '#5f5', 26, 1.4); SFX.pickup(); }
  if (score > hiScore){ hiScore = score; save('hi', hiScore); }
}
let lastBoing = 0;
function bounceSfx(size){ const n = performance.now(); if (n - lastBoing > 70){ lastBoing = n; SFX.boing(size); } }
function killPete(msg, hitFrom){
  lives--; deathMsg = msg; state = 'dead'; stateT = 2.8; SFX.ouch(); shield = false; combo = 0; hitStop = 0.09;
  pete.hitT = 0; pete.landed = false; pete.hitDir = hitFrom === undefined ? (Math.random() < .5 ? -1 : 1) : (hitFrom > pete.x ? -1 : 1);
  burst(pete.x, FLOOR - 60, '#fff', 14, 1.3, 0.3); burst(pete.x, FLOOR - 60, '#ffd23b', 16);
  shake(12, 0.4); flashT = 0.1; peas = []; bonus = null;
}
function segCircle(x1, y1, x2, y2, cx, cy, r){
  const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
  let t = L ? ((cx - x1) * dx + (cy - y1) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  const px = x1 + dx * t - cx, py = y1 + dy * t - cy;
  return px * px + py * py <= r * r;
}

/* ---------- particles / rings / floaters ---------- */
const DUST = ['#c9c0ae', '#a79f90', '#857e72'];
function spawn(x, y, vx, vy, life, color, s = 3, g = 900, flutter = false){
  if (parts.length > 700) return;
  parts.push({ x, y, vx, vy, life, color, s, g, flutter });
}
function burst(x, y, color, n, speed = 1, lifeK = 1){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = (120 + Math.random() * 380) * speed;
    spawn(x, y, Math.cos(a) * s, Math.sin(a) * s - 100, (0.5 + Math.random() * 0.5) * lifeK, color, Math.random() < .35 ? 6 : 3);
  }
}
function dust(x, n, amp){
  for (let i = 0; i < n; i++){ const d = i % 2 ? 1 : -1; spawn(x + d * 8, FLOOR - 3, d * (amp * 0.4 + Math.random() * amp), -10 - Math.random() * 50, 0.25 + Math.random() * 0.25, DUST[i % 3], 3, 140); }
}
function addFloater(x, y, text, color, size = 20, life = 1){ floaters.push({ x, y, text: String(text), color, life, size }); }
function updateParts(dt){
  for (const p of parts){
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.flutter){ p.x += Math.sin(p.life * 9 + p.vx) * 50 * dt; if (p.y > FLOOR){ p.y = FLOOR; p.vy = 0; p.vx = 0; } }
  }
  parts = parts.filter(p => p.life > 0);
  for (const f of floaters){ f.y -= (f.size > 30 ? 25 : 50) * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < r.life);
}

/* ---------- menu buttons (shoot them) ---------- */
const BTN_START = { x: W / 2 - 201, y: 483, w: 402, h: 72, label: 'SHOOT TO START' };
const BTN_AIM = { x: W / 2 - 252, y: 576, w: 504, h: 54 };
function inBtn(b){ return aim.x > b.x && aim.x < b.x + b.w && aim.y > b.y && aim.y < b.y + b.h; }
function handleMenuShot(){
  if (state === 'over' && stateT > 0) return;
  if (inBtn(BTN_AIM)){ aimMode = aimMode === 'classic' ? 'aimed' : 'classic'; save('aim', aimMode); SFX.ui(); burst(aim.x, aim.y, '#ff0', 10); return; }
  if (inBtn(BTN_START)) startGame();
  else { SFX.pea(); burst(aim.x, aim.y, '#8f8', 8, 0.6); rings.push({ x: aim.x, y: aim.y, max: 40, life: 0.2, t: 0, color: '#8f8' }); }
}

/* ---------- grungy city backgrounds (drawn directly in lo-res pixels) ---------- */
const FL = Math.round(FLOOR / 3), TOPY = Math.round(CEIL / 3), LWB = 427, LHB = 240;
const SCENES = [
  ['BACK ALLEY', sceneAlley], ['DOWNTOWN', sceneDowntown], ['ROOFTOPS', sceneRooftops], ['SUBWAY', sceneSubway],
  ['UNDER THE OVERPASS', sceneOverpass], ['SCRAPYARD', sceneScrap], ['THE DOCKS', sceneDocks], ['CONSTRUCTION SITE', sceneConstruction],
  ['NEON STRIP', sceneNeon], ['FACTORY ROW', sceneFactory], ['TRAIN YARD', sceneTrainyard], ['PARKING GARAGE', sceneGarage],
];
const sceneName = lv => SCENES[(lv - 1) % SCENES.length][0];
let FXQ = null;                       // animated details registered while a scene is painted (see drawFx)
const fxAdd = f => { if (FXQ) FXQ.push(f); };
function makeBackground(lv){
  const c = document.createElement('canvas'); c.width = LWB; c.height = LHB;
  const g = c.getContext('2d');
  const rnd = mulberry(lv * 977 + 13);
  FXQ = []; FXQ.wn = 0;
  SCENES[(lv - 1) % SCENES.length][1](g, rnd);
  c.fx = FXQ; FXQ = null;
  grime(g, 0, 0, LWB, LHB, rnd, 0.05, 'rgba(0,0,0,0.2)');            // film grit over everything
  R(g, 0, 0, LWB, TOPY, 'rgba(0,0,0,0.4)');
  R(g, 0, 0, 7, LHB, 'rgba(0,0,0,0.4)'); R(g, LWB - 7, 0, 7, LHB, 'rgba(0,0,0,0.4)');
  return c;
}
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255;

}

/* ---------- drawing (pixel renderer) ----------
   World is drawn to a 427x240 canvas (1 px = 3 screen px) and scaled up
   with no smoothing. Text, buttons and crosshair use a 5x7 bitmap font
   drawn on the full-size canvas in 3px blocks so everything shares one grid. */
const PIX = 3, LW = Math.ceil(W / PIX), LH = Math.ceil(H / PIX);
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const loCtx = lo.getContext('2d');
const hiCtx = cv.getContext('2d');
let ctx = loCtx, frameDt = 0.016;
const snap = v => Math.round(v / PIX) * PIX;

/* CRT overlay: faint scanlines on the pixel grid + vignette (toggle with C) */
const overlay = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.1)'; for (let y = 2; y < H; y += 3) g.fillRect(0, y, W, 1);
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.62, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.34)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c;
})();

const textCache = new Map();
function textCanvas(s, b, color, outline){
  const key = s + '|' + b + '|' + color + '|' + outline;
  let c = textCache.get(key);
  if (c) return c;
  const pad = outline ? b : 0;
  c = document.createElement('canvas');
  c.width = Math.max(1, s.length * 6 * b - b + pad * 2); c.height = 7 * b + pad * 2;
  const g = c.getContext('2d');
  const each = fn => { for (let i = 0; i < s.length; i++){ const gl = FONT[s[i]]; if (gl) for (const [x, y] of gl) fn(pad + (i * 6 + x) * b, pad + y * b); } };
  if (outline){ g.fillStyle = '#000'; each((x, y) => g.fillRect(x - b, y - b, b * 3, b * 3)); }
  g.fillStyle = color; each((x, y) => g.fillRect(x, y, b, b));
  if (outline){ g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(0, pad + 5 * b, c.width, 2 * b); }   // shaded bottom rows
  if (textCache.size > 500) textCache.clear();
  textCache.set(key, c);
  return c;
}
function txt(s, x, y, size, color = '#fff', align = 'left', outline = 5){
  s = String(s).toUpperCase().replace(/—/g, '-');
  const b = PIX * Math.max(1, Math.round(size / 24));
  const c = textCanvas(s, b, color, outline > 0.5);
  let dx = align === 'center' ? x - c.width / 2 : align === 'right' ? x - c.width : x;
  hiCtx.drawImage(c, snap(dx), snap(y - c.height / 2));
}

function draw(){
  const dt = state === 'paused' ? 0 : frameDt;
  hiCtx.imageSmoothingEnabled = false;
  loCtx.imageSmoothingEnabled = false;
  loCtx.setTransform(1 / PIX, 0, 0, 1 / PIX, 0, 0);
  ctx = loCtx;

  if (state === 'title'){
    drawTitleWorld(dt); composite(); ctx = hiCtx; drawTitleUI(); post(); drawCrosshair(); return;
  }
  ctx.drawImage(bgCanvas, 0, 0, LW * PIX, LH * PIX);
  drawFx(bgCanvas.fx, dt);
  for (const k of pickups) drawPickup(k);
  if (bonus) drawBalloon(bonus);
  for (const b of balloons) drawBalloon(b);
  drawRings();
  for (const p of peas) drawPea(p);
  if (state === 'dead' || state === 'over') drawPeteDown(); else drawPete();
  drawParts();
  composite();

  ctx = hiCtx;
  drawFloaters();
  drawHUD();
  if (state === 'intro') banner(`LEVEL ${level}`, `${sceneName(level)} - GET READY!`, Math.min(1, (2 - stateT) * 5));
  if (state === 'play' && goT > 0) txt('GO!', W / 2, H / 2 - 30, 112, Math.floor(goT * 16) % 2 ? '#fff' : '#5ee06b', 'center');
  if (state === 'dead' && pete.hitT > 0.5) banner(deathMsg, lives > 0 ? `${lives} ${lives === 1 ? 'LIFE' : 'LIVES'} LEFT` : '');
  if (state === 'clear' && clearInfo) drawClear();
  if (state === 'paused') banner('PAUSED', 'PRESS P / GUN BUTTON A TO RESUME');
  if (state === 'over') drawGameOver();
  post();
  drawCrosshair();
}
function composite(){
  let ox = 0, oy = 0;
  if (shakeT > 0 && state !== 'paused'){
    const a = shakeAmp * shakeT / shakeDur;
    ox = snap((Math.random() * 2 - 1) * a); oy = snap((Math.random() * 2 - 1) * a);
    hiCtx.fillStyle = '#000'; hiCtx.fillRect(0, 0, W, H);
  }
  hiCtx.drawImage(lo, ox, oy, LW * PIX, LH * PIX);
}
function post(){
  if (flashT > 0){ hiCtx.fillStyle = `rgba(255,255,255,${Math.min(0.6, flashT * 6)})`; hiCtx.fillRect(0, 0, W, H); }
  if (crt) hiCtx.drawImage(overlay, 0, 0);
}

/* ---------- animated background details (lo-res pixels) ---------- */
function drawFx(fx, dt){
  if (!fx) return;
  const g = loCtx, t = gameT, rr = Math.random;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  for (const f of fx){
    if (f.k === 'neon'){
      f.next -= dt;
      if (f.next <= 0){ f.off = 0.04 + rr() * 0.2; f.next = f.off + (rr() < 0.55 ? 0.06 + rr() * 0.2 : 2 + rr() * 8); }
      if (f.off > 0){ f.off -= dt; R(g, f.x, f.y, f.w, f.h, 'rgba(6,6,12,0.8)'); }
    } else if (f.k === 'blink'){
      if ((t + f.ph) % 1.6 < 0.8){ R(g, f.x - 1, f.y, 3, 1, '#ff5a5a'); R(g, f.x, f.y - 1, 1, 3, '#ff5a5a'); P(g, f.x, f.y, '#ffd8d8'); }
    } else if (f.k === 'fire'){
      if (t - (f.t || 0) > 0.07){
        f.t = t; f.gl = 0.5 + rr() * 0.5; f.fl = [];
        for (let i = 0; i < 12; i++) f.fl.push([f.x + Math.floor(rr() * 8), f.y - Math.floor(rr() * 11), 1 + Math.floor(rr() * 2), 2 + Math.floor(rr() * 4), ['#ffd23b', '#ff8a2a', '#ff4a1a', '#fff2a0'][Math.floor(rr() * 4)]]);
        if (rr() < 0.4) spawn((f.x + 2 + rr() * 6) * PIX, (f.y - 8) * PIX, (rr() - .5) * 50, -70 - rr() * 90, 0.9, '#ffb040', 3, -40);
      }
      disc(g, f.x + 4, f.y - 2, 24, `rgba(255,130,40,${0.05 * f.gl})`); disc(g, f.x + 4, f.y - 2, 13, `rgba(255,150,50,${0.07 * f.gl})`);
      for (const q of f.fl) R(g, q[0], q[1], q[2], q[3], q[4]);
    } else if (f.k === 'win'){
      if (f.next === undefined) f.next = rr() * 25;
      f.next -= dt; if (f.next <= 0){ f.on = !f.on; f.next = 5 + rr() * 30; }
      if (f.on !== f.base) R(g, f.x, f.y, f.w, f.h, f.on ? f.lit : f.dark);
    } else if (f.k === 'rain'){
      if (!f.d){ f.d = []; f.s = []; for (let i = 0; i < f.n; i++) f.d.push({ x: rr() * (LWB + 60), y: rr() * FL, v: 170 + rr() * 90 }); }
      g.fillStyle = 'rgba(170,195,235,0.5)';
      for (const d of f.d){
        d.y += d.v * dt; d.x -= d.v * 0.3 * dt;
        if (d.y > FL + (d.v - 170) * 0.3){ if (rr() < 0.5) f.s.push({ x: d.x, y: d.y, t: 0.12 }); d.y = TOPY - rr() * 30; d.x = rr() * (LWB + 60); }
        g.fillRect(d.x | 0, d.y | 0, 1, 2); g.fillRect((d.x | 0) + 1, (d.y | 0) - 2, 1, 2);
      }
      g.fillStyle = 'rgba(200,220,255,0.6)';
      for (const s of f.s){ s.t -= dt; g.fillRect((s.x | 0) - 1, (s.y | 0) - 1, 1, 1); g.fillRect((s.x | 0) + 1, (s.y | 0) - 1, 1, 1); }
      f.s = f.s.filter(s => s.t > 0);
    } else if (f.k === 'smoke'){
      if (!f.p){ f.p = []; f.e = 0; }
      f.e -= dt; if (f.e <= 0){ f.e = f.rate || 0.55; f.p.push({ x: f.x + rr() * 2, y: f.y, r: f.r0 || 2, a: f.a0 || 0.34 }); }
      for (const p of f.p){ p.y -= 9 * dt; p.x += (4 + (f.y - p.y) * 0.12) * dt; p.r += 1.5 * dt; p.a -= 0.055 * dt; if (p.a > 0) disc(g, p.x, p.y, p.r, `rgba(${f.c},${p.a.toFixed(3)})`); }
      f.p = f.p.filter(p => p.a > 0);
    } else if (f.k === 'shimmer'){
      if (t - (f.t || -1) > 0.22){ f.t = t; f.l = []; for (let i = 0; i < 16; i++) f.l.push([f.x + rr() * f.w, f.y + 2 + rr() * (f.h - 3), 3 + rr() * 9]); }
      for (const l of f.l) R(g, l[0], l[1], l[2], 1, 'rgba(190,215,225,0.35)');
    } else if (f.k === 'weld'){
      if (f.next === undefined) f.next = 1;
      f.next -= dt; if (f.next <= 0){ f.on = 0.4 + rr() * 0.9; f.next = f.on + 1.5 + rr() * 5; }
      if (f.on > 0){
        f.on -= dt;
        if (rr() < 0.7){ glow(g, f.x, f.y, 7, '150,205,255', 2); R(g, f.x - 1, f.y, 3, 1, '#9fd8ff'); R(g, f.x, f.y - 1, 1, 3, '#9fd8ff'); P(g, f.x, f.y, '#fff'); }
        if (rr() < dt * 40) spawn(f.x * PIX, f.y * PIX, (rr() - .5) * 200, -rr() * 140, 0.7, rr() < .5 ? '#ffd070' : '#fff', 3, 700);
      }
    } else if (f.k === 'birds'){
      if (f.next === undefined) f.next = 2 + rr() * 6;
      if (!f.b){ f.next -= dt; if (f.next <= 0){ const d = rr() < .5 ? 1 : -1, n = 3 + Math.floor(rr() * 4); f.b = { x: d > 0 ? -12 : LWB + 12, y: 30 + rr() * 45, d, o: Array.from({ length: n }, () => [rr() * 6, (rr() - .5) * 12]) }; } }
      else {
        f.b.x += f.b.d * 40 * dt; g.fillStyle = f.c || '#18181c';
        f.b.o.forEach((o, i) => { const bx = Math.round(f.b.x - f.b.d * (i * 8 + o[0])), by = Math.round(f.b.y + o[1] + Math.sin(t * 2 + i) * 2), up = Math.floor(t * 7 + i) % 2;
          g.fillRect(bx, by, 1, 1); g.fillRect(bx - 1, by + (up ? -1 : 0), 1, 1); g.fillRect(bx + 1, by + (up ? -1 : 0), 1, 1); g.fillRect(bx - 2, by + (up ? -1 : 1), 1, 1); g.fillRect(bx + 2, by + (up ? -1 : 1), 1, 1); });
        if (f.b.x < -80 || f.b.x > LWB + 80){ f.b = null; f.next = 6 + rr() * 12; }
      }
    }
  }
  g.restore();
}

/* ---------- rubber balls: dithered sphere shading, stripe rotates as the ball rolls ---------- */
const ROT_N = 12, BAYER = [[0, 2], [3, 1]];
const ballCache = new Map();
function ballSprite(size, col, frame){
  const key = size + col + frame; let c = ballCache.get(key); if (c) return c;
  const r = SIZES[size].r / PIX + 1, d = Math.ceil(r * 2) + 2, ri = r - 1;
  c = document.createElement('canvas'); c.width = c.height = d;
  const g = c.getContext('2d'), cx = d / 2, cy = d / 2;
  const tones = [shade(col, -0.6), shade(col, -0.32), col, shade(col, 0.32), shade(col, 0.62)];
  const ang = frame / ROT_N * Math.PI * 2, ca = Math.cos(ang), sa = Math.sin(ang);
  for (let y = 0; y < d; y++) for (let x = 0; x < d; x++){
    const px = x + 0.5 - cx, py = y + 0.5 - cy, rr = Math.hypot(px, py);
    if (rr > r) continue;
    let f = '#000';
    if (rr <= ri){
      const nx = px / ri, ny = py / ri, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
      const lum = -0.5 * nx - 0.62 * ny + 0.6 * nz;                       // light from the top-left
      let idx = Math.round(lum * 2.1 + 1.25 + (BAYER[y & 1][x & 1] / 4 - 0.375) * 0.9);
      idx = Math.max(0, Math.min(3, idx));
      if (rr > ri - 1.2 && lum < -0.2 && nx + ny > 0.9) idx = 1;          // bounce light on the lower-right rim
      const u = px * ca + py * sa, w = -px * sa + py * ca;
      if (Math.abs(w - 0.3 * u * u / r) < r * 0.14) idx = Math.min(4, idx + 1);   // rubber stripe
      f = tones[idx];
    }
    g.fillStyle = f; g.fillRect(x, y, 1, 1);
  }
  const hs = Math.max(1, Math.round(r * 0.18));
  g.fillStyle = '#fff'; g.fillRect(Math.round(cx - r * 0.5), Math.round(cy - r * 0.55), hs, hs);
  if (r > 8) g.fillRect(Math.round(cx - r * 0.5) + hs, Math.round(cy - r * 0.55) - 1, 1, 1);
  ballCache.set(key, c); return c;
}
function drawBalloon(b){
  const r = SIZES[b.size].r, frozen = freezeT > 0 && b !== bonus;
  const fr = ((Math.floor((b.rot || 0) / (Math.PI * 2) * ROT_N) % ROT_N) + ROT_N) % ROT_N;
  const spr = ballSprite(b.size, frozen ? '#9fd8ff' : b.color, fr);
  const s = b.hold > 0 ? Math.sin((1 - b.hold / HOLD) * Math.PI) : 0;   // squish amount 0..1
  const w = snap(spr.width * PIX * (1 + 0.38 * s)), h = snap(spr.height * PIX * (1 - 0.32 * s));
  const bottom = snap(b.y + r) + PIX;
  const k = Math.max(0, 1 - (FLOOR - b.y - r) / 420);
  ctx.fillStyle = `rgba(0,0,0,${0.12 + 0.2 * k})`;
  const shw = snap(r * 1.5 * (0.45 + 0.55 * k));
  ctx.fillRect(snap(b.x - shw / 2), FLOOR, shw, PIX * 2); ctx.fillRect(snap(b.x - shw / 2) + PIX, FLOOR + PIX * 2, shw - PIX * 2, PIX);
  ctx.drawImage(spr, snap(b.x - w / 2), bottom - h, w, h);
  if (frozen && Math.floor(gameT * 6 + b.x) % 5 === 0){ ctx.fillStyle = '#fff'; ctx.fillRect(snap(b.x + r * 0.4), snap(b.y - r * 0.5), PIX, PIX); }
}
function ringPix(x, y, r, color, thick){
  ctx.fillStyle = color;
  const n = Math.max(12, Math.floor(r * 6.3 / PIX)), s = thick ? PIX * 2 : PIX;
  for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2; ctx.fillRect(snap(x + Math.cos(a) * r), snap(y + Math.sin(a) * r), s, s); }
}
function drawRings(){
  for (const r of rings){
    const k = r.t / r.life, e = 1 - (1 - k) * (1 - k);
    if (r.flash && r.t < 0.05){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r.x, r.y, r.flash * 1.15, 0, 7); ctx.fill(); }
    if (k > 0.75 && Math.floor(r.t * 60) % 2) continue;
    ringPix(r.x, r.y, r.max * (0.35 + 0.65 * e), r.color, k < 0.45);
  }
}
/* green bean (pixel art, lo-res) */
const BEAN = ['..##..', '.#lg#.', '#llgg#', '#lggg#', '#gggg#', '.#ggd#', '.#gdd#', '..##..'];

}
function peteFrame(){

}
function drawPete(){

/* ---------- pickups: capsule with a pixel icon ---------- */
const ICONS = {
  FREEZE: ['....#....', '.#..#..#.', '..#.#.#..', '...###...', '#########', '...###...', '..#.#.#..', '.#..#..#.', '....#....'],

function drawPickup(k){
  if (k.t < 2 && Math.floor(k.t * 8) % 2) return;
  const col = PICK_COL[k.type];
  const x = snap(k.x), y = snap(k.y + (k.y >= FLOOR - 24 ? Math.sin(gameT * 5 + k.x) * 4 : 0));
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x - 24, FLOOR, 48, PIX * 2);

  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x - 27, y - 21, 54, 6);
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x - 27, y + 15, 54, 6);
  if (k.type === 'TRIPLE'){ for (let i = -1; i <= 1; i++) ctx.drawImage(beanImg, x + i * 18 - 9, y - 12 + (i ? 3 : -3), 18, 24); return; }
  const ic = ICONS[k.type];
  ctx.fillStyle = k.type === '1UP' ? '#e0263c' : k.type === 'FREEZE' ? '#0b3a66' : '#3a1466';
  ic.forEach((row, j) => { for (let i = 0; i < 9; i++) if (row[i] === '#') ctx.fillRect(x - 12 + i * PIX, y - 12 + j * PIX, PIX, PIX); });
}
function drawParts(){
  for (const p of parts){
    if (p.life < 0.2 && Math.floor(p.life * 30) % 2) continue;
    ctx.fillStyle = p.color;
    ctx.fillRect(snap(p.x), snap(p.y), p.s, p.s);
  }
}
function drawFloaters(){
  for (const f of floaters) if (f.life > 0.25 || Math.floor(f.life * 30) % 2) txt(f.text, f.x, f.y, f.size, f.color, 'center');
}
function drawHUD(){
  const g = hiCtx;
  g.fillStyle = '#000'; g.fillRect(0, 0, W, CEIL);
  txt(`SCORE ${Math.round(dispScore)}`, 30, 24, 26, dispScore < score ? '#ffd23b' : '#fff');
  txt(`HI ${hiScore}`, 330, 24, 20, '#ffd23b');
  txt(`LEVEL ${level}`, W / 2 + 20, 24, 26, '#fff', 'center');
  const low = timer < 10 && state === 'play';
  txt(`TIME ${Math.ceil(timer)}`, 810, 24, 26, low && Math.floor(timer * 4) % 2 ? '#f44' : '#fff');
  // lives: Benny's cap
  const n = Math.min(lives, 5);
  for (let i = 0; i < n; i++) if (PETE_IMG.complete) g.drawImage(PETE_IMG, 5, 15, 14, 12, W - 24 - (i + 1) * 45, 6, 42, 36);
  if (lives > 5) txt(`+${lives - 5}`, W - 24 - 5 * 45 - 9, 24, 20, '#7fd8ff', 'right');
  // timer bar
  const frac = Math.max(0, timer / timerMax), bw = W - 60;
  g.fillStyle = '#26262c'; g.fillRect(30, 48, bw, 9);
  g.fillStyle = frac > 0.5 ? '#5ee06b' : frac > 0.25 ? '#ffd23b' : (low && Math.floor(timer * 4) % 2 ? '#fff' : '#ff3b5c');
  g.fillRect(30, 48, snap(bw * frac), 9);
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(30, 48, snap(bw * frac), 3);
  g.fillStyle = '#000'; for (let x = 30 + 21; x < 30 + bw; x += 24) g.fillRect(x, 48, 3, 9);
  // bottom strip
  let sx = 30;
  if (multiT > 0){ txt(`TRIPLE ${Math.ceil(multiT)}`, sx, H - 30, 20, '#5ee06b'); sx += 210; }
  if (freezeT > 0){ txt(`FREEZE ${Math.ceil(freezeT)}`, sx, H - 30, 20, '#7fd8ff'); sx += 210; }
  if (shield) txt('SHIELD', sx, H - 30, 20, '#c46bff');
  const m = comboMult();
  if (m > 1 && (state === 'play' || state === 'clear')) txt(`COMBO X${m}`, W / 2, H - 33, 40, comboPulse > 0 && Math.floor(comboPulse * 20) % 2 ? '#fff' : '#ffd23b', 'center');
  else if (combo > 0 && state === 'play') txt(`${combo} HIT${combo > 1 ? 'S' : ''}`, W / 2, H - 30, 20, '#ddd', 'center');
  txt(aimMode === 'classic' ? 'CLASSIC AIM' : 'FREE AIM', W - 30, H - 30, 16, '#ccc', 'right');
}
function banner(a, b, k = 1){
  const h = snap(171 * k), y0 = snap(H / 2 - 5 - h / 2);
  hiCtx.fillStyle = 'rgba(0,0,0,0.65)'; hiCtx.fillRect(0, y0, W, h);
  hiCtx.fillStyle = '#ffd23b'; hiCtx.fillRect(0, y0, W, 3); hiCtx.fillRect(0, y0 + h - 3, W, 3);
  if (k < 1) return;
  txt(a, W / 2, H / 2 - 30, 64, '#ffd23b', 'center');
  if (b) txt(b, W / 2, H / 2 + 42, 22, '#fff', 'center');
}
function drawClear(){
  const g = hiCtx, e = CLEAR_T - stateT, rows = clearInfo.rows, y0 = 186, h = 150 + (rows.length + 1) * 42;
  g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillRect(0, y0, W, h);
  g.fillStyle = '#ffd23b'; g.fillRect(0, y0, W, 3); g.fillRect(0, y0 + h - 3, W, 3);
  txt('LEVEL CLEAR!', W / 2, y0 + 54, 64, Math.floor(e * 6) % 2 ? '#ffd23b' : '#fff', 'center');
  const val = (i, v) => Math.round(v * Math.min(1, Math.max(0, (e - 0.7 - i * 0.55) / 0.4)) / 50) * 50;
  rows.forEach((r, i) => {
    if (i >= clearInfo.shown) return;
    const y = y0 + 123 + i * 42, perfect = r[0] === 'PERFECT AIM!';
    txt(r[0], 400, y, 22, perfect ? '#5ee06b' : '#fff'); txt('+' + val(i, r[1]), 880, y, 22, perfect ? '#5ee06b' : '#ffd23b', 'right');
  });
  if (clearInfo.shown > rows.length){
    const y = y0 + 132 + rows.length * 42;
    g.fillStyle = '#fff'; g.fillRect(400, y - 24, 480, 3);
    txt('TOTAL', 400, y, 26, '#fff'); txt('+' + val(rows.length, clearInfo.total), 880, y, 26, '#ffd23b', 'right');
  }
}
function drawButton(b, label, hot){
  const g = hiCtx, p = hot ? 3 : 0;
  g.fillStyle = '#000'; g.fillRect(b.x - 6 - p, b.y - 6 - p, b.w + 12 + p * 2, b.h + 12 + p * 2);
  g.fillStyle = hot ? '#ffd23b' : '#ff6a3b'; g.fillRect(b.x - p, b.y - p, b.w + p * 2, b.h + p * 2);
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(b.x - p, b.y - p, b.w + p * 2, 6);
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(b.x - p, b.y + b.h + p - 6, b.w + p * 2, 6);
  txt(label, b.x + b.w / 2, b.y + b.h / 2, b.h > 60 ? 26 : 16, hot ? '#000' : '#fff', 'center', hot ? 0 : 5);
}
function drawTop(x, y){
  if (!topScores.length) return;
  txt('TOP BLASTERS', x, y, 20, '#ffd23b');
  topScores.forEach((t, i) => {
    const me = i === lastRank && state === 'over';
    txt(`${i + 1}. ${t.s}`, x, y + 33 + i * 27, 20, me ? (Math.floor(gameT * 5) % 2 ? '#fff' : '#5ee06b') : '#ddd');
    txt(`L${t.l}`, x + 300, y + 33 + i * 27, 20, me ? '#5ee06b' : '#999', 'right');
  });
}
function drawTitleWorld(dt){
  if (!bgCanvas) bgCanvas = makeBackground(9);
  ctx.drawImage(bgCanvas, 0, 0, LW * PIX, LH * PIX);
  drawFx(bgCanvas.fx, dt);
  if (titleBalloons) for (const b of titleBalloons) drawBalloon(b);
  pete.vx = 0; pete.x = 1080; drawPete();
  drawRings(); drawParts();
}
function drawTitleUI(){
  hiCtx.fillStyle = 'rgba(0,0,0,0.55)'; hiCtx.fillRect(0, 351, W, 330);
  hiCtx.fillStyle = '#ffd23b'; hiCtx.fillRect(0, 351, W, 3); hiCtx.fillRect(0, 678, W, 3);
  if (LOGO_IMG.complete && LOGO_IMG.width){
    const lw = LOGO_IMG.width * PIX, lh = LOGO_IMG.height * PIX, bob = snap(Math.sin(performance.now() / 400) * 6);
    hiCtx.drawImage(LOGO_IMG, snap((W - lw) / 2), 66 + bob, lw, lh);
  }
  txt('Point where Benny should run. Pull the trigger to blast a bean.', W / 2, 384, 22, '#fff', 'center');
  txt('Pop every ball - big ones split. Chain hits for a combo!', W / 2, 420, 22, '#ddd', 'center');
  txt(`HI SCORE ${hiScore}`, W / 2, 456, 22, '#ffd23b', 'center');
  drawButton(BTN_START, BTN_START.label, inBtn(BTN_START) || Math.floor(gameT * 2) % 2 === 0);
  drawButton(BTN_AIM, aimMode === 'classic' ? 'AIM: CLASSIC (STRAIGHT UP)' : 'AIM: FREE (AT CROSSHAIR)', inBtn(BTN_AIM));
  drawTop(60, 498);
  txt('Gun A = pause   M = music   C = CRT look   F = fullscreen', W / 2, 657, 16, '#ccc', 'center');
}
function drawGameOver(){
  hiCtx.fillStyle = 'rgba(0,0,0,0.7)'; hiCtx.fillRect(0, 0, W, H);
  txt('GAME OVER', W / 2, 220, 96, '#ff3b5c', 'center');
  txt(`SCORE ${score}`, W / 2, 320, 40, '#fff', 'center');
  txt(score > startHi && score > 0 ? 'NEW HIGH SCORE!' : `HI SCORE ${hiScore}`, W / 2, 372, 26, score > startHi && Math.floor(gameT * 4) % 2 ? '#fff' : '#ffd23b', 'center');
  txt(`You reached level ${level} - ${sceneName(level)}`, W / 2, 420, 20, '#ddd', 'center');
  drawButton(BTN_START, 'SHOOT TO PLAY AGAIN', inBtn(BTN_START));
  drawButton(BTN_AIM, aimMode === 'classic' ? 'AIM: CLASSIC (STRAIGHT UP)' : 'AIM: FREE (AT CROSSHAIR)', inBtn(BTN_AIM));
  drawTop(60, 498);
}
function drawCrosshair(){
  const x = snap(aim.x), y = snap(aim.y), c = hiCtx;
  const loaded = state !== 'play' || peas.length < (multiT > 0 ? 3 : 1);
  const bars = [[-27, -1, 18, 3], [9, -1, 18, 3], [-1, -27, 3, 18], [-1, 9, 3, 18],
                [-12, -15, 24, 3], [-12, 12, 24, 3], [-15, -12, 3, 24], [12, -12, 3, 24]];
  c.fillStyle = '#000'; for (const [a, b, w, h] of bars) c.fillRect(x + a - 3, y + b - 3, w + 6, h + 6);
  c.fillStyle = loaded ? '#7fff5a' : '#5a8a4a'; for (const [a, b, w, h] of bars) c.fillRect(x + a, y + b, w, h);
  c.fillRect(x - 1, y - 1, 3, 3);
  if ((state === 'play' || state === 'intro') && aimMode === 'classic'){
    c.fillStyle = 'rgba(127,255,90,0.3)';
    for (let yy = y + 36; yy < FLOOR - SPR_H * PIX; yy += 18) c.fillRect(x - 1, yy, 3, 9);
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now; frameDt = dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
