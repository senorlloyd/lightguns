<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carnival Games — Light Gun Midway</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;user-select:none}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =========================================================
   CARNIVAL GAMES — a light gun midway (OpenFIRE / mouse)
   Trigger = left click. Right-click or R = reload (Saloon).
   C = crosshair on/off · F = fullscreen · M = mute · Esc/Q = back to midway
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1280,H=720;let SC=1,OX=0,OY=0;
function resize(){cv.width=innerWidth;cv.height=innerHeight;SC=Math.min(cv.width/W,cv.height/H);OX=(cv.width-W*SC)/2;OY=(cv.height-H*SC)/2;}
addEventListener('resize',resize);resize();

/* ---------- utils ---------- */
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[(Math.random()*a.length)|0];
function wpick(o){let s=0;for(const k in o)s+=o[k];let r=Math.random()*s;for(const k in o){r-=o[k];if(r<=0&&o[k]>0)return k;}for(const k in o)if(o[k]>0)return k;}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);}
function inRect(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function inEll(px,py,x,y,rx,ry){const dx=(px-x)/rx,dy=(py-y)/ry;return dx*dx+dy*dy<=1;}
function starPath(x,y,r1,r2,n=5,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}
const FONT="'Rockwell','Georgia','DejaVu Serif',serif";
function txt(s,x,y,size,color='#fff',align='center',stroke='#000',sw=0){ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';if(sw){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=color;ctx.fillText(s,x,y);}
function bulbRect(x,y,w,h,sp,t,c1='#ffe680',c2='#6b4a1a'){const per=2*(w+h),n=Math.floor(per/sp),ph=Math.floor(t*8);for(let i=0;i<n;i++){let d=i*per/n,px,py;if(d<w){px=x+d;py=y}else if(d<w+h){px=x+w;py=y+d-w}else if(d<2*w+h){px=x+w-(d-w-h);py=y+h}else{px=x;py=y+h-(d-2*w-h)}const on=((i+ph)%3)!==0;if(on){ctx.fillStyle='rgba(255,220,120,.22)';circ(px,py,9);ctx.fill();}ctx.fillStyle=on?c1:c2;circ(px,py,4.5);ctx.fill();}}
function awning(x,y,w,h,c1,c2,n){const sw=w/n;for(let i=0;i<n;i++){ctx.fillStyle=i%2?c2:c1;ctx.beginPath();ctx.moveTo(x+i*sw,y);ctx.lineTo(x+(i+1)*sw,y);ctx.lineTo(x+(i+1)*sw,y+h);ctx.arc(x+(i+.5)*sw,y+h,sw/2,0,Math.PI,false);ctx.closePath();ctx.fill();}}
function stripes(x,y,w,h,c1,c2,n,vertical=true){const s=(vertical?w:h)/n;for(let i=0;i<n;i++){ctx.fillStyle=i%2?c2:c1;if(vertical)ctx.fillRect(x+i*s,y,s+1,h);else ctx.fillRect(x,y+i*s,w,s+1);}}

/* ---------- input ---------- */
const inp={x:W/2,y:H/2,down:false,pressed:false,rpressed:false};
function setPos(e){inp.x=(e.clientX-OX)/SC;inp.y=(e.clientY-OY)/SC;}
addEventListener('pointermove',e=>setPos(e));
addEventListener('pointerdown',e=>{setPos(e);initAudio();if(e.button===2){inp.rpressed=true;return;}if(e.button===0){inp.down=true;inp.pressed=true;}});
addEventListener('pointerup',e=>{if(e.button===0)inp.down=false;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{inp.down=false;});
let showCross=true;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();initAudio();
  if(k==='c')showCross=!showCross;else if(k==='f')toggleFS();else if(k==='m')toggleMute();else if(k==='r')inp.rpressed=true;
  else if(k==='escape'||k==='q'||k==='backspace'){if(scene!==S.hub&&scene!==S.title)goHub();}});
function toggleFS(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}}

/* ---------- audio (all synthesized, original) ---------- */
let AC=null,master,sfxGain,musicGain,noiseBuf,waterG,muted=false;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:.9;master.connect(AC.destination);
  sfxGain=AC.createGain();sfxGain.gain.value=1;sfxGain.connect(master);
  musicGain=AC.createGain();musicGain.gain.value=.5;musicGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const ns=AC.createBufferSource();ns.buffer=noiseBuf;ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=.6;
  waterG=AC.createGain();waterG.gain.value=0;ns.connect(bp);bp.connect(waterG);waterG.connect(sfxGain);ns.start();
  mus.next=AC.currentTime+.1;}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.9;}
function mf(m){return 440*Math.pow(2,(m-69)/12);}
function tone(f,d,type='square',v=.2,slide=0,delay=0,dest){if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+d+.03);}
function noise(d,v,freq,type='lowpass',delay=0,q=1){if(!AC)return;const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t,Math.random()*.5);s.stop(t+d+.02);}
function setWater(on){if(!AC||!waterG)return;waterG.gain.setTargetAtTime(on?.22:0,AC.currentTime,.03);}
const sfx={
  shot(){noise(.08,.55,1800,'highpass');tone(170,.07,'square',.18,-110);},
  dry(){tone(2200,.025,'square',.08);},
  reload(){for(let i=0;i<6;i++)tone(1300+i*40,.03,'square',.06,0,.08+i*.09);tone(500,.08,'triangle',.15,0,.7);},
  pop(){noise(.14,.75,1300,'bandpass',0,.8);tone(320,.08,'sine',.2,-220);},
  ding(){tone(1320,.35,'sine',.22);tone(1980,.25,'sine',.1);},
  bad(){tone(180,.32,'sawtooth',.16,-70);tone(140,.32,'sawtooth',.12,-50,.02);},
  clank(){tone(900+Math.random()*300,.1,'square',.08,-400);tone(1500,.16,'triangle',.07);noise(.05,.3,3000,'bandpass');},
  bell(){[1,2.76,5.4].forEach((m,i)=>tone(700*m,1.3-i*.3,'sine',.2/(i+1)));},
  beep(){tone(660,.13,'square',.12);},
  go(){tone(990,.4,'square',.14);tone(1320,.4,'square',.07);},
  whistle(){tone(1900,.45,'sine',.18,-300);tone(2400,.45,'sine',.06,-300);},
  boom(){noise(.7,.8,500,'lowpass');for(let i=0;i<6;i++)noise(.04,.25,4000,'highpass',.25+Math.random()*.4);},
  boing(){tone(260,.18,'sine',.2,520);},
  fanfare(){[[72,0],[76,.1],[79,.2],[84,.32]].forEach(([m,d])=>{tone(mf(m),.3,'square',.08,0,d);tone(mf(m),.3,'triangle',.14,0,d);});},
  aww(){[[67,0],[66,.28],[65,.56]].forEach(([m,d],i)=>tone(mf(m),i===2?.7:.3,'triangle',.18,i===2?-30:0,d));},
  tick(){tone(1700,.03,'square',.04);},
  gurgle(){tone(220+Math.random()*260,.07,'sine',.12,240);},
  whoosh(){noise(.25,.25,900,'bandpass',0,.5);},
};
/* original oom-pah calliope waltz */
const MEL=[72,76,79, 84,0,79, 77,76,74, 79,0,0, 71,74,77, 83,0,77, 76,77,79, 72,0,0, 76,79,84, 88,0,84, 81,84,81, 77,0,0, 79,76,72, 74,77,71, 72,0,79, 72,0,0];
const CHS=['C','C','G','G','G','G','C','C','C','C','F','F','C','G','C','C'];
const CHD={C:{r:36,s:[52,55,60]},G:{r:43,s:[53,55,59]},F:{r:41,s:[53,57,60]}};
const mus={on:false,next:0,step:0};
function musicOn(v){mus.on=v;}
function musicTick(){if(!AC||!mus.on)return;const bt=60/172;if(mus.next<AC.currentTime-.3)mus.next=AC.currentTime+.05;
  while(mus.next<AC.currentTime+.25){const st=mus.step%48,bar=(st/3)|0,b=st%3,ch=CHD[CHS[bar]],dl=Math.max(0,mus.next-AC.currentTime);
    const m=MEL[st];if(m){let len=1;while(len<3&&MEL[(st+len)%48]===0)len++;tone(mf(m),bt*len*.92,'triangle',.13,0,dl,musicGain);tone(mf(m+12),bt*len*.85,'sine',.05,0,dl,musicGain);}
    if(b===0)tone(mf(ch.r),bt*.85,'triangle',.24,0,dl,musicGain);else ch.s.forEach(n=>tone(mf(n),bt*.3,'square',.028,0,dl,musicGain));
    mus.next+=bt;mus.step++;}}

/* ---------- particles & floaters ---------- */
const parts=[],floats=[],rings=[];let shake=0;
function burst(x,y,n,cols,o={}){const sp=o.sp??300,life=o.life??.8,g=o.g??700,sz=o.sz??5;n=Math.min(n,700-parts.length);for(let i=0;i<n;i++){const a=o.ang!=null?o.ang+rand(-o.spread,o.spread):rand(0,Math.PI*2),v=rand(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+(o.up||0),life:rand(life*.5,life),max:life,c:Array.isArray(cols)?pick(cols):cols,s:rand(sz*.5,sz),g,rot:rand(0,6),vr:rand(-10,10),sh:o.sh||'r'});}}
function confetti(x,y,n=60){burst(x,y,n,['#ff4d6d','#ffd60a','#4cc9f0','#7dff7a','#c77dff','#fff'],{sp:520,g:500,life:1.6,sz:7,up:-200});}
function firework(x,y,col){burst(x,y,55,[col,'#fff',col],{sp:300,g:90,life:1.5,sz:3.5,sh:'c'});sfx.boom();}
function popText(x,y,s,c='#ffe14d',size=34){floats.push({x,y,s,c,size,t:1.1});}
function ring(x,y){rings.push({x,y,t:.25});}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=dt;f.y-=50*dt;if(f.t<=0)floats.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){rings[i].t-=dt;if(rings[i].t<=0)rings.splice(i,1);}}
function drawParts(){for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max*1.6,0,1);ctx.fillStyle=p.c;if(p.sh==='c'){circ(p.x,p.y,p.s);ctx.fill();}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.s,-p.s/2,p.s*2,p.s);ctx.restore();}}
  ctx.globalAlpha=1;
  for(const r of rings){ctx.globalAlpha=r.t/.25;ctx.strokeStyle='#fff';ctx.lineWidth=3;circ(r.x,r.y,10+(1-r.t/.25)*22);ctx.stroke();}ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=clamp(f.t*2,0,1);const s=f.size*(1+Math.max(0,f.t-.9)*2);txt(f.s,f.x,f.y,s,f.c,'center','#000',6);}ctx.globalAlpha=1;}
function clearFX(){parts.length=0;floats.length=0;rings.length=0;}

/* ---------- save data ---------- */
const SAVE_KEY='carnivalGamesLG_v1';
let save={tickets:[0,0],prizes:[[],[]],best:{}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.tickets)save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const PCOL=['#ff3b5c','#2f9bff'];
const G={np:1,cur:0,booth:0,results:[],last:null};

/* ---------- shared HUD bits ---------- */
function pTag(x,y){ctx.fillStyle=PCOL[G.cur];rr(x,y,130,36,8);ctx.fill();txt(G.np>1?`PLAYER ${G.cur+1}`:'PLAYER 1',x+65,y+19,18,'#fff');}
function hud(name,score,time,maxTime,extra){
  ctx.fillStyle='rgba(12,6,24,.85)';ctx.fillRect(0,0,W,54);pTag(10,9);
  txt(name.toUpperCase(),155,28,22,'#ffd54a','left');
  if(maxTime){const f=clamp(time/maxTime,0,1),warn=time<10&&Math.floor(time*4)%2===0;ctx.fillStyle='#2b2140';rr(480,14,320,26,13);ctx.fill();ctx.fillStyle=warn?'#ff4d4d':'#ffd54a';rr(480,14,Math.max(26,320*f),26,13);ctx.fill();txt(Math.ceil(time),640,28,22,'#1a0d00');}
  txt('SCORE '+score,W-18,28,26,'#fff','right');
  if(extra)extra();}
function countdown(o,dt){const b=Math.ceil(o.pt);o.pt-=dt;const a=Math.ceil(o.pt);if(a!==b&&a>0)sfx.beep();if(o.pt<=0){sfx.go();return true;}return false;}
function drawCount(pt,sub){const n=Math.ceil(pt),fr=pt-Math.floor(pt),s=110+fr*70;ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,0,W,H);txt(String(n),640,350,s,'#ffe14d','center','#3a0010',14);if(sub)txt(sub,640,470,30,'#fff','center','#000',7);}
function bigText(s,c='#ffe14d',y=360,size=120){txt(s,640,y,size,c,'center','#3a0010',14);}

/* ---------- base booth (timed) ---------- */
class Base{
  constructor(time){this.score=0;this.time=time;this.maxTime=time;this.done=false;this.phase='count';this.pt=3;this.t=0;}
  update(dt){this.t+=dt;this.animate(dt);
    if(this.phase==='count'){if(countdown(this,dt))this.phase='play';}
    else if(this.phase==='play'){this.time-=dt;this.play(dt);if(this.time<=0){this.time=0;this.phase='end';this.pt=1.8;sfx.whistle();}}
    else if(this.phase==='end'){this.pt-=dt;if(this.pt<=0)this.done=true;}}
  get prog(){return clamp(1-this.time/this.maxTime,0,1);}
  tickets(){return Math.max(0,Math.round(this.score/10));}
  add(p,x,y,c){this.score=Math.max(0,this.score+p);popText(x,y,(p>0?'+':'')+p,c||(p>0?'#ffe14d':'#ff4d4d'));}
  overlay(name,extra,sub){hud(name,this.score,this.time,this.maxTime,extra);
    if(this.phase==='count')drawCount(this.pt,sub);
    else if(this.phase==='play'&&this.maxTime-this.time<.6)bigText('GO!','#7dff7a');
    else if(this.phase==='end')bigText('TIME!');}
  animate(){} play(){}
}

/* =========================================================
   SHARED DRAWINGS
   ========================================================= */
function drawBalloon(x,by,r,col){if(r<=1)return;const cy=by-r*1.05;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;
  ctx.fillStyle=col;ell(x,cy,r*.88,r);ctx.fill();ctx.beginPath();ctx.moveTo(x,by-r*.1);ctx.lineTo(x-6,by+6);ctx.lineTo(x+6,by+6);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.42)';ell(x-r*.36,cy-r*.42,r*.16,r*.28,-.4);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ell(x,cy,r*.88,r);ctx.stroke();}
function drawClown(x,y,mry,hair,hat,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=hair;for(const sx of[-1,1])for(let k=0;k<3;k++){circ(sx*(86+k*7),-38+k*30,30);ctx.fill();}
  ctx.fillStyle='#fff6ea';ctx.strokeStyle='#3a2a2a';ctx.lineWidth=5;circ(0,0,95);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,90,120,.33)';circ(-56,22,18);ctx.fill();circ(56,22,18);ctx.fill();
  for(const sx of[-1,1]){ctx.fillStyle='#4aa3ff';ctx.beginPath();ctx.moveTo(sx*36,-58);ctx.lineTo(sx*36+14,-28);ctx.lineTo(sx*36,2);ctx.lineTo(sx*36-14,-28);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';circ(sx*36,-28,9);ctx.fill();ctx.fillStyle='#111';circ(sx*36+sx*2,-27,5.5);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=4;ctx.beginPath();ctx.arc(sx*36,-62,14,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
  ctx.fillStyle='#ff2a2a';circ(0,6,17);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';circ(-5,0,5);ctx.fill();
  ctx.fillStyle='#e0142f';ell(0,45,40,mry+13);ctx.fill();ctx.fillStyle='#120006';ell(0,45,27,mry);ctx.fill();
  if(mry>12){ctx.fillStyle='#7a1022';ell(0,45+mry*.55,15,mry*.3);ctx.fill();}
  ctx.fillStyle=hat;ctx.beginPath();ctx.moveTo(-50,-80);ctx.lineTo(50,-80);ctx.lineTo(0,-152);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';circ(-14,-100,6);ctx.fill();circ(14,-112,5);ctx.fill();circ(-2,-128,4);ctx.fill();circ(22,-92,5);ctx.fill();
  ctx.fillStyle='#fff';ell(0,-80,54,8);ctx.fill();circ(0,-152,11);ctx.fill();
  ctx.restore();}
function drawPistol(x,y,ang,col){ctx.save();ctx.translate(x,y);ctx.rotate(ang+Math.PI/2);
  ctx.fillStyle='#222';rr(-14,-6,28,52,8);ctx.fill();ctx.fillStyle=col;rr(-18,-52,36,58,12);ctx.fill();ctx.fillStyle='#fff';rr(-7,-80,14,32,4);ctx.fill();
  ctx.fillStyle='rgba(120,200,255,.8)';rr(-12,-44,24,22,8);ctx.fill();ctx.restore();}
function drawStream(x1,y1,x2,y2,t,a=1){const cx=(x1+x2)/2,cy=Math.min(y1,y2)-70;ctx.globalAlpha=a;ctx.lineCap='round';
  ctx.strokeStyle='rgba(120,200,255,.75)';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.setLineDash([12,18]);ctx.lineDashOffset=-t*700;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
function drawCowboy(x,b,kind,dead,s=1,tin=false){ctx.save();ctx.translate(x,b);ctx.scale(s,s);
  const shirt=tin?'#9aa0a6':kind==='bandit'?'#5b2a2a':'#c9a36b',skin=tin?'#b9bec4':'#e2a877',hat=tin?'#7d838a':kind==='bandit'?'#1d1a1a':'#efe0b0';
  ctx.fillStyle=shirt;rr(-38,-52,76,62,16);ctx.fill();
  if(kind==='sheriff'){ctx.fillStyle='#ffd34d';starPath(-16,-30,11,5);ctx.fill();}
  else{ctx.strokeStyle=tin?'#666':'#2a1a10';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-30,-48);ctx.lineTo(28,6);ctx.stroke();}
  ctx.fillStyle=skin;circ(0,-74,26);ctx.fill();
  ctx.fillStyle=hat;ell(0,-94,48,9);ctx.fill();rr(-24,-126,48,34,10);ctx.fill();
  if(kind==='sheriff'){ctx.fillStyle='#8a5a2b';rr(-24,-104,48,6,2);ctx.fill();}
  ctx.strokeStyle='#111';ctx.fillStyle='#111';ctx.lineWidth=3.5;
  if(dead){for(const sx of[-10,10]){ctx.beginPath();ctx.moveTo(sx-5,-84);ctx.lineTo(sx+5,-74);ctx.moveTo(sx+5,-84);ctx.lineTo(sx-5,-74);ctx.stroke();}}
  else{circ(-10,-79,3.5);ctx.fill();circ(10,-79,3.5);ctx.fill();}
  if(kind==='bandit'){ctx.fillStyle=tin?'#c0392b':'#d62828';ctx.beginPath();ctx.moveTo(-27,-72);ctx.lineTo(27,-72);ctx.lineTo(0,-46);ctx.closePath();ctx.fill();}
  else{ctx.strokeStyle='#5a3418';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-14,-62);ctx.quadraticCurveTo(0,-70,14,-62);ctx.stroke();

class CanSmash extends Base{

    for(const c of this.cans)if(!c.aw&&!c.gone)c.x=this.cx+c.lx;
    for(const c of this.cans){if(c.aw||c.gone||c.row===0)continue;if(!this.cans.some(o=>!o.aw&&!o.gone&&o.row===c.row-1&&Math.abs(o.lx-c.lx)<54))this.wake(c,(Math.random()<.5?-1:1)*rand(150,260),-40);}
    for(const c of this.cans){if(!c.aw||c.gone)continue;const py=c.y;c.vy+=1500*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;
      if(c.x>240&&c.x<1040&&py+35<=522&&c.y+35>=520&&c.vy>0){c.y=485;c.vy=-c.vy*.3;if(Math.abs(c.vy)<90)c.vy=0;c.vx*=.9;if(Math.abs(c.vx)<140)c.vx=(c.vx<0?-1:1)*140;c.vr=c.vx/27;}

        if(o.heavy){c.vx=-c.vx*.35;c.x+=(Math.sign(c.x-o.x)||1)*8;sfx.clank();continue;}
        const dir=Math.sign(o.x-c.x)||Math.sign(c.vx)||1;this.wake(o,c.vx*.6+dir*80,Math.min(-120,c.vy*.4));c.vx*=.45;c.vy*=.6;}}
      if(c.y>H+100||c.x<-150||c.x>W+150)c.gone=true;}}

const HOLES=[[400,300,.72],[640,300,.72],[880,300,.72],[330,452,.86],[640,452,.86],[950,452,.86],[250,618,1],[640,618,1],[1030,618,1]];

    this.newBest=!save.best[B.key]||b.score>save.best[B.key];if(this.newBest&&b.score>0)save.best[B.key]=b.score;persist();this.shown=0;if(this.tix>0)confetti(640,200,50);},
  update(dt){this.t+=dt;const prev=Math.floor(this.shown);this.shown=Math.min(this.tix,this.shown+dt*Math.max(30,this.tix*1.5));if(Math.floor(this.shown)!==prev)sfx.tick();
    if(this.t>1&&inp.pressed){sfx.shot();if(G.np>1&&G.cur===0){G.cur=1;go(S.intro);}else if(G.np>1){go(S.final);}else goHub();}},
  draw(){const B=BOOTHS[G.booth];G.last.draw();ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1a0e26';rr(340,140,600,420,22);ctx.fill();bulbRect(340,140,600,420,30,this.t);
    txt(B.name.toUpperCase(),640,200,40,'#ffd54a','center','#000',6);ctx.fillStyle=PCOL[G.cur];rr(530,232,220,36,8);ctx.fill();txt(G.np>1?`PLAYER ${G.cur+1}`:'PLAYER 1',640,251,20,'#fff');
    txt(G.booth===0?`${this.score} TICKETS WON`:`SCORE  ${this.score}`,640,320,48,'#fff','center','#000',6);
    ctx.fillStyle='#ffd54a';rr(470,370,340,80,10);ctx.fill();ctx.fillStyle='#e0a800';for(let k=0;k<10;k++){circ(470,382+k*7.5,3);ctx.fill();circ(810,382+k*7.5,3);ctx.fill();}txt(`🎟 +${Math.floor(this.shown)}`,640,411,46,'#7a1020');
    if(this.newBest&&this.score>0)txt('★ NEW BOOTH RECORD ★',640,482,26,'#7dff7a','center','#000',5);
    if(this.t>1&&Math.floor(this.t*2)%2===0)txt(G.np>1&&G.cur===0?'PASS THE GUN TO PLAYER 2 — SHOOT TO CONTINUE':'SHOOT TO CONTINUE',640,530,22,'#fff');}};

S.final={enter(){const[a,b]=G.results;this.w=a.score===b.score?-1:a.score>b.score?0:1;sfx.fanfare();confetti(640,250,120);},
  update(dt){this.t+=dt;if(Math.random()<dt*1.5)firework(rand(150,1130),rand(80,260),pick(GCOL));if(this.t>1.2&&inp.pressed){sfx.shot();goHub();}},
  draw(){const t=this.t;nightSky(t);stringLights(t,10,30);const[a,b]=G.results;
    txt(BOOTHS[G.booth].name.toUpperCase(),640,120,44,'#ffd54a','center','#000',6);
    txt(this.w<0?"IT'S A TIE!":`PLAYER ${this.w+1} WINS!`,640,230,96,this.w<0?'#fff':PCOL[this.w],'center','#fff',4);
    for(let p=0;p<2;p++){const x=380+p*520,r=G.results[p];ctx.fillStyle='#1a0e26';rr(x-200,320,400,220,20);ctx.fill();ctx.strokeStyle=PCOL[p];ctx.lineWidth=6;rr(x-200,320,400,220,20);ctx.stroke();
      txt(`PLAYER ${p+1}`,x,365,32,PCOL[p]);txt(`${r.score}`,x,435,64,'#fff','center','#000',6);txt(`🎟 +${r.tix}`,x,500,30,'#ffd54a');if(this.w===p){ctx.fillStyle='#ffd60a';starPath(x+170,330,30,13);ctx.fill();}}
    if(this.t>1.2&&Math.floor(t*2)%2===0)txt('SHOOT TO RETURN TO THE MIDWAY',640,640,26,'#fff','center','#000',6);}};

S.prizes={boxes:PRIZES.map((p,i)=>({x:130+(i%3)*350,y:120+((i/3)|0)*240,w:320,h:210})),bBack:{x:30,y:640,w:200,h:64},bReset:{x:250,y:650,w:170,h:50},bP:[{x:880,y:640,w:180,h:64},{x:1080,y:640,w:180,h:64}],confirm:0,
  enter(){this.msg='';this.mt=0;this.confirm=0;},
  update(dt){this.t+=dt;this.mt-=dt;this.confirm=Math.max(0,this.confirm-dt);if(inp.pressed){sfx.shot();ring(inp.x,inp.y);}
    if(shotIn(this.bBack)){goHub();return;}
    if(G.np>1)for(let p=0;p<2;p++)if(shotIn(this.bP[p])){G.cur=p;sfx.ding();}
    if(shotIn(this.bReset)){if(this.confirm>0){save={tickets:[0,0],prizes:[[],[]],best:{}};persist();this.msg='All tickets, prizes and records cleared.';this.mt=2.5;this.confirm=0;}else{this.confirm=3;}}
    for(let i=0;i<6;i++)if(shotIn(this.boxes[i])){const c=PRIZES[i].c;if(save.tickets[G.cur]>=c){save.tickets[G.cur]-=c;save.prizes[G.cur].push(i);persist();sfx.fanfare();confetti(this.boxes[i].x+160,this.boxes[i].y+80,50);this.msg=`Player ${G.cur+1} won a ${PRIZES[i].n}!`;}else{sfx.bad();this.msg=`Need ${c-save.tickets[G.cur]} more tickets for the ${PRIZES[i].n}.`;}this.mt=2.5;}},
  draw(){const t=this.t;stripes(0,0,W,H,'#3a0a5a','#4a1270',20);awning(0,0,W,40,'#f72585','#fff3e0',20);
    ctx.fillStyle='#ffd60a';rr(440,50,400,56,12);ctx.fill();txt('PRIZE COUNTER',640,79,36,'#7a1020');
    for(let i=0;i<6;i++){const r=this.boxes[i],can=save.tickets[G.cur]>=PRIZES[i].c,hov=inRect(inp.x,inp.y,r.x,r.y,r.w,r.h);
      ctx.fillStyle=hov?'#3a2456':'#24142f';rr(r.x,r.y,r.w,r.h,14);ctx.fill();ctx.strokeStyle=can?'#7dff7a':'#555';ctx.lineWidth=3;rr(r.x,r.y,r.w,r.h,14);ctx.stroke();
      drawPrize(i,r.x+r.w/2,r.y+85,i===5?.75:1,t);txt(PRIZES[i].n,r.x+r.w/2,r.y+165,22,'#fff');
      ctx.fillStyle=can?'#ffd54a':'#777';rr(r.x+r.w/2-60,r.y+180,120,24,6);ctx.fill();txt(`🎟 ${PRIZES[i].c}`,r.x+r.w/2,r.y+193,17,'#3a0010');
      if(hov)bulbRect(r.x,r.y,r.w,r.h,26,t);}
    ctx.fillStyle='rgba(10,4,20,.9)';ctx.fillRect(0,624,W,96);
    btn(this.bBack,'◀ MIDWAY','#555',24);btn(this.bReset,this.confirm>0?'SHOOT AGAIN':'RESET ALL','#7a1020',18);
    txt(`SHOPPING: PLAYER ${G.cur+1}  ·  🎟 ${save.tickets[G.cur]}`,650,672,24,PCOL[G.cur],'center','#000',5);
    if(G.np>1)for(let p=0;p<2;p++){btn(this.bP[p],`P${p+1} 🎟${save.tickets[p]}`,p===G.cur?PCOL[p]:'#333',22);}
    if(this.mt>0)txt(this.msg,640,585,28,'#fff','center','#000',6);}};

/* ---------- crosshair & loop ---------- */
function drawCross(){const x=inp.x,y=inp.y,r=inp.down?12:16;ctx.strokeStyle='#000';ctx.lineWidth=5;circ(x,y,r);ctx.stroke();ctx.beginPath();ctx.moveTo(x-r-8,y);ctx.lineTo(x-r+6,y);ctx.moveTo(x+r-6,y);ctx.lineTo(x+r+8,y);ctx.moveTo(x,y-r-8);ctx.lineTo(x,y-r+6);ctx.moveTo(x,y+r-6);ctx.lineTo(x,y+r+8);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;circ(x,y,r);ctx.stroke();ctx.beginPath();ctx.moveTo(x-r-8,y);ctx.lineTo(x-r+6,y);ctx.moveTo(x+r-6,y);ctx.lineTo(x+r+8,y);ctx.moveTo(x,y-r-8);ctx.lineTo(x,y-r+6);ctx.moveTo(x,y+r-6);ctx.lineTo(x,y+r+8);ctx.stroke();ctx.fillStyle='#ff3b5c';circ(x,y,2.5);ctx.fill();}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{scene.update(dt);updateParts(dt);musicTick();
    ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
    let sx=0,sy=0;if(shake>0){shake=Math.max(0,shake-dt*30);sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;}
    ctx.setTransform(SC,0,0,SC,OX+sx*SC,OY+sy*SC);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
    scene.draw();drawParts();ctx.restore();if(showCross)drawCross();
  }catch(e){console.error(e);}
  inp.pressed=false;inp.rpressed=false;requestAnimationFrame(frame);}
go(S.title);requestAnimationFrame(frame);
</script>
