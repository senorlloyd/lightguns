'use strict';
// =====================================================================
//  POP SHOT — Pop-Up Showdown   (1–2 player light gun shooting gallery)
//  Built for OpenFIRE guns: mouse mode and/or gamepad (absolute stick) mode
// =====================================================================
const W = 1280, H = 720;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let RS = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  cv.style.left = ((innerWidth - W * s) / 2) + 'px';
  cv.style.top = ((innerHeight - H * s) / 2) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  const old = RS;
  RS = cv.width / W;
  if (old !== RS) { bakeGen++; if (currentTheme) buildBG(currentTheme); }
}

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rr(c, x, y, w, h, r) {

let bgCanvas = null, currentTheme = null;

  currentTheme = th;
  const s = Math.min(RS, 2);
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = Math.round(W * s); bgCanvas.height = Math.round(H * s);
  const c = bgCanvas.getContext('2d'); c.setTransform(s, 0, 0, s, 0, 0);
  th.drawBG(c);

}

let ambient = [];
function initAmbient(th) {
  ambient = [];
  const n = { dust: 30, fog: 8, petals: 40, gulls: 4, none: 0 }[th.ambient] || 0;
  for (let i = 0; i < n; i++) ambient.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(0.5, 1.5), p: rnd(0, 6), v: rnd(0.6, 1.4) });
}
function updAmbient(th, dt) {
  for (const a of ambient) {
    if (th.ambient === 'dust') { a.x += 30 * a.v * dt; a.y += Math.sin(a.p + a.x * 0.01) * 10 * dt; }
    else if (th.ambient === 'fog') { a.x += 18 * a.v * dt; a.y = 430 + (a.p * 40) % 280; }
    else if (th.ambient === 'petals') { a.x -= 40 * a.v * dt; a.y += 50 * a.v * dt; a.p += dt * 3; }
    else if (th.ambient === 'gulls') { a.x += 60 * a.v * dt; a.y = 60 + (a.p * 30) % 120 + Math.sin(a.x * 0.02) * 10; a.p += dt * 0.0; }

function updPlay(dt) {

let lastT = performance.now(), T = 0;
function update(dt) {
  stateT += dt;
  for (const p of P) p.recoil = Math.max(0, p.recoil - dt * 6);
  for (const cr of cracks) cr.t += dt; cracks = cracks.filter(cr => cr.t < 1.6);
  shake = Math.max(0, shake - dt * 40); redFlash = Math.max(0, redFlash - dt * 2); whiteFlash = Math.max(0, whiteFlash - dt * 3);
  switch (state) {
    case 'intro': updAmbient(game.theme, dt); updParticles(dt); if (stateT > 3.0) setState('play'); break;
    case 'play': if (!paused) updPlay(dt); break;
    case 'clear': updParticles(dt); if (stateT > 10) nextEntry(); break;
    case 'dying': updParticles(dt); for (const t of targets) { if (t.state === 'fire' || t.state === 'up') t.t += dt; } if (stateT > 1.8) setState('over'); break;
    case 'victory': case 'title': case 'select': case 'settings': updParticles(dt); break;
  }
}
function render() {
  buttons = [];
  const c = ctx;
  c.setTransform(RS, 0, 0, RS, 0, 0);
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  c.save();
  if (shake > 0) c.translate(rnd(-shake, shake), rnd(-shake, shake));
  switch (state) {
    case 'title': drawTitle2(c, T); drawParticles(c); break;
    case 'select': drawSelect(c, T); drawParticles(c); break;
    case 'settings': drawSettings(c, T); drawParticles(c); break;
    case 'intro': drawWorld(c, T); drawHUD(c, T); drawIntroBanner(c, T); break;
    case 'play': drawWorld(c, T); drawHUD(c, T); if (paused) drawPause(c); break;
    case 'clear': drawWorld(c, T); drawResults(c, T); drawParticles(c); break;
    case 'dying': drawWorld(c, T); drawHUD(c, T); c.fillStyle = `rgba(80,0,0,${clamp(stateT / 1.8, 0, 0.6)})`; c.fillRect(0, 0, W, H); break;
    case 'over': drawWorld(c, T); drawOver(c, T); drawParticles(c); break;
    case 'victory': drawVictory(c, T); break;
  }
  c.restore();
  if (redFlash > 0) { c.fillStyle = `rgba(255,0,0,${redFlash * 0.35})`; c.fillRect(0, 0, W, H); }
  if (whiteFlash > 0) { c.fillStyle = `rgba(255,255,255,${whiteFlash * 0.5})`; c.fillRect(0, 0, W, H); }
  const showCross = state !== 'play' && state !== 'intro' || settings.crosshair || paused;
  if (showCross) for (const p of P) if (crossVisible(p.i) && (p.i === 0 || state === 'settings' || ['title', 'select'].includes(state) || p.active)) drawCrosshair(c, p, T);
}
function frame(now) {

}

if (document.fonts && document.fonts.load) document.fonts.load('40px PopFont').then(() => { bakeGen++; thumbs = null; if (currentTheme) buildBG(currentTheme); }).catch(() => { });
requestAnimationFrame(frame);
