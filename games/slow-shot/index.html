<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slow Shot</title>
<style>
  html,body{margin:0;height:100%;background:#f2f2f0;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:none;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   SLOW SHOT — light gun prototype
   Time barely moves until you act: moving your aim nudges time forward,
   every shot pushes it to full speed for a moment. Shatter the red crystal
   enemies, shoot their bullets out of the air, clear the room.
   Input: P1 mouse / light gun (click shoot)  ·  P2 keyboard (arrows + Space)
          ?helper for two guns via the local helper
   Keys:  F fullscreen · D debug · Esc title
   ===================================================================== */
const CFG = {
  baseTime: 0.06,           // time speed when you're doing nothing and something is threatening you
  calmTime: 0.85,           // time speed when nothing is threatening you (enemies still walking in)
  moveTime: 0.35,           // max extra time speed from moving your aim
  burstDecay: 5,            // how fast a shot's time burst fades (per second)
  cracks: 3,                // hits you can take per room
  levels: 8,
  colors: ['#111111', '#1f6fff'], names: ['P1', 'P2'],
  wsUrl: 'ws://localhost:8787',
};

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, U = 1;
let HOR = 0, F = 0;                 // horizon y and focal length (px)
const CAMH = 1.6, ZBACK = 26, XWALL = 9, CEIL = 3.4;
const roomCanvas = document.createElement('canvas');

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const FONT = '"Arial Black", "Helvetica Neue", system-ui, sans-serif';

/* ---------------- projection ---------------- */
const sx = (x, z) => W / 2 + x * F / z;
const sy = (y, z) => HOR + (CAMH - y) * F / z;
const sc = z => F / z;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; U = Math.min(W, H) / 100;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HOR = H * 0.36; F = H * 0.8;
  buildRoom();
}

/* ---------------- static room (pre-rendered) ---------------- */
function quad(g, pts, fill) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = fill; g.fill(); }
function buildRoom() {
  roomCanvas.width = cv.width; roomCanvas.height = cv.height;
  const g = roomCanvas.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const zn = 0.5, P = (x, y, z) => [sx(x, z), sy(y, z)];
  g.fillStyle = '#f4f4f2'; g.fillRect(0, 0, W, H);
  // ceiling, walls, floor, back wall
  quad(g, [P(-XWALL, CEIL, zn), P(XWALL, CEIL, zn), P(XWALL, CEIL, ZBACK), P(-XWALL, CEIL, ZBACK)], '#ebebe9');
  quad(g, [P(-XWALL, 0, zn), P(-XWALL, CEIL, zn), P(-XWALL, CEIL, ZBACK), P(-XWALL, 0, ZBACK)], '#e3e3e1');
  quad(g, [P(XWALL, 0, zn), P(XWALL, CEIL, zn), P(XWALL, CEIL, ZBACK), P(XWALL, 0, ZBACK)], '#dededc');
  const fg = g.createLinearGradient(0, sy(0, ZBACK), 0, H);
  fg.addColorStop(0, '#ececea'); fg.addColorStop(1, '#fbfbfa');
  quad(g, [P(-XWALL, 0, zn), P(XWALL, 0, zn), P(XWALL, 0, ZBACK), P(-XWALL, 0, ZBACK)], fg);
  quad(g, [P(-XWALL, 0, ZBACK), P(XWALL, 0, ZBACK), P(XWALL, CEIL, ZBACK), P(-XWALL, CEIL, ZBACK)], '#e6e6e4');
  // floor tile grid
  g.strokeStyle = 'rgba(0,0,0,0.05)'; g.lineWidth = 1;
  for (let x = -XWALL; x <= XWALL; x += 1.5) { g.beginPath(); g.moveTo(...P(x, 0, zn)); g.lineTo(...P(x, 0, ZBACK)); g.stroke(); }
  for (let z = 1; z <= ZBACK; z *= 1.18) { g.beginPath(); g.moveTo(...P(-XWALL, 0, z)); g.lineTo(...P(XWALL, 0, z)); g.stroke(); }
  // ceiling light panels
  for (let z = 3; z < ZBACK; z += 4) for (const x of [-4, 0, 4]) quad(g, [P(x - 0.9, CEIL, z), P(x + 0.9, CEIL, z), P(x + 0.9, CEIL, z + 1.4), P(x - 0.9, CEIL, z + 1.4)], '#fbfbfa');
  // doorways in the back wall (enemy entrances)
  for (const dx of DOORS) {
    quad(g, [P(dx - 0.9, 0, ZBACK), P(dx + 0.9, 0, ZBACK), P(dx + 0.9, 2.4, ZBACK), P(dx - 0.9, 2.4, ZBACK)], '#c9c9c6');
    quad(g, [P(dx - 0.75, 0, ZBACK), P(dx + 0.75, 0, ZBACK), P(dx + 0.75, 2.25, ZBACK), P(dx - 0.75, 2.25, ZBACK)], '#b4b4b0');
  }
  // soft wall/floor seams
  g.strokeStyle = 'rgba(0,0,0,0.08)'; g.lineWidth = 1.5;
  for (const x of [-XWALL, XWALL]) { g.beginPath(); g.moveTo(...P(x, 0, zn)); g.lineTo(...P(x, 0, ZBACK)); g.lineTo(...P(x, CEIL, ZBACK)); g.stroke(); }
}

/* ---------------- level geometry ---------------- */
const DOORS = [-5.5, 0, 5.5];
const PILLARS = [
  { x: -4.6, z: 12, w: 1.3, d: 1.3, h: CEIL }, { x: 4.2, z: 15, w: 1.3, d: 1.3, h: CEIL },
  { x: -1.2, z: 19.5, w: 1.3, d: 1.3, h: CEIL }, { x: 6.6, z: 9, w: 1.2, d: 1.2, h: CEIL },
  { x: -7, z: 7.5, w: 1.2, d: 1.2, h: CEIL },
  { x: 1.6, z: 10.5, w: 2.4, d: 0.9, h: 1.05 }, { x: -3.2, z: 17, w: 2.2, d: 0.9, h: 1.05 },
];
function boxFaces(b) {   // visible faces of a box, projected, with shades
  const x0 = b.x - b.w / 2, x1 = b.x + b.w / 2, z0 = b.z - b.d / 2, z1 = b.z + b.d / 2, y1 = b.h;
  const P = (x, y, z) => [sx(x, z), sy(y, z)];
  const faces = [];
  if (b.x > 0) faces.push({ pts: [P(x0, 0, z0), P(x0, 0, z1), P(x0, y1, z1), P(x0, y1, z0)], c: '#d4d4d1' });
  else faces.push({ pts: [P(x1, 0, z0), P(x1, 0, z1), P(x1, y1, z1), P(x1, y1, z0)], c: '#d9d9d6' });
  if (y1 < CAMH) faces.push({ pts: [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], c: '#fafaf8' });
  faces.push({ pts: [P(x0, 0, z0), P(x1, 0, z0), P(x1, y1, z0), P(x0, y1, z0)], c: '#efefed' });
  return faces;
}
function pointInPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
const inPillarXZ = (x, z, pad = 0.6) => PILLARS.some(b => Math.abs(x - b.x) < b.w / 2 + pad && Math.abs(z - b.z) < b.d / 2 + pad);

/* ---------------- players + input ---------------- */
function mkPlayer(i) { return { i, color: CFG.colors[i], x: 0, y: 0, px: 0, py: 0, seen: false, joined: false, flash: 0, kick: 0, score: 0, kills: 0, shots: 0, hits: 0 }; }
const players = [mkPlayer(0), mkPlayer(1)];
const keys = {}; let debug = false;
cv.addEventListener('mousemove', e => { const p = players[0]; p.x = e.clientX; p.y = e.clientY; p.seen = true; });
cv.addEventListener('mousedown', e => { audioInit(); const p = players[0]; p.x = e.clientX; p.y = e.clientY; p.seen = true; if (e.button === 0) trigger(0); e.preventDefault(); });
cv.addEventListener('contextmenu', e => e.preventDefault());
function wakeP2() { const p = players[1]; if (!p.seen) { p.seen = true; p.x = W * 0.6; p.y = H * 0.55; } }
addEventListener('keydown', e => {
  audioInit(); keys[e.code] = true;
  if (e.code.startsWith('Arrow')) { wakeP2(); e.preventDefault(); }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) { wakeP2(); trigger(1); } }
  if (e.code === 'KeyF') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (err) {} }
  if (e.code === 'KeyD') debug = !debug;
  if (e.code === 'Escape') toTitle();
});
addEventListener('keyup', e => { keys[e.code] = false; });
let helper = null;
function connectHelper() {
  let ws; try { ws = new WebSocket(CFG.wsUrl); } catch (e) { setTimeout(connectHelper, 5000); return; }
  ws.onopen = () => { helper = ws; }; ws.onclose = () => { helper = null; setTimeout(connectHelper, 5000); }; ws.onerror = () => {};
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } const p = players[m.p]; if (!p) return;
    if (typeof m.x === 'number') { p.x = m.x * W; p.y = m.y * H; p.seen = true; } if (m.ev === 'trigger') trigger(m.p); };
}
const feedback = (i, kind) => { if (helper && helper.readyState === 1) helper.send(JSON.stringify({ p: i, ev: kind })); };
if (new URLSearchParams(location.search).has('helper')) connectHelper();

/* ---------------- audio (synth, low-passed by time speed) ---------------- */
let AC = null, master = null, lp = null, noiseBuf = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
    master = AC.createGain(); master.gain.value = 0.55; master.connect(lp); lp.connect(AC.destination);
    const len = AC.sampleRate; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, type, freq, gain, delay = 0) {
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
function tone(freq, dur, type, gain, slideTo, delay = 0) {
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = fn => { if (!AC) return; try { fn(); } catch (e) {} };
const SFX = {
  shot:    () => sfx(() => { noise(0.2, 'lowpass', 3000, 1); tone(140, 0.15, 'sine', 0.8, 40); }),
  glass:   () => sfx(() => { noise(0.5, 'highpass', 3500, 0.55); for (let i = 0; i < 7; i++) tone(2400 + Math.random() * 3500, 0.25 + Math.random() * 0.35, 'triangle', 0.08, null, i * 0.03); }),
  ping:    () => sfx(() => { tone(3200, 0.12, 'triangle', 0.15, 1800); noise(0.1, 'highpass', 5000, 0.3); }),
  enemyShot: () => sfx(() => { noise(0.25, 'lowpass', 1200, 0.5); tone(90, 0.2, 'sine', 0.5, 45); }),
  hurt:    () => sfx(() => { noise(0.4, 'highpass', 2500, 0.6); tone(120, 0.4, 'square', 0.25, 60); }),
  block:   () => sfx(() => { noise(0.12, 'bandpass', 1500, 0.5); }),
  slam:    (hi) => sfx(() => { tone(hi ? 110 : 82, 0.38, 'sawtooth', 0.32, hi ? 90 : 60); noise(0.2, 'lowpass', 600, 0.5); }),
  fail:    () => sfx(() => { noise(1.2, 'highpass', 2000, 0.6); for (let i = 0; i < 12; i++) tone(1500 + Math.random() * 4000, 0.4, 'triangle', 0.06, null, i * 0.05); tone(200, 1, 'sawtooth', 0.2, 50); }),
  tick:    () => sfx(() => tone(1000, 0.05, 'sine', 0.15)),
};

/* ---------------- crystal figures ---------------- */
// enemy types: gunner (shoots), runner (charges you), heavy (2 hits), sniper (far, fast shots)
const TYPES = {
  gunner: { h: 1.8, speed: 2.4, aim: 1.3, cool: [1.6, 2.6], bullet: 9, hp: 1, hue: 2 },
  runner: { h: 1.7, speed: 4.2, hp: 1, hue: 8 },
  heavy:  { h: 2.15, speed: 1.6, aim: 1.6, cool: [1.4, 2.2], bullet: 8, hp: 2, hue: 352, wide: 1.25 },
  sniper: { h: 1.8, speed: 2, aim: 2.4, cool: [2.5, 3.5], bullet: 16, hp: 1, hue: 12 },
};
// returns the figure as triangles in local metres (x right, y up, feet at 0,0)
function figureTris(e) {
  const T = [], h = e.t.h / 1.8, wd = (e.t.wide || 1);
  const sw = e.state === 'aim' || e.state === 'cool' ? 0 : Math.sin(e.ph) * 0.16;
  const add = (a, b, c, k) => T.push({ p: [a, b, c], k });
  const quadT = (a, b, c, d, k1, k2) => { add(a, b, c, k1); add(a, c, d, k2); };
  const X = v => v * wd, Y = v => v * h;
  // legs
  for (const s of [-1, 1]) {
    const o = sw * s, hx = X(0.13 * s);
    quadT([hx - X(0.1), Y(0.95)], [hx + X(0.1), Y(0.95)], [hx + X(0.09) + o, Y(0.5)], [hx - X(0.09) + o, Y(0.5)], 0.75 + s * 0.08, 0.6);
    quadT([hx - X(0.09) + o, Y(0.5)], [hx + X(0.09) + o, Y(0.5)], [hx + X(0.08) + o * 1.5, 0], [hx - X(0.1) + o * 1.5, 0], 0.68, 0.52 + s * 0.06);
  }
  // torso: 4 facets around a centre point
  const c = [0, Y(1.22)], hl = [X(-0.24), Y(0.95)], hr = [X(0.24), Y(0.95)], sr = [X(0.31), Y(1.5)], sl = [X(-0.31), Y(1.5)];
  add(hl, hr, c, 0.62); add(hr, sr, c, 0.78); add(sr, sl, c, 1); add(sl, hl, c, 0.86);
  add([X(-0.07), Y(1.5)], [X(0.07), Y(1.5)], [0, Y(1.57)], 0.7);
  // head: faceted hexagon
  const hc = [0, Y(1.69)], hr2 = 0.135 * h;
  for (let k = 0; k < 6; k++) { const a1 = -Math.PI / 2 + k * Math.PI / 3, a2 = a1 + Math.PI / 3; add(hc, [hc[0] + Math.cos(a1) * hr2, hc[1] + Math.sin(a1) * hr2 * 1.15], [hc[0] + Math.cos(a2) * hr2, hc[1] + Math.sin(a2) * hr2 * 1.15], [1, 0.85, 0.7, 0.62, 0.74, 0.92][k]); }
  // arms
  if (e.state === 'aim' || e.state === 'cool' || e.t === TYPES.sniper) {
    for (const s of [-1, 1]) quadT([X(0.3 * s), Y(1.48)], [X(0.2 * s), Y(1.42)], [X(0.04 * s), Y(1.3)], [X(0.1 * s), Y(1.36)], 0.9, 0.72);
  } else {
    for (const s of [-1, 1]) { const o = -sw * s * 0.8; quadT([X(0.3 * s), Y(1.5)], [X(0.38 * s), Y(1.45)], [X(0.35 * s) + o, Y(0.95)], [X(0.27 * s) + o, Y(0.98)], 0.8, 0.64); }
  }
  return T;
}
function triColor(hue, k, a = 1) { return `hsla(${hue},${(78 + k * 12).toFixed(0)}%,${(18 + k * 40).toFixed(0)}%,${a})`; }

/* ---------------- world state ---------------- */
let state = 'title';     // title | intro | play | clear | fail | win
let calm = 1, level = 1, cracks = 0, timeScale = CFG.baseTime, burst = 0, worldT = 0, stateT = 0, levelT = 0;
let enemies = [], bullets = [], shards = [], dusts = [], crackLines = [], tracers = [], screenShards = null, spawnQ = [], spawnT = 0;
let titleFigs = [], shake = 0, flashA = 0, flashCol = '#ff2020', announce = null, clock = 0, lobbyT = 0;

function makeEnemy(type, opts = {}) {
  const t = TYPES[type];
  const door = DOORS[(Math.random() * DOORS.length) | 0];
  let tx = 0, tz = 0;
  for (let k = 0; k < 20; k++) {
    tx = rand(-7, 7); tz = type === 'sniper' ? rand(15, 21) : rand(5.5, 12);
    if (!inPillarXZ(tx, tz) && !enemies.some(o => Math.hypot(o.tx - tx, o.tz - tz) < 1.6)) break;
  }
  const side = Math.random() < 0.45 && type !== 'sniper';   // some step in from the side edges, closer to you
  const e = { type, t, x: side ? (Math.random() < 0.5 ? -1 : 1) * (XWALL - 0.4) : door + rand(-0.4, 0.4), z: side ? rand(10, 16) : ZBACK - 0.3, tx, tz, state: 'walk', st: 0, ph: rand(0, 6), hp: t.hp, cool: rand(...(t.cool || [1, 1])), dead: false, hitT: 0, spawnA: 0, id: Math.random() };
  if (type === 'runner') { e.tx = rand(-1.5, 1.5); e.tz = 1.6; }
  return Object.assign(e, opts);
}
function levelPlan(n) {
  const L = [];
  const add = (type, count, gap) => { for (let i = 0; i < count; i++) L.push({ type, gap }); };
  if (n === 1) add('gunner', 3, 2.5);
  else if (n === 2) add('gunner', 5, 1.8);
  else if (n === 3) { add('gunner', 3, 1.6); add('runner', 3, 1.4); }
  else if (n === 4) { add('heavy', 1, 1); add('gunner', 4, 1.5); add('runner', 2, 1.2); }
  else if (n === 5) { add('sniper', 2, 1.5); add('gunner', 4, 1.4); add('runner', 2, 1); }
  else if (n === 6) { add('gunner', 3, 1.2); add('heavy', 2, 1.6); add('runner', 4, 0.9); add('sniper', 1, 1); }
  else if (n === 7) { add('runner', 6, 0.7); add('gunner', 4, 1.1); add('sniper', 2, 1.2); }
  else { add('heavy', 3, 1.4); add('gunner', 5, 1); add('runner', 5, 0.8); add('sniper', 2, 1); }
  for (let i = L.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [L[i], L[j]] = [L[j], L[i]]; }
  if (twoP()) L.push(...L.filter((_, i) => i % 3 === 0).map(o => ({ ...o })));
  return L;
}
const twoP = () => players[0].joined && players[1].joined;
const maxAlive = () => Math.min(2 + level, 7) + (twoP() ? 2 : 0);

/* ---------------- flow ---------------- */
function toTitle() {
  state = 'title'; enemies = []; bullets = []; shards = []; crackLines = []; screenShards = null; announce = null;
  for (const p of players) { p.joined = false; }
  titleFigs = [0, 1].map(i => ({ ...makeEnemy('gunner'), x: i ? 2.2 : -2.2, z: 7, state: 'cool', player: i, spawnA: 1 }));
  lobbyT = 0;
}
function startGame() {
  level = 1; for (const p of players) Object.assign(p, { score: 0, kills: 0, shots: 0, hits: 0 });
  startLevel();
}
function startLevel() {
  state = 'intro'; stateT = 0; cracks = 0; enemies = []; bullets = []; crackLines = []; screenShards = null;
  spawnQ = levelPlan(level); spawnT = 0.6; levelT = 0;
  announce = { text: `ROOM ${level}`, sub: level === 1 ? 'TIME MOVES WHEN YOU MOVE' : '', t: 0, dur: 1.4 };
}
function levelClear() {
  state = 'clear'; stateT = 0; announce = null;
  for (const p of players) if (p.joined) p.score += Math.max(0, 500 - Math.floor(levelT) * 10);
}
function levelFail() {
  state = 'fail'; stateT = 0; SFX.fail(); feedback(0, 'rumble');
  // snapshot the screen and break it into falling shards
  render(true);
  const snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height; snap.getContext('2d').drawImage(cv, 0, 0);
  const cols = 9, rows = 6, pts = [];
  for (let r = 0; r <= rows; r++) { pts.push([]); for (let c = 0; c <= cols; c++) { const edge = r === 0 || c === 0 || r === rows || c === cols; pts[r].push([c / cols * W + (edge ? 0 : rand(-0.4, 0.4) * W / cols), r / rows * H + (edge ? 0 : rand(-0.4, 0.4) * H / rows)]); } }
  const list = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = pts[r][c], b = pts[r][c + 1], d = pts[r + 1][c], e2 = pts[r + 1][c + 1];
    for (const tri of [[a, b, e2], [a, e2, d]]) {
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
      const dx = cx - W / 2, dy = cy - H / 2, dl = Math.hypot(dx, dy) || 1;
      list.push({ tri: tri.map(([x, y]) => [x - cx, y - cy]), cx, cy, x: cx, y: cy, vx: dx / dl * rand(60, 260), vy: dy / dl * rand(60, 200) - rand(0, 150), rot: 0, vr: rand(-2, 2) });
    }
  }
  screenShards = { snap, list };
}
function win() { state = 'win'; stateT = 0; announce = null; }

/* ---------------- shooting ---------------- */
function trigger(i) {
  const p = players[i];
  SFX.shot(); p.flash = 0.1; p.kick = 1; feedback(i, 'recoil');
  burst = 1;                                   // every shot pushes time forward
  tracers.push({ x0: i ? W * 0.85 : W * 0.15, y0: H, x1: p.x, y1: p.y, a: 1 });
  if (state === 'title') {
    for (const f of titleFigs) {

/* ---------------- effects ---------------- */

/* ---------------- update ---------------- */
function update(dt) {

  // --- time: base crawl + aim movement + shot bursts ---

  for (const p of players) {
    if (!p.seen) { p.px = p.x; p.py = p.y; continue; }
    const v = Math.hypot(p.x - p.px, p.y - p.py) / Math.max(dt, 1e-3);
    move = Math.max(move, clamp((v - 0.04 * W) / (1.6 * W), 0, 1));   // small dead-zone for gun jitter

  }
  burst *= Math.exp(-dt * CFG.burstDecay);
  const active = state === 'play' || state === 'intro';
  const threat = bullets.length > 0 || enemies.some(e => e.state === 'aim' || (e.type === 'runner' && e.z < 14));
  calm += ((threat ? 0 : 1) - calm) * Math.min(1, dt * (threat ? 10 : 1.5));
  const base = lerp(CFG.baseTime, CFG.calmTime, calm);
  const target = active ? Math.max(base + move * CFG.moveTime, burst) : 1;
  timeScale += (target - timeScale) * Math.min(1, dt * 18);
  if (lp && AC) lp.frequency.setTargetAtTime(300 + 12000 * Math.pow(timeScale, 1.4), AC.currentTime, 0.03);
  const wdt = dt * (state === 'fail' ? 0.3 : timeScale);

  if (state === 'title') {

  } else if (state === 'intro') {

  }

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    e.spawnA = Math.min(1, e.spawnA + wdt * 2.5);

    // time meter
    const bw = 22 * U, bx = W / 2 - bw / 2, by = H - 4 * U;
    ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(bx, by, bw, 0.7 * U);
    ctx.fillStyle = timeScale > 0.6 ? '#ff2a24' : '#1a1a1a'; ctx.fillRect(bx, by, bw * clamp(timeScale, 0, 1), 0.7 * U);
    bigText('TIME', W / 2, by - 1.6 * U, 1.5 * U, 'rgba(0,0,0,0.45)');
  }
  if (state === 'title') {
    bigText('SLOW SHOT', W / 2, H * 0.16, 11 * U, '#141414');
    bigText('TIME MOVES WHEN YOU MOVE', W / 2, H * 0.26, 2.6 * U, '#ff2a24');
    for (const f of titleFigs) {
      const x = sx(f.x, f.z), y = sy(0, f.z) + 3 * U;
      if (f.dead) bigText(CFG.names[f.player] + ' READY', x, sy(1, f.z), 3.4 * U, CFG.colors[f.player]);
      else bigText((f.player ? 'P2' : 'P1') + ' — SHOOT TO ' + (f.player ? 'JOIN' : 'START'), x, y, 2 * U, CFG.colors[f.player]);
    }
    if (lobbyT > 0) bigText(String(Math.ceil(lobbyT)), W / 2, H * 0.42, 10 * U, '#ff2a24');
    bigText('P1: mouse / gun   ·   P2: arrows + Space   ·   F fullscreen', W / 2, H - 3 * U, 1.8 * U, 'rgba(0,0,0,0.5)');
  }
  if (announce) {
    const a = announce, al = clamp(Math.min(a.t / 0.15, (a.dur - a.t) / 0.3), 0, 1);
    ctx.globalAlpha = al; bigText(a.text, W / 2, H * 0.3, 8 * U, '#141414');
    if (a.sub) bigText(a.sub, W / 2, H * 0.38, 2.4 * U, '#ff2a24');
    ctx.globalAlpha = 1;
  }
  if (state === 'clear') {
    const beat = Math.floor(stateT / 0.42);
    if (beat < 6) {
      const red = beat % 2 === 1;
      ctx.fillStyle = red ? '#ff2a24' : '#f4f4f2'; ctx.fillRect(0, 0, W, H);
      const t = (stateT % 0.42) / 0.42, s = 1 + (1 - t) * 0.25;
      bigText(red ? 'SHOT' : 'SLOW', W / 2, H / 2, 22 * U * s, red ? '#ffffff' : '#141414');
    } else {
      bigText('ROOM CLEAR', W / 2, H * 0.4, 7 * U, '#141414');
      const acc = players.filter(p => p.joined).map(p => `${CFG.names[p.i]} ${p.shots ? Math.round(p.hits / p.shots * 100) : 0}%`).join('   ');
      bigText(`TIME ${levelT.toFixed(1)}s   ·   ACCURACY ${acc}`, W / 2, H * 0.5, 2.4 * U, '#ff2a24');
    }
  }
  if (state === 'win') {
    ctx.fillStyle = '#ff2a24'; ctx.fillRect(0, 0, W, H);
    bigText('ALL ROOMS CLEAR', W / 2, H * 0.3, 8 * U, '#ffffff');
    let y = H * 0.45;
    for (const p of players) if (p.joined) { bigText(`${CFG.names[p.i]}   ${p.score} pts   ${p.kills} kills   ${p.shots ? Math.round(p.hits / p.shots * 100) : 0}% accuracy`, W / 2, y, 2.8 * U, '#ffffff'); y += 5 * U; }
    if (stateT > 2 && Math.floor(stateT * 2) % 2 === 0) bigText('SHOOT TO CONTINUE', W / 2, H * 0.8, 3 * U, '#ffffff');
  }
  if (!noCross) for (const p of players) if (p.seen) drawCrosshair(p);
  if (debug) { ctx.font = `600 ${1.6 * U}px monospace`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#080'; ctx.fillText(`${fps.toFixed(0)} fps  time ${timeScale.toFixed(2)}  enemies ${enemies.length}  bullets ${bullets.length}  shards ${shards.length}`, U, H - U); }
}

/* ---------------- loop ---------------- */
let last = performance.now(), fps = 60;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fps = fps * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
  update(dt); render();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); toTitle(); requestAnimationFrame(frame);
window.__ss = { players, get state() { return state; }, get enemies() { return enemies; }, get bullets() { return bullets; }, get titleFigs() { return titleFigs; },
  trigger, sx, sy, sc, startGame, setLevel(n) { level = n; startLevel(); }, get timeScale() { return timeScale; }, hurt: hurtPlayer, figScreen };
</script>
