  }
}

const K = '#000000', WH = '#fcfcfc';

function buildGoose(T, frame) {
  const p = new Pix(36, 28);
  if (frame === 'up') p.poly([[14, 13], [20, 13], [21, 4], [17, 4]], T.wing);
  if (frame === 'hit') { p.poly([[17, 13], [23, 13], [28, 2], [22, 1]], T.wing); if (T.tips) p.ell(26, 2, 1.6, 1.2, T.tips); }
  // tail
  p.poly([[2, 13], [8, 12], [8, 19], [3, 17]], T.body); p.rect(4, 17, 3, 1, WH);
  // body
  p.ell(15, 16, 10, 5.5, T.body);
  p.ell(16, 19, 8, 2.2, T.belly);
  // neck + head
  p.line(23, 14, 27, 7, T.neck, 2);
  p.ell(28.5, 5, 3.6, 2.6, T.head);
  p.rect(31, 4, 3, 2, T.beak); p.set(34, 5, T.beak);
  if (T.strap) { p.set(27, 7, WH); p.set(28, 7, WH); p.set(27, 6, WH); }
  // near wing
  const tip = (x, y) => { if (T.tips) p.ell(x, y, 2, 1.5, T.tips); };
  if (frame === 'up') { p.poly([[9, 14], [19, 14], [15, 1], [6, 3]], T.wing); p.line(18, 13, 14, 2, T.wingL); tip(8, 3); }
  if (frame === 'mid') { p.poly([[8, 13], [20, 13], [13, 9], [1, 10]], T.wing); p.line(19, 12, 3, 10, T.wingL); tip(3, 11); }
  if (frame === 'down') { p.poly([[10, 15], [19, 15], [15, 26], [8, 25]], T.wing); p.line(18, 16, 15, 24, T.wingL); tip(11, 24); }
  if (frame === 'hit') { p.poly([[8, 14], [16, 14], [10, 1], [4, 3]], T.wing); p.line(15, 13, 10, 2, T.wingL); tip(6, 3); }
  if (frame === 'fold') { p.ell(13, 15, 7, 3, T.wing); p.line(7, 13, 19, 13, T.wingL); }
  // eye
  if (frame === 'hit' || frame === 'fold') { const e = T.eye; p.set(28, 3, e); p.set(30, 3, e); p.set(29, 4, e); p.set(28, 5, e); p.set(30, 5, e); }
  else { p.set(29, 4, T.eye); }

}

const DOGC = { fur: '#e47c1c', dark: '#a84808', cream: '#fcecd0', pink: '#fca0a0', tongue: '#e83c50', mouth: '#801818' };

function buildDogSide(pose, f) {
  const p = new Pix(56, 42); p.oy = 1;
  const O = DOGC.fur, R = DOGC.dark, Cr = DOGC.cream, P = DOGC.pink;
  if (pose === 'jump') {
    p.line(10, 30, 4, 36, O, 3); p.line(14, 30, 9, 37, O, 3);
    p.line(31, 30, 38, 36, O, 3); p.line(35, 30, 42, 35, O, 3);
  } else {
    [9, 14, 30, 35].forEach((x, i) => {
      const lift = pose === 'walk' && ((i % 2 === 0) === (f === 0)) ? 2 : 0;
      p.rect(x, 30, 3, 10 - lift, O); p.rect(x, 38 - lift, 3, 2, Cr);
    });
  }
  p.ell(5, 21, 2.6, 2.6, O); p.set(4, 20, Cr);
  p.ell(21, 26, 15, 6.5, O);
  p.ell(18, 21.5, 9, 2, R);
  p.ell(23, 30, 11, 2, Cr);
  p.ell(33, 27, 4.5, 5.5, Cr);
  let hx = 39, hy = 18, ear = 0;
  if (pose === 'sniff') { hx = 43; hy = 28 + (f ? 1 : 0); }
  if (pose === 'alert') { hy = 15; ear = 2; }
  if (pose === 'jump') hy = 16;
  p.poly([[hx - 6, hy - 3], [hx - 5, hy - 12 - ear], [hx - 1, hy - 4]], R);
  p.poly([[hx - 2, hy - 4], [hx + 1, hy - 13 - ear], [hx + 4, hy - 4]], O);
  p.poly([[hx - 0.5, hy - 5], [hx + 1, hy - 10 - ear], [hx + 2.5, hy - 5]], P);
  p.ell(hx, hy, 6.5, 5.5, O);
  p.rect(hx + 1, hy - 5, 1, 3, Cr);
  p.ell(hx + 5, hy + 2, 4.5, 2.6, Cr);
  p.rect(hx + 9, hy, 2, 2, K);
  p.rect(hx + 1, hy - 2, 2, 2, K);
  if (pose === 'walk' || pose === 'jump' || pose === 'alert') p.rect(hx + 5, hy + 4, 2, 2, DOGC.tongue);
  return p.outline(K);
}

function buildDogFront(pose, f) {
  const p = new Pix(50, 62); p.oy = 1; const cx = 25;
  const O = DOGC.fur, R = DOGC.dark, Cr = DOGC.cream, P = DOGC.pink;
  p.ell(cx, 50, 12, 12, O); p.ell(cx, 52, 7, 9, Cr);
  if (pose === 'show') {
    p.line(cx - 10, 46, cx - 15, 31, O, 3); p.line(cx + 10, 46, cx + 15, 31, O, 3);
    p.ell(cx - 15, 30, 2.6, 2.6, Cr); p.ell(cx + 15, 30, 2.6, 2.6, Cr);
  }
  const eu = pose === 'yelp' ? -3 : 0;
  for (const s of [-1, 1]) {
    p.poly([[cx + s * 11, 24], [cx + s * 15, 4 + eu], [cx + s * 4, 17]], O);
    p.poly([[cx + s * 10, 21], [cx + s * 13, 8 + eu], [cx + s * 6, 17]], P);
  }
  p.ell(cx, 27, 12, 10, O);
  p.rect(cx - 1, 17, 2, 9, Cr);
  p.ell(cx, 33, 6.5, 4.5, Cr);
  p.ell(cx, 30, 2.2, 1.4, K);
  if (pose === 'laugh') {
    for (const s of [-1, 1]) { p.set(cx + s * 8, 26, K); p.set(cx + s * 7, 25, K); p.set(cx + s * 6, 25, K); p.set(cx + s * 5, 26, K); }
    p.ell(cx, 36.5, 3.6, f ? 3 : 2.2, DOGC.mouth); p.rect(cx - 1, 38, 3, f ? 2 : 1, DOGC.tongue);
    p.line(cx - 11, 48, cx - 9, 40, O, 3); p.ell(cx - 9, 39, 2.6, 2.6, Cr);
  } else if (pose === 'yelp') {
    for (const s of [-1, 1]) { p.rect(cx + s * 7 - 2, 23, 4, 4, WH); p.rect(cx + s * 7 - 1, 24, 2, 2, K); }
    p.ell(cx, 37, 1.6, 2.2, DOGC.mouth);
    p.rect(cx + 13, 14, 1, 3, '#9ce8fc'); p.rect(cx + 14, 16, 1, 1, '#9ce8fc');
  } else {
    p.rect(cx - 7, 24, 2, 3, K); p.rect(cx + 5, 24, 2, 3, K);
    for (const [x, y] of [[-3, 36], [-2, 37], [-1, 37], [0, 37], [1, 37], [2, 36]]) p.set(cx + x, y, K);
    p.rect(cx - 1, 38, 2, 2, DOGC.tongue);
  }
  p.rect(cx - 10, 31, 2, 1, P); p.rect(cx + 8, 31, 2, 1, P);
  return p.outline(K);
}

function buildCloud(s) {
  const p = new Pix(Math.ceil(44 * s), Math.ceil(18 * s));
  p.ell(11 * s, 11 * s, 8 * s, 5 * s, WH); p.ell(22 * s, 8 * s, 10 * s, 7 * s, WH); p.ell(33 * s, 11 * s, 8 * s, 5 * s, WH); p.ell(22 * s, 13 * s, 18 * s, 3.5 * s, WH);
  for (let y = Math.floor(14 * s); y < p.h; y++) for (let x = 0; x < p.w; x++) if (p.get(x, y)) p.d[y * p.w + x] = '#bcecfc';
  return p;
}

function buildCrosshair() {
  const p = new Pix(19, 19), R = '#f83800';
  for (let y = 0; y < 19; y++) for (let x = 0; x < 19; x++) { const d = Math.hypot(x - 9, y - 9); if (d >= 5.4 && d <= 6.5) p.set(x, y, R); }
  p.rect(9, 1, 1, 4, R); p.rect(9, 14, 1, 4, R); p.rect(1, 9, 4, 1, R); p.rect(14, 9, 4, 1, R); p.set(9, 9, R);

}

function buildHudGoose(col) {
  const p = new Pix(11, 7);

/* =====================================================================
   HONK HUNT (8-bit edition) — light gun goose shooter
   Native 320x180, scaled with crisp pixels (exactly 6x on a 1080p TV).
   Gun = mouse; trigger = left click.
   Keys: F fullscreen · M mute · P pause · C crosshair · B Sinden border
   ===================================================================== */
const W = 320, H = 180;
const GRASS_Y = 135, GROUND_Y = 150, HUD_Y = 162, FEET_Y = 160;
const SKY = '#3cbcfc', SKY_PINK = '#fca4c0';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------------- settings ---------------- */
const settings = { crosshair: true, sound: true, border: false };
let topScore = 0;
try {
  Object.assign(settings, JSON.parse(localStorage.getItem('honkhunt.settings') || '{}'));
  topScore = parseInt(localStorage.getItem('honkhunt.top') || '0', 10) || 0;
} catch (e) {}
const saveSettings = () => { try { localStorage.setItem('honkhunt.settings', JSON.stringify(settings)); } catch (e) {} };
const saveTop = () => { try { localStorage.setItem('honkhunt.top', String(topScore)); } catch (e) {} };

function fit() {
  let s = Math.min(window.innerWidth / W, window.innerHeight / H);
  if (s >= 1 && Math.floor(s) / s > 0.9) s = Math.floor(s);   // prefer whole-pixel scaling
  canvas.style.width = Math.round(W * s) + 'px';
  canvas.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* =====================================================================
   AUDIO — recorded clips (embedded) + chip-synth extras
   ===================================================================== */
const Sound = {
  ctx: null, master: null, music: null, sfx: null, noiseBuf: null, song: null, samples: {}, ready: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ready; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return (this.ready = Promise.resolve());
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = settings.sound ? 0.8 : 0; this.master.connect(this.ctx.destination);
    this.music = this.ctx.createGain(); this.music.gain.value = 0.45; this.music.connect(this.master);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
    const len = this.ctx.sampleRate; this.noiseBuf = this.ctx.createBuffer(1, len, len);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.ready = Promise.all(Object.entries(SAMPLE_DATA).map(async ([k, uri]) => {
      try {
        const bin = atob(uri.slice(uri.indexOf(',') + 1)), buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        this.samples[k] = await new Promise((res, rej) => this.ctx.decodeAudioData(buf.buffer, res, rej));
      } catch (e) { console.warn('sample failed', k, e); }
    }));
    return this.ready;
  },
  setOn(on) { if (this.master) this.master.gain.setTargetAtTime(on ? 0.8 : 0, this.ctx.currentTime, 0.02); },
  now() { return this.ctx ? this.ctx.currentTime : 0; },

  play(name, o = {}) {
    const b = this.samples[name]; if (!b || !this.ctx) return null;
    const s = this.ctx.createBufferSource(); s.buffer = b; s.playbackRate.value = o.rate || 1;
    const g = this.ctx.createGain(); g.gain.value = o.vol ?? 1;
    s.connect(g); g.connect(o.dest || this.sfx);
    if (o.loop) s.loop = true;
    s.start(o.when || this.ctx.currentTime);
    return s;
  },
  tone(freq, dur, type, vol, when, o = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = when ?? c.currentTime, osc = c.createOscillator(), g = c.createGain();
    osc.type = type || 'square'; osc.frequency.setValueAtTime(freq, t);
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slideTo), t + (o.slideTime ?? dur));
    const a = 0.004, rel = o.release ?? Math.min(0.06, dur * 0.4);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.setValueAtTime(vol, Math.max(t + a, t + dur - rel)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.dest || this.sfx); osc.start(t); osc.stop(t + dur + 0.02);
  },
  noise(dur, vol, when, o = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = when ?? c.currentTime, src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.filter || 'lowpass'; f.frequency.setValueAtTime(o.freq || 3000, t); f.Q.value = o.Q || 0.7;
    if (o.freqTo) f.frequency.exponentialRampToValueAtTime(o.freqTo, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  },

  /* ---------- effects ---------- */
  shot() { if (!this.play('shot', { vol: 0.85 })) { this.noise(0.25, 0.8, null, { freq: 5000, freqTo: 300 }); this.tone(140, 0.15, 'square', 0.4, null, { slideTo: 40 }); } },
  click() { this.tone(1600, 0.03, 'square', 0.1); this.tone(800, 0.03, 'square', 0.08, this.now() + 0.035); },
  honk(pitch = 1, vol = 0.5) {
    if (!this.play(Math.random() < 0.5 ? 'honk1' : 'honk2', { rate: pitch * (0.96 + Math.random() * 0.08), vol }))
      this.tone(330 * pitch, 0.25, 'sawtooth', vol * 0.5, null, { slideTo: 260 * pitch });
  },
  squawk(pitch = 1) {
    if (!this.play(Math.random() < 0.5 ? 'quack1' : 'quack2', { rate: pitch, vol: 0.85 }))
      this.tone(700, 0.2, 'square', 0.25, null, { slideTo: 380 });
  },
  fall() { this.tone(1320, 0.85, 'square', 0.06, null, { slideTo: 220 }); },
  thud() { this.noise(0.12, 0.45, null, { freq: 700 }); this.tone(110, 0.1, 'square', 0.18, null, { slideTo: 50 }); },
  rustle(vol = 0.7) { this.play('rustle', { vol, rate: 0.9 + Math.random() * 0.25 }) || this.noise(0.3, 0.2, null, { filter: 'bandpass', freq: 2500 }); },
  bark() {
    if (this.play('bark', { vol: 0.85 })) this.play('bark', { vol: 0.75, rate: 1.08, when: this.now() + 0.24 });
    else { this.tone(520, 0.09, 'square', 0.2, null, { slideTo: 330 }); this.tone(520, 0.09, 'square', 0.2, this.now() + 0.18, { slideTo: 330 }); }
  },
  yelp() { if (!this.play('bark', { rate: 1.75, vol: 0.9 })) this.tone(900, 0.25, 'square', 0.2, null, { slideTo: 1600 }); },
  snicker() {   // chip-tune "heh heh heh"
    const t = this.now();
    for (let i = 0; i < 7; i++) {
      const s = t + i * 0.115, p = i % 2 ? 0.89 : 1;
      this.tone(560 * p, 0.065, 'square', 0.13, s, { slideTo: 470 * p });
      this.noise(0.05, 0.12, s, { filter: 'bandpass', freq: 1600 * p, Q: 3 });
    }
  },
  flyAway() { this.noise(0.5, 0.18, null, { filter: 'bandpass', freq: 500, freqTo: 2600, Q: 1.4 }); },
  select() { if (!this.play('select', { vol: 0.75 })) this.tone(1200, 0.06, 'square', 0.15); },

  /* ---------- music ---------- */
  playSong(name, loop = false) {
    this.stopSong(); if (!this.ctx) return;
    const g = this.ctx.createGain(); g.gain.value = 1; g.connect(this.music);
    const cur = this.song = { g, loop, timer: null, src: null };
    if (this.samples[name]) { cur.src = this.play(name, { dest: g, loop }); return; }
    if (SONGS[name]) this._pass(cur, SONGS[name], this.ctx.currentTime + 0.05);
  },
  _pass(cur, song, t0) {
    if (this.song !== cur) return;
    const spb = 60 / song.bpm; let len = 0;
    for (const tr of song.tracks) {
      let t = t0;
      for (const [m, b] of tr.notes) { if (m !== null) this.tone(440 * Math.pow(2, (m - 69) / 12), Math.max(0.03, b * spb * 0.85), tr.wave, tr.vol, t, { dest: cur.g, release: 0.03 }); t += b * spb; }
      len = Math.max(len, t - t0);
    }
    if (cur.loop) cur.timer = setTimeout(() => this._pass(cur, song, t0 + len), Math.max(0, (t0 + len - this.ctx.currentTime - 0.25) * 1000));
  },
  stopSong() {
    if (!this.song) return; const s = this.song; this.song = null;
    clearTimeout(s.timer);
    try { s.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.03); } catch (e) {}
    setTimeout(() => { try { s.src && s.src.stop(); s.g.disconnect(); } catch (e) {} }, 300);
  }
};

function songLength(song) { return Math.max(...song.tracks.map(tr => tr.notes.reduce((t, n) => t + n[1], 0))) * 60 / song.bpm; }
function noteMidi(n) { const m = /^([A-G])([#b]?)(-?\d)$/.exec(n); return { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12; }
function seq(str) { return str.trim().split(/\s+/).map(tok => { const [n, b] = tok.split(':'); return [n === 'r' ? null : noteMidi(n), parseFloat(b)]; }); }

/* ---------------- flow ---------------- */
function goTitle() {

}
function startGame(mode) {

}

      const top = 18, bottom = decorative ? 105 : GRASS_Y - 18;
      if (g.x < 18) { g.x = 18; g.vx = Math.abs(g.vx); }
      if (g.x > W - 18) { g.x = W - 18; g.vx = -Math.abs(g.vx); }

function shoot(x, y) {

  }
  if (game.state === 'boot') {
    game.state = 'loading';
    Promise.race([Sound.init(), new Promise(r => setTimeout(r, 3000))]).then(goTitle);
    return;
  }
  if (game.paused || game.state === 'loading') return;
  if (game.state === 'wave') {
    if (game.shots <= 0) { Sound.click(); return; }
    game.shots--; Sound.shot(); spark(x, y); game.shake = 2;
    for (const g of game.geese) {
      if (g.state !== 'fly' && g.state !== 'flee') continue;
      if (hitTest(g, x, y)) {
        g.state = 'hit'; g.t = 0; g.wasHit = true;
        const pts = Math.round(GOOSE_TYPES[g.type].pts * ptsMult(game.round) / 10) * 10;
        game.score += pts;
        particles.push({ kind: 'score', x: g.x, y: g.y - 16, text: String(pts), t: 0, life: 1.2 });
        feathers(g.x, g.y, GOOSE_TYPES[g.type].feather);

        break;

    return;

  if ((game.state === 'resolve' || game.state === 'gameover') && dog.mode === 'laugh' && dog.popT > 0.5) {
    Sound.shot(); spark(x, y);
    if (Math.abs(x - dog.x) < 18 && y > dog.y - 60 && y < GRASS_Y + 5) {
      dog.mode = 'yelp'; Sound.yelp();
      dog.t = 0.35; dog.hold = 0.5;
      if (game.state === 'gameover') setTimeout(() => { if (game.state === 'gameover') { dog.mode = 'laugh'; dog.t = 0; dog.hold = 9999; Sound.snicker(); } }, 1300);
    }

  if (game.state === 'boot' || game.state === 'loading') renderBoot();
  else if (game.state === 'title') renderTitle();
  else {
    renderHUD();
    if (game.banner) renderBanner();
    if (game.state === 'tally') renderTally();
    if (game.state === 'gameover') renderGameOver();
  }
  if (game.paused) { box(100, 70, 120, 40, K, WH); text('PAUSED', W / 2, 84, WH, 2); text('P TO RESUME', W / 2, 100, '#bcbcbc', 1, 'center', null); }
  if (settings.border) { ctx.fillStyle = WH; ctx.fillRect(0, 0, W, 5); ctx.fillRect(0, H - 5, W, 5); ctx.fillRect(0, 0, 5, H); ctx.fillRect(W - 5, 0, 5, H); }
  if (settings.crosshair && pointer.seen) sprite(SPR.cross, pointer.x - 9, pointer.y - 9);
}
function drawGoose(g) {
  if (g.state === 'gone') return;
  const S = SPR.goose[g.type], m = g.dir === 1 ? 0 : 1;
  let img;
  if (g.state === 'hit') img = S.hit[m];
  else if (g.state === 'fall') img = S.fall[Math.floor(g.t * 8) % 2];
  else img = S[['up', 'mid', 'down', 'mid'][Math.floor(g.flap) % 4]][m];
  sprite(img, g.x - img.width / 2, g.y - img.height / 2);
}
function drawDog() {
  if (dog.mode === 'hidden') return;
  if (dog.mode === 'show' || dog.mode === 'laugh' || dog.mode === 'yelp') {
    let img, y = dog.y;
    if (dog.mode === 'laugh') { img = SPR.dogFront['laugh' + (Math.floor(dog.t * 8) % 2)]; y -= (Math.floor(dog.t * 8) % 2) * 2; }
    else img = SPR.dogFront[dog.mode];
    if (dog.mode === 'show' && dog.geese) {
      const pawY = y - 62 + 31;
      const hangAt = (px, type, m) => { const h = SPR.goose[type].hang[m]; sprite(h, m ? px - h.width + 6 : px - 5, pawY - 3); };
      if (dog.geese.length === 1) hangAt(dog.x + 15, dog.geese[0], 0);
      else { hangAt(dog.x - 15, dog.geese[0], 1); hangAt(dog.x + 15, dog.geese[1], 0); }
    }
    sprite(img, dog.x - 25, y - 62);
  } else {
    let key = dog.mode;
    if (dog.mode === 'walk') key = 'walk' + (Math.floor(dog.t * 8) % 2);
    if (dog.mode === 'sniff') key = 'sniff' + (Math.floor(dog.t * 6) % 2);
    const img = SPR.dogSide[key][0];
    sprite(img, dog.x - 25, dog.y - 41);
    if (dog.mode === 'alert') text('!', dog.x + 14, dog.y - 50, '#fce040', 2);
  }
}
function box(x, y, w, h, fill = K, border = WH) {
  ctx.fillStyle = border; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fill; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
}
function renderHUD() {
  ctx.fillStyle = K; ctx.fillRect(0, HUD_Y, W, H - HUD_Y);
  const ty = 171;
  text('R', 8, ty, '#80d010', 1, 'left', null); text(String(game.round), 16, ty, WH, 1, 'left', null);
  text('SHOT', 36, ty, '#80d010', 1, 'left', null);
  for (let i = 0; i < 3; i++) {
    const on = game.state === 'wave' ? i < game.shots : true, x = 62 + i * 6;
    ctx.fillStyle = on ? '#d82800' : '#383838'; ctx.fillRect(x, 166, 4, 6);
    ctx.fillStyle = on ? '#fcbc3c' : '#282828'; ctx.fillRect(x, 172, 4, 3);
  }
  text('HIT', 90, ty, '#80d010', 1, 'left', null);
  const need = needFor(game.round);
  for (let i = 0; i < 10; i++) {
    const h = game.hits[i], x = 110 + i * 12;
    let img = SPR.hud.white;
    if (h === 'hit') img = SPR.hud.red; else if (h === 'miss') img = SPR.hud.grey;
    else if (h === 'current') img = Math.floor(game.t * 6) % 2 ? SPR.hud.white : SPR.hud.grey;
    sprite(img, x, 165);
    if (i < need) { ctx.fillStyle = '#3cbcfc'; ctx.fillRect(x + 1, 174, 9, 1); }
  }
  text(String(game.score).padStart(7, '0'), 314, ty, WH, 1, 'right', null);
}
function renderBanner() {
  const b = game.banner; if (Math.floor(b.t * 30) < 1) return;
  if (b.box) { box(110, 40, 100, 22); text(b.text, W / 2, 51, WH, 2, 'center', null); }
  else { box(95, 42, 130, 28, K, '#fce040'); text(b.text, W / 2, 56, '#fce040', 2, 'center', null); }
}
function renderTally() {
  const r = game.tally;
  box(80, 30, 160, 64);
  text('HITS ' + r.hits + '/10', W / 2, 42, WH, 2, 'center', null);
  text('NEED ' + r.need, W / 2, 58, '#3cbcfc', 1, 'center', null);
  if (r.done) {
    if (r.perfect) { text('PERFECT!!', W / 2, 72, Math.floor(game.t * 8) % 2 ? '#fce040' : '#f83800', 2, 'center', null); text('+' + r.bonus, W / 2, 86, WH, 1, 'center', null); }
    else if (r.pass) text('NICE SHOT!', W / 2, 74, '#80d010', 2, 'center', null);
    else text('NOT ENOUGH', W / 2, 74, '#f83800', 2, 'center', null);
  }
}
function button(label, x, y, w, h, action, sub, scale = 2) {
  const hover = pointer.seen && pointer.x >= x && pointer.x <= x + w && pointer.y >= y && pointer.y <= y + h;
  box(x, y, w, h, hover ? '#fce040' : K, hover ? K : WH);
  const col = hover ? K : WH;
  text(label, x + w / 2, y + h / 2 - (sub ? 4 : 0), col, scale, 'center', null);
  if (sub) text(sub, x + w / 2, y + h / 2 + 8, hover ? '#503000' : '#bcbcbc', 1, 'center', null);
  buttons.push({ x, y, w, h, action: () => { Sound.select(); action(); } });
}
function drawLogo(y) {
  text('HONK', W / 2 - 3, y, '#fce040', 4, 'center', '#502000');
  text('HUNT', W / 2 + 3, y + 30, '#f87800', 4, 'center', '#502000');
}
function renderBoot() {
  drawLogo(32);
  if (game.state === 'loading') text('LOADING...', W / 2, 112, WH, 2);
  else if (Math.floor(game.t * 2) % 2 === 0) text('SHOOT TO START', W / 2, 112, WH, 2);
}
function renderTitle() {
  drawLogo(22);
  sprite(SPR.dogSide['sniff' + (Math.floor(game.t * 6) % 2)][1], 236, FEET_Y - 41);
  button('GAME A', 70, 72, 84, 30, () => startGame('A'), '1 GOOSE');
  button('GAME B', 166, 72, 84, 30, () => startGame('B'), '2 GEESE');
  const tg = (l, on) => l + (on ? ' ON' : ' OFF');
  button(tg('SOUND', settings.sound), 34, 112, 80, 15, () => { settings.sound = !settings.sound; Sound.setOn(settings.sound); saveSettings(); }, null, 1);
  button(tg('AIM', settings.crosshair), 120, 112, 80, 15, () => { settings.crosshair = !settings.crosshair; saveSettings(); }, null, 1);
  button(tg('BORDER', settings.border), 206, 112, 80, 15, () => { settings.border = !settings.border; saveSettings(); }, null, 1);
  button(document.fullscreenElement ? 'WINDOW' : 'FULLSCREEN', 110, 132, 100, 14, toggleFullscreen, null, 1);
  ctx.fillStyle = K; ctx.fillRect(0, HUD_Y, W, H - HUD_Y);
  text('TOP SCORE ' + String(topScore).padStart(7, '0'), W / 2, 171, '#80d010', 1, 'center', null);
}
function renderGameOver() {
  if (game.t > 0.4) { box(90, 16, 140, 28, K, '#f83800'); text('GAME OVER', W / 2, 30, '#f83800', 2, 'center', null); }
  if (game.t > 1.8) {
    button('AGAIN', 40, 54, 80, 26, () => startGame(game.mode));
    button('MENU', 200, 54, 80, 26, goTitle);
    if (game.newTop) text('NEW TOP SCORE!', W / 2, 92, '#fce040', 1);
  }
}

/* =====================================================================
   INPUT + LOOP
   ===================================================================== */
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
canvas.addEventListener('pointermove', e => { const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; pointer.seen = true; });
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; pointer.seen = true;
  if (Sound.ctx && Sound.ctx.state === 'suspended' && !game.paused) Sound.ctx.resume();
  shoot(p.x, p.y);
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); }
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') toggleFullscreen();
  if (k === 'm') { settings.sound = !settings.sound; Sound.setOn(settings.sound); saveSettings(); }
  if (k === 'c') { settings.crosshair = !settings.crosshair; saveSettings(); }
  if (k === 'b') { settings.border = !settings.border; saveSettings(); }
  if (k === 'p' && !['title', 'boot', 'loading'].includes(game.state)) togglePause();
  if (k === 'escape' && game.state === 'gameover') goTitle();
});
function togglePause() { game.paused = !game.paused; if (Sound.ctx) game.paused ? Sound.ctx.suspend() : Sound.ctx.resume(); }
document.addEventListener('visibilitychange', () => { if (document.hidden && !game.paused && !['title', 'boot', 'loading'].includes(game.state)) togglePause(); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!game.paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>

<script>/* TRIGGER HAPPY ARCADE: hold Esc for 1 second, press Home, or hold Select+Start on a gamepad to return to the game menu */
(function(){var t=null,done=false,go=function(){if(done)return;done=true;location.href='../../index.html';};
addEventListener('keydown',function(e){if(e.key==='Home')go();if(e.key==='Escape'&&!t&&!e.repeat)t=setTimeout(go,1000);},true);
addEventListener('keyup',function(e){if(e.key==='Escape'&&t){clearTimeout(t);t=null;}},true);
(function poll(){var ps=navigator.getGamepads?navigator.getGamepads():[];for(var i=0;i<ps.length;i++){var p=ps[i];if(p&&p.buttons[8]&&p.buttons[9]&&p.buttons[8].pressed&&p.buttons[9].pressed)go();}requestAnimationFrame(poll);})();})();</script>
