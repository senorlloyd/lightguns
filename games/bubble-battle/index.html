<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bubble Battle — OpenFIRE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;cursor:none;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   BUBBLE BATTLE v3 — cartoon bubble duel for OpenFIRE light guns
   ---------------------------------------------------------------------
   MODES   Story (1 player, 8-stage world map) · Versus (2 guns) · Quick match vs CPU
   INPUT
   • OpenFIRE guns in GAMEPAD mode (aim on an analog stick).
     First gun to pull any button joins as P1, second as P2.
     The button you join with becomes that gun's TRIGGER; any other
     button on the gun = SWAP current/next bubble.
     Menus are shot with the trigger.
     D = input debug overlay, A = cycle aim axes, I = invert Y, X = invert X
   • Mouse (testing, or one gun in mouse mode): left-click fire, right-click swap.
   Other keys: F fullscreen · M music · P pause · Esc back to title
               Delete (on the world map) = erase story progress
   ===================================================================== */

const CONFIG = {
  shotSpeed: 1900,        // px/sec
  reload: 0.12,           // sec after a bubble lands before next shot
  launcherFollow: 0.35,   // 0 = launcher fixed in center, 1 = directly under crosshair
  launcherSpeed: 2400,    // px/sec launcher slide speed
  angleBoost: 1.2,        // >1 exaggerates side angles so ricochets are easier to get
  maxAngleDeg: 85,        // max shot angle from vertical
  garbageDelay: 2.5,      // warning seconds before incoming rows drop in
  rainbowPop: 6,          // popping this many at once earns a RAINBOW next bubble...
  rainbowDrop: 5,         // ...or dropping this many
  bubbleFaces: true,      // little faces on the bubbles (false = plain glossy bubbles)
};
// Match rules. Story stages override some of these. Two-item arrays are [P1, P2].
const BASE_RULES = {
  colors: 5,              // bubble colors in play (max 6)
  startRows: [6, 6],      // rows on each board at round start
  stone: [0.25, 0.25],    // chance each garbage bubble LANDING on that player is a stone
  guide: [560, 560],      // aim guide length for each player (0 = off)
  autoStart: 28,          // ceiling pushes a row every N sec (0 = off)...
  autoMin: 12,            // ...speeding up to this
  roundsToWin: 2,
};
// CPU brains: think = pause between shots, error = aim wobble px,
// noise = randomness in shot choice, aim = crosshair speed, swap = uses swap
const CPU_LEVELS = {
  easy:   { think: [1.3, 2.3], error: 50, noise: 140, aim: 3.5, swap: false, char: 'sprout' },
  normal: { think: [0.8, 1.5], error: 28, noise: 45,  aim: 5,   swap: true,  char: 'waddles' },
  hard:   { think: [0.4, 0.9], error: 14, noise: 6,   aim: 8,   swap: true,  char: 'bolt' },
};
const LEVEL_KEYS = ['easy', 'normal', 'hard'];

// Story mode. par = seconds of play to beat for the third star.
const STAGES = [
  { name: 'Sunny Meadow', theme: 'meadow', foe: 'sprout', line: 'I just learned how to pop bubbles!', twist: 'A gentle warm-up: 4 colors, no stones.',
    cpu: { think: [2.2, 3.6], error: 70, noise: 260, aim: 3, swap: false }, rules: { colors: 4, startRows: [5, 5], stone: [0, 0], autoStart: 36 }, par: 110 },
  { name: 'Bubble Beach', theme: 'beach', foe: 'pinchy', line: 'Snip snap! Mind the tide!', twist: '4 colors. A few stones wash in.',
    cpu: { think: [1.7, 2.8], error: 60, noise: 190, aim: 3.5, swap: false }, rules: { colors: 4, stone: [0.1, 0.1], autoStart: 32 }, par: 110 },
  { name: 'Honey Hollow', theme: 'hive', foe: 'buzzby', line: 'Bzzt! Too fast for you!', twist: 'Buzzby shoots FAST… but sloppy.',
    cpu: { think: [0.45, 0.9], error: 85, noise: 230, aim: 8, swap: false }, rules: {}, par: 110 },
  { name: 'Frosty Peak', theme: 'ice', foe: 'waddles', line: 'My rows come frozen solid!', twist: 'Rows sent to YOU are packed with stones.',
    cpu: { think: [1.2, 2.0], error: 40, noise: 100, aim: 4.5, swap: true }, rules: { stone: [0.5, 0.2] }, par: 120 },
  { name: 'Spooky Attic', theme: 'spooky', foe: 'wisp', line: 'Who turned out the lights? Oooo!', twist: 'It\'s dark: your aim guide is very short.',
    cpu: { think: [1.0, 1.7], error: 32, noise: 70, aim: 5, swap: true }, rules: { guide: [170, 560] }, par: 120 },
  { name: 'Gizmo Works', theme: 'factory', foe: 'bolt', line: 'CEILING SPEED: INCREASED. BEEP.', twist: 'The ceiling press runs at double speed.',
    cpu: { think: [0.85, 1.5], error: 26, noise: 45, aim: 5.5, swap: true }, rules: { autoStart: 15, autoMin: 8 }, par: 110 },
  { name: 'Deep Blue', theme: 'sea', foe: 'inky', line: 'Six colors, eight arms. Good luck!', twist: 'A sixth bubble color joins in.',
    cpu: { think: [0.8, 1.4], error: 22, noise: 35, aim: 6, swap: true }, rules: { colors: 6 }, par: 130 },
  { name: 'Cloud Castle', theme: 'castle', foe: 'king', line: 'Kneel before the Bubble King!', twist: 'BOSS: first to 3 rounds, 6 colors, extra stones.',
    cpu: { think: [0.6, 1.1], error: 18, noise: 18, aim: 7, swap: true }, rules: { colors: 6, stone: [0.4, 0.25], roundsToWin: 3 }, par: 190 },
];

// ---------- Geometry ----------
const W = 1920, H = 1080, HALF = 960;
const R = 40, D = R * 2, ROWH = D * Math.sqrt(3) / 2, COLS = 9, FIELD_W = COLS * D;
const FIELD_Y0 = 100, DEAD_ROW = 12, LAUNCH_Y = 1010;
const RAINBOW = 6, STONE = 7;
const DEAD_Y = FIELD_Y0 + 2 * R + (DEAD_ROW - 1) * ROWH + 4;
const MAXA = CONFIG.maxAngleDeg * Math.PI / 180;
const FONT = "'Fredoka One','Baloo 2','Fredoka','Arial Rounded MT Bold','Chalkboard SE','Comic Sans MS','Arial Black','DejaVu Sans',sans-serif";
const OUT = '#2a1848';                       // cartoon outline color
const PCOL = ['#2fd4e6', '#ff6fb8'];         // player frame colors
const COLORS = ['#ff5a6e', '#ffd23f', '#4fdc7b', '#4aa3ff', '#b673ff', '#ff9838'];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, k) {   // k < 0 darker, k > 0 lighter
  const n = parseInt(hex.slice(1), 16), f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

// ---------- Canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px';
}
addEventListener('resize', fit); fit();

function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function starPath(g, x, y, r, rot = 0, inner = 0.48) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * inner : r; g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  g.closePath();
}
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- Bubble sprites (pre-rendered for Pi 5 speed) ----------
const SPR_S = R * 2 + 8, SPR_H = SPR_S / 2;
// face: -1 none, 0 normal, 1 blink, 2 worried, 3 knocked out
function makeBubble(col, face) {
  const c = newCanvas(SPR_S, SPR_S), g = c.getContext('2d'), cx = SPR_H, cy = SPR_H;
  const dark = shade(col, -0.55), ink = shade(col, -0.72);
  g.fillStyle = dark; g.beginPath(); g.arc(cx, cy, R - 0.5, 0, 7); g.fill();
  g.fillStyle = shade(col, -0.2); g.beginPath(); g.arc(cx, cy, R - 5, 0, 7); g.fill();
  g.fillStyle = col; g.beginPath(); g.arc(cx - 3, cy - 4, R - 9, 0, 7); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, R - 11, Math.PI * 1.08, Math.PI * 1.55); g.stroke();
  g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(cx - R * 0.36, cy - R * 0.46, R * 0.2, R * 0.12, -0.6, 0, 7); g.fill();
  g.beginPath(); g.arc(cx - R * 0.56, cy - R * 0.14, 3, 0, 7); g.fill();
  if (face >= 0) {
    const ex = R * 0.27, ey = cy + R * 0.1;
    g.fillStyle = 'rgba(255,120,150,0.4)';
    for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * R * 0.5, cy + R * 0.34, 6, 4, 0, 0, 7); g.fill(); }
    g.strokeStyle = ink; g.fillStyle = ink; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
    for (const s of [-1, 1]) {
      const x = cx + s * ex;
      if (face === 0) { g.beginPath(); g.ellipse(x, ey, 4.5, 6.5, 0, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 1.5, ey - 2.5, 1.8, 0, 7); g.fill(); g.fillStyle = ink; }
      else if (face === 1) { g.beginPath(); g.arc(x, ey - 2, 5, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
      else if (face === 2) { g.fillStyle = '#fff'; g.beginPath(); g.ellipse(x, ey, 6.5, 8, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = ink; g.beginPath(); g.arc(x, ey + 1, 2.6, 0, 7); g.fill(); }
      else { g.beginPath(); g.moveTo(x - 5, ey - 5); g.lineTo(x + 5, ey + 5); g.moveTo(x + 5, ey - 5); g.lineTo(x - 5, ey + 5); g.stroke(); }
    }
    g.beginPath();
    if (face === 2) { g.ellipse(cx, cy + R * 0.42, 4, 5, 0, 0, 7); g.fill(); }
    else if (face === 3) { g.arc(cx, cy + R * 0.55, 7, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke(); }
    else { g.arc(cx, cy + R * 0.26, 7, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
  }
  return c;
}
function makeRainbow() {
  const c = newCanvas(SPR_S, SPR_S), g = c.getContext('2d'), cx = SPR_H, cy = SPR_H;
  const stops = ['#ff5a6e', '#ff9838', '#ffd23f', '#4fdc7b', '#4aa3ff', '#b673ff', '#ff5a6e'];
  g.fillStyle = OUT; g.beginPath(); g.arc(cx, cy, R - 0.5, 0, 7); g.fill();
  let fill;
  if (g.createConicGradient) fill = g.createConicGradient(0, cx, cy); else fill = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  stops.forEach((s, i) => fill.addColorStop(i / 6, s));
  g.fillStyle = fill; g.beginPath(); g.arc(cx, cy, R - 5, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.3)'; g.beginPath(); g.arc(cx, cy, R - 14, 0, 7); g.fill();
  return c;
}
function makeStone() {
  const c = newCanvas(SPR_S, SPR_S), g = c.getContext('2d'), cx = SPR_H, cy = SPR_H;
  const blob = q => { g.beginPath(); for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2 + 0.2, k = q * (i % 2 ? 0.92 : 1); g.lineTo(cx + Math.cos(a) * k, cy + Math.sin(a) * k); } g.closePath(); };
  g.lineJoin = 'round';
  blob(R - 1); g.fillStyle = '#343848'; g.fill();
  blob(R - 6); g.fillStyle = '#868ca0'; g.fill();
  g.save(); g.translate(-3, -4); blob(R - 11); g.fillStyle = '#a9afc2'; g.fill(); g.restore();
  g.strokeStyle = '#343848'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx - 17, cy - 8); g.lineTo(cx - 5, cy - 3); g.moveTo(cx + 17, cy - 8); g.lineTo(cx + 5, cy - 3); g.stroke();   // grumpy brows
  g.fillStyle = '#343848';
  for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * 11, cy + 4, 3.5, 0, 7); g.fill(); }
  g.beginPath(); g.moveTo(cx - 7, cy + 17); g.lineTo(cx + 7, cy + 17); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 4;
  g.beginPath(); g.arc(cx, cy, R - 13, Math.PI * 1.1, Math.PI * 1.5); g.stroke();
  return c;
}
const FACES = CONFIG.bubbleFaces ? [0, 1, 2, 3] : [-1, -1, -1, -1];
const SPRF = COLORS.map(c => FACES.map(f => makeBubble(c, f)));
const SPR = COLORS.map((c, i) => SPRF[i][0]);
SPR[RAINBOW] = makeRainbow(); SPR[STONE] = makeStone();
const GRAY = makeBubble('#9aa0b5', FACES[3]);
const colOf = ci => ci === RAINBOW ? COLORS[(Math.random() * 6) | 0] : ci === STONE ? '#a9afc2' : COLORS[ci];

// ---------- Characters (all original; drawn with code so they can animate) ----------
const CHARS = {
  fizz:    { name: 'FIZZ',      body: '#3fd0e0', belly: '#d8fbff', dark: '#14606e', ears: 'round' },
  pop:     { name: 'POP',       body: '#ff7ac0', belly: '#ffe3f2', dark: '#8f1f5c', ears: 'bunny' },
  sprout:  { name: 'SPROUT',    body: '#8be26a', belly: '#e9ffd9', dark: '#2a6e24', ears: 'leaf' },
  pinchy:  { name: 'PINCHY',    body: '#ff7a5c', belly: '#ffdccf', dark: '#8f2a14', ears: 'claws' },
  buzzby:  { name: 'BUZZBY',    body: '#ffd23f', belly: '#fff5c9', dark: '#6e4700', ears: 'antenna', stripes: true, wings: true },
  waddles: { name: 'WADDLES',   body: '#51649a', belly: '#ffffff', dark: '#1c2647', ears: 'none', beak: true },
  wisp:    { name: 'WISP',      body: '#f3f1ff', belly: '#ffffff', dark: '#5d5799', ears: 'none', ghost: true },
  bolt:    { name: 'BOLT-9',    body: '#aab6c8', belly: '#e9f0f7', dark: '#3d4860', ears: 'bolt', square: true },
  inky:    { name: 'INKY',      body: '#b673ff', belly: '#eedcff', dark: '#4c2187', ears: 'none', tentacles: true },
  king:    { name: 'KING FIZZLE', body: '#ff5a6e', belly: '#ffdbe0', dark: '#7d1228', ears: 'crown', stache: true },
};
// x,y = where the feet stand. mood: idle | happy | worry | cry | cheer
function drawChar(kind, x, y, s, mood = 'idle', look = 0) {
  const C = CHARS[kind], t = time + x * 0.013, P = Math.PI;
  let hop = 0, sq = 1 + Math.sin(t * 5) * 0.025;
  if (mood === 'cheer') { hop = Math.abs(Math.sin(t * 9)) * 26; sq = 1; }
  else if (mood === 'happy') { hop = Math.abs(Math.sin(t * 13)) * 10; sq = 1; }
  else if (mood === 'cry') sq = 0.93;
  else if (mood === 'worry') sq = 1 + Math.sin(t * 22) * 0.02;
  const up = mood === 'cheer';
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(0, 0, 36 * s * (1 - hop / 90), 8 * s, 0, 0, 7); ctx.fill();
  ctx.translate(0, -hop * s); ctx.scale(s, s * sq);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = C.dark;
  const fs = (fill) => { ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  // things behind the body
  if (C.wings) for (const d of [-1, 1]) { ctx.save(); ctx.translate(d * 30, -70); ctx.rotate(d * (0.6 + Math.sin(t * 40) * 0.25)); ctx.beginPath(); ctx.ellipse(d * 8, 0, 18, 10, 0, 0, 7); ctx.globalAlpha = 0.85; fs('#ffffff'); ctx.restore(); }
  if (C.ears === 'round') for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(d * 28, -70, 13, 0, 7); fs(C.body); ctx.beginPath(); ctx.arc(d * 28, -70, 5.5, 0, 7); ctx.fillStyle = C.belly; ctx.fill(); }
  else if (C.ears === 'bunny') for (const d of [-1, 1]) { ctx.save(); ctx.translate(d * 16, -74); ctx.rotate(d * (0.18 + Math.sin(t * 4) * 0.05)); ctx.beginPath(); ctx.ellipse(0, -22, 10, 26, 0, 0, 7); fs(C.body); ctx.beginPath(); ctx.ellipse(0, -22, 4, 16, 0, 0, 7); ctx.fillStyle = C.belly; ctx.fill(); ctx.restore(); }
  else if (C.ears === 'leaf') { ctx.beginPath(); ctx.moveTo(0, -72); ctx.lineTo(0, -92); ctx.stroke(); for (const d of [-1, 1]) { ctx.save(); ctx.translate(d * 13, -98); ctx.rotate(-d * (0.5 + Math.sin(t * 5) * 0.12)); ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, 7); fs('#5fc85a'); ctx.restore(); } }
  else if (C.ears === 'antenna') for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * 12, -72); ctx.quadraticCurveTo(d * 14, -92, d * 22, -98); ctx.stroke(); ctx.beginPath(); ctx.arc(d * 22, -98, 5, 0, 7); fs(C.dark); }
  else if (C.ears === 'bolt') { ctx.beginPath(); ctx.moveTo(0, -76); ctx.lineTo(0, -98); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -100, 7, 0, 7); fs((t * 3 | 0) % 2 ? '#ffd23f' : '#ff5a6e'); for (const d of [-1, 1]) { rr(ctx, d * 40 - 7, -52, 14, 18, 4); fs(C.dark); } }
  else if (C.ears === 'crown') { ctx.save(); ctx.strokeStyle = '#7a4e00'; ctx.beginPath(); [[-25, -68], [-30, -102], [-13, -86], [0, -110], [13, -86], [30, -102], [25, -68]].forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath(); fs('#ffd23f'); ctx.beginPath(); ctx.arc(0, -84, 4.5, 0, 7); ctx.fillStyle = '#4aa3ff'; ctx.fill(); ctx.restore(); }
  // feet
  if (C.tentacles) for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(-30 + i * 20, -6 + Math.sin(t * 6 + i * 1.6) * 3, 11, 0, 7); fs(C.body); }
  else if (!C.ghost) for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(d * 16, -4, 13, 7, 0, 0, 7); fs(C.beak ? '#ff9838' : shade(C.body, -0.25)); }
  // body
  if (C.ghost) { ctx.beginPath(); ctx.arc(0, -44, 38, P, 0); ctx.lineTo(38, -8); for (let i = 0; i < 4; i++) ctx.quadraticCurveTo(28.5 - i * 19, 6 + Math.sin(t * 6 + i) * 3, 19 - i * 19, -8); ctx.closePath(); fs(C.body); }
  else if (C.square) { rr(ctx, -38, -78, 76, 72, 16); fs(C.body); }
  else { ctx.beginPath(); ctx.ellipse(0, -40, 38, 36, 0, 0, 7); fs(C.body); }
  if (C.stripes) { ctx.save(); ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-31, -26); ctx.quadraticCurveTo(0, -20, 31, -26); ctx.moveTo(-20, -11); ctx.quadraticCurveTo(0, -6, 20, -11); ctx.stroke(); ctx.restore(); }
  else if (C.square) { rr(ctx, -20, -32, 40, 18, 5); ctx.fillStyle = C.belly; ctx.fill(); for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-11 + i * 11, -23, 3.5, 0, 7); ctx.fillStyle = ((t * 4 | 0) + i) % 3 ? '#4fdc7b' : '#ffd23f'; ctx.fill(); } }
  else if (!C.ghost) { ctx.beginPath(); ctx.ellipse(0, C.beak ? -32 : -25, C.beak ? 25 : 21, C.beak ? 25 : 16, 0, 0, 7); ctx.fillStyle = C.belly; ctx.fill(); }
  // arms
  if (C.ears === 'claws') for (const d of [-1, 1]) { const ay = up ? -78 : -50 + Math.sin(t * 6 + d) * 3; ctx.beginPath(); ctx.arc(d * 50, ay, 15, 0, 7); fs(C.body); ctx.beginPath(); ctx.moveTo(d * 50, ay); ctx.lineTo(d * 62, ay - 12); ctx.stroke(); }
  else if (C.beak) for (const d of [-1, 1]) { ctx.save(); ctx.translate(d * 36, -46); ctx.rotate(d * (up ? -1.9 + Math.sin(t * 18) * 0.3 : -0.35)); ctx.beginPath(); ctx.ellipse(0, 16, 8, 19, 0, 0, 7); fs(C.body); ctx.restore(); }
  else for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(d * (up ? 42 : 40), up ? -70 : -34, 9, 0, 7); fs(C.body); }
  // face
  ctx.lineWidth = 4;
  const ex = 14, ey = C.square ? -56 : -52;
  ctx.fillStyle = 'rgba(255,110,150,0.5)';
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(d * 27, ey + 12, 6, 4, 0, 0, 7); ctx.fill(); }
  if (mood === 'cheer' || mood === 'happy') for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * ex - 7, ey + 3); ctx.quadraticCurveTo(d * ex, ey - 9, d * ex + 7, ey + 3); ctx.stroke(); }
  else if (mood === 'cry') {
    for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * (ex + 6), ey - 6); ctx.lineTo(d * (ex - 5), ey); ctx.lineTo(d * (ex + 6), ey + 6); ctx.stroke(); }
    ctx.fillStyle = '#6fd3ff';
    for (const d of [-1, 1]) for (let i = 0; i < 2; i++) { const k = (t * 1.6 + i * 0.5 + (d > 0 ? 0.25 : 0)) % 1; ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.ellipse(d * (ex + 8 + k * 16), ey + 8 + k * 30, 4, 6, 0, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  } else {
    const w = mood === 'worry';
    for (const d of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(d * ex, ey, 9, w ? 12 : 11, 0, 0, 7); ctx.lineWidth = 3; fs('#fff');

      if (!w) { ctx.beginPath(); ctx.arc(d * ex + look * 3 - 1.5, ey - 1.5, 1.8, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }

// ---------- Input ----------
const AXES_PAIRS = [[0, 1], [2, 3], [3, 4], [1, 0], [4, 5]];
let axesPairIdx = 0, invertY = false, invertX = false;
try { const s = JSON.parse(localStorage.getItem('bb_input') || '{}'); if (s.ap != null) axesPairIdx = s.ap % AXES_PAIRS.length; invertY = !!s.iy; invertX = !!s.ix; } catch (e) { }
function saveInput() { try { localStorage.setItem('bb_input', JSON.stringify({ ap: axesPairIdx, iy: invertY, ix: invertX })); } catch (e) { } }
const padPrev = {};
function pollPads() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  padInfo = [];
  for (const pad of pads) {
    if (!pad) continue;
    const pressed = pad.buttons.map(b => b.pressed || b.value > 0.5);
    const prev = padPrev[pad.index] || [], jp = [];
    pressed.forEach((v, i) => { if (v && !prev[i]) jp.push(i); });
    padPrev[pad.index] = pressed;
    padInfo.push({ index: pad.index, id: pad.id, axes: [...pad.axes], pressed: pressed.map((v, i) => v ? i : -1).filter(i => i >= 0) });
    const pl = players.find(p => p.input === 'gamepad' && p.padIndex === pad.index);
    if (pl) {
      const [ax, ay] = AXES_PAIRS[axesPairIdx];
      let vx = pad.axes[ax] ?? 0, vy = pad.axes[ay] ?? 0;
      if (invertX) vx = -vx; if (invertY) vy = -vy;
      pl.aimX = clamp((vx + 1) / 2 * W, 0, W); pl.aimY = clamp((vy + 1) / 2 * H, 0, H);
      for (const b of jp) { if (b === pl.trigBtn) onFire(pl.idx); else onSwap(pl.idx); }
    } else if (jp.length && state === 'title' && menu !== 'cpu') {
      const slot = players.find(p => !p.input);
      if (slot) { slot.input = 'gamepad'; slot.padIndex = pad.index; slot.trigBtn = jp[0]; sfx.join(); }
    }
  }
}
const mouse = { x: W / 2, y: H / 2, seen: false };
function mousePlayer() {
  const ms = players.filter(p => p.input === 'mouse');
  if (ms.length === 1) return ms[0];
  if (ms.length === 2) return players[mouse.x < HALF ? 0 : 1];
  return null;
}
function mouseXY(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; mouse.seen = true; }
addEventListener('mousemove', e => {
  mouseXY(e); const ms = players.filter(p => p.input === 'mouse');
  if (ms.length === 1) { ms[0].aimX = mouse.x; ms[0].aimY = mouse.y; }
  else if (ms.length === 2) { const p = players[mouse.x < HALF ? 0 : 1]; p.aimX = mouse.x; p.aimY = mouse.y; }
});
function mouseJoin(slot) { slot.input = 'mouse'; slot.padIndex = -1; slot.aimX = mouse.x; slot.aimY = mouse.y; sfx.join(); }
addEventListener('mousedown', e => {
  initAudio(); mouseXY(e);
  if (uiState()) {
    if (e.button !== 0) return;
    if (state === 'title') {
      if (menu === 'versus' && !btns.some(b => mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h)) {
        const slot = players[mouse.x < HALF ? 0 : 1]; if (!slot.input) mouseJoin(slot); return;
      }
      if (!players[0].input) mouseJoin(players[0]);
    }
    shootBtn(mouse.x, mouse.y); return;
  }
  const mp = mousePlayer();
  if (e.button === 0) onFire(mp ? mp.idx : 0);
  else if (e.button === 2 && mp) onSwap(mp.idx);
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  initAudio(); const k = e.key.toLowerCase();
  if (k === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if (k === 'm') toggleMusic();
  else if (k === 'd') showDebug = !showDebug;
  else if (k === 'a') { axesPairIdx = (axesPairIdx + 1) % AXES_PAIRS.length; saveInput(); }
  else if (k === 'i') { invertY = !invertY; saveInput(); }
  else if (k === 'x') { invertX = !invertX; saveInput(); }
  else if ((k === '1' || k === '2' || k === '3') && state === 'title' && menu === 'cpu') startCpu(LEVEL_KEYS[+k - 1]);
  else if (k === 'delete' && state === 'map') { story = { unlocked: 1, stars: STAGES.map(() => 0) }; saveStory(); }
  else if (k === 'p' && state === 'play') paused = !paused;
  else if (k === 'escape') toTitle();
  else if (k === ' ' || k === 'enter') { if (state === 'intro' || (state === 'roundEnd' && !matchOver)) onFire(0); }
});
// Gamepad presses don't unlock audio in Chrome; any key/click does.
addEventListener('gamepadconnected', () => initAudio());

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pollPads();
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
