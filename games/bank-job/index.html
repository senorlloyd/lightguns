<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   BANK JOB — light gun ricochet puzzle (OpenFIRE / mouse / keys)
   One bullet per shot. It flies from the gun toward your crosshair and
   bounces off steel. Crack every lock in the vault with a single shot.
   ===================================================================== */
const W = 1280, H = 720, CX = W / 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function resize(){ const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px'; }
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const rand = (a, b) => a + Math.random() * (b - a);
const FONT = '"Arial Black","Arial Bold",Gadget,"Helvetica Neue",Arial,sans-serif';

/* =====================================================================
   PHYSICS — exact ray casting, shared with the level generator.
   Keep this block self-contained (the generator script evals it).
   ===================================================================== */
/*PHYSICS-START*/
const ARENA = { L:40, T:92, R:1240, B:690 };
const SPEED = 1150;      // bullet px/s
const BR = 4;            // bullet radius
const TR = 22;           // lock (target) radius
const PR = 18;           // portal capture radius (ring is drawn bigger)
const MAXD = 16000;      // max bullet travel
const MUZZLE = 34;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function rectSegs(x, y, w, h){ return [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]]; }
function mirrorSeg(m, st){
  const a = m.a[st || 0] * Math.PI / 180, hx = Math.cos(a) * m.len / 2, hy = Math.sin(a) * m.len / 2;
  return [m.x - hx, m.y - hy, m.x + hx, m.y + hy];
}
function buildSegs(lv, ms){
  const S = [], A = ARENA, dead = lv.deadEdges || '';
  const edge = (c, s) => S.push({ s, k: dead.includes(c) ? 'dead' : 'wall', edge:c });
  edge('T', [A.L,A.T,A.R,A.T]); edge('R', [A.R,A.T,A.R,A.B]); edge('B', [A.R,A.B,A.L,A.B]); edge('L', [A.L,A.B,A.L,A.T]);
  for (const w of lv.walls || []) S.push({ s:w, k:'wall' });
  for (const b of lv.boxes || []) for (const s of rectSegs(b[0], b[1], b[2], b[3])) S.push({ s, k:'wall' });
  for (const w of lv.dead || []) S.push({ s:w, k:'dead' });
  for (const b of lv.deadBoxes || []) for (const s of rectSegs(b[0], b[1], b[2], b[3])) S.push({ s, k:'dead' });
  (lv.mirrors || []).forEach((m, i) => S.push({ s: mirrorSeg(m, ms ? ms[i] : 0), k:'mirror', mi:i }));
  return S;
}
function bumperPos(b, t){
  if (!b.move) return [b.x, b.y];
  const f = Math.sin(t * Math.PI * 2 / b.move[2] + (b.move[3] || 0));
  return [b.x + b.move[0] * f, b.y + b.move[1] * f];
}
function raySeg(x, y, dx, dy, s){
  const ex = s[2] - s[0], ey = s[3] - s[1], den = dx * ey - dy * ex;
  if (Math.abs(den) < 1e-9) return Infinity;
  const qx = s[0] - x, qy = s[1] - y, u = (qx * ey - qy * ex) / den, v = (qx * dy - qy * dx) / den;
  return (u > 1e-6 && v >= 0 && v <= 1) ? u : Infinity;
}
function rayCircle(x, y, dx, dy, cx, cy, r){
  const fx = x - cx, fy = y - cy, b = fx * dx + fy * dy, c = fx * fx + fy * fy - r * r, disc = b * b - c;
  if (disc < 0 || c < 0) return Infinity;
  const u = -b - Math.sqrt(disc);
  return u > 1e-6 ? u : Infinity;
}
/* Fires one bullet. Returns the path (pts with absolute times), which locks it hits and when, and how it ended. */
function simulate(lv, ang, t0, ms, firstOnly){
  const segs = buildSegs(lv, ms), maxB = lv.bounces == null ? 10 : lv.bounces;
  let dx = Math.cos(ang), dy = Math.sin(ang), x = lv.gun[0] + dx * MUZZLE, y = lv.gun[1] + dy * MUZZLE, t = t0, dist = 0, bounces = 0;
  const pts = [{ x, y, t }], hits = [], got = new Set(), portals = lv.portals || [], bumpers = lv.bumpers || [], targets = lv.targets || [];
  let skipSeg = -1, skipBump = -1, skipPortal = -1, end = 'range';
  for (let iter = 0; iter < 80; iter++){
    let best = MAXD - dist, kind = 'range', idx = -1;
    for (let i = 0; i < segs.length; i++){ if (i === skipSeg) continue; const u = raySeg(x, y, dx, dy, segs[i].s); if (u < best){ best = u; kind = 'seg'; idx = i; } }
    for (let i = 0; i < portals.length; i++) for (let e = 0; e < 2; e++){
      const id = i * 2 + e; if (id === skipPortal) continue;
      const u = rayCircle(x, y, dx, dy, portals[i][e*2], portals[i][e*2+1], PR); if (u < best){ best = u; kind = 'portal'; idx = id; }
    }
    for (let i = 0; i < bumpers.length; i++){
      if (i === skipBump) continue;
      const b = bumpers[i], R = b.r + BR;
      if (!b.move){ const u = rayCircle(x, y, dx, dy, b.x, b.y, R); if (u < best){ best = u; kind = 'bump'; idx = i; } continue; }
      for (let s = 0.5; s < best; s += 5){                       // moving bumper: march, then refine
        const c = bumperPos(b, t + s / SPEED);
        if (Math.hypot(x + dx*s - c[0], y + dy*s - c[1]) < R){
          let lo = Math.max(0, s - 5), hi = s;
          for (let k = 0; k < 10; k++){ const m = (lo + hi) / 2, cm = bumperPos(b, t + m / SPEED); if (Math.hypot(x + dx*m - cm[0], y + dy*m - cm[1]) < R) hi = m; else lo = m; }
          if (hi < best){ best = hi; kind = 'bump'; idx = i; }
          break;
        }
      }
    }
    if (!firstOnly) for (let i = 0; i < targets.length; i++){
      if (got.has(i)) continue;
      const tg = targets[i], s = (tg[0] - x) * dx + (tg[1] - y) * dy;
      if (s < -TR || s > best + TR) continue;
      const sc = clamp(s, 0, best);
      if (Math.hypot(x + dx*sc - tg[0], y + dy*sc - tg[1]) < TR + BR){ got.add(i); hits.push({ i, t: t + Math.max(0, sc - TR * 0.5) / SPEED }); }
    }
    x += dx * best; y += dy * best; t += best / SPEED; dist += best;
    if (kind === 'range'){ pts.push({ x, y, t, ev:'range' }); end = 'range'; break; }
    if (kind === 'portal'){
      const pi = idx >> 1, e = idx & 1, p = portals[pi];
      pts.push({ x, y, t, ev:'portal', pi });
      if (firstOnly){ end = 'portal'; break; }
      x = p[(1-e)*2]; y = p[(1-e)*2+1]; pts.push({ x, y, t, jump:true, pi });
      skipPortal = pi * 2 + (1 - e); skipSeg = -1; skipBump = -1;
      continue;
    }
    let nx, ny, ev;
    if (kind === 'seg'){
      const S = segs[idx];
      if (S.k === 'dead'){ pts.push({ x, y, t, ev:'dead' }); end = 'dead'; break; }
      const l = Math.hypot(S.s[2] - S.s[0], S.s[3] - S.s[1]); nx = -(S.s[3] - S.s[1]) / l; ny = (S.s[2] - S.s[0]) / l;
      skipSeg = idx; skipBump = -1; ev = S.k === 'mirror' ? 'mirror' : 'wall';
    } else {
      const c = bumperPos(bumpers[idx], t), l = Math.hypot(x - c[0], y - c[1]) || 1;
      nx = (x - c[0]) / l; ny = (y - c[1]) / l; skipBump = idx; skipSeg = -1; ev = 'bump';
    }
    skipPortal = -1;
    if (bounces >= maxB){ pts.push({ x, y, t, ev:'spent' }); end = 'spent'; break; }
    const dot = dx * nx + dy * ny; dx -= 2 * dot * nx; dy -= 2 * dot * ny; bounces++;
    pts.push({ x, y, t, ev, bi: kind === 'bump' ? idx : -1 });
    if (firstOnly){ end = 'bounce'; break; }
  }
  hits.sort((a, b) => a.t - b.t);
  return { pts, hits, end, bounces, ok: hits.length === targets.length && targets.length > 0 };
}
/*PHYSICS-END*/

/* =====================================================================
   LEVELS — written by the level generator (locks are placed along a
   real solution path and every level is checked for a fair aim window).
   sol = the intended solution (angle in degrees + swivel mirror states).
   ===================================================================== */
/*LEVELS-START*/
const LEVELS = [
  {"name":"First Deposit","tip":"Point anywhere. The bullet flies from the gun toward your crosshair. Hit every lock with ONE shot.","gun":[160,560],"targets":[[999,564]],"bounces":3,"sol":{"a":0.26,"ms":[]}},
  {"name":"Bank Shot","tip":"Steel walls bounce the bullet. The dotted line shows where it hits first.","gun":[150,560],"boxes":[[560,330,150,360]],"targets":[[792,390]],"bounces":3,"sol":{"a":309.95,"ms":[]}},
  {"name":"Double Up","tip":"Two locks, one bullet.","gun":[130,390],"boxes":[[520,250,90,280]],"targets":[[806,596],[1086,254]],"bounces":4,"sol":{"a":30.21,"ms":[]}},
  {"name":"Corner Pocket","tip":"Corners are your friend.","gun":[640,620],"boxes":[[300,230,130,130],[850,230,130,130]],"targets":[[1040,310],[1131,228],[1123,140]],"bounces":5,"sol":{"a":338.8,"ms":[]}},
  {"name":"Hall of Mirrors","tip":"Mirrors bounce the bullet too. Use them to get around the wall.","gun":[130,600],"boxes":[[620,92,40,380]],"mirrors":[{"x":420,"y":250,"len":150,"a":[45]},{"x":900,"y":560,"len":150,"a":[-30]}],"targets":[[968,396],[1187,152]],"bounces":4,"sol":{"a":358.99,"ms":[0,0]}},
  {"name":"Red Means Dead","tip":"RED surfaces swallow the bullet. Keep it on the steel.","gun":[110,390],"deadEdges":"TB","boxes":[[600,300,80,180]],"deadBoxes":[[360,520,120,60]],"mirrors":[{"x":380,"y":200,"len":140,"a":[20]},{"x":900,"y":560,"len":140,"a":[-25]}],"targets":[[442,442],[722,529],[1148,241]],"bounces":5,"sol":{"a":4.57,"ms":[0,0]}},
  {"name":"Wormhole","tip":"PORTALS: in one, out the other, still flying the same direction.","gun":[130,600],"boxes":[[620,92,40,598]],"portals":[[330,210,960,560]],"targets":[[478,283],[813,486]],"bounces":3,"sol":{"a":333.34,"ms":[]}},
  {"name":"Pinball Vault","tip":"Bumpers kick the bullet off at an angle.","gun":[120,630],"bumpers":[{"x":470,"y":300,"r":44},{"x":820,"y":470,"r":44},{"x":660,"y":200,"r":30},{"x":1020,"y":260,"r":36}],"targets":[[531,235],[933,480],[1111,237]],"bounces":5,"sol":{"a":301.14,"ms":[]}},
  {"name":"Swivel","tip":"SWIVEL MIRROR: point at it and press A (right-click) to turn it. Then take the shot.","gun":[170,600],"boxes":[[40,420,330,30],[470,420,30,270]],"mirrors":[{"x":600,"y":300,"len":130,"a":[0,45,90,135]}],"targets":[[672,178],[1008,504]],"bounces":4,"sol":{"a":326,"ms":[3]}},
  {"name":"Night Shift","tip":"That bumper is moving. Time your shot.","gun":[120,390],"boxes":[[380,92,40,170],[380,520,40,170]],"bumpers":[{"x":700,"y":390,"r":46,"move":[0,190,3.4]}],"targets":[[1027,482],[870,525]],"bounces":4,"sol":{"a":3.94,"ms":[]}},
  {"name":"Zig Zag","tip":"Watch the bounce counter. The bullet runs out of steam.","gun":[110,630],"boxes":[[300,92,40,400],[600,290,40,400],[900,92,40,400]],"targets":[[433,399],[525,301],[843,149],[438,178]],"bounces":5,"sol":{"a":340.6,"ms":[]}},
  {"name":"Portal Maze","tip":"Two pairs of portals. Match the colors.","gun":[110,620],"deadEdges":"L","deadBoxes":[[480,92,40,320],[820,370,40,320]],"portals":[[260,190,1110,600],[700,600,1100,190]],"targets":[[1158,478],[1191,141],[1098,279]],"bounces":4,"sol":{"a":291.33,"ms":[]}},
  {"name":"Double Swivel","tip":"Two swivel mirrors. Set them both, then shoot.","gun":[640,630],"boxes":[[600,220,80,200]],"mirrors":[{"x":330,"y":300,"len":140,"a":[0,45,90,135]},{"x":950,"y":300,"len":140,"a":[0,45,90,135]}],"targets":[[535,486],[971,490],[1136,144]],"bounces":5,"sol":{"a":227.18,"ms":[3,1]}},
  {"name":"Rush Hour","tip":"Two moving bumpers. Patience pays.","gun":[110,390],"bumpers":[{"x":460,"y":390,"r":42,"move":[0,200,2.9]},{"x":840,"y":390,"r":42,"move":[0,-200,3.6]}],"targets":[[548,550],[712,548],[943,201]],"bounces":5,"sol":{"a":300.11,"ms":[]}},
  {"name":"Long Con","tip":"Everything you have learned, all at once.","gun":[110,600],"deadEdges":"B","boxes":[[560,92,40,250]],"mirrors":[{"x":800,"y":230,"len":140,"a":[60]}],"portals":[[300,200,1060,520]],"bumpers":[{"x":430,"y":470,"r":38}],"targets":[[411,254],[805,373],[663,218],[1007,165],[1054,407]],"bounces":6,"sol":{"a":330,"ms":[0]}},
  {"name":"The Big Score","tip":"The main vault. Good luck.","gun":[640,640],"deadEdges":"T","boxes":[[200,250,60,200],[1020,250,60,200]],"deadBoxes":[[560,92,160,60]],"mirrors":[{"x":420,"y":470,"len":140,"a":[0,45,90,135]},{"x":860,"y":470,"len":140,"a":[0,45,90,135]}],"portals":[[160,160,1120,160]],"bumpers":[{"x":640,"y":300,"r":40}],"targets":[[505,556],[730,555],[939,637],[1131,513],[1131,251]],"bounces":7,"sol":{"a":219.81,"ms":[3,0]}}
];
/*LEVELS-END*/

/* ---------- palette ---------- */
const GOLD = '#ffc93b', STEEL = '#a9bcff', CYAN = '#3bf0ff', RED = '#ff3b5c', PINK = '#ff3df5';
const PCOL = ['#b45cff', '#39ff88', '#ff9a3b'];

/* ---------- progress (saved in the browser) ---------- */
const SAVE_KEY = 'bankjob.v1';
let prog = { stars:[], cleared:[], skipped:[] };
function loadProg(){
  try { const p = JSON.parse(localStorage.getItem(SAVE_KEY)); if (p && Array.isArray(p.stars)) prog = p; } catch (e) {}
  prog.skipped = prog.skipped || [];
  for (let i = 0; i < LEVELS.length; i++){ prog.stars[i] = prog.stars[i] || 0; prog.cleared[i] = !!prog.cleared[i]; prog.skipped[i] = !!prog.skipped[i]; }
}
function saveProg(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(prog)); } catch (e) {} }
const unlocked = i => i === 0 || prog.cleared[i] || prog.cleared[i-1] || prog.skipped[i-1];
const totalStars = () => prog.stars.reduce((a, b) => a + b, 0);
function firstOpen(){ for (let i = 0; i < LEVELS.length; i++) if (!prog.cleared[i] && unlocked(i)) return i; return 0; }
loadProg();

/* ---------- audio (synthesized placeholders) ---------- */
let ac = null, master = null, muted = false;
function unlockAudio(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(dur, f0, f1, vol, type, delay){
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq, delay){
  if (!ac) return;
  if (!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  const t0 = ac.currentTime + (delay || 0), s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq || 1800;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur);
}
const sfx = {
  shot(){ noise(0.28, 0.55, 3200); tone(0.18, 190, 45, 0.4, 'square'); },
  ping(n){ const f = 900 + n * 110; tone(0.13, f, f * 0.72, 0.18, 'triangle'); tone(0.09, f * 2.1, f * 1.5, 0.05, 'sine'); },
  mirror(n){ const f = 1250 + n * 110; tone(0.2, f, f, 0.13, 'sine'); tone(0.2, f * 1.5, f * 1.5, 0.07, 'sine'); },
  bump(){ tone(0.14, 480, 950, 0.22, 'square'); },
  portal(){ tone(0.26, 180, 1700, 0.16, 'sawtooth'); },
  dead(){ noise(0.22, 0.45, 450); tone(0.16, 120, 55, 0.3, 'square'); },
  lock(k){ const m = 1 + k * 0.07; [1318, 1568, 2093].forEach((f, j) => tone(0.12, f*m, f*m, 0.14, 'square', j * 0.05)); },
  fail(){ tone(0.3, 300, 150, 0.2, 'sawtooth'); tone(0.35, 220, 110, 0.18, 'sawtooth', 0.12); },
  clear(){ [523, 659, 784, 1047, 1319].forEach((f, k) => tone(0.22, f, f, 0.2, 'square', k * 0.09)); },
  star(k){ const f = 880 * (1 + k * 0.26); tone(0.3, f, f, 0.2, 'triangle'); tone(0.3, f * 2, f * 2, 0.05, 'sine'); },
  click(){ tone(0.06, 700, 900, 0.15, 'square'); },
  turn(){ tone(0.09, 420, 640, 0.16, 'triangle'); noise(0.06, 0.1, 4000); },
  dry(){ tone(0.05, 180, 140, 0.15, 'square'); }
};

/* ---------- state ---------- */
let state = 'title', stateT = 0, clock = 0;
let li = 0, lv = null, ms = [], msDisp = [], phase = 'aim', phaseT = 0, introT = 0;
let tries = 0, fails = 0, shot = null, ghost = null, hitNow = new Set(), bounceNow = 0, clearStars = 0, starsPlayed = 0;
let parts = [], floats = [], rings = [];
const cur = { x: W/2, y: H/2 };

function startLevel(i){
  li = i; lv = LEVELS[i];
  ms = (lv.mirrors || []).map(() => 0);
  msDisp = (lv.mirrors || []).map(m => m.a[0] * DEG);
  tries = 0; fails = 0; shot = null; ghost = null; hitNow = new Set(); bounceNow = 0;
  state = 'play'; stateT = 0; phase = 'aim'; phaseT = 0; introT = 0; parts = []; floats = []; rings = [];
}
const aimAngle = () => Math.atan2(cur.y - lv.gun[1], cur.x - lv.gun[0]);

function fire(){
  tries++; sfx.shot();
  const a = aimAngle();
  shot = simulate(lv, a, clock, ms); shot.ang = a; shot.ev = 1; shot.hi = 0; shot.winT = 0;
  hitNow = new Set(); bounceNow = 0; phase = 'fly'; phaseT = 0;
  const mx = lv.gun[0] + Math.cos(a) * MUZZLE, my = lv.gun[1] + Math.sin(a) * MUZZLE;
  for (let k = 0; k < 14; k++){ const s = a + rand(-0.5, 0.5), v = rand(150, 600); parts.push({ x:mx, y:my, vx:Math.cos(s)*v, vy:Math.sin(s)*v, r:rand(2, 4), t:0, life:rand(.15, .35), col: k % 2 ? '#fff' : GOLD }); }
  rings.push({ x:mx, y:my, R:46, t:0, life:.18, col:'#fff' });
}
function sparks(x, y, col, n, sp){ for (let k = 0; k < n; k++){ const a = rand(0, TAU), v = rand(80, sp); parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:rand(1.5, 3.5), t:0, life:rand(.2, .5), col }); } }
function floatText(s, x, y, col, size, life){ floats.push({ s, x, y, col, size, t:0, life: life || 1 }); }

function onEvent(p){
  if (p.jump) return;
  if (p.ev === 'wall'){ bounceNow++; sfx.ping(bounceNow); sparks(p.x, p.y, '#fff', 10, 380); }
  else if (p.ev === 'mirror'){ bounceNow++; sfx.mirror(bounceNow); sparks(p.x, p.y, CYAN, 14, 420); rings.push({ x:p.x, y:p.y, R:30, t:0, life:.25, col:CYAN }); }
  else if (p.ev === 'bump'){ bounceNow++; sfx.bump(); sparks(p.x, p.y, PINK, 14, 420); const b = lv.bumpers[p.bi]; if (b) b.flash = 0.3; }
  else if (p.ev === 'portal'){ sfx.portal(); rings.push({ x:p.x, y:p.y, R:50, t:0, life:.35, col:PCOL[p.pi % PCOL.length] }); }
  else if (p.ev === 'dead'){ sfx.dead(); sparks(p.x, p.y, RED, 22, 300); floatText('THUNK', p.x, p.y - 20, RED, 18, .8); }
  else if (p.ev === 'spent'){ sparks(p.x, p.y, '#888', 12, 200); floatText('OUT OF BOUNCES', p.x, p.y - 20, '#ccc', 16, .9); sfx.dry(); }
}
function onHit(i){
  hitNow.add(i); const t = lv.targets[i];
  sfx.lock(hitNow.size);
  rings.push({ x:t[0], y:t[1], R:60, t:0, life:.35, col:GOLD });
  for (let k = 0; k < 18; k++){ const a = rand(0, TAU), v = rand(120, 460); parts.push({ x:t[0], y:t[1], vx:Math.cos(a)*v, vy:Math.sin(a)*v - 150, g:900, r:rand(3, 5), t:0, life:rand(.5, 1), col: k % 3 ? GOLD : '#fff7c2' }); }
  floatText('$', t[0], t[1] - 30, GOLD, 30, .8);
}
function bulletPos(){
  const P = shot.pts;
  for (let k = 0; k < P.length - 1; k++){
    const a = P[k], b = P[k+1];
    if (b.jump) continue;
    if (clock <= b.t){ const f = b.t > a.t ? clamp((clock - a.t) / (b.t - a.t), 0, 1) : 1; return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, k }; }
  }
  const e = P[P.length - 1]; return { x:e.x, y:e.y, k:P.length - 1 };
}
function finishShot(){
  if (hitNow.size === lv.targets.length){
    phase = 'clear'; phaseT = 0; sfx.clear(); starsPlayed = 0;
    clearStars = tries === 1 ? 3 : tries <= 3 ? 2 : 1;
    prog.stars[li] = Math.max(prog.stars[li], clearStars); prog.cleared[li] = true; saveProg();
    for (let k = 0; k < 70; k++) parts.push({ x:rand(80, W - 80), y:rand(-200, -10), vx:rand(-60, 60), vy:rand(60, 220), g:160, r:6, t:0, life:rand(2.2, 3.5), col: k % 4 ? '#3ddc84' : GOLD, bill:true, rot:rand(0, TAU), vr:rand(-6, 6) });
  } else {
    phase = 'fail'; phaseT = 0; fails++; ghost = shot; sfx.fail();
  }
}
function turnMirrorAt(p){
  let best = -1, bd = 1e9;
  (lv.mirrors || []).forEach((m, i) => { if (m.a.length < 2) return; const d = Math.hypot(p.x - m.x, p.y - m.y); if (d < m.len / 2 + 30 && d < bd){ bd = d; best = i; } });
  if (best < 0){ sfx.dry(); return; }
  const m = lv.mirrors[best]; ms[best] = (ms[best] + 1) % m.a.length; sfx.turn();
  rings.push({ x:m.x, y:m.y, R:m.len / 2, t:0, life:.25, col:CYAN });
  if (phase === 'fail'){ phase = 'aim'; hitNow = new Set(); }
}

/* ---------- buttons ---------- */
const inBtn = (b, p) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const B_PLAY = { x:CX - 250, y:480, w:230, h:80 }, B_LEVELS = { x:CX + 20, y:480, w:230, h:80 };
const B_BACK = { x:60, y:610, w:220, h:66 };
const B_MENU = { x:1090, y:18, w:150, h:56 }, B_SKIP = { x:925, y:18, w:150, h:56 };
const B_NEXT = { x:CX - 375, y:490, w:230, h:78 }, B_RETRY = { x:CX - 115, y:490, w:230, h:78 }, B_LV = { x:CX + 145, y:490, w:230, h:78 };
const tile = i => ({ x: 71 + (i % 8) * 144, y: 190 + (i / 8 | 0) * 200, w:130, h:178 });

function act(kind){
  unlockAudio();
  if (kind === 'fire') rings.push({ x:cur.x, y:cur.y, R:34, t:0, life:.18, col:'#ffffff' });
  if (state === 'title'){
    if (kind !== 'fire') return;
    if (inBtn(B_PLAY, cur)){ sfx.click(); startLevel(firstOpen()); }
    else if (inBtn(B_LEVELS, cur)){ sfx.click(); state = 'select'; stateT = 0; }
    return;
  }
  if (state === 'select'){
    if (kind !== 'fire') return;
    if (inBtn(B_BACK, cur)){ sfx.click(); state = 'title'; stateT = 0; return; }
    for (let i = 0; i < LEVELS.length; i++) if (inBtn(tile(i), cur)){ if (unlocked(i)){ sfx.click(); startLevel(i); } else sfx.dry(); return; }
    return;
  }
  if (state === 'finale'){ if (kind === 'fire' && stateT > 1.5){ state = 'title'; stateT = 0; } return; }
  if (state !== 'play') return;
  if (phase === 'clear'){
    if (kind !== 'fire' || phaseT < 1.1) return;
    if (inBtn(B_NEXT, cur)){ sfx.click(); if (li < LEVELS.length - 1) startLevel(li + 1); else { state = 'finale'; stateT = 0; sfx.clear(); } }
    else if (inBtn(B_RETRY, cur)){ sfx.click(); startLevel(li); }
    else if (inBtn(B_LV, cur)){ sfx.click(); state = 'select'; stateT = 0; }
    return;
  }
  if (kind === 'alt'){ if (phase === 'aim' || phase === 'fail') turnMirrorAt(cur); return; }
  if (inBtn(B_MENU, cur)){ sfx.click(); state = 'select'; stateT = 0; return; }
  if (canSkip() && inBtn(B_SKIP, cur)){ sfx.click(); prog.skipped[li] = true; saveProg(); startLevel(li + 1); return; }
  if (phase === 'fly' || introT < 0.45) return;
  if (phase === 'fail' && phaseT < 0.3) return;
  if (Math.hypot(cur.x - lv.gun[0], cur.y - lv.gun[1]) < 40){ sfx.dry(); return; }
  fire();
}
const canSkip = () => fails >= 5 && li < LEVELS.length - 1;

/* ---------- input: mouse ---------- */
function mpos(e){ const r = cv.getBoundingClientRect(); cur.x = (e.clientX - r.left) / r.width * W; cur.y = (e.clientY - r.top) / r.height * H; }
addEventListener('mousemove', mpos);
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousedown', e => { mpos(e); act(e.button === 0 ? 'fire' : 'alt'); });

/* ---------- input: keyboard ---------- */
const keys = {};
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('keydown', e => {
  unlockAudio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  switch (e.code){
    case 'KeyF': if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); break;
    case 'KeyM': muted = !muted; if (master) master.gain.value = muted ? 0 : 0.6; break;
    case 'Escape': if (state === 'play'){ state = 'select'; stateT = 0; } else if (state !== 'title'){ state = 'title'; stateT = 0; } break;
    case 'Enter': case 'NumpadEnter': case 'Space': act('fire'); break;
    case 'ShiftLeft': case 'ShiftRight': act('alt'); break;
    case 'KeyI': for (const k in padInfo) padInfo[k].invY = !padInfo[k].invY; break;
  }
});

/* ---------- input: gamepads (OpenFIRE gun in gamepad mode) ----------
   The first button a gun presses is its trigger; any other button is "A" (turn a swivel mirror). */
const padPrev = {}, padInfo = {};
function pollPads(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads){
    if (!gp) continue;
    const s = padInfo[gp.index] || (padInfo[gp.index] = { trig:-1, stick:'auto', pick:0, mov:[0,0], la:[], invY:false, last:[] });
    const a = gp.axes;
    if (a.length >= 4){
      const d0 = Math.abs(a[0] - (s.la[0] ?? a[0])) + Math.abs(a[1] - (s.la[1] ?? a[1]));
      const d1 = Math.abs(a[2] - (s.la[2] ?? a[2])) + Math.abs(a[3] - (s.la[3] ?? a[3]));
      s.mov[0] = s.mov[0]*0.97 + d0; s.mov[1] = s.mov[1]*0.97 + d1;
      s.la = [a[0], a[1], a[2], a[3]];
      if (s.mov[1] > s.mov[0]*1.5 + 0.02) s.pick = 1; else if (s.mov[0] > s.mov[1]*1.5 + 0.02) s.pick = 0;
    } else s.pick = 0;
    if (a.length >= 2){
      const ax = a[s.pick*2] || 0, ay = (a[s.pick*2+1] || 0) * (s.invY ? -1 : 1);
      if (Math.abs(ax - (s.last[0] ?? ax)) + Math.abs(ay - (s.last[1] ?? ay)) > 0.0015){ cur.x = (ax + 1) / 2 * W; cur.y = (ay + 1) / 2 * H; }
      s.last = [ax, ay];
    }
    const prev = padPrev[gp.index] || [], now = gp.buttons.map(b => b.pressed || b.value > 0.5);
    for (let b = 0; b < now.length; b++) if (now[b] && !prev[b]){
      if (s.trig < 0) s.trig = b;
      act(b === s.trig ? 'fire' : 'alt');
    }
    padPrev[gp.index] = now;
  }
}

/* ---------- update ---------- */
function update(dt){
  clock += dt; stateT += dt; phaseT += dt; introT += dt;
  pollPads();
  if (keys.ArrowLeft) cur.x -= 650*dt; if (keys.ArrowRight) cur.x += 650*dt; if (keys.ArrowUp) cur.y -= 650*dt; if (keys.ArrowDown) cur.y += 650*dt;
  cur.x = clamp(cur.x, 0, W); cur.y = clamp(cur.y, 0, H);
  if (state === 'play'){
    (lv.mirrors || []).forEach((m, i) => {          // swivel animation (mirrors are 2-sided, so the shortest turn is mod 180°)
      let d = (m.a[ms[i]] * DEG - msDisp[i]) % Math.PI; if (d > Math.PI/2) d -= Math.PI; if (d < -Math.PI/2) d += Math.PI;
      msDisp[i] += d * Math.min(1, dt * 14);
    });
    for (const b of lv.bumpers || []) b.flash = Math.max(0, (b.flash || 0) - dt);
    if (phase === 'fly'){
      while (shot.ev < shot.pts.length && shot.pts[shot.ev].t <= clock) onEvent(shot.pts[shot.ev++]);
      while (shot.hi < shot.hits.length && shot.hits[shot.hi].t <= clock) onHit(shot.hits[shot.hi++].i);
      const endT = shot.pts[shot.pts.length - 1].t;
      if (hitNow.size === lv.targets.length && !shot.winT){ shot.winT = clock; floatText('VAULT CRACKED!', CX, 300, GOLD, 64, 1.2); }
      if ((shot.winT && clock > shot.winT + 0.8) || clock >= endT + 0.2) finishShot();
    } else if (phase === 'fail' && phaseT > 1.4){ phase = 'aim'; hitNow = new Set(); }
  }
  for (let k = parts.length - 1; k >= 0; k--){
    const q = parts[k]; q.t += dt; q.x += q.vx*dt; q.y += q.vy*dt; if (q.g) q.vy += q.g*dt; else { q.vx *= 0.94; q.vy *= 0.94; }
    if (q.vr) q.rot += q.vr*dt; if (q.t > q.life) parts.splice(k, 1);
  }
  if (parts.length > 600) parts.splice(0, parts.length - 600);
  for (let k = rings.length - 1; k >= 0; k--){ rings[k].t += dt; if (rings[k].t > rings[k].life) rings.splice(k, 1); }
  for (let k = floats.length - 1; k >= 0; k--){ floats[k].t += dt; floats[k].y -= 30*dt; if (floats[k].t > floats[k].life) floats.splice(k, 1); }
}

/* ---------- drawing helpers ---------- */
function txt(s, x, y, size, col, align, glow){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  if (glow){ const ga = ctx.globalAlpha; ctx.globalAlpha = ga * 0.35; ctx.fillStyle = glow; for (const o of [[-2,0],[2,0],[0,-2],[0,2]]) ctx.fillText(s, x + o[0], y + o[1]); ctx.globalAlpha = ga; }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function neon(col, w, path){            // layered strokes instead of shadowBlur (Pi friendly)
  const ga = ctx.globalAlpha;
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = ga * 0.16; ctx.lineWidth = w * 4; ctx.beginPath(); path(); ctx.stroke();
  ctx.globalAlpha = ga * 0.4; ctx.lineWidth = w * 2; ctx.beginPath(); path(); ctx.stroke();
  ctx.globalAlpha = ga; ctx.lineWidth = w; ctx.beginPath(); path(); ctx.stroke();
}
function button(b, label, sub, col, on){
  ctx.fillStyle = on ? col : '#0b0e1c'; ctx.globalAlpha = on ? 0.25 : 0.88; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.globalAlpha = 1;
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y, b.w, b.h);
  if (sub){ txt(label, b.x + b.w/2, b.y + b.h*0.3, 12, '#8d96c8', 'center'); txt(sub, b.x + b.w/2, b.y + b.h*0.66, 20, '#fff', 'center'); }
  else txt(label, b.x + b.w/2, b.y + b.h/2 + 1, b.h > 60 ? 26 : 18, '#fff', 'center', col);
}
function star(x, y, r, fill, line){
  ctx.beginPath();
  for (let k = 0; k < 10; k++){ const a = -Math.PI/2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); }
  ctx.closePath(); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (line){ ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.stroke(); }
}
function hatch(x, y, w, h, col){
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.lineWidth = 3; ctx.beginPath();
  for (let k = -h; k < w; k += 16){ ctx.moveTo(x + k, y + h); ctx.lineTo(x + k + h, y); }
  ctx.stroke(); ctx.restore();
}

/* ---------- drawing the vault ---------- */
function drawBackdrop(){
  ctx.fillStyle = '#04060a'; ctx.fillRect(0, 0, W, H);
  const A = ARENA;
  ctx.fillStyle = '#070b14'; ctx.fillRect(A.L, A.T, A.R - A.L, A.B - A.T);
  ctx.strokeStyle = '#0e1528'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = A.L; x <= A.R; x += 50){ ctx.moveTo(x, A.T); ctx.lineTo(x, A.B); }
  for (let y = A.T; y <= A.B; y += 50){ ctx.moveTo(A.L, y); ctx.lineTo(A.R, y); }
  ctx.stroke();
  // vault-door rings (decor)
  ctx.strokeStyle = '#0f182e'; ctx.lineWidth = 10;
  for (const r of [120, 200, 280]){ ctx.beginPath(); ctx.arc(CX, (A.T + A.B) / 2, r, 0, TAU); ctx.stroke(); }
  ctx.lineWidth = 6; ctx.beginPath();
  for (let k = 0; k < 8; k++){ const a = k * TAU / 8 + clock * 0.03; ctx.moveTo(CX + Math.cos(a)*130, (A.T + A.B)/2 + Math.sin(a)*130); ctx.lineTo(CX + Math.cos(a)*270, (A.T + A.B)/2 + Math.sin(a)*270); }
  ctx.stroke();
}
function drawEdges(dead){
  const A = ARENA, E = { T:[A.L,A.T,A.R,A.T], R:[A.R,A.T,A.R,A.B], B:[A.R,A.B,A.L,A.B], L:[A.L,A.B,A.L,A.T] };
  for (const c of 'TRBL'){
    const s = E[c], isDead = (dead || '').includes(c);
    neon(isDead ? RED : STEEL, isDead ? 5 : 3, () => { ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); });
    if (isDead){ ctx.strokeStyle = '#2a0710'; ctx.lineWidth = 5; ctx.setLineDash([12, 12]); ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke(); ctx.setLineDash([]); }
  }
}
function drawLevel(){
  drawEdges(lv.deadEdges);
  for (const b of lv.boxes || []){ ctx.fillStyle = '#0d1528'; ctx.fillRect(b[0], b[1], b[2], b[3]); neon(STEEL, 2.5, () => ctx.rect(b[0], b[1], b[2], b[3])); }
  for (const w of lv.walls || []) neon(STEEL, 4, () => { ctx.moveTo(w[0], w[1]); ctx.lineTo(w[2], w[3]); });
  for (const b of lv.deadBoxes || []){ ctx.fillStyle = '#1e070d'; ctx.fillRect(b[0], b[1], b[2], b[3]); hatch(b[0], b[1], b[2], b[3], RED); neon(RED, 2.5, () => ctx.rect(b[0], b[1], b[2], b[3])); }
  for (const w of lv.dead || []) neon(RED, 5, () => { ctx.moveTo(w[0], w[1]); ctx.lineTo(w[2], w[3]); });
  (lv.portals || []).forEach((p, i) => { for (let e = 0; e < 2; e++) drawPortal(p[e*2], p[e*2+1], PCOL[i % PCOL.length], e); });
  for (const b of lv.bumpers || []){
    const [x, y] = bumperPos(b, clock);
    if (b.move){ ctx.strokeStyle = '#3a1640'; ctx.lineWidth = 3; ctx.setLineDash([8, 10]); ctx.beginPath(); ctx.moveTo(b.x - b.move[0], b.y - b.move[1]); ctx.lineTo(b.x + b.move[0], b.y + b.move[1]); ctx.stroke(); ctx.setLineDash([]); }
    ctx.globalAlpha = 0.22 + (b.flash || 0) * 2; ctx.fillStyle = PINK; ctx.beginPath(); ctx.arc(x, y, b.r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    neon((b.flash || 0) > 0 ? '#fff' : PINK, 3, () => ctx.arc(x, y, b.r + (b.flash || 0) * 25, 0, TAU));
    ctx.strokeStyle = PINK; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, b.r * 0.5, 0, TAU); ctx.stroke();
  }
  (lv.mirrors || []).forEach((m, i) => {
    const a = msDisp[i], hx = Math.cos(a) * m.len / 2, hy = Math.sin(a) * m.len / 2, swivel = m.a.length > 1;
    if (swivel){
      ctx.strokeStyle = '#13324a'; ctx.lineWidth = 2; ctx.setLineDash([4, 8]); ctx.beginPath(); ctx.arc(m.x, m.y, m.len / 2, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    neon(CYAN, 5, () => { ctx.moveTo(m.x - hx, m.y - hy); ctx.lineTo(m.x + hx, m.y + hy); });
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(m.x - hx, m.y - hy); ctx.lineTo(m.x + hx, m.y + hy); ctx.stroke();
    if (swivel){
      ctx.fillStyle = '#0b0e1c'; ctx.beginPath(); ctx.arc(m.x, m.y, 10, 0, TAU); ctx.fill(); ctx.strokeStyle = CYAN; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = CYAN; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(m.x, m.y, 18, -0.6, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(m.x + Math.cos(0.9)*18 - 5, m.y + Math.sin(0.9)*18 - 2); ctx.lineTo(m.x + Math.cos(0.9)*18, m.y + Math.sin(0.9)*18); ctx.lineTo(m.x + Math.cos(0.9)*18 + 2, m.y + Math.sin(0.9)*18 - 6); ctx.stroke();
    }

}
function drawPortal(x, y, col, e){
  ctx.globalAlpha = 0.18; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 30, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  ctx.lineCap = 'round';
  for (let k = 0; k < 3; k++){

    ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 28, a, a + 1.3); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 17, -a, -a + 1.1); ctx.stroke();
  }

function drawLock(x, y, open){
  if (open){

  }
  const pulse = 1 + Math.sin(clock * 4 + x) * 0.05;
  ctx.globalAlpha = 0.2; ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(x, y, TR * pulse + 8, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#1a1406'; ctx.beginPath(); ctx.arc(x, y, TR, 0, TAU); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.stroke();
  ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, TR - 6, 0, TAU); ctx.stroke();
  ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(x, y - 4, 5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 3, y - 2); ctx.lineTo(x + 3, y - 2); ctx.lineTo(x + 5, y + 9); ctx.lineTo(x - 5, y + 9); ctx.closePath(); ctx.fill();
}
function drawGun(a){
  const [gx, gy] = lv.gun;
  ctx.globalAlpha = 0.2; ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(gx, gy, 34, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(gx, gy); ctx.rotate(a);
  ctx.fillStyle = '#c9a23a'; ctx.fillRect(6, -6, MUZZLE - 4, 12); ctx.fillStyle = '#fff3c4'; ctx.fillRect(MUZZLE - 6, -6, 4, 12);
  ctx.restore();
  ctx.fillStyle = '#141a2c'; ctx.beginPath(); ctx.arc(gx, gy, 20, 0, TAU); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.stroke();

}
function drawPath(P, upTo, col, alpha, width){

  ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y);

  for (let k = 1; k <= n; k++){ if (P[k].jump) ctx.moveTo(P[k].x, P[k].y); else ctx.lineTo(P[k].x, P[k].y); }
  if (upTo) ctx.lineTo(upTo.x, upTo.y);
  ctx.stroke(); ctx.globalAlpha = 1;
}
function drawAim(){
  const a = aimAngle();
  if (Math.hypot(cur.x - lv.gun[0], cur.y - lv.gun[1]) < 40) return;
  const pre = simulate(lv, a, clock, ms, true), p0 = pre.pts[0], p1 = pre.pts[1];

function drawHint(){
  if (fails < 3 || !lv.sol || phase === 'fly' || phase === 'clear') return;

  const wedge = () => { ctx.beginPath(); ctx.moveTo(gx, gy); ctx.arc(gx, gy, R, a - half, a + half); ctx.closePath(); };

    if (m.a.length < 2 || lv.sol.ms[i] === ms[i]) return;
    ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 + Math.sin(clock * 6) * 0.4; ctx.beginPath(); ctx.arc(m.x, m.y, m.len / 2 + 10, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;

function drawFx(){
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings){ const f = r.t / r.life; ctx.globalAlpha = 1 - f; ctx.strokeStyle = r.col; ctx.lineWidth = 6 * (1 - f) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.R * (0.2 + 0.8 * Math.sqrt(f)), 0, TAU); ctx.stroke(); }
  for (const q of parts){
    if (q.bill) continue;
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.col; ctx.fillRect(q.x - q.r, q.y - q.r, q.r * 2, q.r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const q of parts){
    if (!q.bill) continue;
    ctx.globalAlpha = clamp((q.life - q.t) * 2, 0, 1); ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.scale(1, Math.cos(q.rot * 2));
    ctx.fillStyle = q.col; ctx.fillRect(-14, -7, 28, 14); ctx.fillStyle = '#0b3d22'; ctx.fillRect(-5, -4, 10, 8); ctx.restore();
  }
  ctx.globalAlpha = 1;
  for (const f of floats){ ctx.globalAlpha = clamp((1 - f.t / f.life) * 2, 0, 1); txt(f.s, f.x, f.y, f.size, '#fff', 'center', f.col); }
  ctx.globalAlpha = 1;
}
function drawBullet(){
  const b = bulletPos();
  drawPath(shot.pts, b, GOLD, 0.55, 3);
  const P = shot.pts, done = clock >= P[P.length - 1].t;
  if (done) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.3; ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(b.x, b.y, 16, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, BR + 2, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}
function drawHud(){
  ctx.fillStyle = '#04060a'; ctx.fillRect(0, 0, W, ARENA.T - 6);
  txt('LEVEL ' + (li + 1), 44, 32, 26, GOLD, 'left');
  txt(lv.name.toUpperCase(), 44, 64, 15, '#c8d4ff', 'left');
  // locks
  txt('LOCKS', 330, 26, 12, '#8d96c8', 'left');
  lv.targets.forEach((t, i) => { const x = 342 + i * 34, y = 58; ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); if (hitNow.has(i)){ ctx.fillStyle = GOLD; ctx.fill(); } ctx.stroke(); });
  // bounces
  const left = lv.bounces - (phase === 'fly' || phase === 'fail' ? bounceNow : 0);
  txt('BOUNCES', 560, 26, 12, '#8d96c8', 'left');
  for (let k = 0; k < lv.bounces; k++){ ctx.fillStyle = k < left ? '#fff' : '#283050'; ctx.fillRect(562 + k * 18, 48, 12, 20); }
  txt('SHOT', 790, 26, 12, '#8d96c8', 'left');
  txt(String(Math.max(1, tries + (phase === 'aim' || phase === 'fail' ? 1 : 0))), 790, 58, 26, '#fff', 'left');
  if (canSkip()) button(B_SKIP, 'SKIP ▶', null, '#8d96c8');
  button(B_MENU, 'LEVELS', null, STEEL);
  if (lv.tip) txt(lv.tip, CX, 706, 14, '#8d96c8', 'center');
}
function drawIntro(){
  if (introT > 2) return;
  const f = introT < 1.3 ? 1 : 1 - (introT - 1.3) / 0.7;
  ctx.globalAlpha = f * 0.6; ctx.fillStyle = '#04060a'; ctx.fillRect(0, 300, W, 150);
  ctx.globalAlpha = f; txt('LEVEL ' + (li + 1), CX, 342, 26, GOLD, 'center'); txt(lv.name.toUpperCase(), CX, 392, 52, '#fff', 'center', GOLD);
  ctx.globalAlpha = 1;
}
function drawFail(){
  if (phase !== 'fail') return;
  const n = hitNow.size, tot = lv.targets.length;
  ctx.globalAlpha = clamp(1.4 - phaseT, 0, 1);
  txt(n + ' / ' + tot + ' LOCKS', CX, 140, 34, '#fff', 'center', RED);
  txt('TRY AGAIN', CX, 176, 16, '#c8d4ff', 'center');
  ctx.globalAlpha = 1;
}
function drawClear(){
  const f = clamp(phaseT * 3, 0, 1);
  ctx.globalAlpha = f * 0.75; ctx.fillStyle = '#04060a'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = f;
  txt('VAULT CRACKED!', CX, 200, 72, '#fff', 'center', GOLD);
  for (let k = 0; k < 3; k++){
    const appear = phaseT - 0.35 - k * 0.25;
    if (appear > 0 && k < clearStars && starsPlayed <= k){ starsPlayed = k + 1; sfx.star(k); }
    const sc = appear > 0 ? Math.min(1, appear * 6) * (1 + Math.max(0, 0.3 - appear)) : 0.001;
    star(CX - 110 + k * 110, 330, 44 * (k < clearStars ? sc : 1), k < clearStars && appear > 0 ? GOLD : '#1a2038', k < clearStars ? '#fff3c4' : '#39406a');
  }
  txt('CLEARED IN ' + tries + (tries === 1 ? ' SHOT' : ' SHOTS'), CX, 410, 20, '#c8d4ff', 'center');
  if (phaseT > 1.1){
    button(B_NEXT, li < LEVELS.length - 1 ? 'NEXT ▶' : 'FINISH', null, GOLD, (clock * 3 | 0) % 2 === 0);
    button(B_RETRY, 'RETRY', null, STEEL);
    button(B_LV, 'LEVELS', null, STEEL);
  }
  ctx.globalAlpha = 1;
}

/* ---------- title / select / finale ---------- */
const demo = { x:300, y:400, dx:Math.cos(-0.6), dy:Math.sin(-0.6), trail:[] };
function demoStep(dt){
  const A = ARENA; let s = 900 * dt;
  demo.x += demo.dx * s; demo.y += demo.dy * s;
  if (demo.x < A.L + 4 || demo.x > A.R - 4){ demo.dx *= -1; demo.x = clamp(demo.x, A.L + 4, A.R - 4); demo.trail.push(demo.x, demo.y); }
  if (demo.y < A.T + 4 || demo.y > A.B - 4){ demo.dy *= -1; demo.y = clamp(demo.y, A.T + 4, A.B - 4); demo.trail.push(demo.x, demo.y); }
  if (demo.trail.length > 16) demo.trail.splice(0, 2);
}
function drawDemoBullet(){
  ctx.globalAlpha = 0.3; ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.beginPath();
  for (let k = 0; k < demo.trail.length; k += 2) (k ? ctx.lineTo : ctx.moveTo).call(ctx, demo.trail[k], demo.trail[k+1]);
  ctx.lineTo(demo.x, demo.y); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(demo.x, demo.y, 5, 0, TAU); ctx.fill();
}
function drawTitle(){
  drawBackdrop(); drawEdges(''); drawDemoBullet();
  ctx.fillStyle = 'rgba(4,6,10,0.6)'; ctx.fillRect(0, 0, W, H);
  const wob = Math.sin(clock * 2) * 3;
  txt('BANK', CX - 16, 180 + wob, 130, '#fff', 'right', GOLD);
  txt('JOB', CX + 16, 180 - wob, 130, GOLD, 'left', '#fff');
  txt('ONE BULLET.  EVERY LOCK.', CX, 280, 30, '#fff', 'center');
  txt('Bank it off steel, mirrors, bumpers and portals to crack every lock in the vault with a single shot.', CX, 330, 16, '#c8d4ff', 'center');
  txt('★ ' + totalStars() + ' / ' + LEVELS.length * 3, CX, 420, 26, GOLD, 'center');
  button(B_PLAY, prog.cleared.some(Boolean) ? 'CONTINUE' : 'PLAY', null, GOLD, (clock * 2 | 0) % 2 === 0);
  button(B_LEVELS, 'LEVELS', null, STEEL);
  txt('Gun: trigger = shoot · A = turn a swivel mirror · A+B and shoot off-screen = arcade menu', CX, 650, 14, '#8d96c8', 'center');
  txt('Mouse: click / right-click  ·  Keys: arrows + Enter, Shift = turn mirror, Esc = back, F = fullscreen, M = mute', CX, 676, 12, '#5a6290', 'center');
}
function drawSelect(){
  drawBackdrop(); ctx.fillStyle = 'rgba(4,6,10,0.7)'; ctx.fillRect(0, 0, W, H);
  txt('PICK A VAULT', CX, 90, 52, '#fff', 'center', GOLD);
  txt('★ ' + totalStars() + ' / ' + LEVELS.length * 3, CX, 140, 20, GOLD, 'center');
  for (let i = 0; i < LEVELS.length; i++){
    const b = tile(i), open = unlocked(i), hov = inBtn(b, cur);
    ctx.fillStyle = hov && open ? '#16203a' : '#0b0f1c'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = !open ? '#283050' : prog.cleared[i] ? GOLD : STEEL; ctx.lineWidth = hov && open ? 4 : 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
    if (!open){ txt(String(i + 1), b.x + b.w/2, b.y + 60, 40, '#283050', 'center'); txt('LOCKED', b.x + b.w/2, b.y + 130, 13, '#39406a', 'center'); continue; }
    txt(String(i + 1), b.x + b.w/2, b.y + 56, 46, '#fff', 'center', prog.cleared[i] ? GOLD : STEEL);
    const words = LEVELS[i].name.toUpperCase().split(' '), l1 = [], l2 = [];
    for (const w of words) ((l1.join(' ') + ' ' + w).length <= 11 && !l2.length ? l1 : l2).push(w);
    txt(l1.join(' '), b.x + b.w/2, b.y + 104, 12, '#c8d4ff', 'center'); if (l2.length) txt(l2.join(' '), b.x + b.w/2, b.y + 120, 12, '#c8d4ff', 'center');
    for (let k = 0; k < 3; k++) star(b.x + b.w/2 - 30 + k * 30, b.y + 152, 11, k < prog.stars[i] ? GOLD : '#1a2038', k < prog.stars[i] ? null : '#39406a');
    if (prog.skipped[i] && !prog.cleared[i]) txt('SKIPPED', b.x + b.w/2, b.y + 22, 11, '#8d96c8', 'center');
  }
  button(B_BACK, '◀ BACK', null, STEEL);
}
function drawFinale(){
  drawBackdrop(); ctx.fillStyle = 'rgba(4,6,10,0.6)'; ctx.fillRect(0, 0, W, H);
  txt('THE BIG SCORE', CX, 230, 90, '#fff', 'center', GOLD);
  txt('Every vault cracked. Not a lock left standing.', CX, 320, 22, '#c8d4ff', 'center');
  txt('★ ' + totalStars() + ' / ' + LEVELS.length * 3, CX, 400, 40, GOLD, 'center');
  if (totalStars() < LEVELS.length * 3) txt('Go back for three stars on every vault: crack it on the first shot.', CX, 450, 16, '#8d96c8', 'center');
  if (stateT > 1.5) txt('SHOOT TO RETURN', CX, 560, 24, '#fff', 'center');
  if (Math.random() < 0.3) parts.push({ x:rand(80, W - 80), y:-20, vx:rand(-40, 40), vy:rand(80, 200), g:120, r:6, t:0, life:5, col: Math.random() < 0.75 ? '#3ddc84' : GOLD, bill:true, rot:rand(0, TAU), vr:rand(-6, 6) });
}
function drawCross(){
  const x = cur.x, y = cur.y;
  const cross = () => { ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.moveTo(x - 28, y); ctx.lineTo(x - 7, y); ctx.moveTo(x + 7, y); ctx.lineTo(x + 28, y); ctx.moveTo(x, y - 28); ctx.lineTo(x, y - 7); ctx.moveTo(x, y + 7); ctx.lineTo(x, y + 28); ctx.stroke(); };
  ctx.strokeStyle = '#000'; ctx.lineWidth = 6; cross(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; cross();
  ctx.fillStyle = GOLD; ctx.fillRect(x - 2, y - 2, 4, 4);
  if (state === 'play' && (phase === 'aim' || phase === 'fail')){
    const m = (lv.mirrors || []).find(m => m.a.length > 1 && Math.hypot(x - m.x, y - m.y) < m.len / 2 + 30);
    if (m) txt('A: TURN', x + 24, y + 30, 13, CYAN, 'left');
  }
}

function draw(){
  if (state === 'title') drawTitle();
  else if (state === 'select') drawSelect();
  else if (state === 'finale') drawFinale();
  else {
    drawBackdrop(); drawLevel(); drawHint();
    if (ghost && phase !== 'fly' && phase !== 'clear') drawPath(ghost.pts, null, '#ffffff', 0.13, 2);
    if (phase === 'aim' || phase === 'fail') drawAim();
    drawGun(phase === 'fly' || phase === 'clear' ? shot.ang : aimAngle());
    if (shot && (phase === 'fly' || phase === 'clear' || phase === 'fail' && phaseT < 0.6)) drawBullet();
    drawHud(); drawFail(); drawIntro();
  }
  drawFx();
  if (state === 'play' && phase === 'clear') drawClear();
  drawCross();
}

/* ---------- main loop ---------- */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(dt); if (state === 'title') demoStep(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
