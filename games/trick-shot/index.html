<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============================================================
   TRICK SHOT — The Midnight Sharpshooter Show
   A light gun game of 20-second trick shots, scored on style.
   Trigger = left click (OpenFIRE / any mouse-mode gun)
   Right click or R = instant retry · Esc = menu
   F fullscreen · M music · C crosshair · G effects quality
   ============================================================ */
const W=1920,H=1080,FLOOR=930,G=1400,INTRO=2.6;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1,OX=0,OY=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  S=Math.min(cv.width/W,cv.height/H);OX=(cv.width-W*S)/2;OY=(cv.height-H*S)/2;
}
addEventListener('resize',resize);resize();

const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[(Math.random()*a.length)|0];
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);
  const cx=ax+dx*t,cy=ay+dy*t;return{d:Math.hypot(px-cx,py-cy),t,cx,cy};
}

/* ---------------- save data ---------------- */
let SAVE={best:{},grade:{},show:0,glow:true,xhair:true,music:true};
try{const s=JSON.parse(localStorage.getItem('trickshot_v2'));if(s)Object.assign(SAVE,s);}catch(e){}
function persist(){try{localStorage.setItem('trickshot_v2',JSON.stringify(SAVE));}catch(e){}}

/* ---------------- audio: everything is synthesized ---------------- */
let AC=null,OUT,SFXB,MUSB,REV,NOISE,APPL;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const sr=AC.sampleRate,comp=AC.createDynamicsCompressor();
    comp.threshold.value=-16;comp.ratio.value=5;comp.attack.value=0.003;comp.release.value=0.2;comp.connect(AC.destination);
    OUT=AC.createGain();OUT.gain.value=0.9;OUT.connect(comp);
    SFXB=AC.createGain();SFXB.gain.value=0.8;SFXB.connect(OUT);
    MUSB=AC.createGain();MUSB.gain.value=SAVE.music?0.5:0;MUSB.connect(OUT);
    NOISE=AC.createBuffer(1,sr*2,sr);const nd=NOISE.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const len=(sr*1.9)|0,ir=AC.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
    REV=AC.createConvolver();REV.buffer=ir;const rg=AC.createGain();rg.gain.value=0.3;REV.connect(rg);rg.connect(OUT);
    APPL=makeApplause();
    MUS.next=AC.currentTime+0.15;
  }catch(e){AC=null;}
}
function makeApplause(){
  const sr=AC.sampleRate,len=(sr*3)|0,b=AC.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let k=0;k<380;k++){
      const st=(Math.random()*(len-2000))|0,w=TAU*rnd(900,2700)/sr,r=0.93,a1=2*r*Math.cos(w),a2=-r*r,amp=rnd(0.2,0.6);
      let y1=0,y2=0;
      for(let i=0;i<1500;i++){const x=i<50?Math.random()*2-1:0,y=x+a1*y1+a2*y2;y2=y1;y1=y;d[st+i]+=y*amp;}
    }
    let mx=0;for(let i=0;i<len;i++)mx=Math.max(mx,Math.abs(d[i]));for(let i=0;i<len;i++)d[i]*=0.8/mx;
  }
  return b;
}
function route(node,bus,rev){node.connect(bus||SFXB);if(rev){const s=AC.createGain();s.gain.value=rev;node.connect(s);s.connect(REV);}}
function envl(g,t,a,vol,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);}
function nz(o){
  if(!AC)return;const t=AC.currentTime+(o.d||0),s=AC.createBufferSource();s.buffer=NOISE;s.loop=true;
  const f=AC.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.setValueAtTime(o.f,t);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);f.Q.value=o.q||0.7;
  const g=AC.createGain();envl(g,t,o.a||0.004,o.vol,o.dur);
  s.connect(f);f.connect(g);route(g,o.bus,o.rev);s.start(t,Math.random()*1.5);s.stop(t+(o.a||0.004)+o.dur+0.05);
}
function osc(o){
  if(!AC)return;const t=AC.currentTime+(o.d||0),s=AC.createOscillator(),g=AC.createGain();
  s.type=o.type||'sine';s.frequency.setValueAtTime(o.f,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=o.vibd||30;l.connect(lg);lg.connect(s.frequency);l.start(t);l.stop(t+o.dur+0.1);}
  envl(g,t,o.a||0.005,o.vol,o.dur);
  if(o.lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.lp,t);if(o.lp2)f.frequency.exponentialRampToValueAtTime(o.lp2,t+o.dur);f.Q.value=o.q||1;s.connect(f);f.connect(g);}
  else s.connect(g);
  route(g,o.bus,o.rev);s.start(t);s.stop(t+(o.a||0.005)+o.dur+0.05);
}
function applause(dur,vol,d=0){
  if(!AC)return;const t=AC.currentTime+d,s=AC.createBufferSource();s.buffer=APPL;s.loop=true;s.playbackRate.value=rnd(0.9,1.1);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.25);
  g.gain.setValueAtTime(vol,t+dur*0.5);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(g);route(g,SFXB,0.3);s.start(t,Math.random()*2);s.stop(t+dur+0.1);
}
const sfx={
  shot(){const p=rnd(0.92,1.08);
    nz({type:'highpass',f:2600,dur:0.05,vol:0.55});
    nz({f:2400*p,f2:220,dur:0.3,vol:0.9,rev:0.5});

/* ---------------- music: a little spaghetti-western synth loop ---------------- */
const BPM=132,STEP=60/BPM/4;
const MUS={next:0,step:0};
const CHORD=[0,0,3,5,0,0,-4,-5];            // Em Em G A | Em Em C B  (semitones from E)
const LEAD={0:[0,6],6:[3,2],8:[5,4],12:[7,4],16:[10,6],22:[7,2],24:[5,2],26:[3,2],28:[0,4],
  32:[3,4],36:[7,4],40:[10,6],46:[7,2],48:[5,4],52:[9,4],56:[12,8],
  64:[12,3],67:[10,3],70:[7,2],72:[5,4],76:[3,4],80:[0,6],86:[3,2],88:[7,8],
  96:[8,4],100:[7,2],102:[3,2],104:[0,4],108:[3,4],112:[2,4],116:[5,4],120:[7,4],124:[11,4]};
const nf=(base,n)=>base*Math.pow(2,n/12);
function mKick(t,v){osc({d:t,f:125,f2:42,dur:0.16,vol:0.7*v,bus:MUSB});}
function mSnare(t,v){nz({d:t,type:'bandpass',f:1900,q:0.8,dur:0.11,vol:0.3*v,bus:MUSB,rev:0.25});osc({d:t,type:'triangle',f:210,f2:150,dur:0.07,vol:0.15*v,bus:MUSB});}
function mHat(t,v){nz({d:t,type:'highpass',f:7500,dur:0.03,vol:0.1*v,bus:MUSB});}
function mBass(t,n,v){const f=nf(82.41,n);osc({d:t,type:'sawtooth',f,dur:0.16,vol:0.26*v,lp:520,lp2:160,q:3,bus:MUSB});osc({d:t,type:'triangle',f,dur:0.18,vol:0.3*v,bus:MUSB});}
function mLead(t,n,len,v){const f=nf(329.63,n),dur=len*STEP+0.3;
  osc({d:t,type:'sawtooth',f,dur,vol:0.085*v,lp:3400,lp2:650,q:5,vib:5.6,vibd:f*0.006,bus:MUSB,rev:0.8});
  osc({d:t,type:'sawtooth',f:f*1.005,dur,vol:0.05*v,lp:2400,lp2:500,q:3,bus:MUSB,rev:0.5});}
function musicStep(s,at,full){
  const t=at-AC.currentTime,bar=(s>>4)&7,q=s&15,root=CHORD[bar];
  if(full){
    if(q===0||q===8||(q===10&&bar%2===1))mKick(t,1);
    if(q===4||q===12)mSnare(t,1);
    if(q%2===0)mHat(t,q%4===0?0.6:1);else if(q%4===3)mHat(t,0.5);
    if(q%4===0)mBass(t,q===8?root+7:root,1);else if(q%4>=2)mBass(t,root,0.55);
    if(bar===7&&q>=12)mSnare(t,0.5+0.15*(q-12));
  }else{
    if(q===0)mBass(t,root,0.8);else if(q===8)mBass(t,root+7,0.6);
    if(q===4||q===12)mHat(t,0.8);
  }
  const L2=LEAD[s];if(L2)mLead(t,L2[0],L2[1],full?1:0.8);
}
setInterval(()=>{
  if(!AC||AC.state!=='running')return;
  if(MUS.next<AC.currentTime-0.3)MUS.next=AC.currentTime+0.05;
  while(MUS.next<AC.currentTime+0.14){
    if(SAVE.music)musicStep(MUS.step,Math.max(MUS.next,AC.currentTime+0.005),state==='play'||state==='intro');
    MUS.next+=STEP;MUS.step=(MUS.step+1)%128;

},40);

function burst(x,y,n){for(let i=fxn(n);i--;){const a=rnd(-Math.PI,0),s=rnd(300,1000),l=rnd(1.6,2.6);addP({k:4,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,col:pick(CONF),size:rnd(10,18),g:520,rot:rnd(0,TAU),vr:rnd(-6,6),fl:rnd(0,TAU),drag:1});}}
function ring(x,y,R=140,col='255,255,255',life=0.3){rings.push({x,y,t:0,R,col,life});}
function popup(t,x,y,col='#ffe36e',size=44){
  let yy=y-popStack*52;if(yy<150)yy=150+popStack*52;
  pops.push({text:t,x:clamp(x,240,W-240),y:Math.min(yy,H-150),col,size,t:0,life:1.3,rot:rnd(-0.05,0.05)});popStack++;
}
function updateFX(dt,rdt){
  for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.k===1||p.k===3)p.rot+=p.vr*dt;else if(p.k===2){p.size+=dt*34;p.vx*=0.98;}
    else if(p.k===4){p.rot+=p.vr*dt;p.fl+=dt*9;if(p.drag){p.vx*=1-2.2*dt;if(p.vy>260)p.vy=260;}p.x+=Math.sin(p.fl*0.6)*40*dt;}}
  let j=0;for(let i=0;i<parts.length;i++)if(parts[i].life>0)parts[j++]=parts[i];parts.length=j;
  for(const p of pops){p.t+=rdt;p.y-=rdt*46;}pops=pops.filter(p=>p.t<p.life);
  for(const r of rings)r.t+=rdt;rings=rings.filter(r=>r.t<r.life);
  for(const r of tracers)r.t+=rdt;tracers=tracers.filter(r=>r.t<0.11);
  shake=Math.max(0,shake-rdt*32);flash=Math.max(0,flash-rdt*4);hitmark=Math.max(0,hitmark-rdt);hype=Math.max(0,hype-rdt*0.38);
}
function drawParts(){
  for(const p of parts){
    if(p.k===0)continue;const a=clamp(p.life/p.max*1.6,0,1);
    if(p.k===2){ctx.globalAlpha=a*0.4;ctx.drawImage(SMOKE,p.x-p.size,p.y-p.size,p.size*2,p.size*2);continue;}
    ctx.globalAlpha=p.k===3?a*0.8:a;ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.k===1)ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.66);
    else if(p.k===3){ctx.beginPath();ctx.moveTo(-p.size*0.5,p.size*0.3);ctx.lineTo(p.size*0.5,p.size*0.1);ctx.lineTo(0,-p.size*0.5);ctx.closePath();ctx.fill();}
    else{const w=p.size*Math.cos(p.fl);ctx.fillRect(-w/2,-p.size*0.3,w,p.size*0.6);}
    ctx.restore();
  }
  ctx.globalAlpha=1;add();ctx.lineCap='round';
  for(const p of parts){
    if(p.k!==0)continue;ctx.globalAlpha=clamp(p.life/p.max*1.5,0,1);ctx.strokeStyle=p.col;ctx.lineWidth=p.size;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.035,p.y-p.vy*0.035);ctx.stroke();
  }
  for(const r of tracers){const a=1-r.t/0.11;ctx.globalAlpha=a*0.7;ctx.strokeStyle=r.col;ctx.lineWidth=5*a+1;
    ctx.beginPath();ctx.moveTo(lerp(960,r.x,0.35+r.t*5),lerp(H+80,r.y,0.35+r.t*5));ctx.lineTo(r.x,r.y);ctx.stroke();
    ctx.globalAlpha=a;ctx.drawImage(glowSprite('#fff2c8'),r.x-70,r.y-70,140,140);}
  norm();
  for(const r of rings){const k=r.t/r.life;ctx.strokeStyle=`rgba(${r.col},${1-k})`;ctx.lineWidth=5*(1-k)+1;ctx.beginPath();ctx.arc(r.x,r.y,8+easeOut(k)*r.R,0,TAU);ctx.stroke();}
}
function drawPops(){
  for(const p of pops){
    const a=p.t<p.life-0.3?1:(p.life-p.t)/0.3,sc=p.t<0.16?easeBack(p.t/0.16):1;
    ctx.globalAlpha=a;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);text(p.text,0,0,p.size*Math.max(0.2,sc),p.col);ctx.restore();
  }

}

/* ============================================================
   THE ACTS
   shoot() returns true (hit: builds streak), 'meh' (no change),
   'bad' or false (miss: streak resets)
   ============================================================ */
let L=null;
const mult=()=>L?1+0.125*Math.min(L.streak,8):1;
function award(pts,label,x,y,col){
  if(!L)return 0;const p=Math.round(pts*mult()/5)*5;L.score+=p;
  if(label){popup(p>0?`${label} +${p}`:label,x,y,col||(p>=600?'#ff7af0':'#ffe36e'),p>=600?58:42);
    if(!/^HIT /.test(label))L.log[label]=(L.log[label]||0)+1;}
  return p;
}
function bonus(pts,label,x,y,col='#7dffb2'){if(!L)return;L.score+=pts;popup(`${label} +${pts}`,x,y,col,46);L.log[label]=(L.log[label]||0)+1;}
function cheer(v){hype=Math.max(hype,v);sfx.cheer(v);}
function wow(x,y){slow=0.4;hitstop=0.05;flash=0.35;shake=Math.max(shake,9);ring(x,y,260,'255,122,240',0.45);sfx.big();cheer(0.9);}

class Level{
  constructor(){this.t=0;this.score=0;this.shots=0;this.hits=0;this.misses=0;this.streak=0;this.bestStreak=0;this.done=false;this.passed=false;
    this.limit=20;this.early=true;this.log={};this.msg='';this.endHandled=false;this.endT=0;this.ammo=null;}
  finish(passed,msg){if(this.done)return;this.done=true;this.passed=passed;if(!passed&&msg)this.msg=msg;}
  timeUp(){this.finish(this.passCheck(),"TIME'S UP");}
  passCheck(){return false;}
  progress(){return '';}
  focus(){return null;}
}

/* ---- 1. COIN TOSS ---- */
class CoinLevel extends Level{
  constructor(){super();this.early=false;this.n=0;this.lastHit=-9;this.tossAt=0.35;this.coins=[this.mk(rnd(780,1140),false)];}
  mk(x,silver){return{x,y:FLOOR-6,vx:0,vy:0,th:1.2,w:8,r:silver?31:38,silver,state:'wait',trail:[],n:0};}
  progress(){return `HITS ${this.n} / 3`;}
  passCheck(){return this.n>=3;}
  focus(){const c=this.coins.find(c=>c.state==='air');return c?{x:c.x,y:Math.max(c.y,140)}:null;}
  timeUp(){if(this.n>=3)for(const c of this.coins)if(c.state==='air')bonus(300,'STILL FLYING',c.x,clamp(c.y-60,220,800));super.timeUp();}
  update(dt){
    if(this.tossAt!=null&&this.t>=this.tossAt){this.tossAt=null;
      for(const c of this.coins)if(c.state==='wait'){c.state='air';c.vx=rnd(-170,170);c.vy=c.silver?-1380:-1450;sfx.coin(0);sfx.whoosh();spark(c.x,FLOOR,10,'#ffe9a0',300,0.4,3);}}
    for(const c of this.coins){
      if(c.state!=='air')continue;
      c.vy+=G*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.th+=c.w*dt;
      if(c.x<c.r){c.x=c.r;c.vx=Math.abs(c.vx)*0.85;}else if(c.x>W-c.r){c.x=W-c.r;c.vx=-Math.abs(c.vx)*0.85;}
      c.trail.push(c.x,c.y);if(c.trail.length>24)c.trail.splice(0,2);
      if(c.y>=FLOOR-6&&c.vy>0){c.y=FLOOR-6;c.state='down';c.trail=[];sfx.coinLand();spark(c.x,FLOOR,12,'#ffd34d',260,0.4,3);}
    }
    if(!this.done&&this.tossAt==null&&this.coins.every(c=>c.state==='down'))this.finish(this.n>=3,'IT LANDED');
  }
  shoot(x,y){
    if(this.done)return false;let c=null,d=1e9;
    for(const k of this.coins){if(k.state!=='air')continue;const dd=Math.hypot(x-k.x,y-k.y);if(dd<k.r+14&&dd<d){c=k;d=dd;}}
    if(!c)return false;
    const R=c.r+14,n=++this.n,py=c.y-70;c.n++;
    award(100*Math.min(c.n,4)*(c.silver?2:1)+Math.round(80*(1-d/R)),c.silver?'SILVER':n<=3?`HIT ${n}/3`:`HIT ${n}`,c.x,py,'#ffffff');
    if(d<12)award(100,'DEAD CENTER',c.x,py);
    if(c.y<300)award(150,'SKY HIGH',c.x,py,'#7ae8ff');
    if(c.y>FLOOR-130)award(200,'CLUTCH SAVE',c.x,py,'#7dffb2');
    if(Math.abs(Math.cos(c.th))<0.25)award(200,'EDGE HIT',c.x,py,'#7ae8ff');
    if(this.t-this.lastHit<0.45)award(150,'DOUBLE TAP',c.x,py);
    this.lastHit=this.t;
    if(n===3){sfx.good();cheer(0.6);popup('ENCORE COIN!',960,400,'#cfe8ff',60);
      this.coins.push(this.mk(c.x<960?rnd(1150,1500):rnd(420,770),true));this.tossAt=this.t+0.7;}
    c.vy=-Math.max(720,1010-c.n*28);c.vx=clamp(c.vx*0.5+(c.x-x)*16,-520,520);c.w=8+c.n*1.2;
    sfx.coin(c.n+(c.silver?4:0));spark(x,y,18,c.silver?'#e6f4ff':'#ffe9a0',560,0.5,3.5);ring(x,y,90);shake=Math.max(shake,4);
    return true;
  }
  draw(){
    ctx.setLineDash([12,14]);ctx.lineWidth=2;
    ctx.strokeStyle='rgba(122,232,255,0.3)';ctx.beginPath();ctx.moveTo(0,300);ctx.lineTo(W,300);ctx.stroke();
    ctx.strokeStyle='rgba(125,255,178,0.26)';ctx.beginPath();ctx.moveTo(0,FLOOR-130);ctx.lineTo(W,FLOOR-130);ctx.stroke();ctx.setLineDash([]);
    text('SKY HIGH',34,278,20,'rgba(122,232,255,0.6)','left');text('CLUTCH ZONE',34,FLOOR-152,20,'rgba(125,255,178,0.55)','left');
    for(const c of this.coins){
      const col=c.silver?'#cfe8ff':'#ffd34d';
      if(SAVE.glow){add();for(let i=0;i<c.trail.length;i+=2){ctx.globalAlpha=i/c.trail.length*0.35;const s=c.r*(0.6+i/c.trail.length);ctx.drawImage(glowSprite(col),c.trail[i]-s,c.trail[i+1]-s,s*2,s*2);}norm();}
      drawCoin(c.x,c.y,c.r,c.th,c.silver,c.state!=='air');
      if(c.y<92){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(c.x,104);ctx.lineTo(c.x-18,134);ctx.lineTo(c.x+18,134);ctx.closePath();ctx.fill();}
    }
  }
}

/* ---- 2. APPLE DROP ---- */
const AR=32;
class AppleLevel extends Level{
  constructor(){super();this.wave=0;this.next=0.4;this.sticks=[];this.deb=[];this.clean=0;this.lastApple=-9;
    this.cfg=[{n:1,av:0.5},{n:1,av:1.8},{n:2,av:1.1},{n:2,av:1.6,gold:1}];}
  progress(){return `APPLES ${this.clean} / 6`;}
  passCheck(){return this.clean>=4;}
  focus(){const s=this.sticks.find(s=>s.apple)||this.sticks[0];return s?{x:s.x,y:clamp(s.y,160,860)}:null;}
  spawn(){
    const c=this.cfg[this.wave++];
    for(let i=0;i<c.n;i++){
      let x,vx;
      if(c.n===1){x=rnd(650,1270);vx=(960-x)*0.25+rnd(-60,60);}else{x=i?1500:420;vx=(i?-1:1)*(c.gold?rnd(200,260):300);}
      const gold=!!c.gold&&i===1;
      this.sticks.push({x,y:H+160,vx,vy:-rnd(1480,1600),ang:rnd(-0.25,0.25),av:c.av*(Math.random()<0.5?-1:1),len:230,apple:true,gold,r:gold?26:AR});
    }
    sfx.whoosh();
  }
  geo(s){const dx=Math.sin(s.ang),dy=-Math.cos(s.ang),h=s.len/2;
    return{tx:s.x+dx*h,ty:s.y+dy*h,bx:s.x-dx*h,by:s.y-dy*h,ax:s.x+dx*(h+s.r-6),ay:s.y+dy*(h+s.r-6)};}
  update(dt){
    for(const s of this.sticks){s.vy+=G*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.ang+=s.av*dt;}
    for(const s of this.sticks)if(s.y>H+300&&s.vy>0&&s.apple&&!this.done){popup('DROPPED',clamp(s.x,240,W-240),H-200,'#ff6b6b');sfx.lost();}
    this.sticks=this.sticks.filter(s=>!(s.y>H+300&&s.vy>0));
    for(const d of this.deb){d.vy+=G*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;}
    this.deb=this.deb.filter(d=>d.y<H+250);
    const clear=this.sticks.length===0&&!this.deb.some(d=>d.shoot);
    if(clear&&this.wave<4){this.next-=dt;if(this.next<=0){this.spawn();this.next=0.5;}}
    else if(clear&&!this.done){if(this.clean===6)bonus(500,'CLEAN SWEEP',960,420,'#ff7af0');this.finish(this.clean>=4,'TOO MANY DROPPED');}
  }
  halves(x,y,vx,vy,rot,r,gold){[-1,1].forEach(side=>this.deb.push({kind:'half',side,x,y,vx:vx+side*280,vy:vy-200,rot,vr:side*7,r,gold}));
    spark(x,y,16,gold?'#ffe08a':'#ff5a6a',480,0.6,4);chunks(x,y,8,'#fff3cf',380,8);sfx.splat();}
  shoot(x,y){
    if(this.done)return false;
    for(const s of this.sticks){
      if(!s.apple)continue;const g=this.geo(s),R=s.r+12,d=Math.hypot(x-g.ax,y-g.ay);
      if(d<R){
        s.apple=false;this.clean++;const py=g.ay-60;
        award((s.gold?600:300)+Math.round(100*(1-d/R)),s.gold?'GOLDEN APPLE!':'APPLE!',g.ax,py,s.gold?'#ffd34d':'#ff9a9a');
        if(d<10)award(100,'CORE SHOT',g.ax,py);
        if(g.ay<330)award(150,'HIGH',g.ax,py,'#7ae8ff');
        if(s.vy<-350)award(150,'ON THE RISE',g.ax,py,'#7dffb2');
        if(this.t-this.lastApple<0.6)award(200,'QUICK PAIR',g.ax,py,'#ff7af0');
        this.lastApple=this.t;this.halves(g.ax,g.ay,s.vx,s.vy,s.ang,s.r,s.gold);shake=Math.max(shake,5);if(s.gold)cheer(0.5);
        return true;
      }
    }
    for(const s of this.sticks){
      const g=this.geo(s),sd=segDist(x,y,g.bx,g.by,g.tx,g.ty);
      if(sd.d<14){
        this.sticks.splice(this.sticks.indexOf(s),1);
        const cx=g.bx+(g.tx-g.bx)*sd.t,cy=g.by+(g.ty-g.by)*sd.t;
        [[(g.bx+cx)/2,(g.by+cy)/2,s.len*sd.t,-140],[(cx+g.tx)/2,(cy+g.ty)/2,s.len*(1-sd.t),140]].forEach(([px,py,len,k])=>{
          if(len>8)this.deb.push({kind:'stick',x:px,y:py,len,rot:s.ang,vx:s.vx+k,vy:s.vy-150,vr:rnd(-8,8)});});
        chunks(x,y,9,'#b98244',320,8);sfx.snap();
        if(s.apple){this.deb.push({kind:'apple',x:g.ax,y:g.ay,vx:s.vx+rnd(-100,100),vy:s.vy-100,rot:s.ang,vr:rnd(-3,3),shoot:true,r:s.r,gold:s.gold});
          award(0,'SPLINTERS!',x,y-50,'#ff6b6b');return 'bad';}
        award(150,'STICK SNAP',x,y-50,'#7dffb2');return true;
      }
    }
    for(const d of this.deb){
      if(d.kind==='apple'&&d.shoot&&Math.hypot(x-d.x,y-d.y)<d.r+12){
        this.deb.splice(this.deb.indexOf(d),1);this.halves(d.x,d.y,d.vx,d.vy,d.rot,d.r,d.gold);
        award(100,'SALVAGE',d.x,d.y-50,'#ffb36b');return true;
      }
    }
    return false;
  }
  draw(){
    for(const d of this.deb){
      if(d.kind==='half')drawAppleHalf(d.x,d.y,d.r,d.rot,d.side,d.gold);
      else if(d.kind==='apple')drawApple(d.x,d.y,d.r,d.rot,d.gold);
      else{const dx=Math.sin(d.rot)*d.len/2,dy=-Math.cos(d.rot)*d.len/2;drawStick(d.x-dx,d.y-dy,d.x+dx,d.y+dy);}
    }
    for(const s of this.sticks){const g=this.geo(s);drawStick(g.bx,g.by,g.tx,g.ty);if(s.apple)drawApple(g.ax,g.ay,s.r,s.ang,s.gold);}
  }
}

/* ---- 3. CARD SPLIT ---- */
class CardLevel extends Level{
  constructor(){super();this.idx=0;this.splits=0;this.card=null;this.next=0.3;this.deb=[];
    this.cfgs=[{w:2.6,sw:0},{w:3.6,sw:170},{w:4.2,toss:1}];}
  progress(){return `SPLITS ${this.splits} / 3`;}
  passCheck(){return this.splits>=2;}
  focus(){return this.card?{x:this.card.cx,y:this.card.cy}:null;}
  spawn(){
    const c=this.cfgs[this.idx++],dir=Math.random()<0.5?1:-1;
    this.card={ax:rnd(620,1300),cx:0,cy:-200,th:rnd(0,TAU),w:c.w*(Math.random()<0.5?-1:1),sw:c.sw||0,born:this.t,holes:[],pierces:0,toss:!!c.toss,
      vx:dir*rnd(420,480),vy:-1350,rot:0};
    if(c.toss){this.card.cx=dir>0?200:1720;this.card.cy=FLOOR+60;sfx.whoosh();popup('ACE IN THE AIR!',960,400,'#7ae8ff',54);}else{this.card.cx=this.card.ax;sfx.thunk();}
  }
  update(dt){
    if(!this.card&&this.idx<3){this.next-=dt;if(this.next<=0)this.spawn();}
    const c=this.card;
    if(c){c.th+=c.w*dt;const lt=this.t-c.born;
      if(c.toss){c.vy+=G*dt;c.cx+=c.vx*dt;c.cy+=c.vy*dt;c.rot+=dt*0.8*Math.sign(c.vx);
        if(c.cy>FLOOR+140&&c.vy>0){popup('GOT AWAY',clamp(c.cx,240,W-240),FLOOR-120,'#ff6b6b');sfx.lost();this.card=null;this.next=0.4;}}
      else{c.cx=c.ax+c.sw*Math.sin(lt*1.7);const k=Math.max(0,1-lt/0.35);c.cy=470-k*k*640;}}
    for(const d of this.deb){d.vy+=G*0.8*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;d.th+=d.w*dt;}
    this.deb=this.deb.filter(d=>d.y<H+250);
    if(!this.card&&this.idx>=3&&!this.done){if(this.splits===3)bonus(400,'FULL HOUSE',960,420,'#ff7af0');this.finish(this.splits>=2,'NOT SHARP ENOUGH');}
  }
  shoot(x,y){
    const c=this.card;if(!c||this.done)return false;
    const cr=Math.cos(-c.rot),sr=Math.sin(-c.rot),lx=(x-c.cx)*cr-(y-c.cy)*sr,ly=(x-c.cx)*sr+(y-c.cy)*cr;
    const cs=Math.cos(c.th),e=Math.abs(cs),hw=CHW*e;
    if(Math.abs(ly)>CHH+8||Math.abs(lx)>hw+16)return false;
    const py=c.cy-CHH-50;
    if(e<0.2){
      this.splits++;
      award(500+Math.round((0.2-e)/0.2*300),e<0.07?'RAZOR SPLIT!':'SPLIT!',c.cx,py,'#ff7af0');
      if(c.toss)award(400,'MID-AIR',c.cx,py,'#7ae8ff');
      if(c.pierces===0)award(150,'FIRST TRY',c.cx,py,'#7dffb2');
      if(Math.abs(ly)<25)award(100,'CENTER CUT',c.cx,py);
      [-1,1].forEach(s=>this.deb.push({x:c.cx,y:c.cy,vx:s*rnd(320,420)+(c.toss?c.vx*0.5:0),vy:-rnd(250,400),th:c.th,w:s*14,rot:c.rot,vr:s*rnd(2,4),holes:c.holes}));
      spark(x,y,26,'#9ff3ff',640,0.6,3.5);chunks(x,y,10,'#f4efe4',360,7);sfx.snap();wow(x,y);
      this.card=null;this.next=0.7;return true;
    }
    c.pierces++;c.holes.push({lx:clamp(lx/cs,-65,65),v:clamp(ly,-95,95)});
    award(25,'PIERCED',x,y-50,'#cccccc');sfx.thunk();chunks(x,y,4,'#f4efe4',220,5);
    if(c.pierces>=3){
      award(0,'SHREDDED',c.cx,py,'#ff6b6b');sfx.lost();
      this.deb.push({x:c.cx,y:c.cy,vx:c.toss?c.vx:rnd(-80,80),vy:c.toss?c.vy:-100,th:c.th,w:c.w,rot:c.rot,vr:rnd(-2,2),holes:c.holes});
      this.card=null;this.next=0.6;return 'bad';
    }
    return 'meh';
  }
  draw(){
    const c=this.card;

/* ---- 4. CANDLE SNUFF (on a swinging chandelier) ---- */

        rr(ctx,x-22,-c.h,44,c.h,7);ctx.fillStyle=c.col;ctx.fill();ctx.globalAlpha=0.45;ctx.fillStyle=g;ctx.fill();ctx.globalAlpha=1;
        ctx.fillStyle='rgba(255,255,255,0.7)';rr(ctx,x-15,-c.h,8,24,4);ctx.fill();rr(ctx,x+6,-c.h,7,14,3.5);ctx.fill();
        ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,-c.h);ctx.lineTo(x+1,-c.h-12);ctx.stroke();
        if(c.state==='out'){ctx.fillStyle='#ff4a2a';ctx.beginPath();ctx.arc(x+1,-c.h-12,2.5,0,TAU);ctx.fill();}}
      ctx.fillStyle='#d9a93c';ctx.beginPath();ctx.moveTo(x-34,-4);ctx.lineTo(x+34,-4);ctx.lineTo(x+24,12);ctx.lineTo(x-24,12);ctx.closePath();ctx.fill();
    }

/* ---- 5. DOUBLE CLAY ---- */
const G2=900;
class ClayLevel extends Level{
  constructor(){super();this.pair=0;this.discs=[];this.next=0.5;this.broken=0;}
  progress(){return `CLAYS ${this.broken} / 9`;}
  passCheck(){return this.broken>=6;}
  focus(){if(!this.discs.length)return null;let x=0,y=0;for(const d of this.discs){x+=d.x;y+=d.y;}return{x:x/this.discs.length,y:y/this.discs.length};}
  launch(){
    const k=this.pair++,P={x:rnd(700,1220),y:rnd(300,470)},vy0=Math.sqrt(2*G2*(FLOOR-P.y)),T=vy0/G2;
    const v=[170,240,320,300][k]*(Math.random()<0.5?1:-1),vs=k===3?[v,-v,0]:[v,-v];
    if(k===3)popup('TRIPLE!',960,400,'#7ae8ff',60);
    for(const sv of vs){const x=P.x-sv*T;this.discs.push({x,y:FLOOR,vx:sv,vy:-vy0,r:28,trail:[]});spark(x,FLOOR,10,'#ffb36b',280,0.4,3);}
    sfx.whoosh();sfx.thunk();

  update(dt){
    for(const d of this.discs){d.vy+=G2*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.trail.push(d.x,d.y);if(d.trail.length>20)d.trail.splice(0,2);}
    this.discs=this.discs.filter(d=>!(d.vy>0&&d.y>FLOOR+10));
    if(this.discs.length===0){
      if(this.pair<4){this.next-=dt;if(this.next<=0){this.launch();this.next=0.5;}}
      else if(!this.done){if(this.broken===9)bonus(400,'CLEAN SWEEP',960,420,'#ff7af0');this.finish(this.broken>=6,'TOO MANY GOT AWAY');}
    }
  }
  shoot(x,y){
    if(this.done)return false;
    const hit=this.discs.filter(d=>Math.hypot(x-d.x,y-d.y)<d.r+14);if(!hit.length)return false;
    for(const d of hit){this.discs.splice(this.discs.indexOf(d),1);this.broken++;chunks(d.x,d.y,12,'#ff7a2e',440,10);chunks(d.x,d.y,6,'#a8330c',300,7);spark(d.x,d.y,10,'#ffd0a8',400,0.4,3);smoke(d.x,d.y,3);}
    sfx.shatter();shake=Math.max(shake,5);
    if(hit.length>=3){award(1800,'HAT TRICK!',x,y-70,'#ff7af0');wow(x,y);}
    else if(hit.length===2){award(800,'TWO FOR ONE!',x,y-70,'#ff7af0');wow(x,y);}
    else{const d=hit[0],dd=Math.hypot(x-d.x,y-d.y);award(150+Math.round(80*(1-dd/(d.r+14))),'CLAY',d.x,d.y-60,'#ffb36b');if(d.y<330)award(100,'HIGH BIRD',d.x,d.y-60,'#7ae8ff');}
    return true;
  }
  draw(){
    for(const d of this.discs){
      if(SAVE.glow){add();for(let i=0;i<d.trail.length;i+=2){ctx.globalAlpha=i/d.trail.length*0.25;ctx.drawImage(glowSprite('#ff7a2e'),d.trail[i]-22,d.trail[i+1]-22,44,44);}norm();}
      drawDisc(d.x,d.y,d.r,Math.atan2(d.vy,d.vx)*0.2);
    }
  }
}

/* ---- 6. HANG TIME ---- */
class RopeLevel extends Level{
  constructor(){super();this.round=0;this.tg=null;this.next=0.3;this.ok=0;this.cfg=[{L:380,amp:0.5,w:2.3},{L:410,amp:0.8,w:3.0}];}
  progress(){return `TARGETS ${this.ok} / 2`;}
  passCheck(){return this.ok>=2;}
  focus(){return this.tg?{x:this.tg.x,y:clamp(this.tg.y,160,880)}:null;}
  spawn(){const c=this.cfg[this.round++];
    this.tg={px:rnd(760,1160),py:138,L:c.L,amp:c.amp,w:c.w,born:this.t,ph0:rnd(0,TAU),state:'hang',holes:[],hits:0,x:0,y:0,vx:0,vy:0,rot:0,vr:0,phi:0};
    this.pose(this.tg);sfx.thunk();}
  pend(g){const lt=this.t-g.born;return{phi:g.amp*Math.sin(g.w*lt+g.ph0),dphi:g.amp*g.w*Math.cos(g.w*lt+g.ph0)};}
  pose(g){const{phi}=this.pend(g);g.phi=phi;g.x=g.px+g.L*Math.sin(phi);g.y=g.py+g.L*Math.cos(phi);g.rot=-phi;}
  update(dt){
    if(!this.tg&&this.round<2){this.next-=dt;if(this.next<=0)this.spawn();}
    const g=this.tg;
    if(g){
      if(g.state==='hang')this.pose(g);
      else{g.vy+=G*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.rot+=g.vr*dt;
        if(g.x<TR){g.x=TR;g.vx=Math.abs(g.vx);}else if(g.x>W-TR){g.x=W-TR;g.vx=-Math.abs(g.vx);}
        if(g.y>H+130){if(!g.hits&&!this.done){popup('MISSED IT',clamp(g.x,240,W-240),H-200,'#ff6b6b');sfx.lost();}this.tg=null;this.next=0.5;}}
    }
    if(!this.tg&&this.round>=2&&!this.done)this.finish(this.ok>=2,'MISSED A TARGET');
  }
  local(g,x,y){const dx=x-g.x,dy=y-g.y,c=Math.cos(-g.rot),s=Math.sin(-g.rot);return{x:dx*c-dy*s,y:dx*s+dy*c};}
  shoot(x,y){
    const g=this.tg;if(!g||this.done)return false;const dT=Math.hypot(x-g.x,y-g.y);
    if(g.state==='hang'){
      const kx=g.px+(g.L-TR)*Math.sin(g.phi),ky=g.py+(g.L-TR)*Math.cos(g.phi),sd=segDist(x,y,g.px,g.py,kx,ky);
      if(sd.d<20&&dT>TR-4){
        const{dphi}=this.pend(g),v=g.L*dphi;
        g.state='fall';g.cutT=this.t;g.vx=v*Math.cos(g.phi);g.vy=-v*Math.sin(g.phi);g.vr=dphi*0.6+rnd(-1.5,1.5);
        g.cut={len:Math.hypot(sd.cx-g.px,sd.cy-g.py),phi:g.phi};g.tail=Math.hypot(kx-sd.cx,ky-sd.cy);
        award(300,'ROPE CUT',sd.cx,sd.cy-40,'#7ae8ff');if(g.tail<45)award(200,'CLOSE SHAVE',sd.cx,sd.cy-40,'#7ae8ff');
        sfx.snap();spark(sd.cx,sd.cy,12,'#e8d3a0',300,0.4,3);return true;
      }
      if(dT<TR){g.holes.push(this.local(g,x,y));award(0,'TOO EARLY',x,y-50,'#bbbbbb');sfx.thunk();return 'bad';}
      return false;
    }
    if(dT<TR){
      g.holes.push(this.local(g,x,y));
      if(g.hits>=3){award(0,'MAX HITS',g.x,g.y-100,'#bbbbbb');sfx.thunk();return 'meh';}
      g.hits++;
      if(g.hits===1){this.ok++;if(this.t-g.cutT<0.45)award(150,'QUICK DRAW',g.x,g.y-100,'#7dffb2');}
      if(dT<14){award(800,'BULLSEYE!',g.x,g.y-100,'#ff7af0');wow(x,y);}
      else if(dT<28)award(500,'GOLD RING',g.x,g.y-100,'#ffd34d');
      else if(dT<56)award(300,'RED RING',g.x,g.y-100);
      else award(150,'OUTER RING',g.x,g.y-100);
      if(g.hits===3)award(250,'JUGGLER',g.x,g.y-100,'#7ae8ff');
      g.vy=Math.min(g.vy,0)-300;g.vr+=(x-g.x)*0.03;g.vx+=(g.x-x)*3;
      sfx.coin(g.hits*2);sfx.thunk();spark(x,y,14,'#ffffff',420,0.4,3);chunks(x,y,5,'#d92d3d',300,6);shake=Math.max(shake,5);return true;
    }
    return false;
  }
  draw(){
    const gr=ctx.createLinearGradient(0,118,0,150);gr.addColorStop(0,'#a8703c');gr.addColorStop(1,'#4a2a12');
    rr(ctx,520,120,880,30,8);ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle='#2a1608';ctx.lineWidth=3;ctx.stroke();
    const g=this.tg;if(!g)return;
    ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(g.px,g.py,8,0,TAU);ctx.fill();
    ctx.strokeStyle='#e8d3a0';ctx.lineWidth=5;ctx.lineCap='round';
    if(g.state==='hang'){ctx.beginPath();ctx.moveTo(g.px,g.py);ctx.lineTo(g.px+(g.L-TR)*Math.sin(g.phi),g.py+(g.L-TR)*Math.cos(g.phi));ctx.stroke();}
    else{
      const lt=this.t-g.cutT,sp=g.cut.phi*Math.exp(-lt*0.9)*Math.cos(lt*4.5);
      ctx.beginPath();ctx.moveTo(g.px,g.py);ctx.lineTo(g.px+g.cut.len*Math.sin(sp),g.py+g.cut.len*Math.cos(sp));ctx.stroke();
      ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.rot);ctx.beginPath();ctx.moveTo(0,-TR);ctx.quadraticCurveTo(8*Math.sin(lt*9),-TR-g.tail/2,3*Math.sin(lt*7),-TR-g.tail);ctx.stroke();ctx.restore();
    }
    glowAt(g.x,g.y,130,'#ffffff',0.25);drawTarget(g.x,g.y,g.rot,g.holes);
  }
}

/* ---- 7. RICOCHET ---- */
class RicochetLevel extends Level{
  constructor(){super();this.ammo=8;this.popped=0;this.rays=[];this.endAt=null;
    this.pl=[{x:330,y:800,c:-0.78,A:0.62,w:1.5,ph:rnd(0,TAU),kick:0},{x:1590,y:800,c:-Math.PI+0.78,A:0.62,w:1.9,ph:rnd(0,TAU),kick:0}];
    this.b=[];this.layout();}
  progress(){return `POPPED ${this.popped} / 8`;}
  passCheck(){return this.popped>=5;}
  pang(p){return p.c+p.A*Math.sin(p.w*this.t+p.ph);}
  layout(){
    for(let tries=0;tries<200;tries++){
      const b=[];let ok=true;
      for(const [pi,sgn,n] of [[0,1,2],[0,-1,2],[1,-1,3],[1,1,1]]){
        const p=this.pl[pi],a=p.c+sgn*rnd(0.2,0.5),sx=Math.cos(a),sy=Math.sin(a);
        let dmax=Math.min(1050,(p.y-190)/Math.abs(sy));dmax=Math.min(dmax,sx>0?(1780-p.x)/sx:(p.x-140)/-sx);
        const d0=390;let last=-999;
        for(let k=0;k<n;k++){
          const d=d0+(dmax-d0)*(k+rnd(0.15,0.85))/n;if(d-last<115){ok=false;break;}last=d;
          const x=p.x+sx*d,y=p.y+sy*d;
          if(b.some(o=>Math.hypot(o.x-x,o.y-y)<104)||this.pl.some(q=>Math.hypot(q.x-x,q.y-y)<230)){ok=false;break;}
          b.push({x,y,col:(b.length*2+pi)%5,ph:rnd(0,TAU),alive:true});
        }
        if(!ok)break;
      }
      if(ok||tries===199){this.b=b;if(ok)return;}
    }
  }
  bpos(o){return{x:o.x+4*Math.sin(this.t*1.3+o.ph),y:o.y+6*Math.sin(this.t*1.9+o.ph)};}
  along(p,a){const sx=Math.cos(a),sy=Math.sin(a),out=[];
    for(const o of this.b){if(!o.alive)continue;const q=this.bpos(o),dx=q.x-p.x,dy=q.y-p.y,t=dx*sx+dy*sy;if(t>0&&Math.abs(dx*sy-dy*sx)<46)out.push(o);}return out;}
  pop(o){o.alive=false;this.popped++;const q=this.bpos(o);chunks(q.x,q.y,10,BCOL[o.col],460,9);spark(q.x,q.y,10,'#ffffff',380,0.35,3);ring(q.x,q.y,80);}
  check(){if(this.popped===8){if(this.ammo>0)bonus(150*this.ammo,this.ammo>1?`${this.ammo} SPARE ROUNDS`:'SPARE ROUND',960,420);this.endAt=this.t+0.3;}
    else if(this.ammo===0)this.endAt=this.t+0.5;}
  update(dt){
    for(const p of this.pl)p.kick=Math.max(0,p.kick-dt*4);
    this.rays=this.rays.filter(r=>(r.t+=dt)<0.35);
    if(this.endAt!=null&&this.t>=this.endAt&&!this.done)this.finish(this.popped>=5,'OUT OF AMMO');
  }
  shoot(x,y){
    if(this.done||this.endAt!=null)return 'meh';
    for(const p of this.pl){
      if(Math.hypot(x-p.x,y-p.y)<64){
        const a=this.pang(p),hit=this.along(p,a),n=hit.length;p.kick=1;
        this.rays.push({x:p.x,y:p.y,a,t:0,n});sfx.rico();spark(p.x,p.y,16,'#cfe8ff',520,0.4,3);
        for(const o of hit)this.pop(o);if(n)sfx.pop();
        const far=hit.length?this.bpos(hit[hit.length-1]):p,mx2=p.x+Math.cos(a)*420,my2=p.y+Math.sin(a)*420;
        let res=true;
        if(n===0){popup('NO BANK',mx2,my2,'#bbbbbb');res=false;}
        else if(n===1)award(250,'BANK SHOT',hit[0].x,hit[0].y-70,'#7ae8ff');
        else if(n===2){award(800,'DOUBLE BANK!',mx2,my2,'#ff7af0');wow(far.x,far.y);}
        else{award(1600,'TRIPLE BANK!',mx2,my2,'#ff7af0');wow(far.x,far.y);}
        this.check();return res;
      }
    }
    for(const o of this.b){
      if(!o.alive)continue;const q=this.bpos(o);
      if(Math.hypot(x-q.x,y-q.y+4)<44){this.pop(o);sfx.pop();award(60,'DIRECT HIT',q.x,q.y-70,'#cccccc');this.check();return 'meh';}
    }
    this.check();return false;
  }
  draw(){
    for(const p of this.pl){
      const a=this.pang(p),n=this.along(p,a).length,sx=Math.cos(a),sy=Math.sin(a);
      add();ctx.setLineDash([16,14]);ctx.lineDashOffset=-this.t*90;ctx.lineWidth=n>1?6:n?5:3;
      ctx.strokeStyle=n>1?'rgba(255,122,240,0.9)':n?'rgba(255,227,110,0.85)':'rgba(122,232,255,0.4)';
      ctx.beginPath();ctx.moveTo(p.x+sx*50,p.y+sy*50);ctx.lineTo(p.x+sx*1150,p.y+sy*1150);ctx.stroke();ctx.setLineDash([]);norm();
    }
    for(const o of this.b){
      if(!o.alive)continue;const q=this.bpos(o);
      ctx.strokeStyle='rgba(240,230,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.x,q.y+50);ctx.quadraticCurveTo(q.x+10*Math.sin(this.t*2+o.ph),q.y+90,q.x-2,q.y+130);ctx.stroke();
      spr(BALLOON[o.col],q.x,q.y);
    }
    for(const p of this.pl){
      const a=this.pang(p);
      ctx.fillStyle='#1a0a28';ctx.beginPath();ctx.moveTo(p.x-34,FLOOR);ctx.lineTo(p.x+34,FLOOR);ctx.lineTo(p.x+7,p.y);ctx.lineTo(p.x-7,p.y);ctx.closePath();ctx.fill();
      glowAt(p.x,p.y,110+p.kick*90,'#cfe8ff',0.35+p.kick*0.6);
      spr(PLATE,p.x-Math.cos(a)*p.kick*10,p.y-Math.sin(a)*p.kick*10,a+Math.PI/2);
      ctx.fillStyle='#263243';ctx.beginPath();ctx.arc(p.x,p.y,9,0,TAU);ctx.fill();
    }
    add();
    for(const r of this.rays){const k=1-r.t/0.35;ctx.globalAlpha=k;ctx.strokeStyle=r.n?'#fff2a8':'#cfe8ff';ctx.lineWidth=10*k+2;
      ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x+Math.cos(r.a)*1400,r.y+Math.sin(r.a)*1400);ctx.stroke();}
    norm();
  }
}

/* ---- 8. THREAD THE NEEDLE ---- */
class NeedleLevel extends Level{
  constructor(){super();this.ammo=6;this.early=false;this.thr=0;this.t0=rnd(0.4,3.6);this.gx=960;this.gy=470;this.ring=0;this.holes=[];this.endAt=null;
    this.r=[{A:150,w:1.6,R:92,col:'#ff5fa2',dk:'#8a1f52'},{A:120,w:2.4,R:76,col:'#ffd34d',dk:'#8a6410'},{A:95,w:3.2,R:62,col:'#7ae8ff',dk:'#1f6f86'}];}
  progress(){return this.thr<2?`THREADED ${this.thr} / 2`:`THREADED ${this.thr}`;}
  passCheck(){return this.thr>=2;}
  focus(){return{x:this.gx,y:this.gy};}
  rx(i){const r=this.r[i];return this.gx+r.A*Math.sin(r.w*(this.t+this.t0)+(i===1?Math.PI:0));}
  aligned(){for(let i=0;i<3;i++)if(Math.abs(this.rx(i)-this.gx)>this.r[i].R-14)return false;return true;}
  update(dt){
    this.ring=Math.max(0,this.ring-dt*2.5);
    if(this.endAt!=null&&this.t>=this.endAt&&!this.done){if(this.thr>=4)bonus(500,'NEEDLE MASTER',960,300,'#ff7af0');this.finish(this.thr>=2,'OUT OF AMMO');}
  }
  shoot(x,y){
    if(this.done||this.endAt!=null)return 'meh';
    if(this.ammo===0)this.endAt=this.t+0.7;
    let thru=0;
    for(let i=0;i<3;i++){
      const d=Math.hypot(x-this.rx(i),y-this.gy),R=this.r[i].R;
      if(d<R)thru++;
      else if(d<R+17){popup('RIM!',x,y-50,'#ff6b6b');sfx.clang();spark(x,y,18,'#ffe9a0',520,0.4,3);shake=Math.max(shake,4);return 'bad';}
    }
    const dg=Math.hypot(x-this.gx,y-this.gy);
    if(dg>=85)return false;
    this.holes.push({x:x-this.gx,y:y-this.gy});this.ring=1;sfx.gong(0.5+thru*0.25);spark(x,y,12,'#ffe9a8',380,0.4,3);
    const py=this.gy-150;
    if(thru===0){award(40,'OPEN GONG',this.gx,py,'#cccccc');return 'meh';}
    if(thru===3){this.thr++;award(900,'THREADED!',this.gx,py,'#ff7af0');wow(this.gx,this.gy);}
    else if(thru===2)award(350,'TWO RINGS',this.gx,py,'#ffd34d');
    else award(120,'ONE RING',this.gx,py);
    if(dg<16)award(200,'DEAD CENTER',this.gx,py);
    return true;
  }
  draw(){
    const gx=this.gx,gy=this.gy,al=this.aligned();
    ctx.strokeStyle='#2a1608';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(gx-140,FLOOR);ctx.lineTo(gx-140,gy-130);ctx.lineTo(gx+140,gy-130);ctx.lineTo(gx+140,FLOOR);ctx.stroke();
    ctx.strokeStyle='#8a5a34';ctx.lineWidth=8;ctx.stroke();
    ctx.strokeStyle='#e8d3a0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx-40,gy-130);ctx.lineTo(gx-30,gy-80);ctx.moveTo(gx+40,gy-130);ctx.lineTo(gx+30,gy-80);ctx.stroke();
    glowAt(gx,gy,al?230:150,al?'#7dffb2':'#ffd34d',al?0.9:0.3+this.ring*0.5);
    const w=1+this.ring*0.06*Math.sin(this.t*60);
    spr(GONG,gx,gy,0,1.93*w);
    for(const h of this.holes){ctx.fillStyle='#1a0c04';ctx.beginPath();ctx.arc(gx+h.x,gy+h.y,6,0,TAU);ctx.fill();}
    for(let i=2;i>=0;i--){
      const r=this.r[i],x=this.rx(i),R=r.R+8;
      ctx.strokeStyle='rgba(232,211,160,0.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx+(x-gx)*0.3,96);ctx.lineTo(x,gy-R);ctx.stroke();
      ctx.lineWidth=18;ctx.strokeStyle=r.dk;ctx.beginPath();ctx.arc(x,gy,R,0,TAU);ctx.stroke();
      ctx.lineWidth=11;ctx.strokeStyle=r.col;ctx.beginPath();ctx.arc(x,gy,R,0,TAU);ctx.stroke();
      ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.beginPath();ctx.arc(x,gy,R+3,Math.PI*1.05,Math.PI*1.5);ctx.stroke();
    }
  }
}

/* ---- 9. QUICK DRAW ---- */
class DrawLevel extends Level{
  constructor(){super();this.limit=22;this.early=false;this.round=0;this.phase='gap';this.pt=0.6;this.bot=[];this.got=0;this.bestMs=null;this.sy=650;this.drawT=0;
    this.slots=[420,636,852,1068,1284,1500];}
  progress(){return `BOTTLES ${this.got} / 6`;}
  passCheck(){return this.got>=4;}
  focus(){const b=this.bot.find(b=>b.alive);return b?{x:b.x,y:this.sy-80}:{x:960,y:this.sy-80};}
  update(dt){
    this.pt-=dt;for(const b of this.bot)b.up=Math.min(1,b.up+dt*16);
    if(this.pt>0||this.done)return;
    if(this.phase==='gap'){
      if(this.round>=5){if(this.got===6)bonus(400,'FASTEST GUN',960,420,'#ff7af0');this.finish(this.got>=4,'TOO SLOW');return;}
      this.phase='wait';this.pt=rnd(0.8,1.9);this.round++;this.bot=[];sfx.tick();
    }else if(this.phase==='wait'){
      this.phase='draw';this.drawT=this.t;const n=this.round===5?2:1,s=this.slots.slice();
      for(let i=0;i<n;i++)this.bot.push({x:s.splice((Math.random()*s.length)|0,1)[0],up:0,alive:true});
      this.pt=n===2?1.5:1.2;sfx.bell();flash=0.18;
    }else{
      for(const b of this.bot)if(b.alive){popup('TOO SLOW',b.x,this.sy-200,'#ff6b6b');b.alive=false;}
      sfx.lost();this.phase='gap';this.pt=0.5;
    }
  }
  shoot(x,y){
    if(this.done)return false;
    if(this.phase==='wait'){popup('JUMPED THE GUN!',960,400,'#ff6b6b',60);sfx.buzz();this.phase='gap';this.pt=0.8;return 'bad';}
    if(this.phase!=='draw')return false;
    for(const b of this.bot){
      if(!b.alive||Math.abs(x-b.x)>34||y<this.sy-168||y>this.sy+4)continue;
      const ms=Math.round((this.t-this.drawT)*1000);b.alive=false;this.got++;if(this.bestMs==null||ms<this.bestMs)this.bestMs=ms;
      const py=this.sy-230;
      if(ms<450){award(600,'LIGHTNING',b.x,py,'#ff7af0');cheer(0.7);flash=0.25;}
      else if(ms<650)award(400,'FAST',b.x,py,'#7ae8ff');
      else if(ms<900)award(250,'QUICK',b.x,py);
      else award(120,'SLOWPOKE',b.x,py,'#cccccc');
      popup(ms+' MS',b.x,py,'#ffffff',36);
      shards(b.x,this.sy-80,16,'#54d79a');shards(b.x,this.sy-80,6,'#f3e9cf',380);spark(b.x,this.sy-80,12,'#d8ffe9',520,0.4,3);sfx.glass();shake=Math.max(shake,5);
      if(!this.bot.some(b=>b.alive)){this.phase='gap';this.pt=0.5;}
      return true;
    }
    return false;
  }
  draw(){
    const sy=this.sy;
    ctx.fillStyle='#2a1608';[400,960,1520].forEach(x=>ctx.fillRect(x-14,sy+20,28,FLOOR-sy-20));
    for(let i=1;i<=5;i++){ctx.fillStyle=i<this.round||(i===this.round&&this.phase==='gap')?'#7dffb2':i===this.round?'#ffd34d':'rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(960+(i-3)*44,sy+78,10,0,TAU);ctx.fill();}
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,sy);ctx.clip();
    for(const b of this.bot){if(!b.alive)continue;const u=easeBack(b.up);glowAt(b.x,sy-80,120,'#7dffb2',0.5*b.up);spr(BOTTLE,b.x,sy-82*u+90*(1-u));}
    ctx.restore();
    const g=ctx.createLinearGradient(0,sy,0,sy+30);g.addColorStop(0,'#c08a4a');g.addColorStop(1,'#5a3418');
    rr(ctx,330,sy,1260,30,8);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#2a1608';ctx.lineWidth=3;ctx.stroke();
    for(const x of this.slots){ctx.strokeStyle='rgba(42,22,8,0.6)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,sy+8,30,5,0,0,TAU);ctx.stroke();}
    if(this.phase==='wait')text('STEADY...',960,330,70,`rgba(255,227,110,${0.55+0.35*Math.sin(this.t*10)})`);
    else if(this.phase==='draw'&&this.t-this.drawT<0.4){const k=(this.t-this.drawT)/0.4;ctx.globalAlpha=1-k;text(this.bot.length>1?'DOUBLE DRAW!':'DRAW!',960,330,130+k*40,'#ff5a6a');ctx.globalAlpha=1;}
  }
}

const GRADE_ORDER='FCBAS',GRADE_COL={S:'#ff7af0',A:'#7dffb2',B:'#7ae8ff',C:'#ffe36e',F:'#ff6b6b'};
function gradeOf(lv,l){if(!l.passed)return 'F';const s=l.score,g=lv.G;return s>=g[2]?'S':s>=g[1]?'A':s>=g[0]?'B':'C';}

/* ============================================================
   GAME STATE, INPUT, UI
   ============================================================ */
let state='menu',LD=null,lvIdx=0,stT=0,show=null,result=null,mx=W/2,my=H/2,buttons=[],dispScore=0,clock=0,LOGO=null;
const PCOL=['#ff5fa2','#4fd8ff'];
const pcol=()=>show&&show.players===2?PCOL[show.turn]:'#ffe9b0';
function startLevel(i){lvIdx=i;LD=LEVELS[i];L=LD.mk();state='intro';stT=0;parts=[];pops=[];rings=[];slow=0;hitstop=0;dispScore=0;hype=Math.max(hype,0.3);sfx.roll(INTRO-0.25);}
function startShow(players){show={players,act:0,turn:0,totals:[0,0],grades:[[],[]],scores:[[],[]]};startLevel(0);}
function goMenu(){state='menu';L=null;show=null;parts=[];pops=[];sfx.rollStop();}
function quickRetry(){if(show||!LD)return;if(state==='play'||state==='result'||state==='intro')startLevel(lvIdx);}
function toggleFS(){try{const r=!document.fullscreenElement?document.documentElement.requestFullscreen():document.exitFullscreen();if(r&&r.catch)r.catch(()=>{});}catch(e){}}
let ROLLB=null;
sfx.roll=function(dur){
  if(!AC)return;if(!ROLLB){ROLLB=AC.createGain();ROLLB.connect(SFXB);}
  ROLLB.gain.cancelScheduledValues(AC.currentTime);ROLLB.gain.setValueAtTime(1,AC.currentTime);
  for(let t=0;t<dur;t+=0.052){const k=t/dur;nz({d:t,type:'bandpass',f:1900,q:0.7,dur:0.05,vol:0.04+0.2*k*k,bus:ROLLB});}
};
sfx.rollStop=function(){if(ROLLB)ROLLB.gain.setTargetAtTime(0,AC.currentTime,0.015);};
sfx.go=function(){nz({type:'highpass',f:5200,dur:1.3,vol:0.3,rev:0.5});osc({f:130,f2:45,dur:0.25,vol:0.8});};

function onEnd(){
  L.endHandled=true;L.endT=0;popStack=0;
  if(L.passed){
    const rem=L.limit-L.t;
    if(L.early&&rem>0.5)bonus(Math.floor(rem)*25,'TIME BONUS',960,700);
    if(L.misses===0&&L.shots>0)bonus(300,'FLAWLESS',960,700);
    sfx.clear();cheer(0.8);burst(960,FLOOR,50);
  }else{sfx.fail();sfx.aww();}
}
function toResult(){
  state='result';stT=0;
  const g=gradeOf(LD,L),id=LD.id,prev=SAVE.best[id]||0,newBest=L.passed&&L.score>prev;
  if(newBest)SAVE.best[id]=L.score;
  if(GRADE_ORDER.indexOf(g)>GRADE_ORDER.indexOf(SAVE.grade[id]||'F'))SAVE.grade[id]=g;
  if(show){show.totals[show.turn]+=L.score;show.grades[show.turn].push(g);show.scores[show.turn].push(L.score);}
  persist();
  result={grade:g,score:L.score,newBest,best:SAVE.best[id]||0,shots:L.shots,acc:L.shots?Math.round(100*L.hits/L.shots):0,streak:L.bestStreak,log:L.log,passed:L.passed,msg:L.msg,stamped:false,extra:L.bestMs!=null?`BEST DRAW ${L.bestMs} MS`:''};
}
function showNext(){
  if(show.turn<show.players-1){show.turn++;startLevel(show.act);return;}
  show.turn=0;show.act++;
  if(show.act<LEVELS.length){startLevel(show.act);return;}
  state='final';stT=0;show.newBest=false;
  if(show.players===1&&show.totals[0]>(SAVE.show||0)){SAVE.show=show.totals[0];show.newBest=true;persist();}
  sfx.clear();cheer(1);confetti(160);
}

/* ---------------- input ---------------- */
function toV(e){const r=cv.getBoundingClientRect();return{x:((e.clientX-r.left)*DPR-OX)/S,y:((e.clientY-r.top)*DPR-OY)/S};}
cv.addEventListener('pointermove',e=>{const p=toV(e);mx=p.x;my=p.y;});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();const p=toV(e);mx=p.x;my=p.y;
  if(e.button===2){quickRetry();return;}
  if(e.button===0||e.pointerType!=='mouse')fire(p.x,p.y);
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  initAudio();const k=e.key.toLowerCase();
  if(k==='f')toggleFS();
  else if(k==='c'){SAVE.xhair=!SAVE.xhair;persist();}
  else if(k==='g'){SAVE.glow=!SAVE.glow;persist();}
  else if(k==='m')setMusic(!SAVE.music);
  else if(k==='escape')goMenu();
  else if(k==='r')quickRetry();
  else if(k===' '||k==='enter'){e.preventDefault();if((state==='result'&&stT>0.9)||state==='final'){if(buttons[0])buttons[0].act();}}
  else if(state==='menu'&&k>='1'&&k<='9')startLevel(+k-1);
});
function fire(x,y){
  const playing=state==='play'&&!L.done;
  if(playing&&L.ammo!=null&&L.ammo<=0){sfx.dry();return;}
  tracers.push({x,y,t:0,col:pcol()});ring(x,y,60,'255,255,255',0.2);sfx.shot();
  if(state==='menu'||state==='result'||state==='final'){
    if(state==='result'&&stT<0.9)return;
    for(const b of buttons)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){sfx.click();spark(x,y,10,'#ffffff',300,0.3,3);b.act();return;}
    return;
  }
  if(state==='intro'){if(stT<INTRO-0.2){stT=INTRO-0.2;sfx.rollStop();}return;}
  if(!playing)return;
  popStack=0;L.shots++;if(L.ammo!=null)L.ammo--;
  const m0=L.streak,r=L.shoot(x,y);
  if(r===true){L.hits++;L.streak++;L.bestStreak=Math.max(L.bestStreak,L.streak);hitmark=0.2;if(L.streak<=8&&L.streak>m0)sfx.streak(L.streak);}
  else if(r==='meh'){L.hits++;hitmark=0.12;}
  else{L.misses++;if(r!=='bad'){spark(x,y,6,'#c8c0d8',180,0.3,2.5,0);smoke(x,y,1);}
    if(L.streak>=2){popup('STREAK LOST',x,y+70,'#ff6b6b',34);sfx.lost();}L.streak=0;}
}

/* ---------------- update ---------------- */
function update(gdt,dt){
  stT+=dt;
  if(state==='intro'&&stT>=INTRO){state='play';stT=0;popStack=0;popup('GO!',W/2,H/2-40,'#7dffb2',130);sfx.go();flash=0.2;}
  if(state==='play'){
    L.t+=gdt;L.update(gdt);
    if(!L.done&&L.t>=L.limit)L.timeUp();
    if(L.done){if(!L.endHandled)onEnd();else{L.endT+=dt;if(L.endT>1.7)toResult();}}
    dispScore+=(L.score-dispScore)*Math.min(1,dt*12);
  }
  if(state==='result'&&!result.stamped&&stT>0.35){result.stamped=true;sfx.stamp();shake=10;
    const g=result.grade;if(g==='S'){cheer(1);confetti(140);flash=0.3;}else if(g==='A')cheer(0.75);else if(g==='B')cheer(0.45);else if(g==='C')applause(1.2,0.2);else sfx.ooh();}
  updateFX(gdt,dt);
}

/* ---------------- UI drawing ---------------- */
const inBtn=b=>mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h;
function panel(x,y,w,h,col,a=0.9){rr(ctx,x,y,w,h,22);ctx.fillStyle=`rgba(16,7,34,${a})`;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=col;ctx.stroke();}

    const x=150+(i%3)*550,y=262+((i/3)|0)*174,w=520,h=160,b={x,y,w,h,act:()=>{show=null;startLevel(i);}};buttons.push(b);

  });

    .forEach(([label,on,act],i)=>buttons.push({x:1250+i*132,y:by,w:122,h:92,label,size:24,act,col:on?'#7dffb2':'#8a7aa0',dim:!on}));

const HUDBAR=mk(8,120,g=>{const r=g.createLinearGradient(0,0,0,120);r.addColorStop(0,'rgba(6,3,16,0.9)');r.addColorStop(0.7,'rgba(6,3,16,0.6)');r.addColorStop(1,'rgba(6,3,16,0)');g.fillStyle=r;g.fillRect(0,0,8,120);});
function drawHUD(){

  const rem=Math.max(0,L.limit-L.t),low=rem<5&&!L.done;
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(0,88,W,6);ctx.fillStyle=low?'#ff5a6a':'#7ae8ff';ctx.fillRect(0,88,W*rem/L.limit,6);

function drawIntro(){

  text('SHOOT TO SKIP',W/2,740,20,'rgba(255,255,255,0.45)');ctx.globalAlpha=1;

function drawEndBanner(){
  const s=easeBack(L.endT/0.25),ok=L.passed,msg=ok?'CLEAR!':(L.msg||'MISSED IT');
  glowAt(W/2,H/2-60,520,ok?'#7dffb2':'#ff6b6b',0.5);
  ctx.save();ctx.translate(W/2,H/2-60);ctx.rotate(-0.04);text(msg,0,0,130*Math.max(0.2,s),ok?'#7dffb2':'#ff6b6b','center',FD,1600);ctx.restore();

function drawResult(){
  buttons=[];const r=result,px=330,py=120,pw=1260,ph=660;
  ctx.fillStyle='rgba(5,2,15,0.6)';ctx.fillRect(0,0,W,H);
  panel(px,py,pw,ph,pcol()==='#ffe9b0'?'#ff5fa2':pcol(),0.95);

  if(stT>0.35){const k=clamp((stT-0.35)/0.18,0,1),sc=1+(1-easeOut(k))*2.2,gc=GRADE_COL[r.grade];
    glowAt(px+300,py+330,300,gc,0.6);ctx.save();ctx.translate(px+300,py+330);ctx.rotate(-0.1);ctx.globalAlpha=k;
    ctx.lineWidth=10;ctx.strokeStyle=gc;ctx.beginPath();ctx.arc(0,0,170*sc,0,TAU);ctx.stroke();ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,150*sc,0,TAU);ctx.stroke();
    text(r.grade,0,10,230*sc,gc);ctx.restore();ctx.globalAlpha=1;}
  text('STYLE GRADE',px+300,py+540,24,'rgba(255,255,255,0.6)');
  const cx=px+570,rx=px+pw-70,cnt=Math.round(r.score*easeOut(clamp((stT-0.2)/0.8,0,1)));
  text('SCORE',cx,py+210,28,'rgba(255,255,255,0.6)','left');text(String(cnt),rx,py+206,72,'#ffe36e','right');
  text('BEST',cx,py+290,26,'rgba(255,255,255,0.6)','left');text(String(r.best),rx,py+290,38,'#ffffff','right');

  text('BEST STREAK',cx,py+410,26,'rgba(255,255,255,0.6)','left');text(`x${(1+0.125*Math.min(r.streak,8)).toFixed(2)}`,rx,py+410,38,'#ffffff','right');
  const gi=GRADE_ORDER.indexOf(r.grade);
  if(r.newBest&&(stT*3|0)%2===0)text('NEW BEST!',cx+320,py+475,40,'#ff7af0');
  else if(r.extra)text(r.extra,cx+320,py+475,30,'#7ae8ff');
  else if(r.passed&&r.grade!=='S')text(`${GRADE_ORDER[gi+1]} RANK AT ${LD.G[gi-1]}`,cx+320,py+475,26,'rgba(255,255,255,0.55)');
  const entries=Object.entries(r.log).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(entries.length){
    ctx.font='22px '+FD;const chips=entries.map(([k,v])=>v>1?`${k} ×${v}`:k),ws=chips.map(c=>ctx.measureText(c).width+34);
    let rows=[[]],rw=[0];chips.forEach((c,i)=>{if(rw[rows.length-1]+ws[i]>pw-80){rows.push([]);rw.push(0);}rows[rows.length-1].push(i);rw[rw.length-1]+=ws[i]+12;});
    rows.slice(0,2).forEach((row,ri)=>{let x=W/2-(rw[ri]-12)/2;const y=py+ph-92+ri*48;
      for(const i of row){rr(ctx,x,y-20,ws[i],40,20);ctx.fillStyle='rgba(122,232,255,0.14)';ctx.fill();text(chips[i],x+ws[i]/2,y+2,22,'#7ae8ff');x+=ws[i]+12;}});
  }
  const by=812;
  if(show){
    const last=show.act>=LEVELS.length-1&&show.turn>=show.players-1,nx=show.players===2&&show.turn===0?'PLAYER 2 UP':last?'FINAL SCORE':'NEXT ACT';
    buttons.push({x:540,y:by,w:520,h:110,label:nx,size:48,act:showNext,col:'#7dffb2'});
    buttons.push({x:1100,y:by,w:280,h:110,label:'QUIT',size:42,act:goMenu,col:'#b48cff'});
    text(show.players===2?`P1 ${show.totals[0]}   ·   P2 ${show.totals[1]}`:`SHOW TOTAL ${show.totals[0]}`,W/2,by+134,24,'#ffe36e');
  }else{
    buttons.push({x:400,y:by,w:460,h:110,label:'RETRY',size:56,act:()=>startLevel(lvIdx),col:'#7dffb2'});
    buttons.push({x:900,y:by,w:340,h:110,label:'NEXT ACT',size:38,act:()=>startLevel((lvIdx+1)%LEVELS.length),col:'#7ae8ff'});
    buttons.push({x:1280,y:by,w:240,h:110,label:'MENU',size:42,act:goMenu,col:'#b48cff'});
  }
  if(stT>0.9)buttons.forEach(drawButton);
}
function rankOf(t){const s=i=>LEVELS.reduce((a,l)=>a+l.G[i],0);return t>=s(2)?'LEGEND OF THE WEST':t>=s(1)?'SHARPSHOOTER':t>=s(0)?'DEADEYE':'GREENHORN';}
function drawFinal(){
  buttons=[];ctx.fillStyle='rgba(5,2,15,0.7)';ctx.fillRect(0,0,W,H);
  const two=show.players===2,T=show.totals;

  }else{

    if(two){for(let p=0;p<2;p++){const g=show.grades[p][i]||'-';text(g,x-44,y+34+p*66,50,GRADE_COL[g]||'#fff');text(String(show.scores[p][i]||0),x+78,y+36+p*66,24,PCOL[p],'right');}}
    else{const g=show.grades[0][i]||'-';text(g,x-36,y+44,62,GRADE_COL[g]||'#fff');text(String(show.scores[0][i]||0),x+78,y+46,22,'#ffe36e','right');}

function drawCrosshair(){
  if(!SAVE.xhair)return;const c=pcol(),k=hitmark/0.2;
  ctx.lineCap='butt';
  for(let p=0;p<2;p++){
    ctx.lineWidth=p?3:7;ctx.strokeStyle=p?'#ffffff':'rgba(0,0,0,0.65)';ctx.beginPath();ctx.arc(mx,my,22,0,TAU);
    ctx.moveTo(mx-36,my);ctx.lineTo(mx-12,my);ctx.moveTo(mx+12,my);ctx.lineTo(mx+36,my);ctx.moveTo(mx,my-36);ctx.lineTo(mx,my-12);ctx.moveTo(mx,my+12);ctx.lineTo(mx,my+36);ctx.stroke();
  }
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(mx,my,3.5,0,TAU);ctx.fill();
  if(k>0){const a=26+(1-k)*16;ctx.strokeStyle=`rgba(255,80,110,${k})`;ctx.lineWidth=5;ctx.beginPath();
    for(const [sx,sy] of [[1,1],[1,-1],[-1,1],[-1,-1]]){ctx.moveTo(mx+sx*a,my+sy*a);ctx.lineTo(mx+sx*(a+16),my+sy*(a+16));}ctx.stroke();}
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
  let gdt=dt;if(hitstop>0){hitstop-=dt;gdt=0;}else if(slow>0){slow-=dt;gdt=dt*0.3;}
  update(gdt,dt);
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;
  ctx.setTransform(S,0,0,S,OX+sx*S,OY+sy*S);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.drawImage(BG,0,0);
  const inLevel=L&&(state==='play'||state==='intro'||state==='result');
  drawStageLights(clock,inLevel&&state==='play'?L.focus():null,dt);
  if(inLevel)L.draw();
  drawParts();
  drawCrowd(clock);
  if(SAVE.glow)ctx.drawImage(VIG,0,0,W,H);
  if(state==='menu')drawMenu(clock);
  else if(state==='play'){drawHUD();if(L.done&&L.endHandled)drawEndBanner();}
  else if(state==='intro'){drawHUD();drawIntro();}
  else if(state==='result')drawResult();
  else if(state==='final')drawFinal();
  drawPops();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*0.5})`;ctx.fillRect(0,0,W,H);}
  drawCrosshair();
  ctx.restore();
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load)document.fonts.load('40px Bungee').then(()=>{LOGO=null;CARD_F=mkCardF();});
requestAnimationFrame(frame);

</script>

addEventListener('keydown',function(e){if(e.key==='Home')go();if(e.key==='Escape'&&!t&&!e.repeat)t=setTimeout(go,1000);},true);
