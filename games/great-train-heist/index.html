<script>
'use strict';
/* =====================================================================
   GREAT TRAIN HEIST — side-view pixel-art light gun shooter (1-2 players)
   The robot Rustler Gang has hijacked the Gold Line Express. Ride alongside
   the train, work your way from the caboose up to the engine, and blast the
   bandits popping out of windows, off the roof and between the cars.
   PASSENGERS POP UP TOO. Shooting one costs a star and 500 points.
   3 stages: Desert Dash, Canyon Crossing, Midnight Express (+ a boss each).
   (OpenFIRE guns in gamepad mode, mouse, or keyboard)
   ===================================================================== */
const W = 1280, H = 720, LW = 320, LH = 180, SC = 4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function resize(){ const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px'; }
addEventListener('resize', resize); resize();
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH; const g = lo.getContext('2d');
ctx.imageSmoothingEnabled = false; g.imageSmoothingEnabled = false;

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.random() * a.length | 0];

/* ---------- tuning ---------- */
const CLIP = 6, RELOAD_T = 0.45, AUTO_RELOAD_T = 1.1, MAX_STARS = 6;
const PASSENGER_PENALTY = 500;      // points lost for shooting a passenger (they also cost a star)
const HARD = 1.0;                   // overall difficulty: raise for quicker draws, lower to relax
/* Optional music: drop your own files here and they replace the built-in chiptune. */
const MUSIC_FILES = { title:'music/title.mp3', desert:'music/desert.mp3', canyon:'music/canyon.mp3', night:'music/night.mp3', boss:'music/boss.mp3' };

/* ---------- palette ---------- */
const C = {
  k:'#14101e', u:'#24222f', d:'#3a3a4e', g:'#6b7088', l:'#a8b0c4', w:'#f4f1e6',
  r:'#c8323a', R:'#ff4a3c', o:'#f08a24', y:'#ffd23f', Y:'#fff3a0',
  n:'#8a5a32', N:'#4e301a', t:'#c8a070', b:'#3a6fd8', c:'#6fd8ff', G:'#3c9a44'
};
const P1C = '#4fc3ff', P2C = '#ff9f2e';

/* ---------- tiny sprite toolkit (everything is drawn pixel by pixel) ---------- */
function mk(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); fn(x, w, h); return c; }
function R(x, X, Y, w, h, col){ x.fillStyle = C[col] || col; x.fillRect(X, Y, w, h); }
function Mr(x, W2, X, Y, w, h, col){ R(x, X, Y, w, h, col); R(x, W2 - X - w, Y, w, h, col); }
function blob(x, cx, cy, r, col, sy){ x.fillStyle = C[col] || col; sy = sy || 1; for (let dy = -Math.round(r*sy); dy <= Math.round(r*sy); dy++){ const hw = Math.floor(Math.sqrt(Math.max(0, r*r - (dy/sy)*(dy/sy)))); x.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw*2 + 1, 1); } }
function pl(x, x0, y0, x1, y1, col, wd){ wd = wd || 1; const n = Math.max(1, Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)))); x.fillStyle = C[col] || col; for (let i = 0; i <= n; i++){ const t = i / n; x.fillRect(Math.round(x0 + (x1 - x0)*t - (wd - 1)/2), Math.round(y0 + (y1 - y0)*t - (wd - 1)/2), wd, wd); } }
function fromMap(rows, mirror){
  const r = mirror ? rows.map(s => s + s.split('').reverse().join('')) : rows;
  return mk(Math.max(...r.map(s => s.length)), r.length, x => r.forEach((s, yy) => { for (let xx = 0; xx < s.length; xx++){ const ch = s[xx]; if (ch !== '.' && C[ch]){ x.fillStyle = C[ch]; x.fillRect(xx, yy, 1, 1); } } }));
}
let seedN = 11; const srand = () => (seedN = (seedN * 1664525 + 1013904223) >>> 0) / 4294967296;
const whiteCache = new Map();
function white(img){
  let w = whiteCache.get(img); if (w) return w;
  w = mk(img.width, img.height, x => { x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, img.width, img.height); });
  whiteCache.set(img, w); return w;
}

/* ---------- pixel font (5x7) ---------- */
const F5 = {
'A':[14,17,17,31,17,17,17],'B':[30,17,17,30,17,17,30],'C':[14,17,16,16,16,17,14],'D':[30,17,17,17,17,17,30],'E':[31,16,16,30,16,16,31],'F':[31,16,16,30,16,16,16],
'G':[14,17,16,23,17,17,15],'H':[17,17,17,31,17,17,17],'I':[14,4,4,4,4,4,14],'J':[7,2,2,2,2,18,12],'K':[17,18,20,24,20,18,17],'L':[16,16,16,16,16,16,31],
'M':[17,27,21,21,17,17,17],'N':[17,17,25,21,19,17,17],'O':[14,17,17,17,17,17,14],'P':[30,17,17,30,16,16,16],'Q':[14,17,17,17,21,18,13],'R':[30,17,17,30,20,18,17],
'S':[15,16,16,14,1,1,30],'T':[31,4,4,4,4,4,4],'U':[17,17,17,17,17,17,14],'V':[17,17,17,17,17,10,4],'W':[17,17,17,21,21,21,10],'X':[17,17,10,4,10,17,17],
'Y':[17,17,17,10,4,4,4],'Z':[31,1,2,4,8,16,31],
'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],
'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
' ':[0,0,0,0,0,0,0],'!':[4,4,4,4,4,0,4],'?':[14,17,1,2,4,0,4],'.':[0,0,0,0,0,12,12],',':[0,0,0,0,12,4,8],"'":[12,4,8,0,0,0,0],'-':[0,0,0,31,0,0,0],
':':[0,12,12,0,12,12,0],'/':[1,1,2,4,8,16,16],'+':[0,4,4,31,4,4,0],'%':[24,25,2,4,8,19,3],'#':[10,10,31,10,31,10,10],'>':[8,4,2,1,2,4,8],'<':[2,4,8,16,8,4,2],
'(':[2,4,8,8,8,4,2],')':[8,4,2,2,2,4,8],'*':[0,4,21,14,21,4,0],'=':[0,0,31,0,31,0,0],'@':[0,10,31,31,14,4,0],'&':[12,18,20,8,21,18,13]
};
const txtCache = new Map();
function textCanvas(s, col){
  const key = s + '|' + col; let c = txtCache.get(key); if (c) return c;
  if (txtCache.size > 500) txtCache.clear();
  c = mk(Math.max(1, s.length * 6 - 1), 7, x => { x.fillStyle = col; for (let i = 0; i < s.length; i++){ const gl = F5[s[i]] || F5['?']; for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if (gl[r] >> (4 - b) & 1) x.fillRect(i*6 + b, r, 1, 1); } });
  txtCache.set(key, c); return c;
}
function ptxt(s, x, y, col, sc, align, sh){
  s = String(s).toUpperCase(); sc = sc || 1;
  const c = textCanvas(s, col), w = c.width * sc;
  let X = align === 'center' ? x - w/2 : align === 'right' ? x - w : x; X = Math.round(X); y = Math.round(y);
  if (sh !== null){ g.drawImage(textCanvas(s, sh || '#000'), X + sc, y + sc, w, 7*sc); }
  g.drawImage(c, X, y, w, 7*sc);
  return w;
}
function ftext(x, s, X, Y, col){ x.drawImage(textCanvas(s.toUpperCase(), C[col] || col), X, Y); }

/* ---------- sprites ---------- */
const SPR = {};
function hex(c){ c = C[c] || c; return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function outline(src){                     // pads by 1px and adds a dark outline
  const w = src.width + 2, h = src.height + 2;
  return mk(w, h, x => {
    x.drawImage(src, 1, 1); const im = x.getImageData(0, 0, w, h), d = im.data, a = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
    const k = hex('k');
    for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++){ const i = y * w + xx; if (a[i]) continue; if ((xx > 0 && a[i - 1]) || (xx < w - 1 && a[i + 1]) || (y > 0 && a[i - w]) || (y < h - 1 && a[i + w])){ d[i*4] = k[0]; d[i*4+1] = k[1]; d[i*4+2] = k[2]; d[i*4+3] = 255; } }
    x.putImageData(im, 0, 0);
  });
}

/* =====================================================================
   SPRITES — robot bandits & passengers (all drawn pixel by pixel, cached)
   ===================================================================== */
const SPRC = new Map();
function spr(key, w, h, fn){ let c = SPRC.get(key); if (!c){ c = outline(mk(w, h, fn)); SPRC.set(key, c); } return c; }
function flipX(img){ const k = 'flip'; if (img[k]) return img[k]; img[k] = mk(img.width, img.height, x => { x.translate(img.width, 0); x.scale(-1, 1); x.drawImage(img, 0, 0); }); return img[k]; }

const BV = {   // bandit variants
  grunt:  { id:'grunt',  hat:'#6a4428', hatL:'#8a5e3a', band:'#2a1a10', bnd:'#c8323a', coat:'#6b4a2e', coatL:'#8a6240', vest:'#3a3a4e', metal:'#8a90a4', metalL:'#c6ccd8', eye:'#ff4a3c', hp:1, pts:100, aim:1.0 },
  slinger:{ id:'slinger',hat:'#1c1a24', hatL:'#3a3646', band:'#ffd23f', bnd:'#24222f', coat:'#2a2836', coatL:'#46425a', vest:'#8a2a2a', metal:'#6b7088', metalL:'#a8b0c4', eye:'#ffd23f', hp:1, pts:200, aim:0.7 },
  brute:  { id:'brute',  hat:'#4e301a', hatL:'#6a4428', band:'#c8323a', bnd:'#565b6a', coat:'#8a2a2a', coatL:'#b8463c', vest:'#4a4a5e', metal:'#565b6a', metalL:'#8a90a4', eye:'#ff4a3c', hp:3, pts:300, aim:1.25 },
  boomer: { id:'boomer', hat:'#8a6a3a', hatL:'#b08a50', band:'#f08a24', bnd:'#f08a24', coat:'#5a4a3a', coatL:'#7a6a52', vest:'#c8a070', metal:'#8a90a4', metalL:'#c6ccd8', eye:'#ff4a3c', hp:1, pts:150, aim:1 },
  gold:   { id:'gold',   hat:'#ffd23f', hatL:'#fff3a0', band:'#c8323a', bnd:'#ffd23f', coat:'#b8843a', coatL:'#e0b050', vest:'#fff3a0', metal:'#e0b050', metalL:'#fff3a0', eye:'#6fd8ff', hp:1, pts:1000, aim:0.75 },
  duke:   { id:'duke',   hat:'#f4f1e6', hatL:'#ffffff', band:'#c8323a', bnd:'#3a6fd8', coat:'#8a2430', coatL:'#b8404a', vest:'#e8d0a0', metal:'#a8b0c4', metalL:'#e0e4ec', eye:'#ff4a3c', hp:1, pts:0, aim:1 },
  baron:  { id:'baron',  hat:'#14101e', hatL:'#3a3a4e', band:'#c040e0', bnd:'#c040e0', coat:'#3a1a4a', coatL:'#5a2a6a', vest:'#ffd23f', metal:'#e0b050', metalL:'#fff3a0', eye:'#6fd8ff', hp:1, pts:0, aim:1, top:true }
};
const PV = [   // passengers
  { id:'lady',   hat:'bonnet', hatC:'#c040e0', hatL:'#e07aff', hair:'#6b3a1a', skin:'#f0c8a0', body:'#7a3aa0', bodyL:'#9a5ac0', trim:'#f4f1e6', dress:true },
  { id:'gent',   hat:'bowler', hatC:'#24222f', hatL:'#46425a', hair:'#3a2a1a', skin:'#c8875a', body:'#6b4a2e', bodyL:'#8a6240', trim:'#f4f1e6', stache:true },
  { id:'miner',  hat:'floppy', hatC:'#b08a50', hatL:'#d0aa70', hair:'#e8e4dc', skin:'#e8b07a', body:'#3a6fd8', bodyL:'#6fa0ff', trim:'#c8323a', beard:true },
  { id:'granny', hat:'bun',    hatC:'#c6c6d0', hatL:'#f4f1e6', hair:'#c6c6d0', skin:'#f0c8a0', body:'#2f7a3a', bodyL:'#4a9a54', trim:'#f4f1e6', specs:true, dress:true },
  { id:'rancher',hat:'cowboy', hatC:'#f4f1e6', hatL:'#ffffff', hair:'#e8a040', skin:'#8a5a3a', body:'#c8323a', bodyL:'#e85a50', trim:'#f4f1e6' },
  { id:'dandy',  hat:'top',    hatC:'#3a2a5a', hatL:'#5a4a7a', hair:'#14101e', skin:'#6a4228', body:'#e0b050', bodyL:'#fff3a0', trim:'#3a2a5a', stache:true },
  { id:'nurse',  hat:'cap',    hatC:'#f4f1e6', hatL:'#ffffff', hair:'#3a2a1a', skin:'#d89a6a', body:'#6fd8ff', bodyL:'#a8eaff', trim:'#f4f1e6', dress:true }
];
const CONDUCTOR = { id:'cond', hat:'conductor', hatC:'#24346c', hatL:'#3a52a0', hair:'#6b3a1a', skin:'#e8b07a', body:'#24346c', bodyL:'#3a52a0', trim:'#ffd23f', stache:true };

function rr(x){ return (X, Y, w, h, c) => R(x, X, Y, w, h, c); }
function banditHat(r, v, y0, wide){
  if (v.top){ r(6, y0 - 3, 8, 6, v.hat); r(6, y0 - 3, 8, 1, v.hatL); r(6, y0 + 1, 8, 1, v.band); r(3, y0 + 3, 14, 1, v.hat); return; }
  r(6, y0, 8, 1, v.hat); r(5, y0 + 1, 10, 2, v.hat); r(9, y0, 2, 1, v.hatL); r(5, y0 + 3, 10, 1, v.band);
  r(0, y0 + 4, wide, 2, v.hat); r(0, y0 + 4, wide, 1, v.hatL); r(0, y0 + 3, 2, 1, v.hat); r(wide - 2, y0 + 3, 2, 1, v.hat);
}
/* bust, 20x22 (window / crate peeker). poses: idle aim throw hurt */
function banditBust(v, pose){
  return spr('bb' + v.id + pose, 20, 22, x => {
    const r = rr(x);
    r(1, 15, 18, 7, v.coat); r(1, 15, 18, 1, v.coatL); r(8, 15, 4, 7, v.vest); r(9, 17, 1, 1, '#ffd23f'); r(10, 20, 1, 1, '#ffd23f');
    r(8, 13, 4, 2, '#3a3a4e');
    r(5, 5, 10, 9, v.metal); r(5, 5, 10, 1, v.metalL); r(5, 5, 1, 9, v.metalL); r(14, 6, 1, 8, '#3a3a4e');
    r(5, 7, 10, 3, '#14101e');
    if (pose === 'hurt'){ r(6, 8, 3, 1, '#fff3a0'); r(11, 8, 3, 1, '#fff3a0'); }
    else { r(6, 8, 3, 1, v.eye); r(11, 8, 3, 1, v.eye); r(6, 8, 1, 1, '#fff'); r(11, 8, 1, 1, '#fff'); }
    if (v.top){ r(10, 7, 5, 4, '#ffd23f'); r(11, 8, 3, 2, v.eye); }                  // monocle
    r(5, 10, 10, 3, v.bnd); r(6, 13, 8, 1, v.bnd); r(8, 14, 4, 1, v.bnd); r(6, 11, 1, 1, 'rgba(255,255,255,0.5)');
    banditHat(r, v, 0, 20);
    if (pose === 'aim'){ r(14, 14, 4, 6, v.coat); r(13, 10, 6, 6, '#3a3a4e'); r(14, 11, 4, 4, '#14101e'); r(15, 12, 2, 2, '#000'); r(12, 15, 3, 3, v.metal); }
    else if (pose === 'throw'){ r(15, 5, 3, 11, v.coat); r(14, 1, 5, 4, '#c8323a'); r(15, 1, 1, 4, '#ff6a5a'); r(16, 0, 1, 1, '#ffd23f'); }
    else if (pose === 'hurt'){ r(0, 8, 3, 8, v.coat); r(17, 8, 3, 8, v.coat); }
    else { r(16, 16, 3, 6, v.coatL); r(17, 19, 2, 3, '#3a3a4e'); }
  });
}
/* full body, 16x31 (roof / gap / doorway). poses: stand aim dual run1 run2 throw hurt */
function banditFull(v, pose){
  return spr('bf' + v.id + pose, 16, 31, x => {
    const r = rr(x), boot = '#24222f';
    if (pose === 'run1'){ r(4, 24, 3, 5, v.metal); r(9, 23, 3, 4, v.metal); r(3, 29, 5, 2, boot); r(10, 27, 5, 2, boot); }
    else if (pose === 'run2'){ r(5, 23, 3, 4, v.metal); r(9, 24, 3, 5, v.metal); r(3, 27, 5, 2, boot); r(9, 29, 5, 2, boot); }
    else { r(4, 24, 3, 5, v.metal); r(9, 24, 3, 5, v.metal); r(3, 29, 5, 2, boot); r(8, 29, 5, 2, boot); }
    r(2, 14, 12, 10, v.coat); r(2, 14, 12, 1, v.coatL); r(1, 19, 3, 7, v.coat); r(12, 19, 3, 7, v.coat);
    r(6, 14, 4, 6, v.vest); r(2, 20, 12, 1, '#24222f'); r(7, 20, 2, 1, '#ffd23f');
    r(6, 12, 4, 2, '#3a3a4e');
    r(4, 5, 8, 8, v.metal); r(4, 5, 8, 1, v.metalL); r(4, 5, 1, 8, v.metalL);
    r(4, 6, 8, 2, '#14101e');
    if (pose === 'hurt'){ r(5, 6, 2, 1, '#fff3a0'); r(9, 6, 2, 1, '#fff3a0'); } else { r(5, 6, 2, 1, v.eye); r(9, 6, 2, 1, v.eye); }
    if (v.top){ r(8, 5, 4, 4, '#ffd23f'); r(9, 6, 2, 2, v.eye); }
    r(4, 9, 8, 2, v.bnd); r(5, 11, 6, 1, v.bnd); r(7, 12, 2, 1, v.bnd);
    if (v.top){ r(5, 0, 6, 4, v.hat); r(5, 0, 6, 1, v.hatL); r(5, 3, 6, 1, v.band); r(2, 4, 12, 1, v.hat); }
    else { r(5, 0, 6, 1, v.hat); r(4, 1, 8, 2, v.hat); r(7, 0, 2, 1, v.hatL); r(4, 3, 8, 1, v.band); r(0, 4, 16, 1, v.hat); r(0, 3, 2, 1, v.hat); r(14, 3, 2, 1, v.hat); }
    if (pose === 'aim' || pose === 'dual'){
      r(12, 14, 3, 5, v.coat); r(11, 11, 5, 5, '#3a3a4e'); r(12, 12, 3, 3, '#14101e'); r(13, 13, 1, 1, '#000');
      if (pose === 'dual'){ r(1, 14, 3, 5, v.coat); r(0, 11, 5, 5, '#3a3a4e'); r(1, 12, 3, 3, '#14101e'); r(2, 13, 1, 1, '#000'); } else r(1, 15, 2, 7, v.coat);
    } else if (pose === 'throw'){ r(13, 4, 2, 11, v.coat); r(12, 0, 4, 4, '#c8323a'); r(13, 0, 1, 4, '#ff6a5a'); r(1, 15, 2, 7, v.coat); }
    else if (pose === 'hurt'){ r(0, 9, 2, 8, v.coat); r(14, 9, 2, 8, v.coat); }
    else if (pose === 'run1' || pose === 'run2'){ r(12, 15, 3, 5, v.coat); r(13, 13, 3, 3, '#3a3a4e'); r(1, 15, 2, 6, v.coat); }
    else { r(1, 15, 2, 7, v.coat); r(13, 15, 2, 7, v.coat); r(13, 21, 2, 3, '#3a3a4e'); }
  });
}
function passHat(r, pv, ox){
  const c = pv.hatC, l = pv.hatL;
  switch (pv.hat){
    case 'bonnet': r(ox + 4, 2, 12, 4, c); r(ox + 3, 4, 2, 7, c); r(ox + 15, 4, 2, 7, c); r(ox + 4, 2, 12, 1, l); r(ox + 4, 12, 2, 1, l); r(ox + 14, 12, 2, 1, l); break;
    case 'bowler': r(ox + 6, 1, 8, 4, c); r(ox + 4, 4, 12, 1, c); r(ox + 6, 1, 8, 1, l); break;
    case 'floppy': r(ox + 5, 1, 10, 3, c); r(ox + 2, 4, 16, 2, c); r(ox + 2, 4, 16, 1, l); r(ox + 7, 3, 6, 1, '#7a5a30'); break;
    case 'bun': r(ox + 6, 3, 8, 3, pv.hair); r(ox + 8, 0, 4, 3, pv.hair); r(ox + 9, 0, 2, 1, l); break;
    case 'cowboy': r(ox + 6, 1, 8, 3, c); r(ox + 9, 1, 2, 1, '#c6c0b0'); r(ox + 1, 4, 18, 2, c); r(ox + 1, 4, 18, 1, l); break;
    case 'top': r(ox + 7, 0, 6, 5, c); r(ox + 7, 3, 6, 1, '#c8323a'); r(ox + 4, 5, 12, 1, c); break;
    case 'cap': r(ox + 5, 2, 10, 3, c); r(ox + 9, 2, 2, 3, '#c8323a'); r(ox + 8, 3, 4, 1, '#c8323a'); break;
    case 'conductor': r(ox + 5, 1, 10, 4, c); r(ox + 5, 1, 10, 1, l); r(ox + 4, 5, 12, 1, '#14101e'); r(ox + 9, 2, 2, 2, '#ffd23f'); break;
  }
}

  g.fillStyle = '#b8843a'; g.fillRect(x, y, 16, 13); g.fillStyle = '#d8a858'; g.fillRect(x, y, 16, 2); g.fillStyle = '#8a5a2a'; g.fillRect(x, y + 11, 16, 2);

}
function drawCarExtras(c){

  if (c.door){ const h = c.holes[0], x = c.sx + h.x + Math.round(c.door.open * (h.w - 4)); g.fillStyle = '#14101e'; g.fillRect(x - 1, h.y - 1, h.w + 2, h.h + 1); g.fillStyle = '#8a5432'; g.fillRect(x, h.y, h.w, h.h); g.fillStyle = '#6a3e22'; for (let i = 5; i < h.w; i += 6) g.fillRect(x + i, h.y, 1, h.h); g.fillStyle = '#a8b0c4'; g.fillRect(x + 3, h.y + 26, 3, 6); }
  for (const d of c.decals){ const x = c.sx + d.x; if (d.k === 'hole'){ g.fillStyle = '#14101e'; g.fillRect(Math.round(x), d.y, 1, 1); g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(Math.round(x) - 1, d.y - 1, 1, 1); } else { g.fillStyle = 'rgba(255,255,255,0.7)'; const X = Math.round(x), Y = Math.round(d.y); g.fillRect(X, Y, 1, 1); g.fillRect(X - 2, Y - 1, 2, 1); g.fillRect(X + 1, Y + 1, 2, 1); g.fillRect(X, Y - 3, 1, 2); g.fillRect(X - 1, Y + 2, 1, 2); } }
}
function drawWheels(c){

  const xs = c.w < 120 ? [18, c.w - 18] : [24, 42, c.w - 42, c.w - 24];
  for (const x of xs) wheel(c.sx + x, WY, 6, ang * 2);
}
function drawTrain(){
  const vis = cars.filter(c => c.sx + c.w > -20 && c.sx < LW + 20);
  // couplers and gap platforms
  for (const gp of gaps){ const x = Math.round(gp.x - camX + LW / 2); if (x < -20 || x > LW + 20) continue; g.fillStyle = '#24222f'; g.fillRect(x - GAP / 2 - 2, 134, GAP + 4, 4); g.fillStyle = '#3a3a4e'; g.fillRect(x - GAP / 2 - 2, 134, GAP + 4, 1); g.fillStyle = '#14101e'; g.fillRect(x - 3, 136, 6, 4); }

  for (const c of vis){ g.drawImage(carBody(c), c.sx, BY0); drawCarExtras(c); drawWheels(c); }
  if (boss) boss.draw();
  for (const e of ents) if (e.k === 'crate') drawCrate(e);
  for (const e of ents) if (e.gap) (e.form === 'host' ? drawHost(e) : drawEntImg(e));
}
function drawProjs(){
  for (const q of projs){
    const s = q.s, x = q.x, y = q.y, a = q.t * 9;
    if (q.k === 'tnt'){
      g.save(); g.translate(Math.round(x), Math.round(y)); g.rotate(a); g.fillStyle = '#14101e'; g.fillRect(-2 * s - 1, -5 * s - 1, 4 * s + 2, 10 * s + 2); g.fillStyle = '#c8323a'; g.fillRect(-2 * s, -5 * s, 4 * s, 10 * s); g.fillStyle = '#ff6a5a'; g.fillRect(-2 * s, -5 * s, s, 10 * s); g.fillStyle = '#f4f1e6'; g.fillRect(-2 * s, -s, 4 * s, s * 1.5); g.restore();

    } else if (q.k === 'bag'){
      const r = 4 * s; pcirc(x, y, r + 1, '#14101e'); pcirc(x, y, r, '#c8a070'); pcirc(x - 1, y - 1, r * 0.5, '#e0c090'); g.fillStyle = '#8a5a32'; g.fillRect(Math.round(x - 2), Math.round(y - r - 2), 4, 3); ptxtTo('$', x - 2, y - 3, '#5a3418');
    } else {
      const r = 3.5 * s; pcirc(x, y, r + 1, q.k === 'coal' ? '#ff4a3c' : '#14101e'); pcirc(x, y, r, q.k === 'coal' ? '#24222f' : '#3a3a4e'); pcirc(x - r * 0.3, y - r * 0.3, r * 0.4, q.k === 'coal' ? '#f08a24' : '#6b7088');

}
function drawRings(){
  for (const r of rings){

    pring(r.x, r.y, rad, '#14101e'); pring(r.x, r.y, rad - 1, col);
    if (u > 0.6){ g.fillStyle = col; g.fillRect(Math.round(r.x) - 1, Math.round(r.y - rad - 6), 2, 4); g.fillRect(Math.round(r.x) - 1, Math.round(r.y - rad - 1), 2, 1); }
  }

}
function drawFx(){
  for (const b of booms){ const u = b.t / 0.5, rad = b.r * (0.3 + u); pcirc(b.x, b.y, rad, u < 0.3 ? '#fff3a0' : u < 0.6 ? '#ffd23f' : '#f08a24'); if (u > 0.4) pcirc(b.x, b.y, rad * (u - 0.3), '#3a3a4e'); }
  for (const pa of parts){ g.fillStyle = pa.col; g.globalAlpha = clamp((pa.life - pa.t) / pa.life * 2, 0, 1); g.fillRect(Math.round(pa.x), Math.round(pa.y), pa.sz, pa.sz); }
  g.globalAlpha = 1;
  for (const f of flyers){ g.save(); g.translate(Math.round(f.x), Math.round(f.y)); g.rotate(f.rot); g.drawImage(f.img, -f.img.width / 2, -f.img.height / 2); g.restore(); }
  for (const f of flashes){
    if (f.small){ g.fillStyle = f.col; g.fillRect(Math.round(f.x) - 3, Math.round(f.y), 7, 1); g.fillRect(Math.round(f.x), Math.round(f.y) - 3, 1, 7); continue; }
    pcirc(f.x, f.y, 6, '#ffd23f'); pcirc(f.x, f.y, 3.5, '#ffffff'); g.fillStyle = '#fff3a0'; g.fillRect(Math.round(f.x) - 9, Math.round(f.y), 19, 1); g.fillRect(Math.round(f.x), Math.round(f.y) - 9, 1, 19);
  }
}
function drawTunnel(){
  if (tunnel <= 0) return;
  g.fillStyle = 'rgba(6,4,10,' + (tunnel * 0.92).toFixed(2) + ')'; g.fillRect(0, 0, LW, LH);
  g.globalCompositeOperation = 'lighter';
  for (const c of cars){ if (!visibleSX(c)) continue; for (const h of c.holes){ g.fillStyle = 'rgba(240,190,90,' + (tunnel * 0.55).toFixed(2) + ')'; g.fillRect(c.sx + h.x, h.y, h.w, h.h); } }
  g.globalCompositeOperation = 'source-over';
  const o = (bgX * 1.2) % 160; g.fillStyle = 'rgba(255,220,140,' + (tunnel * 0.5).toFixed(2) + ')'; for (let xx = -160; xx < LW + 160; xx += 160) g.fillRect(Math.round(xx - o), 20, 6, 3);
}

/* ---------- HUD ---------- */
function drawHud(){
  for (const p of PL){
    const left = p.i === 0, x = left ? 3 : LW - 3, al = left ? 'left' : 'right';
    if (!p.src){ if (state === 'play' && Math.sin(clock * 4) > 0) ptxt('P' + (p.i + 1) + ' PULL TRIGGER', x, 3, PC[p.i], 1, al); continue; }

    for (let k = 0; k < CLIP; k++){ const bx = left ? x + k * 5 : x - 4 - k * 5; g.fillStyle = '#14101e'; g.fillRect(bx - 1, 12, 5, 8); g.fillStyle = p.rapid > 0 ? '#ffd23f' : k < p.ammo ? '#e0b050' : '#3a3a4e'; g.fillRect(bx, 13, 3, 6); if (k < p.ammo || p.rapid > 0){ g.fillStyle = '#a8b0c4'; g.fillRect(bx, 13, 3, 2); } }

    if (p.spread > 0) tags.push(['SCATTER', '#6fd8ff']); if (p.rapid > 0) tags.push(['RAPID', '#ffd23f']);
    for (const [s, col] of tags){ if (s === 'RELOAD!' && Math.sin(clock * 12) < 0) continue; const w = ptxt(s, tagX, 13, col, 1, al); tagX += (left ? 1 : -1) * (w + 4); }
  }

    g.fillStyle = 'rgba(16,10,8,0.88)'; g.fillRect(x0, y0, 252, 24); g.fillStyle = '#d8a040'; g.fillRect(x0, y0, 252, 1); g.fillRect(x0, y0 + 23, 252, 1);

/* ---------- screens ---------- */
const stageBtn = i => ({ x: 22 + i * 96, y: 132, w: 84, h: 20 });
const BTN_COL = ['#c86a3a', '#7a3266', '#24305a'];

function drawContinue(){

}
function drawGameOver(){

  PL.filter(p => p.src).forEach((p, i) => ptxt('P' + (p.i + 1) + '  ' + String(Math.floor(p.score)).padStart(7, '0'), LW / 2, 86 + i * 12, PC[p.i], 1, 'center'));

  });
  if (stateT > 2.6) ptxt(clearInfo.perfect ? 'NO PASSENGERS HURT! +5000' : 'PASSENGERS GOT HURT. NO SAFE-RIDE BONUS.', LW / 2, 150, clearInfo.perfect ? '#86d45a' : '#ff9a8a', 1, 'center');
  if (stateT > 3.5 && Math.sin(clock * 4) > 0) ptxt(stageI < STAGES.length - 1 ? 'PULL THE TRIGGER FOR THE NEXT RIDE' : 'PULL THE TRIGGER', LW / 2, 166, '#ffffff', 1, 'center');
}
function drawEnding(){
  g.fillStyle = 'rgba(8,4,2,0.82)'; g.fillRect(0, 0, LW, LH);
  ptxt('THE GOLD LINE', LW / 2, 22, '#ffd23f', 2, 'center'); ptxt('IS SAFE!', LW / 2, 42, '#ffd23f', 3, 'center');

  ptxt('EVERY PASSENGER MADE IT HOME.', LW / 2, 84, '#ffffff', 1, 'center');
  PL.filter(p => p.src).forEach((p, i) => ptxt('P' + (p.i + 1) + '  ' + String(Math.floor(p.score)).padStart(7, '0') + '   PASSENGERS HIT ' + p.pass, LW / 2, 104 + i * 12, PC[p.i], 1, 'center'));
  ptxt('CONTINUES USED ' + continues, LW / 2, 132, '#a8b0c4', 1, 'center');
  for (let i = 0; i < 5; i++){ const a = clock * 1.5 + i * TAU / 5; g.drawImage(STARSPR, Math.round(LW / 2 + Math.cos(a) * 130 - 4), Math.round(50 + Math.sin(a) * 30)); }

function render(){
  drawBg(); drawTrack(); drawTrain(); drawForeground(); drawProjs(); drawFx(); drawTunnel(); drawRings();

  if (state === 'continue') drawContinue();

  if (state === 'clear') drawClear();
  if (state === 'ending') drawEnding();
  if (hurtFlash > 0){ g.fillStyle = 'rgba(255,40,40,' + (hurtFlash * 0.8).toFixed(2) + ')'; g.fillRect(0, 0, LW, LH); }
  if (whiteFlash > 0){ g.fillStyle = 'rgba(255,255,255,' + Math.min(1, whiteFlash * 1.6).toFixed(2) + ')'; g.fillRect(0, 0, LW, LH); }
  const sx = shake > 0 ? Math.round(rand(-shake, shake)) * SC / 2 : 0, sy = shake > 0 ? Math.round(rand(-shake, shake)) * SC / 2 : 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(lo, sx, sy, W, H);

}
function drawCross(p){
  const x = Math.round(p.x), y = Math.round(p.y), col = PC[p.i], b = 4;
  const sq = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x + dx, y + dy, w, h); };
  for (const [c, o] of [['#000', 2], [col, 0]]){
    sq(-22 - o, -b/2 - o, 14 + o*2, b + o*2, c); sq(8 - o, -b/2 - o, 14 + o*2, b + o*2, c);
    sq(-b/2 - o, -22 - o, b + o*2, 14 + o*2, c); sq(-b/2 - o, 8 - o, b + o*2, 14 + o*2, c);
  }
  sq(-2, -2, 4, 4, '#fff');
  if (p.spread > 0 && state === 'play'){ ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 36, 0, TAU); ctx.stroke(); }
  if (state === 'play' && (p.reload > 0 || p.ammo === 0) && p.rapid <= 0){ ctx.fillStyle = '#ff4a3c'; ctx.fillRect(x - 20, y + 26, 40 * (p.reload > 0 ? (p.auto ? 1 - p.reload / AUTO_RELOAD_T : 1 - p.reload / RELOAD_T) : 0), 4); }
}

/* ---------- main loop ---------- */
let lastT = performance.now();
function frame(now2){
  const rdt = Math.min(0.05, (now2 - lastT) / 1000); lastT = now2;
  update(rdt); musicTick(); render();
  requestAnimationFrame(frame);
}
goTitle();
requestAnimationFrame(frame);
window.__GTH = { get state(){ return state; }, PL, get ents(){ return ents; }, get boss(){ return boss; }, get scene(){ return scene; }, get sceneI(){ return sceneI; }, startGame, act, fire, get cars(){ return cars; }, get stars(){ return stars; }, set stars(v){ stars = v; }, carClear: () => carClear(), jump: i => { sceneI = i; beginScene(i); camX = scenes[i].cx; }, entRects, get projs(){ return projs; }, get transit(){ return transit; }, get stageI(){ return stageI; }, get scenes(){ return scenes; } };
</script>
