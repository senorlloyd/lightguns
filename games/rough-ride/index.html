<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rough Ride</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:none;display:block;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   ROUGH RIDE — 4 stages: Jungle Run, Desert Canyon, Snow Pass, Enemy Base
   1-2 player pixel-art light gun rail shooter. You ride in the back of a
   jeep while the robot army chases you down the road.
   (OpenFIRE guns in gamepad mode, mouse, or keyboard)
   ===================================================================== */
const W = 1280, H = 720, LW = 320, LH = 180, SC = 4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function resize(){ const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px'; }
addEventListener('resize', resize); resize();
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH; const g = lo.getContext('2d');
const dark = document.createElement('canvas'); dark.width = LW; dark.height = LH; const dg = dark.getContext('2d');
ctx.imageSmoothingEnabled = false; g.imageSmoothingEnabled = false;

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.random() * a.length | 0];

/* ---------- tuning ---------- */
const SEG = 200, ROAD_W = 1000, CAM_H = 700, CAM_D = 0.85, DRAW = 140, HORIZON = 66;
const V0 = 5200, SPS = V0 / SEG;          // jeep speed (units/s), segments per second
const CLIP = 12, RELOAD_T = 0.4, AUTO_RELOAD_T = 1.1, MAX_ARMOR = 8;
/* Optional music: drop your own files here and they replace the built-in chiptune. */
const MUSIC_FILES = { jungle:'music/jungle.mp3', desert:'music/desert.mp3', snow:'music/snow.mp3', base:'music/base.mp3', boss:'music/boss.mp3' };

/* ---------- palette ---------- */
const C = {
  k:'#14101e', u:'#24222f', d:'#3a3a4e', g:'#6b7088', l:'#a8b0c4', w:'#f4f1e6',
  r:'#c8323a', R:'#ff4a3c', o:'#f08a24', y:'#ffd23f', Y:'#fff3a0',
  h:'#1f5c2c', G:'#3c9a44', L:'#86d45a', n:'#8a5a32', N:'#4e301a', t:'#c8a070', s:'#e8b07a',
  b:'#3a6fd8', c:'#6fd8ff', m:'#c040e0',
  J:'#4a5a30', j:'#6a7a44', q:'#3a4724', Q:'#2c3a1c'
};
const P1C = '#4fc3ff', P2C = '#ff9f2e';

/* ---------- tiny sprite toolkit (everything is drawn pixel by pixel) ---------- */
function mk(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); fn(x, w, h); return c; }
function R(x, X, Y, w, h, col){ x.fillStyle = C[col] || col; x.fillRect(X, Y, w, h); }
function Mr(x, W2, X, Y, w, h, col){ R(x, X, Y, w, h, col); R(x, W2 - X - w, Y, w, h, col); }
function blob(x, cx, cy, r, col, sy){ x.fillStyle = C[col] || col; sy = sy || 1; for (let dy = -Math.round(r*sy); dy <= Math.round(r*sy); dy++){ const hw = Math.floor(Math.sqrt(Math.max(0, r*r - (dy/sy)*(dy/sy)))); x.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw*2 + 1, 1); } }
function pl(x, x0, y0, x1, y1, col, wd){ wd = wd || 1; const n = Math.max(1, Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)))); x.fillStyle = C[col] || col; for (let i = 0; i <= n; i++){ const t = i / n; x.fillRect(Math.round(x0 + (x1 - x0)*t - (wd - 1)/2), Math.round(y0 + (y1 - y0)*t - (wd - 1)/2), wd, wd); } }
function fromMap(rows, mirror){
  const r = mirror ? rows.map(s => s + s.split('').reverse().join('')) : rows;
  return mk(Math.max(...r.map(s => s.length)), r.length, x => r.forEach((s, yy) => { for (let xx = 0; xx < s.length; xx++){ const ch = s[xx]; if (ch !== '.' && C[ch]){ x.fillStyle = C[ch]; x.fillRect(xx, yy, 1, 1); } } }));
}
let seedN = 11; const srand = () => (seedN = (seedN * 1664525 + 1013904223) >>> 0) / 4294967296;
const whiteCache = new Map();
function white(img){
  let w = whiteCache.get(img); if (w) return w;
  w = mk(img.width, img.height, x => { x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, img.width, img.height); });
  whiteCache.set(img, w); return w;
}

/* ---------- pixel font (5x7) ---------- */
const F5 = {
'A':[14,17,17,31,17,17,17],'B':[30,17,17,30,17,17,30],'C':[14,17,16,16,16,17,14],'D':[30,17,17,17,17,17,30],'E':[31,16,16,30,16,16,31],'F':[31,16,16,30,16,16,16],
'G':[14,17,16,23,17,17,15],'H':[17,17,17,31,17,17,17],'I':[14,4,4,4,4,4,14],'J':[7,2,2,2,2,18,12],'K':[17,18,20,24,20,18,17],'L':[16,16,16,16,16,16,31],
'M':[17,27,21,21,17,17,17],'N':[17,17,25,21,19,17,17],'O':[14,17,17,17,17,17,14],'P':[30,17,17,30,16,16,16],'Q':[14,17,17,17,21,18,13],'R':[30,17,17,30,20,18,17],
'S':[15,16,16,14,1,1,30],'T':[31,4,4,4,4,4,4],'U':[17,17,17,17,17,17,14],'V':[17,17,17,17,17,10,4],'W':[17,17,17,21,21,21,10],'X':[17,17,10,4,10,17,17],
'Y':[17,17,17,10,4,4,4],'Z':[31,1,2,4,8,16,31],
'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],
'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
' ':[0,0,0,0,0,0,0],'!':[4,4,4,4,4,0,4],'?':[14,17,1,2,4,0,4],'.':[0,0,0,0,0,12,12],',':[0,0,0,0,12,4,8],"'":[12,4,8,0,0,0,0],'-':[0,0,0,31,0,0,0],
':':[0,12,12,0,12,12,0],'/':[1,1,2,4,8,16,16],'+':[0,4,4,31,4,4,0],'%':[24,25,2,4,8,19,3],'#':[10,10,31,10,31,10,10],'>':[8,4,2,1,2,4,8],'<':[2,4,8,16,8,4,2],
'(':[2,4,8,8,8,4,2],')':[8,4,2,2,2,4,8],'*':[0,4,21,14,21,4,0],'=':[0,0,31,0,31,0,0],'@':[0,10,31,31,14,4,0],'&':[12,18,20,8,21,18,13]
};
const txtCache = new Map();
function textCanvas(s, col){
  const key = s + '|' + col; let c = txtCache.get(key); if (c) return c;
  if (txtCache.size > 500) txtCache.clear();
  c = mk(Math.max(1, s.length * 6 - 1), 7, x => { x.fillStyle = col; for (let i = 0; i < s.length; i++){ const gl = F5[s[i]] || F5['?']; for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if (gl[r] >> (4 - b) & 1) x.fillRect(i*6 + b, r, 1, 1); } });
  txtCache.set(key, c); return c;
}
function ptxt(s, x, y, col, sc, align, sh){
  s = String(s).toUpperCase(); sc = sc || 1;
  const c = textCanvas(s, col), w = c.width * sc;
  let X = align === 'center' ? x - w/2 : align === 'right' ? x - w : x; X = Math.round(X); y = Math.round(y);
  if (sh !== null){ g.drawImage(textCanvas(s, sh || '#000'), X + sc, y + sc, w, 7*sc); }
  g.drawImage(c, X, y, w, 7*sc);
  return w;
}
function ftext(x, s, X, Y, col){ x.drawImage(textCanvas(s.toUpperCase(), C[col] || col), X, Y); }

/* ---------- sprites ---------- */
const SPR = {};
SPR.barrel = fromMap([
  ".kkkkkkkk.", "krrrrrrrrk", "krwrrrrrrk", "krwrrrrrrk", "kyyyyyyyyk", "kkkkkkkkkk", "krwrrrrrrk", "krwrrrrrrk", "krrrrrrrrk", "kyyyyyyyyk", "krrrrrrrrk", ".kkkkkkkk."
]);
SPR.sandbag = mk(46, 11, x => { for (let r = 0; r < 2; r++) for (let i = 0; i < 5; i++){ const ox = r ? 0 : 4; blob(x, 5 + ox + i*9, 3 + r*5, 4, 'k', 0.7); blob(x, 5 + ox + i*9, 3 + r*5, 3, 't', 0.7); R(x, 3 + ox + i*9, 2 + r*5, 4, 1, 's'); } });
function crateSpr(col){ return mk(22, 28, x => {
  for (let dy = 0; dy < 8; dy++){ const hw = Math.round(Math.sqrt(Math.max(0, 1 - Math.pow(1 - dy/8, 2))) * 11); for (let xx = 11 - hw; xx < 11 + hw; xx++) R(x, xx, dy, 1, 1, (xx >> 2) % 2 ? 'r' : 'w'); }
  pl(x, 1, 8, 7, 16, 'l'); pl(x, 20, 8, 14, 16, 'l'); pl(x, 11, 8, 11, 16, 'l');
  R(x, 4, 16, 14, 12, 'k'); R(x, 5, 17, 12, 10, 'n'); R(x, 5, 17, 12, 1, 't'); R(x, 5, 22, 12, 1, 'N'); R(x, 8, 19, 6, 6, 'k'); R(x, 9, 20, 4, 4, col);
}); }
const PICKUPS = {
  SPREAD: { col:'c', name:'SPREAD SHOT' }, RAPID: { col:'y', name:'RAPID FIRE' }, REPAIR: { col:'L', name:'ARMOR REPAIR' }, BOOM: { col:'R', name:'BOOM!' }
};
for (const k in PICKUPS) PICKUPS[k].img = crateSpr(PICKUPS[k].col);
function signSpr(label, left){ return mk(40, 32, x => {
  R(x, 18, 12, 4, 20, 'k'); R(x, 19, 12, 2, 20, 'n');
  R(x, 0, 0, 40, 15, 'k'); R(x, 1, 1, 38, 13, 'y'); R(x, 1, 13, 38, 1, 'o');
  const s = left ? '<' + label : label + '>'; ftext(x, s, Math.round(20 - (s.length*6 - 1)/2), 4, 'k');
}); }
SPR.signL = signSpr('RIVER', true); SPR.signR = signSpr('RIDGE', false);
SPR.palm = mk(32, 48, x => {
  for (let i = 0; i <= 36; i++){ const t = i / 36, xx = 14 + Math.sin(t * 1.6) * 4, yy = 47 - i; R(x, Math.round(xx) - 1, yy, 3, 1, i % 4 === 0 ? 'N' : 'n'); }
  const top = [17, 12], fr = [[1, 22], [3, 10], [11, 2], [23, 3], [30, 11], [31, 23], [17, 24], [7, 17], [27, 17]];
  for (const [ex, ey] of fr) for (let i = 0; i <= 14; i++){ const t = i / 14, xx = Math.round(top[0] + (ex - top[0]) * t), yy = Math.round(top[1] + (ey - top[1]) * t - Math.sin(t * Math.PI) * 4 + t * t * 3); R(x, xx, yy, 2, 2, 'G'); R(x, xx, yy + 2, 1, 1, 'h'); R(x, xx + 1, yy - 1, 1, 1, 'L'); }
  blob(x, 16, 14, 2, 'N'); blob(x, 19, 14, 2, 'n');
});
SPR.jtree = mk(44, 52, x => {
  R(x, 19, 28, 6, 24, 'k'); R(x, 20, 28, 4, 24, 'n'); R(x, 20, 28, 1, 24, 'N'); pl(x, 22, 34, 14, 26, 'n', 2); pl(x, 22, 36, 31, 28, 'n', 2);
  blob(x, 22, 19, 15, 'h'); blob(x, 10, 24, 9, 'h'); blob(x, 34, 24, 9, 'h'); blob(x, 22, 15, 12, 'G'); blob(x, 12, 21, 6, 'G'); blob(x, 32, 20, 6, 'G');
  seedN = 5; for (let i = 0; i < 70; i++){ const a = srand() * TAU, r = srand() * 13, px = Math.round(22 + Math.cos(a) * r), py = Math.round(16 + Math.sin(a) * r * 0.9); R(x, px, py, 1, 1, srand() < 0.6 ? 'L' : 'h'); }
});
SPR.bush = mk(26, 13, x => { blob(x, 6, 9, 5, 'h'); blob(x, 19, 9, 5, 'h'); blob(x, 13, 7, 6, 'G'); seedN = 9; for (let i = 0; i < 18; i++) R(x, Math.round(4 + srand() * 18), Math.round(3 + srand() * 8), 1, 1, 'L'); R(x, 2, 12, 22, 1, 'h'); });
SPR.fern = mk(22, 14, x => { for (const [ex, ey] of [[0, 4], [4, 0], [11, 0], [18, 0], [21, 4], [2, 9], [20, 9]]) { pl(x, 11, 13, ex, ey, 'G'); pl(x, 11, 13, ex + 1, ey + 1, 'h'); R(x, ex, ey, 1, 1, 'L'); } });
SPR.rock = mk(20, 12, x => { blob(x, 10, 7, 9, 'k', 0.55); blob(x, 10, 7, 8, 'g', 0.5); blob(x, 8, 5, 4, 'l', 0.5); R(x, 3, 10, 14, 1, 'd'); });
SPR.reed = mk(12, 18, x => { for (let i = 0; i < 5; i++){ const bx = 2 + i * 2; pl(x, bx, 17, bx + (i - 2), 3 + (i % 2) * 3, i % 2 ? 'G' : 'h'); R(x, bx + (i - 2), 2 + (i % 2) * 3, 1, 3, 'n'); } });
SPR.arch = mk(70, 54, x => {
  R(x, 0, 0, 10, 54, 'u'); R(x, 60, 0, 10, 54, 'u'); R(x, 0, 0, 70, 10, 'u');
  for (let yy = 2; yy < 54; yy += 4) { R(x, 0, yy, 10, 1, 'k'); R(x, 60, yy, 10, 1, 'k'); }
  for (let xx = 2; xx < 70; xx += 7) R(x, xx, 0, 1, 10, 'k');
  R(x, 9, 9, 1, 45, 'd'); R(x, 60, 9, 1, 45, 'd'); R(x, 9, 9, 52, 1, 'd');
});
SPR.lamp = mk(6, 5, x => { R(x, 0, 0, 6, 5, 'k'); R(x, 1, 1, 4, 3, 'y'); R(x, 1, 1, 4, 1, 'Y'); });
SPR.warn = mk(16, 24, x => { R(x, 7, 10, 2, 14, 'k'); for (let i = 0; i < 10; i++){ const hw = Math.round(i * 0.8); R(x, 8 - hw - 1, i, hw * 2 + 2, 1, 'k'); if (i > 1 && i < 9) R(x, 8 - hw, i, hw * 2, 1, 'o'); } R(x, 7, 3, 2, 3, 'k'); R(x, 7, 7, 2, 1, 'k'); });
SPR.driver = mk(22, 22, x => {
  R(x, 0, 0, 22, 22, 'k'); R(x, 1, 1, 20, 20, '#2a3a5a');
  blob(x, 11, 8, 8, 'h'); R(x, 3, 8, 16, 2, 'G'); R(x, 5, 9, 12, 9, 's'); R(x, 5, 11, 12, 3, 'k'); R(x, 6, 11, 4, 2, 'u'); R(x, 12, 11, 4, 2, 'u');
  R(x, 7, 15, 8, 2, 'n'); R(x, 9, 17, 4, 1, 'N'); R(x, 4, 18, 14, 4, 'G'); R(x, 9, 18, 4, 4, 'h');
});
SPR.heart = fromMap(["kk.kk..", "kRRkRRk", "kRYRRRk", "kRRRRRk", ".kRRRk.", "..kRk..", "...k..."]);
SPR.heartE = fromMap(["kk.kk..", "kddkddk", "kdddddk", "kdddddk", ".kdddk.", "..kdk..", "...k..."]);

/* background layers */
const BG = {};
BG.sky = mk(LW, HORIZON + 30, x => {
  const bands = ['#24346c', '#2c4280', '#345094', '#3e60a6', '#4a72b6', '#5a86c4', '#6e9ccf', '#86b2d8', '#a2c6dc', '#c0d8dc'];
  const bh = Math.ceil((HORIZON + 30) / bands.length); bands.forEach((c, i) => R(x, 0, i * bh, LW, bh, c));
  seedN = 3; for (let i = 0; i < 6; i++){ const cx = srand() * LW, cy = 8 + srand() * 30; for (let j = 0; j < 4; j++) blob(x, cx + j * 7 - 10, cy + (j % 2), 4 + srand() * 3, j % 2 ? '#e8eef4' : '#ffffff', 0.5); }
});
BG.mtn = mk(LW, 40, x => { for (let xx = 0; xx < LW; xx++){ const t = xx / LW * TAU; const h = 14 + Math.sin(t*2) * 8 + Math.sin(t*5 + 1) * 5 + Math.sin(t*11) * 2; R(x, xx, 40 - h, 1, h, '#5a7aa2'); R(x, xx, 40 - h, 1, 2, '#7e9cc0'); const h2 = 8 + Math.sin(t*3 + 2) * 5 + Math.sin(t*7) * 3; R(x, xx, 40 - h2, 1, h2, '#4a6890'); } });
BG.trees = mk(LW, 24, x => { for (let xx = 0; xx < LW; xx++){ const t = xx / LW * TAU; const h = 9 + Math.abs(Math.sin(t*9)) * 6 + Math.sin(t*23) * 2; R(x, xx, 24 - h, 1, h, '#1d5a2c'); R(x, xx, 24 - h, 1, 1, '#2f7a3a'); } });

/* ---------- sprite toolkit extras ---------- */
Object.assign(C, { z:'#1e2c48', Z:'#7fb0e0', x:'#08070c', A:'#4f6052', B:'#74876f', D:'#33423a', E:'#26302a' });
function pg(x, pts, col){                  // crisp scanline polygon (no anti-aliasing)
  x.fillStyle = C[col] || col; let y0 = 1e9, y1 = -1e9; for (const p of pts){ y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.floor(y0); y < Math.ceil(y1); y++){
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++){ const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }
    xs.sort((a, b) => a - b);
    for (let i = 0; i + 1 < xs.length; i += 2){ const xa = Math.round(xs[i]), xb = Math.round(xs[i + 1]); if (xb > xa) x.fillRect(xa, y, xb - xa, 1); }
  }
}
function hex(c){ c = C[c] || c; return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function outline(src){                     // pads by 1px and adds a dark outline
  const w = src.width + 2, h = src.height + 2;
  return mk(w, h, x => {
    x.drawImage(src, 1, 1); const im = x.getImageData(0, 0, w, h), d = im.data, a = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
    const k = hex('k');
    for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++){ const i = y * w + xx; if (a[i]) continue; if ((xx > 0 && a[i - 1]) || (xx < w - 1 && a[i + 1]) || (y > 0 && a[i - w]) || (y < h - 1 && a[i + w])){ d[i*4] = k[0]; d[i*4+1] = k[1]; d[i*4+2] = k[2]; d[i*4+3] = 255; } }
    x.putImageData(im, 0, 0);
  });
}
function camo(x, seed, n, rad){            // repaint blotches of armour colour A with camo colour E
  const w = x.canvas.width, h = x.canvas.height, im = x.getImageData(0, 0, w, h), d = im.data, A = hex('A'), E = hex('E');
  let s = seed; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let b = 0; b < n; b++){
    const cx = rnd() * w, cy = rnd() * h, rx = (rad || 3) * (0.6 + rnd()), ry = (rad || 3) * (0.5 + rnd() * 0.7);
    for (let y = Math.max(0, Math.floor(cy - ry)); y < Math.min(h, cy + ry); y++) for (let xx = Math.max(0, Math.floor(cx - rx)); xx < Math.min(w, cx + rx); xx++){
      if (Math.pow((xx - cx) / rx, 2) + Math.pow((y - cy) / ry, 2) > 1) continue;
      const i = (y * w + xx) * 4; if (d[i] === A[0] && d[i+1] === A[1] && d[i+2] === A[2]){ d[i] = E[0]; d[i+1] = E[1]; d[i+2] = E[2]; }
    }
  }
  x.putImageData(im, 0, 0);
}
/* sym(): draw the LEFT half, it is mirrored to the right, camo is applied, then `extra` adds one-off details */
function sym(w, h, half, extra, cseed, cn, crad){
  const raw = mk(w, h, x => {
    half(x); const im = mk(w, h, y => y.drawImage(x.canvas, 0, 0));
    x.save(); x.translate(w, 0); x.scale(-1, 1); x.drawImage(im, 0, 0); x.restore();
    if (cseed) camo(x, cseed, cn || 10, crad || 3);
    if (extra) extra(x);
  });
  return outline(raw);
}
const tread = (x, X, Y, w, h, st) => { R(x, X, Y, w, h, 'u'); for (let y = Y + 1; y < Y + h; y += (st || 2)) R(x, X, y, w, 1, 'k'); };

/* ---------- enemy vehicles: modelled on real hardware, seen from the front as they chase you ---------- */
const ART = {};
ART.humvee = () => sym(54, 40, x => {           // HMMWV with a roof missile launcher
  tread(x, 2, 23, 9, 16); R(x, 9, 24, 2, 14, 'd');
  R(x, 11, 31, 16, 5, 'x'); R(x, 13, 33, 14, 2, 'd');
  pg(x, [[6, 28], [6, 18], [9, 16], [27, 16], [27, 28]], 'A'); R(x, 9, 16, 18, 2, 'B');
  R(x, 7, 27, 20, 4, 'D'); R(x, 7, 27, 20, 1, 'B'); R(x, 13, 29, 2, 3, 'x');

/* ---------- audio ---------- */
let ac = null, master = null, sfxBus = null, musBus = null, muted = false;
let engine = null;
function unlockAudio(){
  if (!ac){
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
      musBus = ac.createGain(); musBus.gain.value = 0.38; musBus.connect(master);
      startEngine();
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(dur, f0, f1, vol, type, delay, bus){
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), gn = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(gn); gn.connect(bus || sfxBus); o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq, delay, bus, type){
  if (!ac) return;
  if (!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = ac.currentTime + (delay || 0), s = ac.createBufferSource(), gn = ac.createGain(), f = ac.createBiquadFilter();
  s.buffer = noiseBuf; f.type = type || 'lowpass'; f.frequency.value = freq || 1800;
  gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(gn); gn.connect(bus || sfxBus); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur);
}
function startEngine(){
  if (!noiseBuf) noise(0.01, 0.0001, 100);
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160;
  const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 46;
  const of = ac.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 220;
  const gn = ac.createGain(); gn.gain.value = 0;
  s.connect(f); f.connect(gn); o.connect(of); of.connect(gn); gn.connect(sfxBus); s.start(); o.start();
  engine = { gn, o };
}

/* ---------- track + stage builder ---------- */
const trk = { c:[], y:[], g:[] }; let curY = 0;
let EV = [], evI = 0, FORKT = 1e9, CH = [], HOPS = [], hopI = 0, LOOP = null;
function addSeg(c, y, gr){ trk.c.push(c); trk.y.push(y); trk.g.push(gr); }
function sect(sec, curve, hill, gr){
  const n = Math.max(1, Math.round(sec * SPS)), y0 = curY;
  for (let i = 0; i < n; i++){ const f = i / n, ramp = Math.min(1, f / 0.2, (1 - f) / 0.2); addSeg(curve * ramp, y0 + hill * (1 - Math.cos(Math.PI * f)) / 2, gr); }
  curY = y0 + hill;
}
/* Events are placed relative to "now" = the point in the stage where the track built so far ends.
   So: at(2, f) followed by sect(5, ...) fires f two seconds into that 5-second stretch of road. */
const now = () => trk.c.length / SPS;
const at = (dt, f) => EV.push([now() + dt, f]);
const rep = (dt, n, gap, f) => { for (let i = 0; i < n; i++) at(dt + i * gap, () => f(i)); };
function chasm(sec, gr, onJump, onLand){
  const y = curY, s = trk.c.length * SEG, n = Math.round(sec * SPS);
  for (let i = 0; i < n; i++) addSeg(0, y - 2600 - (i % 7) * 40, gr);
  CH.push({ s, e: trk.c.length * SEG, y, onJump, onLand, done:false }); curY = y;
}
const hopHere = () => HOPS.push(trk.c.length * SEG);
function hills(gr, list){ for (const [upS, h, dnS, cv] of list){ sect(upS, cv, h, gr); hopHere(); sect(dnS, 0, -h, gr); } }
function loopSect(fn){ const a = trk.c.length; fn(); LOOP = { a: a * SEG, len: (trk.c.length - a) * SEG }; }
function fork(g){
  const [a, b] = ST.routes;
  at(0, sayf('FORK AHEAD! EYES FRONT!')); at(0.8, tf); at(1.9, () => { spawnSigns(a, b); say('SHOOT A SIGN TO PICK OUR ROAD!'); });

}
function roadblock(g, msg, nTur){ at(0, sayf(msg)); at(0.8, tf); at(1.8, () => spawnBarricade(nTur)); sect(7, 0, 0, g); }
function buildStage(route){
  trk.c = []; trk.y = []; trk.g = []; curY = 0; EV = []; CH = []; HOPS = []; LOOP = null; FORKT = 1e9;
  ST.build(route || ST.routes[0]);

}
function mapT(T){
  if (LOOP && T >= LOOP.a) T = LOOP.a + ((T - LOOP.a) % LOOP.len + LOOP.len) % LOOP.len;

}
function segAt(T){ return Math.floor(mapT(T) / SEG); }

  const pads = navigator.getGamepads ? navigator.getGamepads() : [];

    const p = PL.find(q => q.src && q.src.type === 'pad' && q.src.index === gp.index);

        s.mov[0] = s.mov[0]*0.97 + d0; s.mov[1] = s.mov[1]*0.97 + d1; s.la = [a[0], a[1], a[2], a[3]];
        if (s.mov[1] > s.mov[0]*1.5 + 0.02) s.pick = 1; else if (s.mov[0] > s.mov[1]*1.5 + 0.02) s.pick = 0;

/* ---------- shooting ---------- */
function act(p, kind){
  unlockAudio();
  if (state === 'title'){
    if (kind !== 'fire') return;
    const lx = p.x / SC, ly = p.y / SC;
    for (let i = 0; i < STAGES.length; i++){ const b = stageBtn(i); if (lx > b.x && lx < b.x + b.w && ly > b.y && ly < b.y + b.h){ sfx.join(); startGame(i); return; } }
    return;
  }
  if (state === 'continue'){ if (kind === 'fire'){ armor = MAX_ARMOR; invul = 2; continues++; totalContinues++; state = 'play'; lowSaid = false; setMusic(boss ? 'boss' : ST.music); sfx.join(); say('BACK IN THE FIGHT!', 1.5); } return; }
  if (state === 'gameover' || state === 'ending'){ if (kind === 'fire' && stateT > 3) goTitle(); return; }
  if (state === 'clear'){ if (kind === 'fire' && stateT > 4.2){ if (stageI < STAGES.length - 1){ sfx.join(); startStage(stageI + 1); } else { state = 'ending'; stateT = 0; sfx.win(); } } return; }
  if (state !== 'play') return;
  if (kind === 'reload'){ if (p.ammo < CLIP && (p.reload <= 0 || p.auto)){ p.reload = RELOAD_T; p.auto = false; sfx.reload(); } return; }

}
function fire(p){

    p.ammo--; if (p.ammo <= 0){ p.reload = AUTO_RELOAD_T; p.auto = true; }
  }

  lights.push({ x: lx, y: ly, r: 34, t:0, life: 0.12 });
  sparks(lx, ly, 4, ['#ffffff', '#fff3a0'], 30, 0.2);
  let hits = 0, neutral = false;
  for (const r of rockets){ if (hits >= maxHits) break; if (!r.dead && r.t >= 0 && Math.hypot(lx - r.x, ly - r.y) < r.r + 3 + rad){ r.dead = true; hits++; explode(r.x, r.y, 4); award(p, 50, r.x, r.y); } }

      if (c.hp <= 0){ explode(cx, cy, 8); award(p, 500, cx, cy); if (gunship.cores.every(q => q.hp <= 0)){ gunship.dead = true; gunship.deadT = 0; explode(gunship.x + 75, gunship.y + 28, 30, true); award(p, 5000, gunship.x + 75, gunship.y + 10); floatText('GUNSHIP DOWN!', LW/2, 60, '#ffd23f', 2, 2); say('GUNSHIP DOWN! WHOO!', 1.6); } } }
  }
  const vis = ents.filter(e => !e.dead && e.rect && e.side === facing && !TYPES[e.type].decor).sort((a, b) => a.d - b.d);

    if (hits >= maxHits) break;

      for (const c of e.cores){ if (c.hp <= 0 || c.ph !== e.phase) continue; const cx = e.rect.x0 + c.x * e.rect.k, cy = e.rect.y0 + c.y * e.rect.k; if (Math.hypot(lx - cx, ly - cy) < Math.max(3, 5.5 * e.rect.k) + rad){ coreHit = true; hitBossCore(e, c, p, cx, cy); hits++; break; } }

function hitBossCore(e, c, p, cx, cy){

  if (e.ring){ e.ringHits++; if (e.ringHits >= 3 + (e.phase > 0 ? 1 : 0)){ e.ring = null; floatText('STAGGERED!', cx, cy - 12, '#ffffff', 1, 0.9); e.lunge = 0; } }

/* ---------- update ---------- */
function update(rdt){
  clock += rdt; stateT += rdt;
  pollPads();
  for (const p of PL){
    if (!p.src) continue;
    if (p.src.type === 'mouse'){ p.x = mouse.x; p.y = mouse.y; p.held = mouse.down; }
    if (p.src.type === 'keys'){ const v = 900 * rdt; if (keys.ArrowLeft) p.x -= v; if (keys.ArrowRight) p.x += v; if (keys.ArrowUp) p.y -= v; if (keys.ArrowDown) p.y += v; p.x = clamp(p.x, 0, W); p.y = clamp(p.y, 0, H); p.held = !!(keys.Enter || keys.Space); }
  }
  timeScale = lerp(timeScale, tsTarget, Math.min(1, rdt * 6));
  if (engine){ engine.gn.gain.value = state === 'play' ? (jump ? 0.05 : 0.14) : state === 'clear' ? 0.08 * speed / V0 : 0; engine.o.frequency.value = 42 + speed / V0 * 10 + Math.sin(clock * 9) * 2; }
  if (state === 'title'){ S += V0 * 0.55 * rdt; if (S > 38 * V0) S = 2 * V0; facing = 'back'; dir = -1; return; }
  if (state === 'continue'){ contT -= rdt; if (contT <= 0){ state = 'gameover'; stateT = 0; saveHi(); } updateFx(rdt); return; }
  if (state === 'gameover' || state === 'clear' || state === 'ending'){ updateFx(rdt); if (state === 'clear') S += speed * rdt; return; }
  const dt = rdt * timeScale;
  stageT += dt; S += speed * dt;
  while (evI < EV.length && EV[evI][0] <= stageT) EV[evI++][1]();
  if (!dlg && dlgQ.length) dlg = dlgQ.shift();
  if (dlg){ const before = Math.floor(dlg.t * 40); dlg.t += rdt; if (Math.floor(dlg.t * 40) > before && Math.floor(dlg.t * 40) < dlg.text.length && before % 2 === 0) sfx.blip(); if (dlg.t > dlg.dur) dlg = null; }
  calm = dlg ? 0.45 : Math.max(0, calm - rdt);            // enemies hold their fire while Sarge is talking
  if (banner){ banner.t += rdt; if (banner.t > banner.dur) banner = null; }
  invul = Math.max(0, invul - rdt); hurtFlash = Math.max(0, hurtFlash - rdt); whiteFlash = Math.max(0, whiteFlash - rdt);
  if (quakeT > 0){ quakeT -= rdt; shake = Math.max(shake, 3); }
  for (const p of PL){
    if (!p.src) continue;
    p.fireCd = Math.max(0, p.fireCd - rdt); p.spread = Math.max(0, p.spread - dt); p.rapid = Math.max(0, p.rapid - dt);
    if (p.reload > 0){ p.reload -= rdt; if (p.reload <= 0){ p.ammo = CLIP; p.auto = false; } }
    if (p.rapid > 0 && p.held) fire(p);

  dir = facing === 'front' ? 1 : -1;
  if (!route && stageT > FORKT) choose(ST.routes[0]);
  const ch = CH.find(c => !c.done);
  if (!jump && ch && S >= ch.s - 30){ jump = { u:0, ch }; tsTarget = 0.28; sfx.whoosh(); if (ch.onJump) ch.onJump(); }
  if (jump){ jump.u = clamp((S - jump.ch.s) / (jump.ch.e - jump.ch.s), 0, 1); if (jump.u >= 1){ const c = jump.ch; c.done = true; jump = null; tsTarget = 1; sfx.land(); shake = 12; if (c.onLand) c.onLand(); } }
  if (hopI < HOPS.length && S >= HOPS[hopI]){ hopI++; hopV = 1100; sfx.whoosh(); }
  hopV -= 3600 * dt; hop = Math.max(0, hop + hopV * dt); if (hop <= 0 && hopV < 0){ if (hopV < -900){ shake = 6; sfx.land(); } hopV = 0; }
  for (const e of ents) updEnt(e, dt);
  ents = ents.filter(e => !e.dead && !e.gone);
  for (const r of rockets){

  ptxt('THANKS FOR RIDING', LW / 2, 148, '#fff3a0', 1, 'center');
  if (stateT > 3 && Math.sin(clock * 4) > 0) ptxt('SHOOT TO RETURN', LW / 2, 164, '#ffffff', 1, 'center');
  if (Math.random() < 0.3) sparks(rand(20, 300), rand(10, 80), 14, ['#ffd23f', '#ff4a3c', '#6fd8ff', '#86d45a', '#ffffff'], 60, 1);
}

/* ---------- main draw ---------- */
function render(){
  const G = GROUND[trk.g[segAt(S)]] || GROUND.jungle, ov = state !== 'title' ? G.ov : null;
  if (ov) ovCur = ov;
  darkA = lerp(darkA, ov ? ov.a : 0, 0.08);
  camY = (jump ? jump.ch.y + 3600 * jump.u * (1 - jump.u) : heightAt(S)) + CAM_H + hop + Math.sin(clock * 23) * 9 + Math.sin(clock * 9.7) * 6;
  const curv = trk.c[segAt(S)] || 0; if (state !== 'gameover') bgX += curv * dir * (state === 'play' ? timeScale : 0.6) * 0.9;
  project();
  drawBg((G.indoor && state !== 'title') || (ovCur && ovCur.black && darkA > 0.5));
  drawRoad();
  drawSprites();
  if (state !== 'title'){
    drawRockets(); drawGunship(); drawFx(); drawWeather(); drawRings(); drawDark(); drawJeep(); drawHud();
  } else { drawFx(); drawTitle(); }
  if (state === 'continue') drawContinue();
  if (state === 'gameover') drawGameOver();
  if (state === 'clear') drawClear();
  if (state === 'ending'){ drawEnding(); drawFx(); }
  if (hurtFlash > 0){ g.fillStyle = 'rgba(255,40,40,' + (hurtFlash * 0.9).toFixed(2) + ')'; g.fillRect(0, 0, LW, LH); }
  if (whiteFlash > 0){ g.fillStyle = 'rgba(255,255,255,' + Math.min(1, whiteFlash * 1.6).toFixed(2) + ')'; g.fillRect(0, 0, LW, LH); }
  const sx = shake > 0 ? Math.round(rand(-shake, shake)) * SC / 2 : 0, sy = shake > 0 ? Math.round(rand(-shake, shake)) * SC / 2 : 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (turn){
    const t = turn.t / 0.56, off = t < 0.5 ? -Math.pow(t * 2, 2) * W : Math.pow((1 - t) * 2, 2) * W;
    ctx.globalAlpha = 0.35; ctx.drawImage(lo, off * 0.85 + sx, sy, W, H); ctx.globalAlpha = 1; ctx.drawImage(lo, off + sx, sy, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; for (let i = 0; i < 18; i++) ctx.fillRect(0, (i * 97 + clock * 900) % H, W, 3);
  } else ctx.drawImage(lo, sx, sy, W, H);
  if (jump && timeScale < 0.6){ ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, 40); ctx.fillRect(0, H - 40, W, 40); }
  for (const p of PL) if (p.src) drawCross(p);
}
function drawCross(p){
  const x = Math.round(p.x), y = Math.round(p.y), col = PC[p.i], b = 4;
  const sq = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x + dx, y + dy, w, h); };
  for (const [c, o] of [['#000', 2], [col, 0]]){
    sq(-22 - o, -b/2 - o, 14 + o*2, b + o*2, c); sq(8 - o, -b/2 - o, 14 + o*2, b + o*2, c);
    sq(-b/2 - o, -22 - o, b + o*2, 14 + o*2, c); sq(-b/2 - o, 8 - o, b + o*2, 14 + o*2, c);
  }
  sq(-2, -2, 4, 4, '#fff');
  if (state === 'play' && (p.reload > 0 || p.ammo === 0) && p.rapid <= 0){ ctx.fillStyle = '#ff4a3c'; ctx.fillRect(x - 20, y + 26, 40 * (p.auto ? 1 - p.reload / AUTO_RELOAD_T : 1 - p.reload / RELOAD_T), 4); }
}

/* ---------- main loop ---------- */
let lastT = performance.now();
function frame(now2){
  const rdt = Math.min(0.05, (now2 - lastT) / 1000); lastT = now2;
  update(rdt); musicTick(); render();
  requestAnimationFrame(frame);
}
goTitle();
requestAnimationFrame(frame);
</script>
