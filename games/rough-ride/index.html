/* ---------- dialogue / banners / floating text ---------- */
function say(text, dur){ dlgQ.push({ text: text.toUpperCase(), dur: dur || 3.4, t:0 }); }
function showBanner(a, b, dur){ banner = { a, b, t:0, dur: dur || 3 }; }
function floatText(s, x, y, col, sc, life){ floats.push({ s, x, y, col, sc: sc || 1, t:0, life: life || 1.1 }); }
function wrap(text, n){ const out = ['']; for (const w of text.split(' ')){ if ((out[out.length - 1] + ' ' + w).trim().length > n) out.push(w); else out[out.length - 1] = (out[out.length - 1] + ' ' + w).trim(); } return out; }

/* ---------- effects ---------- */
function sparks(x, y, n, cols, sp, life){ for (let i = 0; i < n; i++){ const a = rand(0, TAU), v = rand(10, sp || 60); parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 10, g: 60, t:0, life: rand(0.2, life || 0.6), col: pick(cols), sz: Math.random() < 0.3 ? 2 : 1 }); } }
function explode(x, y, r, big){
  booms.push({ x, y, r, t:0, life: big ? 0.8 : 0.5 });
  sparks(x, y, big ? 40 : 14 + r, ['#ffd23f', '#f08a24', '#ff4a3c', '#fff3a0'], big ? 140 : 40 + r * 4, big ? 1 : 0.6);
  sparks(x, y, big ? 20 : 8, ['#6b7088', '#3a3a4e', '#a8b0c4'], big ? 90 : 50, 1.1);
  lights.push({ x, y, r: r * 4 + 20, t:0, life: 0.35 });
  shake = Math.max(shake, big ? 10 : Math.min(6, r / 3)); sfx.boom(big);
}

/* ---------- damage ---------- */
function hurt(n, why){
  if (invul > 0 || state !== 'play') return;
  armor = Math.max(0, armor - n); invul = 0.8; hurtFlash = 0.4; shake = Math.max(shake, 9); sfx.hurt();
  if (why) floatText(why, LW/2, 112, '#ff4a3c', 2, 1);
  if (armor <= 2 && armor > 0 && !lowSaid){ lowSaid = true; say("WE CAN'T TAKE MUCH MORE!", 2.5); }
  if (armor <= 0){ state = 'continue'; contT = 10; setMusic(null); }
}
function award(p, pts, x, y){ if (!p) return; const m = 1 + Math.min(3, Math.floor(p.combo / 10)); p.score += pts * m; if (pts) floatText(String(pts * m), x, y - 6, m > 1 ? '#ffd23f' : '#ffffff', 1, 0.8); }
function kill(e, p){
  if (e.dead) return; e.dead = true; e.ring = null;
  const cx = e.rect ? (e.rect.x0 + e.rect.x1) / 2 : LW/2, cy = e.rect ? (e.rect.y0 + e.rect.y1) / 2 : 80, sz = e.rect ? Math.max(4, (e.rect.x1 - e.rect.x0) * 0.4) : 8;
  if (p){ p.kills++; award(p, e.pts, cx, cy); }
  if (e.type === 'crate'){ grab(p, e.kind, cx, cy); return; }
  if (e.type === 'sign'){ choose(e.label); return; }
  explode(cx, cy, sz, e.type === 'buggy' || e.type === 'boat');
  if (e.type === 'barrel'){ for (const o of ents) if (o.type === 'barrel' && !o.dead && Math.abs(o.x - e.x) < 450 && Math.abs(o.d - e.d) < 400) { o.chain = 0.15; o.chainP = p; } checkBarricade(); }
  if (e.type === 'turret') checkBarricade();
}
function checkBarricade(){
  if (!ents.some(o => o.type === 'barrel' && Math.abs(o.x) < 900 && !o.dead && o.d < 30000)){
    for (const o of ents) if (o.type === 'sandbag' || o.type === 'turret'){ if (!o.dead && o.type === 'turret'){ kill(o, null); } o.dead = true; }
    floatText('ROAD CLEAR!', LW/2, 60, '#86d45a', 2, 1.6); say('ROAD CLEAR! NICE WORK!', 2);
  }
}
function grab(p, kind, x, y){
  sfx.pick(); floatText(PICKUPS[kind].name, x, y - 14, '#fff3a0', 1, 1.4);
  if (kind === 'REPAIR'){ armor = Math.min(MAX_ARMOR, armor + 3); lowSaid = false; }
  else if (kind === 'SPREAD' && p) p.spread = 15;
  else if (kind === 'RAPID' && p){ p.rapid = 12; p.ammo = CLIP; p.reload = 0; }
  else if (kind === 'BOOM'){
    whiteFlash = 0.5; shake = 12;
    for (const e of ents) if (!e.dead && e.side === facing && e.type !== 'crate' && e.type !== 'sign' && e.type !== 'boss' && e.type !== 'sandbag' && e.rect) kill(e, p);
    for (const r of rockets) if (!r.dead){ r.dead = true; explode(r.x, r.y, 4); }
  }
}

/* ---------- shooting ---------- */
function act(p, kind){
  unlockAudio();
  if (state === 'title'){
    if (kind !== 'fire') return;
    const lx = p.x / SC, ly = p.y / SC;
    if (lx > START_BTN.x && lx < START_BTN.x + START_BTN.w && ly > START_BTN.y && ly < START_BTN.y + START_BTN.h){ sfx.join(); startGame(); }
    return;
  }
  if (state === 'continue'){ if (kind === 'fire'){ armor = MAX_ARMOR; invul = 2; continues++; state = 'play'; lowSaid = false; setMusic(boss ? 'boss' : 'stage'); sfx.join(); say("BACK IN THE FIGHT!", 2); } return; }
  if (state === 'gameover' || state === 'clear'){ if (kind === 'fire' && stateT > 3) goTitle(); return; }
  if (state !== 'play') return;
  if (kind === 'reload'){ if (p.ammo < CLIP && (p.reload <= 0 || p.auto)){ p.reload = RELOAD_T; p.auto = false; sfx.reload(); } return; }
  fire(p);
}
function fire(p){
  if (p.fireCd > 0) return;
  if (p.reload > 0 && !p.auto && p.rapid <= 0) return;
  if (p.rapid <= 0){
    if (p.ammo <= 0){ sfx.empty(); p.fireCd = 0.12; floatText('RELOAD!', p.x / SC, p.y / SC - 14, '#ff4a3c', 1, 0.6); return; }
    p.ammo--; if (p.ammo <= 0){ p.reload = AUTO_RELOAD_T; p.auto = true; }
  }
  p.fireCd = p.rapid > 0 ? 0.085 : 0.07; p.shots++;
  sfx.shot(p.i);
  const lx = p.x / SC, ly = p.y / SC, rad = p.spread > 0 ? 12 : 2, maxHits = p.spread > 0 ? 3 : 1;
  lights.push({ x: lx, y: ly, r: 34, t:0, life: 0.12 });
  sparks(lx, ly, 4, ['#ffffff', '#fff3a0'], 30, 0.2);
  let hits = 0, neutral = false;
  // rockets first (closest to you)
  for (const r of rockets){ if (hits >= maxHits) break; if (!r.dead && Math.hypot(lx - r.x, ly - r.y) < r.r + 3 + rad){ r.dead = true; hits++; explode(r.x, r.y, 4); award(p, 50, r.x, r.y); } }
  // gunship cores
  if (gunship && !gunship.dead && hits < maxHits) for (const c of gunship.cores){
    if (c.hp <= 0 || hits >= maxHits) continue;
    if (Math.hypot(lx - (gunship.x + c.x), ly - (gunship.y + c.y)) < 6 + rad){ c.hp--; c.flash = 0.12; hits++; sfx.hit(); sparks(gunship.x + c.x, gunship.y + c.y, 6, ['#ffd23f', '#fff'], 50);
      if (c.hp <= 0){ explode(gunship.x + c.x, gunship.y + c.y, 8); award(p, 500, gunship.x + c.x, gunship.y + c.y); if (gunship.cores.every(q => q.hp <= 0)){ gunship.dead = true; gunship.deadT = 0; explode(gunship.x + 60, gunship.y + 24, 30, true); award(p, 5000, gunship.x + 60, gunship.y + 10); floatText('GUNSHIP DOWN!', LW/2, 60, '#ffd23f', 2, 2); say('GUNSHIP DOWN! WHOO!', 2); } } }
  }
  // world entities, nearest first
  const vis = ents.filter(e => !e.dead && e.rect && e.side === facing && !TYPES[e.type].decor).sort((a, b) => a.d - b.d);
  for (const e of vis){
    if (hits >= maxHits) break;
    if (e.type === 'boss'){
      let coreHit = false;
      for (const c of e.cores){ if (c.hp <= 0 || !c.open) continue; const cx = e.rect.x0 + c.x * e.rect.k, cy = e.rect.y0 + c.y * e.rect.k; if (Math.hypot(lx - cx, ly - cy) < Math.max(3, 5 * e.rect.k) + rad){ coreHit = true; hitBossCore(e, c, p, cx, cy); hits++; break; } }
      if (!coreHit && lx > e.rect.x0 && lx < e.rect.x1 && ly > e.rect.y0 && ly < e.rect.y1){ neutral = true; sfx.ping(); sparks(lx, ly, 3, ['#a8b0c4', '#ffffff'], 30, 0.2); break; }
      continue;
    }
    const r = e.rect, cx = (r.x0 + r.x1) / 2, cy = (r.y0 + r.y1) / 2, hw = Math.max(4, (r.x1 - r.x0) / 2) + rad, hh = Math.max(4, (r.y1 - r.y0) / 2) + rad;
    if (Math.abs(lx - cx) < hw && Math.abs(ly - cy) < hh){
      hits++; e.hp--; e.flash = 0.1; if (e.ring && e.hp > 0){ e.ring = null; e.atk = rand(1.5, 2.5); floatText('STAGGER', cx, r.y0 - 4, '#ffffff', 1, 0.6); }
      if (e.hp <= 0) kill(e, p); else { sfx.hit(); sparks(lx, ly, 5, ['#ffd23f', '#ffffff'], 40, 0.3); }
    }
  }
  if (hits){ p.hits++; p.combo += 1; p.best = Math.max(p.best, p.combo); if (p.combo % 10 === 0 && p.combo <= 30) floatText('COMBO X' + (1 + p.combo / 10), p.x / SC, p.y / SC - 20, PC[p.i], 1, 1); }
  else if (!neutral) p.combo = 0;
}
function hitBossCore(e, c, p, cx, cy){
  c.hp--; c.flash = 0.1; sfx.hit(); sparks(cx, cy, 6, ['#ff4a3c', '#ffd23f', '#ffffff'], 60, 0.4); award(p, 20, cx, cy);
  if (e.ring){ e.ringHits++; if (e.ringHits >= (e.phase === 1 ? 3 : 4)){ e.ring = null; floatText('STAGGERED!', cx, cy - 12, '#ffffff', 1, 0.9); e.lunge = 0; } }
  if (c.hp <= 0){
    explode(cx, cy, 14, true); award(p, 1000, cx, cy); floatText(c.id === 'H' ? 'CORE DESTROYED!' : 'CANNON DESTROYED!', LW/2, 66, '#ffd23f', 1, 1.5);
    if (e.phase === 1 && e.cores.filter(q => q.id !== 'H').every(q => q.hp <= 0)){ e.phase = 2; e.cores.find(q => q.id === 'H').open = true; e.atk = 2; e.ringT = 4; say('THE HEAD IS OPEN! HIT IT!', 2.5); sfx.roar(); }
    if (c.id === 'H'){ e.dying = 3.2; e.ring = null; say('IT\'S GOING DOWN!', 2); if (p) p.kills++; e.killer = p; }
  }
}

/* ---------- rockets (screen space, they fly at you) ---------- */
function fireRocket(x0, y0){
  rockets.push({ x0, y0, x1: rand(90, 230), y1: rand(70, 130), x: x0, y: y0, t:0, dur: rand(1.6, 1.9), r: 1, dead:false });
  sfx.rocket(); sparks(x0, y0, 4, ['#ffd23f', '#ffffff'], 20, 0.3);
}

/* ---------- update ---------- */
function update(rdt){
  clock += rdt; stateT += rdt;
  pollPads();
  for (const p of PL){
    if (!p.src) continue;
    if (p.src.type === 'mouse'){ p.x = mouse.x; p.y = mouse.y; p.held = mouse.down; }
    if (p.src.type === 'keys'){ const v = 900 * rdt; if (keys.ArrowLeft) p.x -= v; if (keys.ArrowRight) p.x += v; if (keys.ArrowUp) p.y -= v; if (keys.ArrowDown) p.y += v; p.x = clamp(p.x, 0, W); p.y = clamp(p.y, 0, H); p.held = !!(keys.Enter || keys.Space); }
  }
  timeScale = lerp(timeScale, tsTarget, Math.min(1, rdt * 6));
  if (engine){ engine.gn.gain.value = state === 'play' ? (jump ? 0.05 : 0.14) : state === 'clear' ? 0.08 * speed / V0 : 0; engine.o.frequency.value = 42 + speed / V0 * 10 + Math.sin(clock * 9) * 2; }
  if (state === 'title'){ S += V0 * 0.55 * rdt; if (S > 38 * V0) S = 2 * V0; facing = 'back'; return; }
  if (state === 'continue'){ contT -= rdt; if (contT <= 0){ state = 'gameover'; stateT = 0; saveHi(); } updateFx(rdt); return; }
  if (state === 'gameover' || state === 'clear'){ updateFx(rdt); if (state === 'clear') S += speed * rdt; return; }
  const dt = rdt * timeScale;

    }
  }
  if (e.type === 'crate' && r.y1 - r.y0 > 10) ptxt(e.kind, (r.x0 + r.x1) / 2, r.y0 - 9, '#' + (e.kind === 'BOOM' ? 'ff4a3c' : 'fff3a0'), 1, 'center');
  if (e.type === 'eyebot' || e.lit) lampSpots.push({ x: (r.x0 + r.x1) / 2, y: (r.y0 + r.y1) / 2, r: e.lit ? 10 : 5, red:true });
  if (e.type === 'sign' && r.y1 - r.y0 > 6 && Math.sin(clock * 10) > 0){ g.strokeStyle = '#ffffff'; g.lineWidth = 1; g.strokeRect(Math.round(r.x0) - 1.5, Math.round(r.y0) - 1.5, Math.round(r.x1 - r.x0) + 3, Math.round((r.y1 - r.y0) * 0.5) + 3); }
}
function pcirc(cx, cy, r, col){ g.fillStyle = col; const rr = Math.max(0.5, r); for (let dy = -Math.floor(rr); dy <= Math.floor(rr); dy++){ const hw = Math.floor(Math.sqrt(rr * rr - dy * dy)); g.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw * 2 + 1, 1); } }
function pring(cx, cy, r, col){ g.fillStyle = col; const n = Math.max(12, Math.round(r * 6)); for (let i = 0; i < n; i++){ const a = i / n * TAU; g.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1); } }

/* ---------- rendering: fx / hud ---------- */
function drawRings(){
  for (const e of ents){
    if (!e.ring || !e.rect || e.side !== facing) continue;
    const r = e.rect, f = e.ring.t / e.ring.dur;
    let cx = (r.x0 + r.x1) / 2, cy = (r.y0 + r.y1) / 2, min = Math.max(5, (r.x1 - r.x0) * 0.45);
    if (e.type === 'boss'){ cx = r.x0 + 48 * r.k; cy = r.y0 + 18 * r.k; min = 10; }
    const rad = lerp(34, min, f), col = (f > 0.7 && Math.sin(clock * 40) > 0) ? '#ffffff' : '#ff3030';
    pring(cx, cy, rad, col); pring(cx, cy, rad + 1, col);
    g.fillStyle = col; g.fillRect(Math.round(cx - rad - 4), Math.round(cy), 4, 1); g.fillRect(Math.round(cx + rad + 1), Math.round(cy), 4, 1); g.fillRect(Math.round(cx), Math.round(cy - rad - 4), 1, 4); g.fillRect(Math.round(cx), Math.round(cy + rad + 1), 1, 4);
    if (e.type === 'boss') ptxt('LASER!', cx, cy - rad - 13, '#ff3030', 1, 'center');
  }
}
function drawRockets(){
  for (const r of rockets){
    const x = r.x, y = r.y, rr = r.r;
    pcirc(x, y, rr + 1, '#14101e'); pcirc(x, y, rr, '#a8b0c4'); pcirc(x, y, rr * 0.55, '#ff4a3c'); pcirc(x, y, rr * 0.25, Math.sin(clock * 30) > 0 ? '#fff3a0' : '#ffd23f');
    if (rr > 3){ g.fillStyle = '#3a3a4e'; g.fillRect(Math.round(x - rr - 2), Math.round(y - 1), 2, 2); g.fillRect(Math.round(x + rr + 1), Math.round(y - 1), 2, 2); g.fillRect(Math.round(x - 1), Math.round(y - rr - 2), 2, 2); }
    if (Math.sin(clock * 24) > 0) pring(x, y, rr + 4, '#ff3030');
  }
}
function drawGunship(){
  const gs = gunship; if (!gs) return;
  const x = Math.round(gs.x), y = Math.round(gs.y);
  g.drawImage(SPR.gunship, x, y);
  const rx = 8 + Math.abs(Math.sin(clock * 30)) * 100; g.fillStyle = '#14101e'; g.fillRect(x + 60 - rx / 2, y, rx, 1);
  for (const c of gs.cores){
    const cx = x + c.x, cy = y + c.y;
    if (c.hp <= 0){ if (Math.random() < 0.4) parts.push({ x: cx, y: cy, vx: rand(-5, 5), vy: -rand(10, 20), g: -5, t:0, life: 0.6, col: pick(['#3a3a4e', '#6b7088']), sz: 2 }); continue; }
    pcirc(cx, cy, 5, '#14101e'); pcirc(cx, cy, 4, c.flash > 0 ? '#ffffff' : Math.sin(clock * 8) > 0.5 ? '#ff7a5c' : '#ff4a3c'); pcirc(cx - 1, cy - 1, 1, '#fff3a0');
  }
}
function drawFx(){
  for (const b of booms){
    const f = b.t / b.life, r = b.r * (0.4 + f * 0.9);
    pcirc(b.x, b.y, r, f < 0.25 ? '#fff3a0' : f < 0.5 ? '#ffd23f' : f < 0.75 ? '#f08a24' : '#6b7088');
    if (f < 0.6) pcirc(b.x, b.y, r * 0.6, f < 0.3 ? '#ffffff' : '#fff3a0');
  }
  for (const q of parts){ g.fillStyle = q.col; g.fillRect(Math.round(q.x), Math.round(q.y), q.sz || 1, q.sz || 1); }
}
function drawDark(){
  if (darkA <= 0.01) return;
  dg.globalCompositeOperation = 'source-over'; dg.clearRect(0, 0, LW, LH);
  dg.fillStyle = 'rgba(2,2,6,' + darkA.toFixed(3) + ')'; dg.fillRect(0, 0, LW, LH);
  dg.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a) => { const gr = dg.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(0,0,0,' + a + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)'); dg.fillStyle = gr; dg.fillRect(x - r, y - r, r * 2, r * 2); };
  hole(LW / 2, HORIZON + 8, 40, 0.4); hole(LW / 2, LH - 30, 70, 0.25);
  for (const l of lights) hole(l.x, l.y, l.r * 1.3 * (1 - l.t / l.life * 0.5), 1 - l.t / l.life);
  for (const l of lampSpots) hole(l.x, l.y, l.r, l.red ? 0.75 : 0.6);
  for (const r of rockets) hole(r.x, r.y, 10 + r.r, 0.9);
  for (const b of booms) hole(b.x, b.y, b.r * 3, 0.9);
  for (const p of PL) if (p.src) hole(p.x / SC, p.y / SC, 9, 0.25);
  g.drawImage(dark, 0, 0);
}
function drawJeep(){
  const bob = Math.round(Math.sin(clock * 17) * 0.6 + Math.sin(clock * 7.3) * 0.6 + (hop > 0 ? -Math.min(3, hop / 300) : 0) + (jump ? -2 : 0));
  if (facing === 'back'){ g.drawImage(SPR.jeepBack, 0, LH - 44 + 10 + bob); }
  else { g.drawImage(SPR.jeepFront, 0, LH - 64 + 14 + bob); }
}
function drawHud(){
  const players = PL;
  for (const p of players){
    const left = p.i === 0, x = left ? 3 : LW - 3, al = left ? 'left' : 'right';
    if (!p.src){ if (state === 'play' && Math.sin(clock * 4) > 0) ptxt('P' + (p.i + 1) + ' PULL TRIGGER', x, 3, PC[p.i], 1, al); continue; }
    ptxt('P' + (p.i + 1) + ' ' + String(Math.floor(p.score)).padStart(7, '0'), x, 3, PC[p.i], 1, al);
    // ammo
    const n = CLIP;
    for (let k = 0; k < n; k++){ const bx = left ? x + k * 4 : x - 3 - k * 4; g.fillStyle = '#14101e'; g.fillRect(bx - 1, 12, 4, 7); g.fillStyle = p.rapid > 0 ? '#ffd23f' : k < p.ammo ? '#fff3a0' : '#3a3a4e'; g.fillRect(bx, 13, 2, 5); if (k < p.ammo || p.rapid > 0){ g.fillStyle = '#f08a24'; g.fillRect(bx, 13, 2, 1); } }
    let tagX = left ? x + n * 4 + 3 : x - n * 4 - 3;
    const tags = [];
    if (p.reload > 0) tags.push([p.auto ? 'RELOAD!' : 'RELOADING', '#ff4a3c']);
    const m = 1 + Math.min(3, Math.floor(p.combo / 10)); if (m > 1) tags.push(['X' + m, '#ffd23f']);
    if (p.spread > 0) tags.push(['SPREAD', '#6fd8ff']); if (p.rapid > 0) tags.push(['RAPID', '#ffd23f']);
    for (const [s, col] of tags){ if (s === 'RELOAD!' && Math.sin(clock * 12) < 0) continue; const w = ptxt(s, tagX, 12, col, 1, al); tagX += (left ? 1 : -1) * (w + 4); }
  }
  // armor (painted on the tailgate)
  const ax = LW / 2 - MAX_ARMOR * 4.5, ay = LH - 9;
  for (let k = 0; k < MAX_ARMOR; k++) g.drawImage(k < armor ? SPR.heart : SPR.heartE, Math.round(ax + k * 9), ay);
  // boss bar
  if (boss && boss.rect && !boss.dying){
    const tot = boss.cores.reduce((a, c) => a + Math.max(0, c.hp), 0), max = boss.cores.reduce((a, c) => a + c.max, 0);
    ptxt('IRON RHINO', LW / 2, 23, '#ff4a3c', 1, 'center');
    g.fillStyle = '#14101e'; g.fillRect(LW / 2 - 61, 31, 122, 6); g.fillStyle = '#3a3a4e'; g.fillRect(LW / 2 - 60, 32, 120, 4); g.fillStyle = '#ff4a3c'; g.fillRect(LW / 2 - 60, 32, Math.round(120 * tot / max), 4); g.fillStyle = '#ff9a8a'; g.fillRect(LW / 2 - 60, 32, Math.round(120 * tot / max), 1);
  }
  // dialogue
  if (dlg){
    const n = Math.min(dlg.text.length, Math.floor(dlg.t * 40)), lines = wrap(dlg.text.slice(0, n), 26), y0 = boss ? 40 : 22;
    g.fillStyle = 'rgba(10,10,20,0.78)'; g.fillRect(64, y0, 192, 26); g.fillStyle = '#14101e'; g.fillRect(64, y0, 192, 1); g.fillRect(64, y0 + 25, 192, 1);
    g.drawImage(SPR.driver, 66, y0 + 2);
    ptxt('SARGE', 92, y0 + 2, '#86d45a', 1, 'left', null);
    lines.slice(0, 2).forEach((l, i) => ptxt(l, 92, y0 + 10 + i * 8, '#ffffff', 1, 'left', null));
  }
  if (banner){
    const a = clamp(Math.min(banner.t * 3, (banner.dur - banner.t) * 3), 0, 1);
    if (a > 0){ g.globalAlpha = a; g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 62, LW, 40); ptxt(banner.a, LW / 2, 66, '#ffd23f', 2, 'center'); ptxt(banner.b, LW / 2, 84, '#ffffff', 2, 'center'); g.globalAlpha = 1; }
  }
  for (const f of floats){ g.globalAlpha = clamp((f.life - f.t) * 3, 0, 1); ptxt(f.s, f.x, f.y, f.col, f.sc, 'center'); g.globalAlpha = 1; }
}

/* ---------- screens ---------- */
const START_BTN = { x: 106, y: 140, w: 108, h: 22 };
function drawTitle(){
  ptxt('ROUGH', LW / 2, 18, '#ffd23f', 5, 'center', '#4e301a');
  ptxt('RIDE', LW / 2, 58, '#f08a24', 5, 'center', '#4e301a');
  ptxt('STAGE 1: JUNGLE RUN', LW / 2, 98, '#ffffff', 1, 'center');
  for (const p of PL){
    const x = p.i ? LW * 0.78 : LW * 0.22;
    g.fillStyle = 'rgba(10,10,20,0.7)'; g.fillRect(x - 46, 108, 92, 26);
    ptxt('PLAYER ' + (p.i + 1), x, 111, PC[p.i], 1, 'center');
    if (p.src) ptxt('READY  ' + srcLabel(p), x, 123, '#ffffff', 1, 'center');
    else if (Math.sin(clock * 4) > 0) ptxt('PULL TRIGGER', x, 123, '#ffffff', 1, 'center');
  }
  const ready = PL.some(p => p.src), b = START_BTN;
  g.fillStyle = ready ? (Math.sin(clock * 6) > 0 ? '#c8323a' : '#8a1e24') : '#3a3a4e'; g.fillRect(b.x, b.y, b.w, b.h);
  g.fillStyle = '#14101e'; g.strokeStyle = '#14101e'; g.fillRect(b.x, b.y + b.h - 2, b.w, 2);
  ptxt(ready ? 'SHOOT TO START' : 'JOIN FIRST', LW / 2, b.y + 7, '#ffffff', 1, 'center');
  ptxt('HI ' + String(hiScore).padStart(7, '0'), LW / 2, 3, '#fff3a0', 1, 'center');
  ptxt('SHOOT OFF-SCREEN = RELOAD   A+B OFF-SCREEN = MENU', LW / 2, LH - 9, '#a8b0c4', 1, 'center');
}
function drawContinue(){
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, LW, LH);
  ptxt('CONTINUE?', LW / 2, 50, '#ffd23f', 3, 'center'); ptxt(String(Math.max(0, Math.ceil(contT))), LW / 2, 82, '#ff4a3c', 4, 'center');
  ptxt('PULL THE TRIGGER!', LW / 2, 124, '#ffffff', 1, 'center');
}
function drawGameOver(){
  g.fillStyle = 'rgba(0,0,0,0.75)'; g.fillRect(0, 0, LW, LH);
  ptxt('GAME OVER', LW / 2, 40, '#ff4a3c', 3, 'center');
  PL.filter(p => p.src).forEach((p, i) => ptxt('P' + (p.i + 1) + '  ' + String(Math.floor(p.score)).padStart(7, '0'), LW / 2, 80 + i * 12, PC[p.i], 1, 'center'));
  if (stateT > 3) ptxt('SHOOT TO RETURN', LW / 2, 140, '#ffffff', 1, 'center');
}
function drawClear(){
  g.fillStyle = 'rgba(0,0,0,' + Math.min(0.75, stateT * 0.5).toFixed(2) + ')'; g.fillRect(0, 0, LW, LH);
  ptxt('STAGE 1 CLEAR!', LW / 2, 14, '#ffd23f', 2, 'center');
  const ci = clearInfo || [];
  ci.forEach((c, i) => {
    const x = ci.length > 1 ? (i ? LW * 0.74 : LW * 0.26) : LW / 2, col = PC[c.p.i], show = n => stateT > 0.6 + n * 0.45;
    ptxt('PLAYER ' + (c.p.i + 1), x, 40, col, 1, 'center');
    if (show(0)) ptxt('KILLS ' + c.p.kills, x, 54, '#ffffff', 1, 'center');
    if (show(1)) ptxt('ACCURACY ' + c.acc + '%', x, 64, '#ffffff', 1, 'center');
    if (show(2)) ptxt('BEST COMBO ' + c.p.best, x, 74, '#ffffff', 1, 'center');
    if (show(3)) ptxt('BONUS +' + c.bonus, x, 84, '#86d45a', 1, 'center');
    if (show(4)) ptxt(String(Math.floor(c.total)).padStart(7, '0'), x, 96, col, 2, 'center');
  });
  if (stateT > 3.2 && ci.rank){ ptxt('RANK', LW / 2, 118, '#ffffff', 1, 'center'); ptxt(ci.rank, LW / 2, 128, ci.rank === 'S' ? '#ffd23f' : '#ffffff', 3, 'center'); }
  if (stateT > 4) ptxt('NEXT: STAGE 2 DESERT CANYON - COMING SOON', LW / 2, 158, '#a8b0c4', 1, 'center');
  if (stateT > 4 && Math.sin(clock * 4) > 0) ptxt('SHOOT TO RETURN', LW / 2, 168, '#ffffff', 1, 'center');
}

/* ---------- main draw ---------- */
function render(){
  const cur = trk.g[segAt(S)];
  const inTunnel = (cur === 'tunnel') && state !== 'title';
  darkA = lerp(darkA, inTunnel ? 0.9 : 0, 0.08);
  camY = (jump ? RAMP_Y + 900 * 4 * jump.u * (1 - jump.u) : heightAt(S)) + CAM_H + hop + Math.sin(clock * 23) * 9 + Math.sin(clock * 9.7) * 6;
  const curv = trk.c[segAt(S)] || 0; if (state !== 'gameover') bgX += curv * dir * (state === 'play' ? timeScale : 0.6) * 0.9;
  project();
  drawBg(inTunnel || darkA > 0.5);
  drawRoad();
  drawSprites();
  if (state !== 'title'){
    drawRockets(); drawGunship(); drawFx(); drawRings(); drawDark(); drawJeep(); drawHud();
  } else { drawFx(); drawJeep(); drawTitle(); }
  if (state === 'continue') drawContinue();
  if (state === 'gameover') drawGameOver();
  if (state === 'clear') drawClear();
  if (hurtFlash > 0){ g.fillStyle = 'rgba(255,40,40,' + (hurtFlash * 0.9).toFixed(2) + ')'; g.fillRect(0, 0, LW, LH); }
  if (whiteFlash > 0){ g.fillStyle = 'rgba(255,255,255,' + Math.min(1, whiteFlash * 1.6).toFixed(2) + ')'; g.fillRect(0, 0, LW, LH); }
  // blit to the big canvas
  const sx = shake > 0 ? Math.round(rand(-shake, shake)) * SC / 2 : 0, sy = shake > 0 ? Math.round(rand(-shake, shake)) * SC / 2 : 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (turn){
    const t = turn.t / 0.56, off = t < 0.5 ? -Math.pow(t * 2, 2) * W : Math.pow((1 - t) * 2, 2) * W;
    ctx.globalAlpha = 0.35; ctx.drawImage(lo, off * 0.85 + sx, sy, W, H); ctx.globalAlpha = 1; ctx.drawImage(lo, off + sx, sy, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; for (let i = 0; i < 18; i++) ctx.fillRect(0, (i * 97 + clock * 900) % H, W, 3);
  } else ctx.drawImage(lo, sx, sy, W, H);
  if (jump && timeScale < 0.6){ ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, 40); ctx.fillRect(0, H - 40, W, 40); }
  for (const p of PL) if (p.src) drawCross(p);
}
function drawCross(p){
  const x = Math.round(p.x), y = Math.round(p.y), col = PC[p.i], b = 4;
  const sq = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x + dx, y + dy, w, h); };
  for (const [c, o] of [['#000', 2], [col, 0]]){
    sq(-22 - o, -b/2 - o, 14 + o*2, b + o*2, c); sq(8 - o, -b/2 - o, 14 + o*2, b + o*2, c);
    sq(-b/2 - o, -22 - o, b + o*2, 14 + o*2, c); sq(-b/2 - o, 8 - o, b + o*2, 14 + o*2, c);
  }
  sq(-2, -2, 4, 4, '#fff');
  if (state === 'play' && (p.reload > 0 || p.ammo === 0) && p.rapid <= 0){ ctx.fillStyle = '#ff4a3c'; ctx.fillRect(x - 20, y + 26, 40 * (p.auto ? 1 - p.reload / AUTO_RELOAD_T : 1 - p.reload / RELOAD_T), 4); }
}

/* ---------- main loop ---------- */
let lastT = performance.now();
function frame(now){
  const rdt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(rdt); musicTick(); render();
  requestAnimationFrame(frame);
}
goTitle();
requestAnimationFrame(frame);
</script>
