<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SplatterStrike</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#15151c;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:none;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   SPLATTERSTRIKE — 2-player light gun paint war (OpenFIRE / mouse / keys)
   60 seconds. Every shot splashes your color. Most wall at the buzzer wins.
   ===================================================================== */
const W = 1280, H = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function resize(){ const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px'; }
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const FONT = '"Arial Black","Arial Bold",Gadget,"Helvetica Neue",Arial,sans-serif';

/* ---------- tuning ---------- */
const ROUND = 60;          // seconds per round
const BASE_R = 40;         // normal splat radius (px)
const SHOT_COST = 1/8;     // ink tank holds 8 shots
const INK_REGEN = 0.42;    // tanks per second (≈3.4 shots/s sustained)
const FIRE_CD = 0.09;      // min seconds between shots

/* ---------- players / palette ---------- */
const NEON = [
  { name:'BLUE',   hex:'#1683ff' }, { name:'CYAN',   hex:'#00d8ff' }, { name:'MINT',   hex:'#00f0a0' },
  { name:'GREEN',  hex:'#3cf01a' }, { name:'LIME',   hex:'#c2f000' }, { name:'YELLOW', hex:'#ffe100' },
  { name:'ORANGE', hex:'#ff7a00' }, { name:'RED',    hex:'#ff2d3c' }, { name:'PINK',   hex:'#ff2bd6' },
  { name:'PURPLE', hex:'#9b30ff' }
];
function hexToHsl(hex){
  const n = parseInt(hex.slice(1), 16), r = (n>>16)/255, g = (n>>8&255)/255, b = (n&255)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2; let h = 0, sa = 0;
  if (mx !== mn){ const d = mx-mn; sa = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === r ? (g-b)/d + (g<b ? 6 : 0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4; h /= 6; }
  return [h*360, sa*100, l*100];
}
const hsl = (h, sa, l) => `hsl(${h.toFixed(0)},${sa.toFixed(0)}%,${clamp(l,0,100).toFixed(0)}%)`;
function makePal(idx){
  const n = NEON[idx], [h, sa, l] = hexToHsl(n.hex);
  return { idx, name:n.name, col:n.hex, shades:[n.hex, hsl(h,sa,l+3), hsl(h,sa,l-5), hsl(h,sa,l-2)], dark:hsl(h,sa,l*0.45) };
}
const PL = [makePal(0), makePal(6)];
function setColor(i, idx){ PL[i] = makePal(idx); }
function mkPlayer(i){
  return { i, id:i+1, x: i ? W*0.7 : W*0.3, y: H*0.55, src:null, ink:1, frozen:0, big:0,
           pending:null, rain:0, rainT:0, cd:0, cpu:{t:0,tx:W/2,ty:H/2,fire:0,pu:null} };
}
const P = [mkPlayer(0), mkPlayer(1)];
const matchWins = [0, 0];
let stats = [];
function resetStats(){ stats = [0,1].map(() => ({ shots:0, steals:0, pu:0 })); }
resetStats();

/* ---------- territory grid (what actually gets scored) ---------- */
const CELL = 5, GW = W / CELL, GH = H / CELL, TOT = GW * GH;
const grid = new Uint8Array(TOT);
const counts = [0, 0, 0];
const paint = document.createElement('canvas'); paint.width = W; paint.height = H;
const pctx = paint.getContext('2d');
function claim(i, id){
  const o = grid[i]; if (o === id) return;
  if (o){ counts[o]--; if (state === 'play') stats[id-1].steals++; }
  grid[i] = id; counts[id]++;
}
function clearBoard(){ grid.fill(0); counts[0]=counts[1]=counts[2]=0; pctx.clearRect(0,0,W,H); }

/* ---------- background wall ---------- */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function(){
  const b = bg.getContext('2d');
  b.fillStyle = '#dedad1'; b.fillRect(0,0,W,H);
  b.strokeStyle = '#d0ccc2'; b.lineWidth = 2;
  for (let y = 0; y < H; y += 48){ b.beginPath(); b.moveTo(0,y); b.lineTo(W,y); b.stroke();
    const off = (y/48)%2 ? 48 : 0;
    for (let x = off; x < W; x += 96){ b.beginPath(); b.moveTo(x,y); b.lineTo(x,y+48); b.stroke(); } }
  const g = b.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.95);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(60,50,30,0.18)');
  b.fillStyle = g; b.fillRect(0,0,W,H);
})();

/* ---------- splat shapes ---------- */
function makeBlob(x, y, R){
  const n = 24, raw = [];
  for (let i = 0; i < n; i++) raw.push(R * (0.72 + Math.random()*0.3));
  const arms = 2 + (Math.random()*3|0), drops = [];
  for (let k = 0; k < arms; k++){            // splash arms with drip chains
    const j = Math.random()*n|0, a = j/n*TAU;
    raw[j] = R * rand(1.15, 1.35);
    for (let m = 1; m <= 3; m++) drops.push({ x: x + Math.cos(a)*R*(1.2 + m*0.28), y: y + Math.sin(a)*R*(1.2 + m*0.28), r: R*(0.2 - m*0.045) });
  }
  const rs = raw.map((r,i) => (raw[(i+n-1)%n] + 3*r + raw[(i+1)%n]) / 5);
  const nd = 3 + (Math.random()*5|0);
  for (let k = 0; k < nd; k++){
    const a = rand(0,TAU), d = R * rand(1.05, 1.75), r = R * rand(0.06, 0.16);
    drops.push({ x: x + Math.cos(a)*d, y: y + Math.sin(a)*d, r });
  }
  return { x, y, n, rs, drops };
}
function blobR(b, ang){
  const t = (((ang / TAU) % 1) + 1) % 1 * b.n, i = Math.floor(t), f = t - i;
  return b.rs[i % b.n] * (1-f) + b.rs[(i+1) % b.n] * f;
}
function blobPath(c, b){
  const n = b.n, pts = [];
  for (let i = 0; i < n; i++){ const a = i/n*TAU; pts.push([b.x + Math.cos(a)*b.rs[i], b.y + Math.sin(a)*b.rs[i]]); }
  const mid = (p,q) => [(p[0]+q[0])/2, (p[1]+q[1])/2];
  const m0 = mid(pts[n-1], pts[0]);
  c.beginPath(); c.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++){ const p = pts[i], m = mid(p, pts[(i+1)%n]); c.quadraticCurveTo(p[0], p[1], m[0], m[1]); }
  c.closePath();
}
function drawBlob(c, b, color){
  c.fillStyle = color; blobPath(c, b); c.fill();
  for (const d of b.drops){ c.beginPath(); c.arc(d.x, d.y, d.r, 0, TAU); c.fill(); }
}
function rasterCircle(x, y, r, id){
  const x0 = Math.max(0, Math.floor((x-r)/CELL)), x1 = Math.min(GW-1, Math.floor((x+r)/CELL));
  const y0 = Math.max(0, Math.floor((y-r)/CELL)), y1 = Math.min(GH-1, Math.floor((y+r)/CELL));
  const r2 = r*r;
  for (let cy = y0; cy <= y1; cy++){ const dy = (cy+.5)*CELL - y;
    for (let cx = x0; cx <= x1; cx++){ const dx = (cx+.5)*CELL - x; if (dx*dx+dy*dy <= r2) claim(cy*GW+cx, id); } }
}
function rasterBlob(b, id){
  let Rm = 0; for (const r of b.rs) if (r > Rm) Rm = r;
  const x0 = Math.max(0, Math.floor((b.x-Rm)/CELL)), x1 = Math.min(GW-1, Math.floor((b.x+Rm)/CELL));
  const y0 = Math.max(0, Math.floor((b.y-Rm)/CELL)), y1 = Math.min(GH-1, Math.floor((b.y+Rm)/CELL));
  for (let cy = y0; cy <= y1; cy++){ const py = (cy+.5)*CELL - b.y;
    for (let cx = x0; cx <= x1; cx++){ const px = (cx+.5)*CELL - b.x, d2 = px*px+py*py;
      if (d2 > Rm*Rm) continue;
      const r = blobR(b, Math.atan2(py, px)) * 0.96;
      if (d2 <= r*r) claim(cy*GW+cx, id); } }
  for (const d of b.drops) rasterCircle(d.x, d.y, d.r, id);
}

/* ---------- effects ---------- */
let parts = [], rings = [], texts = [], rollers = [], delayed = [], powerups = [];
let banner = null, shake = 0;
function burst(x, y, col, R, n){
  rings.push({ x, y, r:R*0.4, max:R*1.6, t:0, life:0.32, col });
  n = n || (8 + R/6 | 0);
  for (let k = 0; k < n; k++){
    const a = rand(0,TAU), sp = rand(180, 560) * Math.min(2.2, R/40);
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:rand(3,7)*Math.min(2,R/40), t:0, life:rand(.3,.6), col });
  }
}
function floatText(s, x, y, col, size){ texts.push({ s, x, y, col, size:size||26, t:0, life:1.2 }); }
function showBanner(s, sub, col, life){ banner = { s, sub, col, t:0, life:life||1.6 }; }

function splat(pi, x, y, R, quiet){
  const b = makeBlob(x, y, R), sh = PL[pi].shades;
  drawBlob(pctx, b, sh[Math.random()*sh.length|0]);
  rasterBlob(b, pi+1);
  burst(x, y, PL[pi].col, R);
  if (!quiet){ sfx.splat(x, R); shake = Math.max(shake, Math.min(6, R/40*2.5)); }
}
function stampCircle(pi, x, y, r){
  pctx.fillStyle = PL[pi].col;
  pctx.beginPath(); pctx.arc(x, y, r, 0, TAU); pctx.fill();
  rasterCircle(x, y, r, pi+1);
}

/* ---------- powerups ---------- */
const PU = {
  big:    { label:'BIG SPLASH',   short:'BIG',    col:'#ff2e88' },
  roller: { label:'PAINT ROLLER', short:'ROLLER', col:'#8b5cf6' },
  freeze: { label:'FREEZE!',      short:'FREEZE', col:'#16b8e0' },
  bomb:   { label:'PAINT BOMB',   short:'BOMB',   col:'#2b2b33' },
  rain:   { label:'PAINT RAIN',   short:'RAIN',   col:'#1faa62' }
};
const PU_TYPES = ['big','roller','freeze','bomb','rain'];
let nextPU = 4;
function spawnPU(){
  const type = PU_TYPES[Math.random()*PU_TYPES.length|0], dir = Math.random() < .5 ? 1 : -1;
  powerups.push({ type, x: dir > 0 ? -50 : W+50, by: rand(160, H-110), y: 0, vx: dir*rand(120,185), t:0, r:38, ph:rand(0,TAU) });
  sfx.ping();
}
function grab(p, pu){
  powerups.splice(powerups.indexOf(pu), 1);
  const d = PU[pu.type], o = P[1-p.i];
  burst(pu.x, pu.y, d.col, 60, 20);
  floatText(d.label, pu.x, pu.y - 50, PL[p.i].col, 30);
  sfx.power(pu.x);
  stats[p.i].pu++;
  if (pu.type === 'big') p.big = 3;
  else if (pu.type === 'roller') p.pending = 'roller';
  else if (pu.type === 'bomb') p.pending = 'bomb';
  else if (pu.type === 'rain'){ p.rain = 2.4; p.rainT = 0; }
  else if (pu.type === 'freeze'){ o.frozen = 2; sfx.freeze(); floatText('FROZEN!', o.x, o.y - 46, '#7fdcff', 28); }
}
function startRoller(p, y, mult){
  const dir = p.i === 0 ? 1 : -1;
  const x = dir > 0 ? -40 : W + 40;
  rollers.push({ pi:p.i, y, x, lx:x, dir, r: 38 * Math.min(mult, 1.6) });
  sfx.roller();
}
function paintBomb(p, x, y, mult){
  splat(p.i, x, y, BASE_R*1.5*mult, true); sfx.boom(x); shake = 10;
  for (let k = 0; k < 6; k++) delayed.push({ t: 0.15 + k*0.06, fn: () => {
    const a = rand(0,TAU), d = rand(80,165)*mult;
    splat(p.i, x + Math.cos(a)*d, y + Math.sin(a)*d, BASE_R*rand(.8,1.1)*mult);
  }});
}

/* ---------- game state ---------- */
let state = 'title', stateT = 0, timeLeft = ROUND, frenzy = false, lastBeep = 99, result = null, fanfared = false;
let decoT = 0;
const startBtn = { x: W/2, y: 556, r: 60 };
const GENRES = [
  { key:'punk', label:'PUNK', acc:'#ff2d3c' }, { key:'nu-disco', label:'NU-DISCO', acc:'#ff2bd6' },
  { key:'j-pop', label:'J-POP', acc:'#00d8ff' }, { key:'breakbeat', label:'BREAKBEAT', acc:'#3cf01a' },
  { key:'thrash', label:'THRASH', acc:'#b06bff' }, { key:'retro', label:'RETRO', acc:'#ffe100' },
  { key:'random', label:'RANDOM', acc:'#ffffff' }
];
const GAME_TRACKS = ['punk','nu-disco','j-pop','breakbeat','thrash','retro'];
let selMusic = 'punk', chosenTrack = 'punk', menuBack = false;
const musicCards = GENRES.map((g, k) => {
  const row = k < 4 ? 0 : 1, inRow = row ? 3 : 4, j = row ? k-4 : k, w = 250, h = 110, gap = 24;
  const x0 = (W - (inRow*w + (inRow-1)*gap)) / 2;
  return { ...g, x: x0 + j*(w+gap), y: row ? 352 : 218, w, h };
});
const goBtn = { x: W/2-120, y: 512, w: 240, h: 86, label:'GO!' };
const swatches = NEON.map((n, k) => ({ idx:k, x: W/2 - 240 + (k%5)*120, y: k < 5 ? 255 : 395, r: 46 }));
const fightBtn = { x: W/2, y: 568, r: 58 };
let swatchBlobs = null, prevBlobs = null;
const bannerImg = new Image();

const rematchBtn = { x: W/2-230, y: 528, w: 210, h: 84, label:'REMATCH' };
const menuBtn    = { x: W/2+20,  y: 528, w: 210, h: 84, label:'MENU' };
const both = () => P[0].src && P[1].src;

function startCountdown(){
  clearBoard(); resetStats();
  powerups = []; rollers = []; delayed = []; texts = [];
  for (const p of P){ p.ink = 1; p.frozen = 0; p.big = 0; p.pending = null; p.rain = 0; }
  timeLeft = ROUND; frenzy = false; lastBeep = 99; nextPU = 4; fanfared = false;
  state = 'countdown'; stateT = 0; banner = null;
  chosenTrack = selMusic === 'random' ? GAME_TRACKS[Math.random()*GAME_TRACKS.length|0] : selMusic;
  musicStop('menu', 1.2); musicStop('win', 0.5);
  for (const k of GAME_TRACKS) musicStop(k, 0.4);
  sfx.beep(520);
}
function goTitle(){
  state = 'title'; stateT = 0; powerups = []; rollers = []; delayed = []; banner = null; clearBoard();
  for (const k of [...GAME_TRACKS, 'win']) musicStop(k, 1);
  musicPlay('menu', 3);
}
function goMusic(){ state = 'music'; stateT = 0; }
function goColors(){ state = 'colors'; stateT = 0; }
function finish(){
  const a = counts[1], b = counts[2];
  result = { a: a/TOT*100, b: b/TOT*100, win: a > b ? 0 : b > a ? 1 : -1 };
  if (result.win >= 0) matchWins[result.win]++;
  state = 'results'; stateT = 0; menuBack = false;
}

/* ---------- shooting ---------- */
function inRect(b, x, y){ return x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h; }
function act(p, kind){
  if (state === 'countdown' || state === 'end') return;
  if (kind === 'reload'){ if (p.ink < 1){ p.ink = 1; sfx.reload(p.x); floatText('RELOAD', p.x, p.y-44, '#fff', 18); } return; }
  if (p.cd > 0) return;
  if (state === 'title'){
    if (both() && Math.hypot(p.x-startBtn.x, p.y-startBtn.y) < startBtn.r + 10){ burst(startBtn.x, startBtn.y, PL[p.i].col, 80, 26); sfx.ui(p.x); goMusic(); return; }
    doShot(p); return;
  }
  if (state === 'music'){
    for (const c of musicCards) if (inRect(c, p.x, p.y)){ selMusic = c.key; sfx.ui(p.x); burst(p.x, p.y, c.acc, 50, 14); return; }
    if (inRect(goBtn, p.x, p.y)){ sfx.ui(p.x); burst(p.x, p.y, '#21a35c', 60, 18); goColors(); return; }
    doShot(p); return;
  }
  if (state === 'colors'){
    for (const sw of swatches) if (Math.hypot(p.x-sw.x, p.y-sw.y) < sw.r + 6){
      if (PL[1-p.i].idx === sw.idx){ sfx.dry(p.x); floatText('TAKEN!', sw.x, sw.y - 56, '#fff', 22); }
      else { setColor(p.i, sw.idx); sfx.ui(p.x); burst(sw.x, sw.y, PL[p.i].col, 60, 18); floatText(PL[p.i].name + '!', sw.x, sw.y - 56, PL[p.i].col, 24); }
      return;
    }
    if (Math.hypot(p.x-fightBtn.x, p.y-fightBtn.y) < fightBtn.r + 10){ burst(fightBtn.x, fightBtn.y, PL[p.i].col, 80, 26); startCountdown(); return; }
    doShot(p); return;
  }
  if (state === 'results'){
    if (stateT < 2.4) return;
    if (inRect(rematchBtn, p.x, p.y)){ sfx.join(p.x); startCountdown(); }
    else if (inRect(menuBtn, p.x, p.y)){ sfx.join(p.x); goTitle(); }
    return;
  }
  if (state === 'play') doShot(p);
}
function doShot(p){
  if (p.frozen > 0){
    sfx.tink(p.x); p.cd = 0.12;
    for (let k = 0; k < 6; k++){ const a = rand(0,TAU); parts.push({ x:p.x, y:p.y, vx:Math.cos(a)*200, vy:Math.sin(a)*200, r:3, t:0, life:.35, col:'#bdefff' }); }
    return;
  }
  if (p.ink < SHOT_COST - 1e-6){ sfx.dry(p.x); p.cd = 0.12; floatText('EMPTY', p.x, p.y-44, '#fff', 16); return; }
  p.ink -= SHOT_COST; p.cd = FIRE_CD;
  if (state === 'play') stats[p.i].shots++;
  for (const pu of powerups){ if (Math.hypot(p.x-pu.x, p.y-pu.y) < pu.r + 8){ grab(p, pu); return; } }
  const mult = (p.big > 0 ? 2.2 : 1) * (frenzy ? 1.25 : 1);
  if (p.big > 0) p.big--;
  if (p.pending === 'roller'){ p.pending = null; startRoller(p, p.y, mult); return; }
  if (p.pending === 'bomb'){ p.pending = null; paintBomb(p, p.x, p.y, mult); return; }
  splat(p.i, p.x, p.y, BASE_R * mult * rand(.92, 1.08));
}

/* ---------- input: mouse ---------- */
const mouse = { x: W/2, y: H/2 };
function mpos(e){ const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; }
addEventListener('mousemove', mpos);
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousedown', e => {
  unlockAudio(); mpos(e);
  const p = P.find(q => q.src && q.src.type === 'mouse');
  if (p){ p.x = mouse.x; p.y = mouse.y; act(p, e.button === 2 ? 'reload' : 'fire'); }
  else if (e.button === 0) tryJoin({ type:'mouse' });
});

/* ---------- input: keyboard ---------- */
const keys = {};
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('keydown', e => {
  unlockAudio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.repeat){ return; }
  keys[e.code] = true;
  const kp = P.find(q => q.src && q.src.type === 'keys');
  switch (e.code){
    case 'KeyF': if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); break;
    case 'KeyM': muted = !muted; if (master) master.gain.value = muted ? 0 : 0.7; break;
    case 'KeyC': if (state === 'title'){ P[1].src = (P[1].src && P[1].src.type === 'cpu') ? null : (P[1].src || { type:'cpu' }); if (P[1].src) sfx.join(W); } break;
    case 'KeyR': if (state === 'title'){ P[0].src = null; P[1].src = null; matchWins[0] = matchWins[1] = 0; } break;
    case 'Escape': if (state === 'colors') goMusic(); else if (state !== 'title') goTitle(); break;
    case 'Digit1': case 'Digit2': {
      const p = P[e.code === 'Digit1' ? 0 : 1];
      if (p.src && p.src.type === 'pad'){ const m = ['auto','left','right']; p.src.stick = m[(m.indexOf(p.src.stick)+1)%3]; }
      break; }
    case 'KeyI': { const p = P.find(q => q.src && q.src.type === 'pad'); for (const q of P) if (q.src && q.src.type === 'pad') q.src.invY = !q.src.invY; break; }
    case 'Enter': case 'NumpadEnter': case 'Space':
      if (kp) act(kp, 'fire'); else tryJoin({ type:'keys' }); break;
    case 'ShiftLeft': case 'ShiftRight': if (kp) act(kp, 'reload'); break;
  }
});

/* ---------- input: gamepads (OpenFIRE gun in gamepad mode) ---------- */
const padPrev = {};
function pollPads(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads){
    if (!gp) continue;
    const prev = padPrev[gp.index] || [];
    const now = gp.buttons.map(b => b.pressed || b.value > 0.5);
    const p = P.find(q => q.src && q.src.type === 'pad' && q.src.index === gp.index);
    if (p){
      const s = p.src, a = gp.axes;
      if (a.length >= 4){
        const d0 = Math.abs(a[0] - (s.la[0] ?? a[0])) + Math.abs(a[1] - (s.la[1] ?? a[1]));

function cpuPick(p){

    const x = rand(40, W-40), y = rand(80, H-40), cell = grid[(y/CELL|0)*GW + (x/CELL|0)];
    const sc = (cell === 0 ? 2 : cell === p.id ? 0 : 3) + rand(0, .8) - Math.hypot(x-p.x, y-p.y)/700;

const sfxBuf = {}; let sfxLoaded = false, liveSplats = 0;
function loadSfx(){
  if (sfxLoaded || !ac) return; sfxLoaded = true;
  for (const k in SFX_DATA){
    const bin = atob(SFX_DATA[k]), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    ac.decodeAudioData(u.buffer, buf => { sfxBuf[k] = buf; }, () => {});
  }
}
function sample(k, x, vol, rate){
  const buf = sfxBuf[k]; if (!buf || !ac || muted) return false;
  const src = ac.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate || 1;
  const g = ac.createGain(); g.gain.value = vol; src.connect(g); g.connect(out(x));
  src.start(); return src;
}

/* ---------- music (files in the music/ folder) ---------- */
const TRACKS = {
  menu:'music/menu-retro.mp3', retro:'music/menu-retro.mp3', punk:'music/punk.mp3', 'nu-disco':'music/nu-disco.mp3',
  'j-pop':'music/j-pop.mp3', breakbeat:'music/breakbeat.mp3', thrash:'music/thrash.mp3', win:'music/win.mp3'
};
const TRACK_VOL = { menu:0.7, win:0.85 };      // game tracks default to 0.55 so splats cut through
const mus = {}, blocked = new Set();
function trk(name){
  if (!mus[name]){
    const el = new Audio(TRACKS[name]); el.preload = 'auto'; el.loop = name !== 'win';
    mus[name] = { el, vol:0, target:0, speed:1, boost:1 };
  }
  return mus[name];
}
function tryPlay(t){
  const pr = t.el.play();
  if (pr && pr.catch) pr.then(() => blocked.delete(t)).catch(() => blocked.add(t));
}
function musicPlay(name, fade, restart){
  const t = trk(name);
  if (restart){ try { t.el.currentTime = 0; } catch(e){} t.vol = 0; }
  t.target = 1; t.speed = fade > 0 ? 1/fade : 1000;
  if (t.el.paused) tryPlay(t);
}
function musicStop(name, fade){ const t = mus[name]; if (!t) return; t.target = 0; t.speed = fade > 0 ? 1/fade : 1000; }
function musicUpdate(dt){
  for (const k in mus){
    const t = mus[k];
    if (t.el.paused && t.target > 0){ t.el.volume = 0; continue; }       // still waiting on autoplay permission
    if (t.vol < t.target) t.vol = Math.min(t.target, t.vol + t.speed*dt);
    else if (t.vol > t.target) t.vol = Math.max(t.target, t.vol - t.speed*dt);
    t.el.volume = clamp(t.vol * (TRACK_VOL[k] ?? 0.55) * t.boost * (muted ? 0 : 1), 0, 1);
    if (t.vol <= 0 && t.target === 0 && !t.el.paused) t.el.pause();
  }
}
function unlockAudio(){ audio(); loadSfx(); for (const t of [...blocked]) if (t.target > 0) tryPlay(t); }

/* ---------- update ---------- */
function update(dt){
  stateT += dt;
  pollPads();
  for (const p of P){
    if (p.src){
      if (p.src.type === 'mouse'){ p.x = mouse.x; p.y = mouse.y; }
      else if (p.src.type === 'keys'){
        const v = 680*dt;
        if (keys.ArrowLeft) p.x -= v; if (keys.ArrowRight) p.x += v;
        if (keys.ArrowUp) p.y -= v;   if (keys.ArrowDown) p.y += v;
      } else if (p.src.type === 'cpu') cpuUpdate(p, dt);
    }
    p.x = clamp(p.x, 0, W); p.y = clamp(p.y, 0, H);
    p.cd -= dt; p.ink = Math.min(1, p.ink + INK_REGEN*dt);
    if (p.frozen > 0) p.frozen -= dt;
    if (p.rain > 0 && state === 'play'){
      p.rain -= dt; p.rainT -= dt;
      if (p.rainT <= 0){ p.rainT = 0.09; splat(p.i, rand(30, W-30), rand(70, H-30), BASE_R*rand(.5,.8), true); sfx.splat(rand(0,W), 18); }
    }
  }

  if (state === 'title'){
    decoT -= dt;
    if (decoT <= 0){ decoT = rand(.5, 1.0); splat(Math.random()<.5?0:1, rand(30,W-30), rand(30,H-30), rand(30,70), true); }
  } else if (state === 'countdown'){
    const n = Math.floor(stateT / 0.8);
    if (n !== lastBeep){ lastBeep = n; if (n < 3) sfx.beep(520); else sfx.beep(1040); }
    if (stateT >= 2.4){ state = 'play'; stateT = 0; lastBeep = 99; showBanner('SPLAT!', null, '#fff', 0.8); trk(chosenTrack).boost = 1; musicPlay(chosenTrack, 0.3, true); }
  } else if (state === 'play'){
    timeLeft -= dt;
    if (!frenzy && timeLeft <= 10){ frenzy = true; trk(chosenTrack).boost = 1.25; showBanner('FINAL 10!', 'ALL SPLASHES +25%', '#ffd23f', 1.6); sfx.beep(880); }
    const sec = Math.ceil(timeLeft);
    if (sec <= 5 && sec >= 1 && sec !== lastBeep){ lastBeep = sec; sfx.beep(660); }
    nextPU -= dt;
    if (nextPU <= 0){ if (powerups.length < 2) spawnPU(); nextPU = frenzy ? rand(3, 5) : rand(4.5, 7.5); }
    if (timeLeft <= 0){ timeLeft = 0; state = 'end'; stateT = 0; sfx.buzzer(); musicStop(chosenTrack, 1.2); showBanner('TIME!', null, '#fff', 1.6); for (const p of P) p.rain = 0; }
  } else if (state === 'end'){
    if (stateT > 1.6) finish();
  } else if (state === 'results'){
    if (!fanfared && stateT > 1.8){ fanfared = true; musicPlay('win', 0, true); }
    if (!menuBack && stateT > 10.5){ menuBack = true; musicPlay('menu', 4); }
  }

  for (const pu of powerups){ pu.t += dt; pu.x += pu.vx*dt; pu.y = pu.by + Math.sin(pu.t*2.4 + pu.ph)*34; }
  powerups = powerups.filter(pu => pu.x > -80 && pu.x < W+80);

  for (const r of rollers){
    const nx = r.x + r.dir*1900*dt;
    for (let x = r.lx; r.dir > 0 ? x < nx : x > nx; x += r.dir*12){
      if (x > -r.r && x < W + r.r) stampCircle(r.pi, x, r.y + rand(-3,3), r.r*rand(.94,1.06));
    }
    r.lx = nx; r.x = nx;
  }
  rollers = rollers.filter(r => r.dir > 0 ? r.x < W + 60 : r.x > -60);

  for (const d of delayed) d.t -= dt;
  const due = delayed.filter(d => d.t <= 0); delayed = delayed.filter(d => d.t > 0);
  for (const d of due) d.fn();

  for (const q of parts){ q.t += dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= 0.9; q.vy = q.vy*0.9 + 900*dt; }
  parts = parts.filter(q => q.t < q.life);
  for (const r of rings) r.t += dt; rings = rings.filter(r => r.t < r.life);
  for (const t of texts){ t.t += dt; t.y -= 40*dt; } texts = texts.filter(t => t.t < t.life);
  if (banner){ banner.t += dt; if (banner.t > banner.life) banner = null; }
  shake = Math.max(0, shake - dt*30);
  musicUpdate(dt);
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function txt(s, x, y, size, col, align, sw){
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (sw !== 0){ ctx.lineJoin = 'round'; ctx.lineWidth = sw || Math.max(4, size*0.16); ctx.strokeStyle = '#1b1b24'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const iconBlob = makeBlob(0, 0, 17);
function drawIcon(type, col){
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round';
  if (type === 'big'){ drawBlob(ctx, iconBlob, col); }
  else if (type === 'roller'){
    rr(-18, -16, 36, 15, 5); ctx.fill();
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(18, -8); ctx.lineTo(22, -8); ctx.lineTo(22, 4); ctx.lineTo(0, 4); ctx.lineTo(0, 18); ctx.stroke();
  } else if (type === 'freeze'){
    ctx.lineWidth = 4;
    for (let k = 0; k < 3; k++){ ctx.save(); ctx.rotate(k*Math.PI/3);
      ctx.beginPath(); ctx.moveTo(-19, 0); ctx.lineTo(19, 0);
      for (const s of [-1, 1]){ ctx.moveTo(s*12, 0); ctx.lineTo(s*18, -6); ctx.moveTo(s*12, 0); ctx.lineTo(s*18, 6); }
      ctx.stroke(); ctx.restore(); }
  } else if (type === 'bomb'){
    ctx.beginPath(); ctx.arc(-2, 5, 14, 0, TAU); ctx.fill();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(6, -6); ctx.quadraticCurveTo(12, -16, 18, -14); ctx.stroke();
    ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(19, -15, 4 + Math.random()*2, 0, TAU); ctx.fill();
  } else if (type === 'rain'){
    for (const [dx, dy] of [[-11,-4],[0,6],[11,-4]]){
      ctx.beginPath(); ctx.arc(dx, dy+4, 6, 0, Math.PI); ctx.lineTo(dx, dy-9); ctx.closePath(); ctx.fill();
    }
  }
}
function drawPU(pu){
  const d = PU[pu.type], s = 1 + Math.sin(pu.t*6)*0.05;
  ctx.save(); ctx.translate(pu.x, pu.y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.arc(4, 6, pu.r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, pu.r, 0, TAU); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = d.col; ctx.stroke();
  ctx.setLineDash([9, 9]); ctx.lineDashOffset = -pu.t*40; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, pu.r + 9, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  drawIcon(pu.type, d.col);
  ctx.restore();
  txt(d.short, pu.x, pu.y + pu.r + 22, 15, '#fff', 'center', 5);
}
function chip(x, y, s, col, align){
  ctx.font = `900 14px ${FONT}`; const w = ctx.measureText(s).width + 20;
  const bx = align === 'right' ? x - w : x;
  ctx.fillStyle = 'rgba(20,20,28,.8)'; rr(bx, y, w, 24, 12); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
  txt(s, bx + w/2, y + 12.5, 14, col, 'center', 0);
  return w;
}
function statusChips(p, x, y, align){
  const list = [];
  if (p.frozen > 0) list.push(['FROZEN ' + p.frozen.toFixed(1), '#7fdcff']);
  if (p.big > 0) list.push(['BIG ×' + p.big, PU.big.col]);
  if (p.pending === 'roller') list.push(['ROLLER READY', '#b79bff']);
  if (p.pending === 'bomb') list.push(['BOMB READY', '#ffcc00']);
  if (p.rain > 0) list.push(['RAIN', '#3fd98a']);
  let cx = x;
  for (const [s, c] of list){ const w = chip(cx, y, s, c, align); cx += align === 'right' ? -(w+8) : (w+8); }
}

function drawReticle(p){
  const c = PL[p.i], x = p.x, y = p.y;
  if (p.pending === 'roller' && (state === 'play')){
    ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = c.col; ctx.globalAlpha = 0.55; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.restore();
  }
  const R = p.big > 0 ? 26 : 20;
  ctx.lineCap = 'round';
  // ink ring
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x, y, R+11, 0, TAU); ctx.stroke();
  ctx.strokeStyle = p.ink < SHOT_COST ? '#ff3b3b' : c.col; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x, y, R+11, -Math.PI/2, -Math.PI/2 + TAU*p.ink); ctx.stroke();
  // reticle
  for (const [w, col] of [[7, '#fff'], [3.5, c.col]]){
    ctx.lineWidth = w; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x-R-6, y); ctx.lineTo(x-R+8, y); ctx.moveTo(x+R-8, y); ctx.lineTo(x+R+6, y);
    ctx.moveTo(x, y-R-6); ctx.lineTo(x, y-R+8); ctx.moveTo(x, y+R-8); ctx.lineTo(x, y+R+6);
    ctx.stroke();
  }
  ctx.fillStyle = c.col; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, TAU); ctx.fill();
  if (p.frozen > 0){
    ctx.fillStyle = 'rgba(170,230,255,.6)'; ctx.beginPath(); ctx.arc(x, y, R+4, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(x, y); ctx.scale(.8, .8); drawIcon('freeze', '#fff'); ctx.restore();
  }
  txt('P' + p.id, x + R + 16, y - R - 8, 15, c.col, 'center', 4);
}

/* ---------- main draw ---------- */
function draw(){

  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  ctx.drawImage(paint, sx, sy);
  // roller heads

    ctx.restore();
  }
  for (const pu of powerups) drawPU(pu);
  for (const r of rings){ const k = r.t/r.life; ctx.globalAlpha = 1 - k; ctx.lineWidth = 5*(1-k) + 1; ctx.strokeStyle = r.col; ctx.beginPath(); ctx.arc(r.x, r.y, r.r + (r.max - r.r)*k, 0, TAU); ctx.stroke(); }
  for (const q of parts){ ctx.globalAlpha = 1 - q.t/q.life; ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const t of texts){ ctx.globalAlpha = 1 - t.t/t.life; txt(t.s, t.x, t.y, t.size, t.col, 'center'); }
  ctx.globalAlpha = 1;

  if (state === 'title') drawTitle();
  else if (state === 'music') drawMusicSelect();
  else if (state === 'colors') drawColorSelect();
  else if (state === 'countdown'){ drawHUD(); drawCountdown(); }
  else if (state === 'play' || state === 'end') drawHUD();
  else if (state === 'results') drawResults();
  drawBanner();

  for (const p of P) if (p.src) drawReticle(p);
}

audio(); loadSfx(); musicPlay('menu', 5);
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
