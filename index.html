<!DOCTYPE html>
<html lang="en">

<title>Trigger Happy Arcade</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;user-select:none}
  canvas{position:absolute;left:0;top:0;image-rendering:auto}

<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   TRIGGER HAPPY ARCADE — light gun game launcher (standalone, no internet)
   ---------------------------------------------------------------------
   Games live in games/<name>/index.html next to this file. Edit GAMES below.
   CONTROLS (OpenFIRE defaults work out of the box):
     Trigger / left click ... shoot (select, launch, skip, exit demo)
     Right click (A btn) .... next game      Middle click (B) ... prev game
     1 / 2 .................. Player 1 / Player 2 START (join / leave)
     5 / 6 .................. coin (just for the sound)
     Arrows / Enter ......... keyboard navigation + launch
     M = music on/off   F = fullscreen   Esc = cancel launch
   Gamepads (incl. OpenFIRE gamepad mode): stick/aim, A or RT = shoot,
     Start = join, d-pad / bumpers = prev/next. Pad 1 = P1, pad 2 = P2.
   Each game is opened as  file.html?players=1  or  ?players=2
   ===================================================================== */

const CONFIG = {
  title1: 'TRIGGER HAPPY',
  title2: 'ARCADE',
  subtitle: 'LIGHT GUN SYSTEM',
  biosName: 'HOT SHOT SYSTEMS',
  idleSeconds: 30,            // no activity this long -> attract mode
  attractSecondsPerGame: 10,  // how long each demo plays in attract mode
  renderScale: 1,             // drop to 0.75 if the Pi ever stutters
  crtEffects: true,           // scanlines + vignette
  music: true,
  musicVolume: 0.5,
  sfxVolume: 0.8,
  playersParam: 'players',    // ?players=N added to the game URL ('' to disable)
  gamepadAim: 'absolute',     // 'absolute' (OpenFIRE stick-as-aim) or 'relative'
  gamepadSpeed: 1400,         // px/sec for relative stick aiming
  moveThreshold: 40,          // px of aim movement that counts as "activity" (ignores gun jitter)
  fullBootEveryTime: false,   // false = short boot when returning from a game
  introSound: true,           // play the intro jingle + pulse blast (embedded at the bottom of this file)
  introVolume: 0.9,
  jingleHitAt: 3.36,          // seconds into the jingle where its big hit lands (lined up with the flash)
  pulsePeakAt: 0.55           // seconds into the pulse where it blows up (lined up with the flash)
};

/* players: [min, max]. demo: built-in animated preview.
   banner: optional title image (e.g. 'art/galagun_banner.png') shown on the card.
   video:  optional gameplay clip (e.g. 'video/galagun.mp4') used instead of the demo. */
const GAMES = [
  // file: path from this launcher to the game.  hidden:true keeps a game off the menu until you add its files.
  { title:'GalaGun',            file:'games/galagun/index.html',            players:[1,1], genre:'SPACE SHOOTER',   blurb:'Hold the line against the swarm. One shot per pull.',      colors:['#ff3b6b','#3bd5ff'], demo:'galagun',  banner:null, video:null },
  { title:'Hold the Gate',      file:'games/hold-the-gate/index.html',      players:[1,1], genre:'CASTLE DEFENSE',  blurb:'Crossbow up. Nobody gets through that gate.',               colors:['#ffd27a','#ff6a3b'], demo:'holdthegate', banner:null, video:null },
  { title:'Twin Comet',         file:'games/twin-comet/index.html',         players:[1,2], genre:'RAIL SHOOTER',    blurb:'Two pilots, one galaxy of glowing chaos.',                  colors:['#00f0ff','#ff3df5'], demo:'twincomet',banner:null, video:null },
  { title:'Pixel Frenzy',       file:'games/pixel-frenzy/index.html',       players:[1,2], genre:'INVADER BLASTER', blurb:'The Great Pizza Rescue. Fill the FRENZY meter.',            colors:['#ff1f6b','#e6ff00'], demo:'pixelfrenzy', banner:null, video:null },
  { title:'Orbit Guard',        file:'games/orbit-guard/index.html',        players:[1,2], genre:'CO-OP DEFENSE',   blurb:'Enemies from every edge. Protect the planet.',              colors:['#39ff88','#00b3ff'], demo:'orbit',    banner:null, video:null },
  { title:'Piñata Panic',  file:'games/pinata-panic/index.html',       players:[1,2], genre:'TOWER TOPPLE',    blurb:'Take turns sniping blocks. Don’t drop the piñata.', colors:['#ff4fa3','#ffd23f'], demo:'pinata',   banner:null, video:null },
  { title:'Pop Shot',           file:'games/pop-shot/index.html',           players:[1,2], genre:'QUICK DRAW',      blurb:'Targets pop up fast. Leave the good guys standing.',        colors:['#ff5a3b','#ffcc33'], demo:'popshot',  banner:null, video:null },
  { title:'Neon Command',       file:'games/neon-command/index.html',       players:[1,2], genre:'MISSILE DEFENSE', blurb:'Shoot where the warheads WILL be.',                         colors:['#00ffd0','#ff3060'], demo:'neoncommand', banner:null, video:null },
  { title:'Bean Blastin’ Benny', file:'games/bean-blastin-benny/index.html', players:[1,1], genre:'BALL BUSTER', blurb:'Aim the shooter, split the bouncers, save the day.',   colors:['#6bff4a','#ff7a2e'], demo:'benny',    banner:null, video:null },
  { title:'Trick Shot',         file:'games/trick-shot/index.html',         players:[1,2], genre:'STYLE CHALLENGE', blurb:'Twenty seconds to pull off something impossible.',          colors:['#ffc93b','#ff3b8f'], demo:'trickshot',banner:null, video:null },
  { title:'Shatter Range',      file:'games/shatter-range/index.html',      players:[1,2], genre:'SHOOTING GALLERY',blurb:'Plates, bottles, glass. Everything breaks.',                colors:['#ffd24d','#4dd2ff'], demo:'shatter',  banner:null, video:null },
  { title:'Slow Shot',          file:'games/slow-shot/index.html',          players:[1,1], genre:'TIME SHOOTER',    blurb:'Time moves only when you move.',                            colors:['#ff2b2b','#e8e8e8'], demo:'slowshot', banner:null, video:null },
  { title:'SplatterStrike',     file:'games/splatterstrike/index.html',     players:[2,2], genre:'PAINT BATTLE',    blurb:'Sixty seconds. Most paint on the screen wins.',             colors:['#1e7bff','#ff8a1e'], demo:'splatter', banner:null, video:null },
  { title:'Bubble Battle',      file:'games/bubble-battle/index.html',      players:[2,2], genre:'PUZZLE VERSUS',   blurb:'Pop three or more and bury your rival in rows.',            colors:['#b45cff','#3bf0ff'], demo:'bubble',   banner:null, video:null },
  { title:'Goose Hunt',         file:'games/goose-hunt/index.html',         players:[1,1], genre:'HUNTING',         blurb:'Honk if you missed. The dog is watching.',                  colors:['#5fb7ff','#7ad04a'], demo:'goose',    banner:null, video:null },
  { title:'Glass Factory',      file:'games/glass-factory/index.html',      players:[1,1], genre:'QUALITY CONTROL', blurb:'Smash the rejects. Let the good glass through.',            colors:['#3bf0d0','#ff4040'], demo:'glass',    banner:null, video:null },
  { title:'Carnival Games',     file:'games/carnival-games/index.html',     players:[1,2], genre:'MIDWAY',          blurb:'Step right up! Tin ducks, stars and bullseyes.',            colors:['#ff3040','#ffe14d'], demo:'carnival', banner:null, video:null }
].filter(g => !g.hidden);

/* ===================================================================== */
const W = 1920, H = 1080, VW = 1280, VH = 720, TAU = Math.PI * 2;
const FONT = '"Arial Black","DejaVu Sans","Helvetica Neue",Arial,sans-serif';
const MONO = '"DejaVu Sans Mono","Liberation Mono","Courier New",monospace';
const PCOL = ['#ff2e63', '#2ec5ff'];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (n, m) => ((n % m) + m) % m;
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
function lstore(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

let RS = CONFIG.renderScale;
function resize() {
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS);
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px';
}
addEventListener('resize', resize); resize();

/* ============================ AUDIO ============================ */
let ac = null, masterGain, sfxGain, musicGain, musicBus, noiseBuf;
function audioInit() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const master = ac.createGain(); master.connect(ac.destination); masterGain = master;
    sfxGain = ac.createGain(); sfxGain.gain.value = CONFIG.sfxVolume; sfxGain.connect(master);
    musicGain = ac.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(musicGain);
    const dl = ac.createDelay(); dl.delayTime.value = 0.32; const fb = ac.createGain(); fb.gain.value = 0.32;
    lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(musicGain);
    musicBus = lp;
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function unlockAudio() { audioInit(); if (ac && ac.state === 'suspended') ac.resume(); loadIntroAudio(); }
/* ---- intro jingle + pulse (base64 MP3s stored in INTRO_AUDIO at the bottom of the file) ---- */
const IA = { loading: false, jingle: null, pulse: null, jSrc: null, jGain: null, jStarted: false, pStarted: false };
function loadIntroAudio() {
  if (IA.loading || !ac || !CONFIG.introSound || !window.INTRO_AUDIO) return; IA.loading = true;
  for (const k of ['jingle', 'pulse']) {
    try {
      const b = atob(window.INTRO_AUDIO[k]), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
      ac.decodeAudioData(u.buffer, buf => { IA[k] = buf; }, () => { });
    } catch (e) { }
  }
}
function playSample(buf, delay, offset, vol) {
  const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = buf; g.gain.value = vol;
  src.connect(g); g.connect(masterGain); src.start(ac.currentTime + Math.max(0, delay), Math.max(0, offset)); return { src, g };
}
function introAudioStep() {
  if (!CONFIG.introSound || !ac || ac.state !== 'running') return;
  const t = boot.t, jAt = boot.bangAt - CONFIG.jingleHitAt, pAt = boot.bangAt - CONFIG.pulsePeakAt;
  if (IA.jingle && !IA.jStarted && t >= jAt - 0.1 && t < boot.bangAt + 0.3) {
    IA.jStarted = true; const r = playSample(IA.jingle, jAt - t, t - jAt, CONFIG.introVolume); IA.jSrc = r.src; IA.jGain = r.g;
  }
  if (IA.pulse && !IA.pStarted && t >= pAt - 0.1 && t < boot.bangAt + 0.2) { IA.pStarted = true; playSample(IA.pulse, pAt - t, t - pAt, CONFIG.introVolume); }
}
function fadeIntroJingle() {
  if (!IA.jGain || !ac) return; const now = ac.currentTime;
  IA.jGain.gain.setTargetAtTime(0, now, 0.3); try { IA.jSrc.stop(now + 2); } catch (e) { } IA.jGain = null;
}
function tone(f, dur, type, vol, when = 0, slide = null, dest = sfxGain) {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, when = 0, freq = 1000, ft = 'highpass', dest = sfxGain) {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = ft; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  shot() { noise(0.14, 0.5, 0, 1800, 'bandpass'); tone(700, 0.12, 'square', 0.12, 0, 90); },
  move() { tone(880, 0.05, 'square', 0.1); tone(1320, 0.07, 'square', 0.08, 0.045); },
  join() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.12, i * 0.06)); },
  leave() { [784, 523].forEach((f, i) => tone(f, 0.14, 'square', 0.1, i * 0.08)); },
  error() { tone(220, 0.14, 'sawtooth', 0.14); tone(165, 0.22, 'sawtooth', 0.14, 0.14); },
  coin() { tone(988, 0.08, 'square', 0.14); tone(1319, 0.4, 'square', 0.14, 0.08); },
  stat() { noise(0.25, 0.12, 0, 2500, 'highpass'); },
  select() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.12, i * 0.05)); noise(0.9, 0.18, 0.2, 800, 'bandpass'); tone(60, 1.2, 'sawtooth', 0.2, 0.25, 30); },
  type() { tone(1800, 0.02, 'square', 0.03); },
  chime() { [261.6, 329.6, 392, 523.3, 659.3, 784].forEach((f, i) => tone(f, 2.6, 'triangle', 0.1, i * 0.06)); tone(65.4, 2.4, 'sawtooth', 0.1, 0); },
  boom() { noise(1.0, 0.6, 0, 500, 'lowpass'); tone(140, 0.7, 'sine', 0.5, 0, 28); },
  whoosh() { noise(0.5, 0.2, 0, 1200, 'bandpass'); },
  drop(i) { tone(300 + i * 70, 0.08, 'square', 0.08); },
  powerOn() { tone(55, 0.5, 'sine', 0.5, 0, 35); noise(0.12, 0.35, 0, 300, 'lowpass'); tone(8000, 1.2, 'sine', 0.025, 0.05, 15000); noise(0.6, 0.06, 0.05, 4000, 'highpass'); }
};
/* little synthwave loop */
const music = { next: 0, step: 0, on: CONFIG.music, level: 0 };
const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function musicTick() {
  if (!ac || ac.state !== 'running') return;
  const target = music.on ? music.level * CONFIG.musicVolume * 0.6 : 0;
  musicGain.gain.setTargetAtTime(target, ac.currentTime, 0.3);
  const spb = 60 / 108 / 2;
  if (music.next < ac.currentTime) music.next = ac.currentTime + 0.05;
  while (music.next < ac.currentTime + 0.2) {
    const w = music.next - ac.currentTime, st = music.step, ch = PROG[Math.floor(st / 16) % 4];
    const n = ch[[0, 1, 2, 1, 2, 0, 1, 2][st % 8]] + 12 + (st % 16 >= 8 ? 12 : 0);
    tone(mtof(n), spb * 0.8, 'square', 0.05, w, null, musicBus);
    if (st % 4 === 0) { tone(mtof(ch[0] - 24), spb * 3.6, 'sawtooth', 0.09, w, null, musicBus); tone(150, 0.16, 'sine', 0.35, w, 40, musicGain); }
    if (st % 4 === 2) noise(0.04, 0.05, w, 7000, 'highpass', musicGain);
    if (st % 8 === 4) noise(0.15, 0.1, w, 1800, 'bandpass', musicGain);
    music.next += spb; music.step++;
  }
}
setInterval(musicTick, 40);

/* ======================== DEMO TOOLKIT ======================== */
function addParts(arr, x, y, n, o) {
  if (arr.length > 700) return;
  for (let i = 0; i < n; i++) {
    const a = o.ang !== undefined ? o.ang + rnd(-(o.spread || 0.5), o.spread || 0.5) : Math.random() * TAU;
    const sp = rnd(o.min || 40, o.max || 300), life = rnd(0.5, 1) * (o.life || 1);
    arr.push({ x, y, vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0), life, max: life,
      col: Array.isArray(o.col) ? pick(o.col) : o.col, size: rnd(0.5, 1) * (o.size || 4), g: o.g || 0, drag: o.drag || 0.6,
      shape: o.shape || 'sq', rot: Math.random() * TAU, vr: rnd(-12, 12), w: o.w || 10, h: o.h || 10 });
  }
}
function updParts(arr, dt) {
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i]; p.life -= dt; if (p.life <= 0) { arr.splice(i, 1); continue; }
    const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy = p.vy * d + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}
function drawParts(c, arr, add) {
  if (add) c.globalCompositeOperation = 'lighter';
  for (const p of arr) {
    c.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); c.fillStyle = p.col;
    if (p.shape === 'tri') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.beginPath(); c.moveTo(0, -p.size); c.lineTo(p.size, p.size); c.lineTo(-p.size * 0.8, p.size * 0.5); c.fill(); c.restore(); }
    else if (p.shape === 'circ') { c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.fill(); }
    else if (p.shape === 'rect') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 2; c.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }
    else c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}
function mkGun(col, label) { return { x: VW / 2 + rnd(-200, 200), y: VH / 2 + rnd(-100, 100), col, label, target: null, cool: rnd(0.3, 0.8), flash: 0, speed: rnd(6, 8.5), wander: Math.random() * 9, frozen: 0 }; }
function gunStep(g, dt, pickFn, fireFn, tolMul = 0.6) {
  g.flash = Math.max(0, g.flash - dt * 3.5); g.cool -= dt;
  if (g.frozen > 0) { g.frozen -= dt; return; }
  if (!g.target || g.target.dead || g.target.gone) { g.target = g.cool < 0.25 ? pickFn(g) : null; }
  let tx, ty, tol = 16;
  if (g.target) { const t = g.target; tx = t.x + (t.vx || 0) / g.speed; ty = t.y + (t.vy || 0) / g.speed; tol = Math.max(14, (t.r || 20) * tolMul); }
  else { g.wander += dt; tx = VW / 2 + Math.cos(g.wander * 0.7) * 320; ty = VH / 2 + Math.sin(g.wander * 1.13) * 160; }
  const k = 1 - Math.exp(-dt * g.speed); g.x += (tx - g.x) * k; g.y += (ty - g.y) * k;
  if (g.target && g.cool <= 0 && Math.hypot(tx - g.x, ty - g.y) < tol) {
    if (fireFn(g, g.target) !== false) { g.flash = 1; g.cool = rnd(0.3, 0.75); g.target = null; }
  }
}
function drawCross(c, x, y, col, flash = 0, s = 1, label = '') {
  c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3.5;
  c.shadowColor = col; c.shadowBlur = 12;
  c.beginPath(); c.arc(0, 0, 22, 0, TAU);
  c.moveTo(-38, 0); c.lineTo(-12, 0); c.moveTo(12, 0); c.lineTo(38, 0);
  c.moveTo(0, -38); c.lineTo(0, -12); c.moveTo(0, 12); c.lineTo(0, 38); c.stroke();
  c.fillRect(-2.5, -2.5, 5, 5);
  if (flash > 0) { c.globalAlpha = flash; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 22 + (1 - flash) * 46, 0, TAU); c.stroke(); }
  if (label) { c.shadowBlur = 0; c.globalAlpha = 1; c.font = 'bold 18px ' + MONO; c.textAlign = 'left'; c.fillText(label, 28, -28); }
  c.restore();
}
function popText(s, x, y, txt, col = '#fff', size = 30) { s.txt.push({ x, y, txt, col, size, life: 1 }); }
function hud(c, txt, x, y, col, size = 28, align = 'left', font = MONO) {
  c.font = `bold ${size}px ${font}`; c.textAlign = align; c.textBaseline = 'top';
  c.fillStyle = 'rgba(0,0,0,.5)'; c.fillText(txt, x + 3, y + 3); c.fillStyle = col; c.fillText(txt, x, y);
}
const pad = (n, l = 6) => String(Math.floor(n)).padStart(l, '0');
function vgrad(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ============================ DEMOS ============================ */
const DEMOS = {};

/* ---------- Shatter Range ---------- */
DEMOS.shatter = {
  init(s) { s.tg = []; s.sp = 0; s.g = mkGun('#ffe14d'); },
  update(s, dt) {
    s.sp -= dt;
    if (s.sp <= 0) {
      s.sp = rnd(0.4, 0.8); const lane = Math.floor(rnd(0, 3)), dir = lane % 2 ? -1 : 1, kind = Math.random() < 0.55 ? 'plate' : 'bottle';
      s.tg.push({ x: dir > 0 ? -60 : VW + 60, y: 200 + lane * 165, vx: dir * rnd(150, 250), r: kind === 'plate' ? 36 : 30, kind, col: pick(['#ff4d4d', '#4dd2ff', '#ffd24d', '#7dff6a', '#c77dff']) });
    }

  for (let i = 0; i < 8; i++) { const an = rnd(0, TAU), sp = rnd(200, 600); uiFx.push({ type: 'spark', x: a.x, y: a.y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: rnd(0.2, 0.4), col: '#fff' }); }

function tryLaunch() {

  let n = players[1].joined ? 2 : 1;

  n = Math.min(n, g.players[1]);

/* ============================ UPDATE ============================ */
function update(dt) {
  T += dt; pollPads(dt);
  for (const a of aims()) a.flash = Math.max(0, a.flash - dt * 3);
  for (const f of uiFx) { f.life -= dt; if (f.type === 'ring') f.r += 380 * dt; else { f.x += f.vx * dt; f.y += f.vy * dt; } }
  for (let i = uiFx.length - 1; i >= 0; i--) if (uiFx[i].life <= 0) uiFx.splice(i, 1);
  players.forEach(p => p.flash = Math.max(0, p.flash - dt * 2));
  p2Need = Math.max(0, p2Need - dt); coinFlash = Math.max(0, coinFlash - dt * 2); shake = Math.max(0, shake - dt * 3);
  const g = GAMES[mod(state === 'attract' && attract.phase === 'game' ? attract.idx : selTarget, N)];
  const k = 1 - Math.exp(-dt * 4); for (let i = 0; i < 3; i++) { theme.a[i] = lerp(theme.a[i], g.rgb[0][i], k); theme.b[i] = lerp(theme.b[i], g.rgb[1][i], k); }

  if (state === 'wait') { music.level = 0; if (ac && ac.state === 'running') startBoot(); else if (T > 0.5) state = 'power'; }
  else if (state === 'power' || state === 'powering') { music.level = 0; }
  else if (state === 'boot') {
    boot.t += dt; music.level = boot.t > boot.bangAt && !IA.jStarted ? 1 : 0; introAudioStep();
    if (!boot.short) {
      const due = Math.floor((boot.t - 0.6) * 22); if (due > boot.typed && boot.t < 3.4) { boot.typed = due; if (due % 2) sfx.type(); }
    }
    const drops = Math.floor((boot.t - boot.logoAt) / 0.09); if (drops > boot.dropped && boot.dropped < CONFIG.title1.length) { boot.dropped++; sfx.drop(boot.dropped); }
    if (!boot.banged && boot.t > boot.bangAt) { boot.banged = true; if (!IA.pStarted) sfx.boom(); if (!IA.jStarted) sfx.chime();
      else boot.len = boot.short ? boot.bangAt + 3.2 : boot.bangAt + IA.jingle.duration - CONFIG.jingleHitAt - 0.4;
      shake = 1; for (let i = 0; i < 60; i++) { const an = rnd(0, TAU), sp = rnd(200, 1100); uiFx.push({ type: 'spark', x: W / 2, y: 430, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: rnd(0.4, 1.0), col: pick(['#fff', '#ffcf3a', '#ff2e63', '#2ec5ff']) }); } }
    if (boot.t > boot.len) endBoot();
  } else if (state === 'select') {
    selPos += (selTarget - selPos) * (1 - Math.exp(-dt * 9));
    previewStatic = Math.max(0, previewStatic - dt);
    stepDemo(preview, Math.min(dt, 0.04));
    if (T - lastAct > CONFIG.idleSeconds) enterAttract();
  } else if (state === 'attract') {
    attract.t += dt; attract.stat = Math.max(0, attract.stat - dt);
    if (attract.phase === 'logo' && attract.t > 5) { attract.phase = 'game'; attract.t = 0; attract.stat = 0.45; attract.demo = newDemo(GAMES[attract.idx].demo); sfx.stat(); playPreviewVideo(); }
    else if (attract.phase === 'game') {
      stepDemo(attract.demo, Math.min(dt, 0.04));
      if (attract.t > CONFIG.attractSecondsPerGame) {
        attract.shown++; attract.idx = mod(attract.idx + 1, N); attract.t = 0; attract.stat = 0.45; sfx.stat();
        if (attract.shown % N === 0) attract.phase = 'logo'; else { attract.demo = newDemo(GAMES[attract.idx].demo); playPreviewVideo(); }
      }
    }
    music.level = 0.7;
  } else if (state === 'launch') {
    launch.t += dt; stepDemo(preview, Math.min(dt, 0.04));
    if (launch.t > 1.9 && !launch.go) { launch.go = true; location.href = launch.url; }
  }
}

}
